<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spatify Cloud</title>
<style>
:root{
  --cream:#F4F0E7; --surface:#FFFDF8; --surface-2:#FAF7F0;
  --ink:#14120F; --ink-2:#4A453C; --ink-3:#8C8577;
  --line:#E3DDD0; --line-2:#EFEAE0;
  --brass:#A67C3D; --brass-soft:#F3E9D8;
  --jade:#2E6B52; --jade-soft:#E4EEE8;
  --amber:#9C6B15; --amber-soft:#F8EEDA;
  --rose:#9B4A4A; --rose-soft:#F6E5E3;
  --r-lg:18px; --r-md:13px; --r-sm:10px;
  --shadow:0 1px 2px rgba(20,18,15,.04),0 8px 24px -12px rgba(20,18,15,.18);
  --shadow-lift:0 2px 6px rgba(20,18,15,.06),0 18px 40px -16px rgba(20,18,15,.28);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums;
  padding-bottom:86px;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.022em}
h1{font-size:20px}h2{font-size:16.5px}h3{font-size:13.5px}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
.ico{display:inline-flex;vertical-align:-3px}

/* ---------- animation ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-320px 0}100%{background-position:320px 0}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.anim{animation:fadeUp .42s var(--ease) both}
.wrap>*{animation:fadeUp .38s var(--ease) both}
.wrap>*:nth-child(1){animation-delay:.02s}
.wrap>*:nth-child(2){animation-delay:.07s}
.wrap>*:nth-child(3){animation-delay:.12s}
.wrap>*:nth-child(4){animation-delay:.17s}
.wrap>*:nth-child(5){animation-delay:.21s}
.wrap>*:nth-child(n+6){animation-delay:.25s}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- chrome ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--ink);color:var(--cream);
  padding:11px 15px;display:flex;align-items:center;gap:11px;
  box-shadow:0 1px 0 rgba(255,255,255,.06),0 10px 30px -20px rgba(0,0,0,.9)}
.mark{width:31px;height:31px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--brass),#7E5B26);color:#fff;
  box-shadow:0 2px 8px -2px rgba(166,124,61,.7)}
.brand{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.topbar .sub{font-size:11px;color:#A8A092;line-height:1.35}
.topbar .who{margin-left:auto;text-align:right;font-size:11px;color:#A8A092;line-height:1.35}
.topbar .who b{color:var(--cream);font-weight:560;display:block;font-size:12.5px}
.wrap{max-width:1140px;margin:0 auto;padding:15px}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(20,18,15,.97);backdrop-filter:blur(14px);
  display:flex;overflow-x:auto;scrollbar-width:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;background:none;border:0;padding:8px 11px 9px;font-size:10.5px;
  color:#8C8577;display:grid;justify-items:center;gap:5px;border-radius:12px;cursor:pointer;min-width:64px;
  transition:color .22s var(--ease),background .22s var(--ease),transform .18s var(--ease)}
.nav button:active{transform:scale(.93)}
.nav button.on{color:var(--ink);background:var(--cream)}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:9px;align-items:center}.row.wrap2{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:640px){.g3{grid-template-columns:1fr 1fr}}
.muted{color:var(--ink-3)}.dim{color:var(--ink-2)}.tiny{font-size:11.5px}
.big{font-size:24px;font-weight:660;letter-spacing:-.035em}

/* ---------- buttons ---------- */
.btn{background:var(--ink);color:var(--cream);border:0;border-radius:var(--r-sm);
  padding:10px 14px;font-weight:560;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:transform .16s var(--ease),box-shadow .22s var(--ease),opacity .2s;
  box-shadow:0 1px 2px rgba(20,18,15,.16),0 8px 18px -10px rgba(20,18,15,.6)}
.btn:active{transform:translateY(1px) scale(.985);box-shadow:0 1px 2px rgba(20,18,15,.2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:active{background:var(--surface-2)}
.btn.brass{background:linear-gradient(145deg,var(--brass),#8A6530);color:#fff}
.btn.warn{background:var(--rose);color:#fff}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px;
  cursor:pointer;display:grid;place-items:center;color:var(--ink-2);
  transition:transform .16s var(--ease),background .2s,color .2s}
.iconbtn:active{transform:scale(.92);background:var(--surface-2);color:var(--ink)}
.fabrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}

/* ---------- forms ---------- */
label{display:block;font-size:11.5px;color:var(--ink-2);margin:0 0 5px;font-weight:530}
.f{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);margin-bottom:11px;transition:border-color .2s,box-shadow .2s}
.f:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,18,15,.07)}
.fieldset{border:1px solid var(--line-2);border-radius:var(--r-md);padding:12px;margin-bottom:12px;
  background:var(--surface-2)}
.fieldset>h3{margin-bottom:10px;display:flex;align-items:center;gap:7px;color:var(--ink-2);
  font-size:11.5px;text-transform:uppercase;letter-spacing:.07em}

/* ---------- pills & tables ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;
  font-weight:560;background:var(--line-2);color:var(--ink-2)}
.pill.g{background:var(--jade-soft);color:var(--jade)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.pill.r{background:var(--rose-soft);color:var(--rose)}
.pill.b{background:var(--brass-soft);color:var(--brass)}
.pill.dark{background:var(--ink);color:var(--cream)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;color:var(--ink-3);font-weight:560;padding:7px 8px;
  border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em}
td{padding:9px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.num{text-align:right}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.item{border:1px solid var(--line);border-radius:var(--r-md);padding:11px 12px;margin-bottom:8px;
  background:var(--surface);cursor:pointer;
  transition:transform .16s var(--ease),box-shadow .22s var(--ease),border-color .2s}
.item:active{transform:scale(.985);box-shadow:var(--shadow-lift);border-color:var(--ink-3)}
.bar{height:7px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:99px;
  transition:width .7s var(--ease)}
.bar>i.brass{background:linear-gradient(90deg,var(--brass),#C79A55)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:13px;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;
  transition:background .22s var(--ease),color .22s,border-color .22s,transform .16s var(--ease)}
.tabs button:active{transform:scale(.95)}
.tabs button.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.seg{display:flex;background:var(--line-2);border-radius:99px;padding:3px;gap:3px;margin-bottom:13px}
.seg button{flex:1;background:transparent;border:0;border-radius:99px;padding:8px 10px;font-size:12.5px;
  color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:background .25s var(--ease),color .25s,box-shadow .25s}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:560;box-shadow:var(--shadow)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:10px}
.empty{text-align:center;padding:30px 14px;color:var(--ink-3);font-size:13px}
.empty .ico{opacity:.4;margin-bottom:6px;justify-content:center}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(20,18,15,.52);backdrop-filter:blur(3px);z-index:80;
  display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .22s var(--ease)}
@media(min-width:700px){.veil{align-items:center}}
.sheet{background:var(--cream);width:100%;max-width:580px;max-height:92vh;overflow:auto;
  border-radius:24px 24px 0 0;padding:17px;animation:sheetUp .34s var(--ease);
  box-shadow:0 -10px 50px -20px rgba(0,0,0,.6)}
@media(min-width:700px){.sheet{border-radius:20px;animation:pop .28s var(--ease)}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.x{background:var(--surface);border:1px solid var(--line);border-radius:99px;cursor:pointer;
  color:var(--ink-2);padding:6px;display:grid;place-items:center;transition:transform .16s var(--ease)}
.x:active{transform:scale(.9) rotate(90deg)}
.toast{position:fixed;left:50%;bottom:98px;background:var(--ink);color:var(--cream);padding:11px 17px;
  border-radius:12px;z-index:99;font-size:13px;max-width:88%;animation:toastIn .3s var(--ease);
  box-shadow:0 14px 36px -14px rgba(0,0,0,.7)}

/* ---------- kpi & chart ---------- */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 13px;
  box-shadow:var(--shadow);transition:transform .18s var(--ease)}
.kpi:active{transform:scale(.98)}
.kpi .lab{font-size:10.5px;color:var(--ink-3);margin-bottom:4px;display:flex;align-items:center;gap:5px;
  text-transform:uppercase;letter-spacing:.06em}
.kpi.dark{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.kpi.dark .lab{color:#9A9285}
.chart{display:flex;align-items:flex-end;gap:6px;height:118px;padding-top:6px}
.chart>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.chart .b{width:100%;background:var(--ink);border-radius:5px 5px 2px 2px;min-height:3px;
  animation:grow .6s var(--ease) both}
@keyframes grow{from{height:0!important;opacity:.3}}
.warnbox{background:var(--amber-soft);border:1px solid #E8D9B8;border-radius:var(--r-md);
  padding:11px 13px;margin-bottom:11px;font-size:12.5px}
.errbox{background:var(--rose-soft);border:1px solid #E9CFCC;border-radius:var(--r-md);
  padding:11px 13px;margin-bottom:11px;font-size:12.5px}
.slot{border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:var(--r-md);
  padding:10px 11px;margin-bottom:8px;cursor:pointer;background:var(--surface);
  transition:transform .16s var(--ease),box-shadow .2s}
.slot:active{transform:scale(.985);box-shadow:var(--shadow-lift)}
.slot.done{border-left-color:var(--ink-3);opacity:.72}
.slot.no{border-left-color:var(--rose)}

/* ---------- client profile ---------- */
.avatar{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--ink),#3A342B);color:var(--cream);
  font-weight:600;font-size:18px;letter-spacing:-.02em;box-shadow:var(--shadow)}
.chead{display:flex;gap:13px;align-items:center;margin-bottom:13px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:7px 10px;font-size:13px}
.kv .k{color:var(--ink-3);font-size:11.5px;padding-top:1px}
.kv .v{color:var(--ink)}
.tline{position:relative;padding-left:26px}
.tline::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tev{position:relative;margin-bottom:12px;animation:fadeUp .35s var(--ease) both}
.tev .dot{position:absolute;left:-22px;top:3px;width:15px;height:15px;border-radius:99px;
  background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.tev .dot svg{width:9px;height:9px}
.tev.sale .dot{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.tev.pkg .dot{background:var(--brass);border-color:var(--brass);color:#fff}
.tev.redeem .dot{background:var(--jade);border-color:var(--jade);color:#fff}
.tev.no .dot{background:var(--rose);border-color:var(--rose);color:#fff}
.tev .when{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.tev .body{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:10px 12px;margin-top:4px}
.daysep{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;
  margin:16px 0 9px;display:flex;align-items:center;gap:9px}
.daysep::after{content:'';flex:1;height:1px;background:var(--line)}

/* ---------- calendar ---------- */
.calbar{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.calbar .title{font-weight:620;font-size:15.5px;flex:1;text-align:center;letter-spacing:-.015em}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mhead{font-size:10px;color:var(--ink-3);text-align:center;padding:4px 0 7px;font-weight:560;
  text-transform:uppercase;letter-spacing:.07em}
.mcell{aspect-ratio:1/1.08;border:1px solid var(--line-2);border-radius:11px;padding:5px 6px;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;background:var(--surface);overflow:hidden;
  transition:transform .16s var(--ease),background .22s,border-color .22s}
.mcell:active{transform:scale(.94)}
.mcell.off{background:transparent;color:var(--ink-3);opacity:.5}
.mcell.today{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.mcell.sel{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.mcell .d{font-size:12.5px;font-weight:570}
.mcell .dots{display:flex;flex-wrap:wrap;gap:2px}
.mcell .dot{width:5px;height:5px;border-radius:99px;background:var(--ink)}
.mcell .dot.n{background:var(--rose)}.mcell .dot.f{background:var(--ink-3)}
.mcell.sel .dot{background:var(--cream)}
.mcell .cnt{font-size:10px;margin-top:auto;color:var(--ink-3)}
.mcell.sel .cnt{color:#B5AEA1}
.tl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface)}
.tlg{display:grid;min-width:max-content}
.tlh{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);
  padding:8px;font-size:11.5px;font-weight:570;text-align:center;border-left:1px solid var(--line-2)}
.tlh.first{border-left:0}
.tlh small{display:block;color:var(--ink-3);font-weight:400;font-size:10px}
.tlgut{position:relative;border-right:1px solid var(--line-2);background:var(--surface-2)}
.tlgut span{position:absolute;right:6px;font-size:10px;color:var(--ink-3);transform:translateY(-6px)}
.tlcol{position:relative;border-left:1px solid var(--line-2)}.tlcol.first{border-left:0}
.hline{position:absolute;left:0;right:0;border-top:1px solid var(--line-2)}
.hline.half{border-top-style:dotted;opacity:.65}
.blk{position:absolute;left:3px;right:3px;border-radius:9px;padding:5px 7px;overflow:hidden;cursor:pointer;
  background:var(--ink);color:var(--cream);border-left:3px solid var(--brass);font-size:11px;line-height:1.32;
  animation:pop .3s var(--ease) both;transition:transform .16s var(--ease)}
.blk:active{transform:scale(.97)}
.blk b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk small{color:#B5AEA1;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk.done{background:var(--line-2);color:var(--ink-2);border-left-color:var(--ink-3)}
.blk.done small{color:var(--ink-3)}
.blk.no{background:var(--rose-soft);color:var(--rose);border-left-color:var(--rose)}
.blk.no small{color:var(--rose)}
.blk.in{background:var(--brass);color:#fff;border-left-color:#6E4E1E}
.blk.in small{color:#F1E2CB}
.buf{position:absolute;left:3px;right:3px;border-radius:0 0 8px 8px;
  background:repeating-linear-gradient(45deg,var(--line-2),var(--line-2) 4px,transparent 4px,transparent 8px)}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--brass);z-index:2}
.nowline::before{content:'';position:absolute;left:0;top:-4px;width:7px;height:7px;border-radius:99px;
  background:var(--brass)}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--ink-3)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ---------- misc ---------- */
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.center .card{max-width:450px;width:100%;animation:fadeUp .45s var(--ease) both}
.step{display:flex;gap:11px;margin-bottom:13px}
.step .n{width:23px;height:23px;border-radius:99px;background:var(--ink);color:var(--cream);
  display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;margin-top:1px}
code{background:var(--line-2);padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.spin{width:24px;height:24px;border:2px solid var(--line);border-top-color:var(--ink);
  border-radius:99px;animation:sp .7s linear infinite;margin:0 auto}
.skel{height:13px;border-radius:6px;margin:7px 0;
  background:linear-gradient(90deg,var(--line-2) 25%,var(--surface-2) 50%,var(--line-2) 75%);
  background-size:640px 100%;animation:shimmer 1.3s linear infinite}
canvas{border:1px dashed var(--line);border-radius:var(--r-md);background:var(--surface);width:100%;touch-action:none}
.imgfield{margin-bottom:11px}
.imgprev{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);
  border-radius:var(--r-md);padding:9px;background:var(--surface)}
.imgprev img{width:84px;height:84px;object-fit:cover;border-radius:var(--r-sm);flex:none;
  background:var(--line-2)}
.imgmeta{flex:1;min-width:0}
.noteimg{max-width:min(100%,240px);max-height:140px;width:auto;height:auto;display:block;
  object-fit:contain;border-radius:var(--r-sm);margin-top:9px;cursor:zoom-in;
  border:1px solid var(--line);background:var(--surface-2);animation:fadeIn .4s var(--ease)}
.imghint{font-size:10px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:4px}
.zoomwrap{text-align:center}
.zoomwrap img{max-width:100%;border-radius:var(--r-md);border:1px solid var(--line)}
.pthumb{width:44px;height:44px;border-radius:11px;object-fit:cover;flex:none;background:var(--line-2);
  border:1px solid var(--line)}
.pthumb.ph{display:grid;place-items:center;color:var(--ink-3)}

/* ---------- receipt ---------- */
.rcpt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:20px 18px;font-size:12.5px;color:var(--ink)}
.rhead{text-align:center;margin-bottom:13px}
.rlogo{max-width:132px;max-height:74px;object-fit:contain;margin:0 auto 10px;display:block}
.rname{font-size:17px;font-weight:650;letter-spacing:-.02em}
.rtag{font-size:11.5px;color:var(--brass);font-style:italic;margin-top:2px}
.rline{font-size:11px;color:var(--ink-3);line-height:1.6}
.rdiv{border-top:1px dashed var(--line);margin:13px 0}
.rmeta{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:13px}
.rmeta div{display:flex;justify-content:space-between;gap:8px;font-size:11.5px}
.rmeta span{color:var(--ink-3)}
.rmeta b{font-weight:560;text-align:right}
.rtab{width:100%;border-collapse:collapse;font-size:12.5px}
.rtab th{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;
  padding:6px 4px;border-bottom:1px solid var(--line)}
.rtab td{padding:8px 4px;border-bottom:1px solid var(--line-2);vertical-align:top}
.rtot{width:100%;border-collapse:collapse;font-size:12.5px}
.rtot td{padding:4px 4px;border:0}
.rtot .grand td{font-size:15px;font-weight:660;border-top:1px solid var(--ink);
  border-bottom:2px solid var(--ink);padding:8px 4px}
.rtot .pay td{color:var(--ink-3);font-size:11.5px}
.rvoid{margin-top:12px;text-align:center;color:var(--rose);border:1px dashed var(--rose);
  border-radius:var(--r-sm);padding:8px;font-weight:600;letter-spacing:.08em}
.rthanks{text-align:center;font-weight:560;margin-bottom:5px}
.rterms{margin-top:13px;padding:11px 12px;background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:var(--r-sm);font-size:10.5px;color:var(--ink-2);line-height:1.65}
.rfoot{margin-top:11px;text-align:center;font-size:10px;color:var(--ink-3)}
@media print{
  .rcpt{border:0;padding:0;font-size:11.5px}
  .veil{position:static;background:none;backdrop-filter:none;display:block}
  .sheet{max-width:none;max-height:none;box-shadow:none;background:#fff;padding:0;border-radius:0;
    animation:none;overflow:visible}
  .sheet-h{display:none}
}

.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sw{width:34px;height:34px;border-radius:11px;border:2px solid transparent;cursor:pointer;
  transition:transform .16s var(--ease),box-shadow .2s;position:relative}
.sw:active{transform:scale(.9)}
.sw.on{box-shadow:0 0 0 3px var(--cream),0 0 0 5px var(--ink)}
.sw.auto::after{content:'A';position:absolute;inset:0;display:grid;place-items:center;
  font-size:10px;font-weight:700;color:rgba(255,255,255,.8)}

/* ---------- home launcher ---------- */
.hero{background:var(--ink);color:var(--cream);border-radius:var(--r-lg);padding:18px 17px 15px;
  margin-bottom:12px;box-shadow:var(--shadow-lift);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-60px;width:170px;height:170px;
  border-radius:99px;background:radial-gradient(circle,rgba(166,124,61,.42),transparent 70%)}
.hgreet{font-size:19px;font-weight:650;letter-spacing:-.02em}
.hsub{font-size:11.5px;color:#A8A092;margin-top:2px}
.hstats{display:flex;gap:22px;margin-top:14px;position:relative}
.hstats div{display:flex;flex-direction:column}
.hstats b{font-size:20px;font-weight:660;letter-spacing:-.03em}
.hstats span{font-size:10px;color:#A8A092;text-transform:uppercase;letter-spacing:.07em}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:13px;padding-bottom:3px}
.quick::-webkit-scrollbar{display:none}
.qbtn{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);

  transition:transform .16s var(--ease),background .2s,color .2s}
.qbtn:active{transform:scale(.94);background:var(--ink);color:var(--cream)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;margin-bottom:12px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:14px 12px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;
  box-shadow:var(--shadow);animation:fadeUp .4s var(--ease) both;
  transition:transform .18s var(--ease),box-shadow .24s var(--ease),border-color .2s}
.tile:active{transform:scale(.955);box-shadow:var(--shadow-lift);border-color:var(--ink-3)}
.tico{width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--cream);

.tile:active .tico{background:var(--brass)}
.tname{font-size:13.5px;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.tdesc{font-size:10.5px;color:var(--ink-3);line-height:1.4}
.tbadge{position:absolute;top:11px;right:11px;background:var(--brass-soft);color:var(--brass);
  font-size:9.5px;font-weight:600;padding:3px 7px;border-radius:99px;text-transform:uppercase;
  letter-spacing:.04em}

.rsec{margin-bottom:13px;break-inside:avoid;page-break-inside:avoid}

.rextra{margin-left:auto;font-size:7.5pt;font-weight:400;text-transform:none;letter-spacing:0;color:#5A5347}
.rt{width:100%;border-collapse:collapse;font-size:9pt}
.rt th{text-align:left;font-size:7.5pt;text-transform:uppercase;letter-spacing:.05em;color:#5A5347;

.rnone{color:#8C8577;font-size:8.5pt;font-style:italic;margin:2px 0}
.rnote{font-size:8.5pt;margin:6px 0 0}
.rgrid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:4px}
.rgrid5>div{border:1px solid #EFEBE0;border-radius:6px;padding:5px;text-align:center}
.rgrid5 span{display:block;font-size:7pt;color:#5A5347}

.rsign{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px;

.rline2{border-bottom:1px solid #14120F;height:26px}
.rsign span{font-size:7.5pt;color:#5A5347;display:block;margin-top:4px}
.rfoot2{margin-top:16px;padding-top:7px;border-top:1px solid #DCD6C8;font-size:7pt;color:#8C8577;

function friendly(e){

   return 'Email or password is not correct.';
 if(c.includes('too-many-requests'))return 'Too many attempts. Wait a few minutes and try again.';
 if(c.includes('network'))return 'No connection to Firebase. Check the tablet is online.';
 if(c.includes('permission-denied'))return 'Firestore rules blocked this. Publish the rules file, then try again.';
 if(c.includes('configuration-not-found')||c.includes('operation-not-allowed'))
   return 'Email/password sign-in is switched off. Turn it on in Firebase console → Authentication → Sign-in method.';
 return (e&&e.message)||'Something went wrong.';
}

function watchAppointments(){
 unsub.forEach(u=>{try{u();}catch(e){}});unsub=[];
 const anchor=calMode==='month'?new Date(new Date(calDate).getFullYear(),new Date(calDate).getMonth(),1):new Date(calDate);
 const from=ymd(addDays(anchor,-10)),to=ymd(addDays(anchor,45));
 calWin={from,to};
 // Range on one field only. Adding branchId as a second condition would need a
 // composite index in Firestore, and until that index exists the listener fails
 // silently — which is exactly how bookings went missing. Filter branch in memory instead.
 const q=query(collection(db,'appointments'),where('date','>=',from),where('date','<=',to));
 unsub.push(onSnapshot(q,s=>{
   APPTS=s.docs.map(d=>({id:d.id,...d.data()})).filter(a=>a.branchId===ME.branchId);
   if(TAB==='home'||TAB==='book')render();},
   e=>{console.warn(e);
     toast(String(e.code||'').includes('failed-precondition')
       ?'Firestore needs an index for this query — open the console link in the browser log.'
       :friendly(e));}));
}
async function loadCustomers(term){
 let q1;
 const t=(term||'').trim();
 if(t&&/^[0-9+\-\s]+$/.test(t)){
  const d=digits(t);
  q1=query(collection(db,'customers'),orderBy('phoneDigits'),
    where('phoneDigits','>=',d),where('phoneDigits','<=',d+'\uf8ff'),limit(30));
 }else if(t){
  const l=t.toLowerCase();
  q1=query(collection(db,'customers'),orderBy('nameLower'),
    where('nameLower','>=',l),where('nameLower','<=',l+'\uf8ff'),limit(30));
 }else{
  q1=query(collection(db,'customers'),orderBy('createdAt','desc'),limit(30));
 }
 const s=await getDocs(q1);
 const found=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.active!==false);
 const seen=new Set(found.map(c=>c.id));
 CUSTS=found.concat(CUSTS.filter(c=>!seen.has(c.id)));
}

let NEWCOLOR='';
function paintSwatches(){

  b.className='sw'+(chosen?' on':'')+(!NEWCOLOR&&b.dataset.c===auto?' auto':'');});

async function saveAppt(){
 const btn=$('#n-go');btn.disabled=true;
 try{
  const s=svc($('#n-s').value);
  const start=new Date($('#n-d').value+'T'+$('#n-t').value+':00');
  if(isNaN(+start))throw new Error('Please pick a valid date and time.');
  const finish=new Date(+start+s.dur*6e4);
  const staffId=$('#n-st').value,roomId=$('#n-r').value;
  if(!staffId)throw new Error('No therapist selected.');
  if(!roomId)throw new Error('No room available for this treatment type.');
  const date=ymd(start);
  const day=await getDocs(query(collection(db,'appointments'),where('date','==',date)));
  const s0=+start,e0=+finish+s.buffer*6e4;
  for(const dd of day.docs){
   const a=dd.data();
   if(a.branchId!==ME.branchId)continue;
   if(a.status==='cancel'||a.status==='no')continue;
   const as=+new Date(a.start),ae=+new Date(a.finish)+(a.buffer||0)*6e4;
   if(!(e0<=as||s0>=ae)){
    if(a.staffId===staffId)throw new Error(stf(staffId).name+' already has a booking at '+tstr(a.start));
    if(a.roomId===roomId)throw new Error(room(roomId).name+' is occupied at '+tstr(a.start));
   }}
  const c=cust($('#n-c').value)||{};
  await addDoc(collection(db,'appointments'),{visitType:($('#n-vt')||{}).value||'return',
   color:NEWCOLOR||'',branchId:ME.branchId,customerId:$('#n-c').value,customerName:c.name||'',
   staffId,staffName:stf(staffId).name,serviceId:s.id,serviceName:s.name,roomId,date,
   start:start.toISOString(),finish:finish.toISOString(),duration:s.dur,buffer:s.buffer,status:'booked',
   deposit:+$('#n-dep').value||0,notes:$('#n-n').value||'',createdBy:UID,createdAt:new Date().toISOString()});
  await audit('Booking created',(c.name||'')+' · '+s.name+' · '+dstr(start)+' '+tstr(start));
  window.closeModal();calDate=ymd(start);calMode='day';render();
  if(needsWindow())watchAppointments();
  toast('Booking saved');
 }catch(e){const el=$('#n-err');if(el)el.textContent=friendly(e);btn.disabled=false;}
}

 try{

}

async function loadHistory(id){
 const out={appts:[],sales:[],packages:[],redemptions:[]};
 const grab=async(col,field,val)=>{
  try{const s=await getDocs(query(collection(db,col),where(field,'==',val),limit(300)));
   return s.docs.map(d=>({id:d.id,...d.data()}));}catch(e){console.warn(col,e);return[];}};
 const [a,s,p,r]=await Promise.all([
  grab('appointments','customerId',id),grab('sales','customerId',id),
  grab('customerPackages','customerId',id),grab('redemptions','customerId',id)]);
 out.appts=a;out.sales=s;out.packages=p;out.redemptions=r;
 return out;}
function custHistory(c){
 const H=HIST||{appts:[],sales:[],packages:[],redemptions:[]};
 const paid=H.sales.filter(s=>!s.voided);

 let h='';

 h+='<div class="card"><div class="sec-h"><h2>Client packages</h2>'+
  '<button class="btn sm" onclick="sellPkg()">'+ic('plus',15)+'Sell</button></div>'+

 h+='<div class="card"><h2 style="margin-bottom:10px">Catalogue</h2>'+D.packages.map(p=>{

   '<div class="tiny muted">'+(p.items||[]).map(i=>i.n+'× '+svc(i.serviceId).name).join(' + ')+' · worth '+rm(val)+

window.redeem=async(id,i)=>{
 const cp=HELD.find(x=>x.id===id);
 if(new Date(cp.expiry)<new Date()&&!confirm('This package has expired. Redeem anyway?'))return;
 try{
  await runTransaction(db,async tx=>{
   const ref=doc(db,'customerPackages',id);
   const snap=await tx.get(ref);
   if(!snap.exists())throw new Error('Package not found.');
   const bal=snap.data().balances.map(b=>({...b}));
   if(!(bal[i].left>0))throw new Error('No sessions left on this line.');
   bal[i].left-=1;
   tx.update(ref,{balances:bal,lastRedeemedAt:new Date().toISOString(),lastRedeemedBy:UID});
  });
  cp.balances[i].left-=1;
  const s=svc(cp.balances[i].serviceId);
  try{await addDoc(collection(db,'redemptions'),{customerId:cp.customerId,customerName:cp.customerName||'',
   customerPackageId:id,packageId:cp.packageId,serviceId:cp.balances[i].serviceId,serviceName:s.name||'',
   remaining:cp.balances[i].left,branchId:ME.branchId,staffId:UID,staffName:ME.name,
   at:new Date().toISOString(),date:today()});}catch(e){console.warn('redemption log',e);}
  for(const u of (s.use||[])){const st=stockOf(u.sku);if(st){await updateDoc(doc(db,'stock',st.id),{qty:increment(-u.qty)});st.qty-=u.qty;}}
  await audit('Package session redeemed',(cp.customerName||'')+' — '+s.name+' ('+cp.balances[i].left+' left)');
  window.closeModal();render();toast('Redeemed. '+cp.balances[i].left+' left');
 }catch(e){toast(friendly(e));}};
window.extendPkg=async id=>{

  await audit('Package extended',(cp.customerName||'')+' → '+dstr(nx));
  window.closeModal();render();toast('Extended by 30 days');}
 catch(e){toast(friendly(e));}};

   payments:[{method:$('#sp-m').value,amount:p.price}],createdBy:UID});

let cart={customerId:'',items:[],discount:0,voucher:null,payments:[],points:0};
function cartTotals(){
 const sub=cart.items.reduce((a,i)=>a+i.price*i.qty,0);
 const v=cart.voucher?(cart.voucher.type==='pct'?sub*cart.voucher.value/100:cart.voucher.value):0;
 const pd=pointsWorth(cart.points||0);
 const net=Math.max(0,sub-cart.discount-v-pd);
 const sst=D.meta.biz.sst?net*(D.meta.biz.sstRate||8)/100:0;
 const total=net+sst,paid=cart.payments.reduce((a,p)=>a+p.amount,0);
 return{sub,v,pd,net,sst,total,paid,balance:total-paid};}

window.usePoints=()=>{
 const L=loy(),c=cust(cart.customerId);
 if(!c){toast('Pick a client first');return;}
 const have=c.points||0,t=cartTotals();
 const affordable=Math.floor((t.sub-cart.discount-t.v)/(L.ringgitPerPoint||0.1));
 const max=Math.max(0,Math.min(have,affordable));
 if(have<L.minRedeem){toast('Needs at least '+L.minRedeem+' points — '+esc(c.name)+' has '+have);return;}
 modal('Redeem points','<div class="card">'+

  '<label>Points to redeem</label>'+
  '<input class="f" type="number" id="up-n" value="'+max+'" min="0" max="'+max+
   '" style="font-size:20px;text-align:center" oninput="upWorth()">'+

  'from the client once the payment is completed.</p></div>',
 ()=>{window.upWorth();$('#up-go').onclick=()=>{
  const n=Math.max(0,Math.min(max,Math.floor(+$('#up-n').value||0)));
  cart.points=n;window.closeModal();render();

window.upWorth=()=>{const el=$('#up-w');if(!el)return;

window.addPay=m=>{
 const t=cartTotals();

window.checkout=async()=>{
 const btn=$('#co-go');if(btn)btn.disabled=true;
 const t=cartTotals();
 try{
  // prices are re-read from the catalogue, never trusted from the cart UI
  const items=cart.items.map(i=>{
   const src=i.kind==='service'?svc(i.id):prod(i.id);
   return{kind:i.kind,id:i.id,name:src.name,price:src.price,qty:i.qty,staffId:i.staffId};});
  const sub=items.reduce((a,i)=>a+i.price*i.qty,0);
  const v=cart.voucher?(cart.voucher.type==='pct'?sub*cart.voucher.value/100:cart.voucher.value):0;
  const pd=pointsWorth(cart.points||0);
  const net=Math.max(0,sub-cart.discount-v-pd);
  const sst=D.meta.biz.sst?net*(D.meta.biz.sstRate||8)/100:0;
  const total=net+sst;
  const c=cust(cart.customerId);
  const ref=await addDoc(collection(db,'sales'),{branchId:ME.branchId,customerId:cart.customerId||'',
   customerName:c?c.name:'Walk-in',staffId:UID,staffName:ME.name,items,
   discount:cart.discount+v+pd,pointsUsed:cart.points||0,
   voucher:cart.voucher?cart.voucher.id:'',sst,total,date:today(),at:new Date().toISOString(),
   voided:false,payments:cart.payments.slice(),createdBy:UID,
   invoiceNo:'INV-'+Date.now().toString().slice(-8)});
  for(const i of items){
   if(i.kind==='product'){const st=stockOf(i.id);if(st){await updateDoc(doc(db,'stock',st.id),{qty:increment(-i.qty)});st.qty-=i.qty;}}
   if(i.kind==='service'){for(const u of (svc(i.id).use||[])){const st=stockOf(u.sku);
    if(st){await updateDoc(doc(db,'stock',st.id),{qty:increment(-u.qty*i.qty)});st.qty-=u.qty*i.qty;}}}
  }
  if(cart.voucher){try{await updateDoc(doc(db,'vouchers',cart.voucher.id),{used:increment(1)});}catch(e){}}
  let earned=0;
  if(cart.customerId){
   const inv=(await getDoc(ref)).data();
   if(cart.points>0)await spendPoints(cart.customerId,c?c.name:'',cart.points,(inv||{}).invoiceNo||'');
   earned=await awardPoints(cart.customerId,c?c.name:'',net,(inv||{}).invoiceNo||'');
  }
  await audit('Bill completed',rm(total)+' · '+(c?c.name:'Walk-in'));
  cart={customerId:'',items:[],discount:0,voucher:null,payments:[],points:0};
  await loadRecentSales();render();
  if(earned)toast('Bill saved · '+earned+' loyalty points earned');
  window.openSale(ref.id);
 }catch(e){toast(friendly(e));if(btn)btn.disabled=false;}};

  '<textarea class="f" id="dc-r" rows="3" placeholder="Duplicate record, client asked to be removed, entered by mistake"></textarea>'+
  '<label>What should happen</label>'+
  '<label class="row" style="gap:9px"><input type="radio" name="dcmode" value="archive" checked> '+
   '<span><b>Archive</b> — hidden from lists and search, record kept</span></label>'+
  (ME.role==='owner'?'<label class="row" style="gap:9px;margin-top:6px"><input type="radio" name="dcmode" '+
   'value="erase"> <span><b>Erase permanently</b> — the client record is destroyed and cannot be recovered</span></label>':
   '<p class="tiny muted" style="margin-top:6px">Only the owner can erase a record permanently.</p>')+
  '<div id="dc-err" class="tiny" style="color:var(--rose);margin:8px 0"></div>'+
  '<button class="btn warn" style="width:100%;justify-content:center;margin-top:10px" id="dc-go">'+
   ic('trash',16)+'Continue</button></div>',
 ()=>{$('#dc-go').onclick=async()=>{
  const why=($('#dc-r').value||'').trim();

  const mode=(document.querySelector('input[name=dcmode]:checked')||{value:'archive'}).value;
  if(mode==='erase'&&!confirm('Erase '+c.name+' permanently? This cannot be undone.'))return;
  $('#dc-go').disabled=true;

    await addDoc(collection(db,'audit'),{action:'Client erased',
     detail:c.name+' ('+(c.phone||'no phone')+') — '+why,uid:UID,userName:ME.name,
     branchId:ME.branchId,at:new Date().toISOString()});

   }else{

     archivedBy:UID,archivedByName:ME.name,archiveReason:why});

   }
   CUSTS=CUSTS.filter(x=>x.id!==id);
   window.closeModal();TAB='cust';render();bindCustSearch();
   toast(mode==='erase'?'Record erased and logged':'Client archived');
  }catch(e){$('#dc-err').textContent=friendly(e);$('#dc-go').disabled=false;}};});};

let repDays=30,REPSALES=null;

function vRep(){
 let h='<div class="card"><div class="tabs noprint">'+[7,30,90].map(d=>'<button class="'+(repDays===d?'on':'')+
  '" onclick="setRepDays('+d+')">'+d+' days</button>').join('')+
  '<button onclick="window.print()">'+ic('print',14)+'Print / PDF</button>'+
  '<button onclick="csvSales()">'+ic('download',14)+'CSV</button></div>';
 if(!REPSALES)return h+'<div class="empty"><div class="spin"></div><div style="margin-top:8px">Loading…</div></div></div>';
 const S=REPSALES.filter(s=>!s.voided);
 const mine=S.filter(s=>s.branchId===ME.branchId);
 const rev=mine.reduce((a,s)=>a+s.total,0);
 const uniq=new Set(mine.map(s=>s.customerId).filter(Boolean)).size;
 const cat={Services:0,Retail:0,Packages:0};
 mine.forEach(s=>(s.items||[]).forEach(i=>{
  if(i.kind==='service')cat.Services+=i.price*i.qty;
  else if(i.kind==='product')cat.Retail+=i.price*i.qty;
  else if(i.kind==='package')cat.Packages+=i.price*i.qty;}));
 h+='<h2 style="margin-bottom:8px">'+esc(D.meta.biz.name||'')+' · last '+repDays+' days</h2>'+
  '<div class="grid g3">'+kpi('Revenue',rm(rev),esc(branch().code))+
  kpi('Average bill',rm(mine.length?rev/mine.length:0),mine.length+' bills')+
  kpi('Unique clients',uniq,'')+'</div></div>';
 h+='<div class="card"><h2>Revenue mix</h2>'+Object.keys(cat).map(k=>
  '<div style="margin:9px 0"><div class="spread tiny"><span>'+k+'</span><span>'+rm(cat[k])+' · '+
  (rev?Math.round(cat[k]/rev*100):0)+'%</span></div><div class="bar"><i style="width:'+
  (rev?cat[k]/rev*100:0)+'%"></i></div></div>').join('')+
  '<p class="tiny muted">Packages count as revenue when sold. Redeemed sessions are not counted again.</p></div>';
 h+='<div class="card"><h2>Branch comparison</h2><div class="scroll"><table><tr><th>Branch</th>'+
  '<th class="num">Revenue</th><th class="num">Bills</th><th class="num">Average</th></tr>'+
  D.branches.map(b=>{const x=S.filter(s=>s.branchId===b.id),r=x.reduce((a,s)=>a+s.total,0);
   return '<tr><td>'+esc(b.name)+'</td><td class="num">'+rm(r)+'</td><td class="num">'+x.length+
   '</td><td class="num">'+rm(x.length?r/x.length:0)+'</td></tr>';}).join('')+'</table></div></div>';
 const top={};mine.forEach(s=>(s.items||[]).forEach(i=>{if(i.kind==='service')top[i.name]=(top[i.name]||0)+i.price*i.qty;}));
 h+='<div class="card"><h2>Top treatments</h2><table>'+Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,10)
  .map(([n,v])=>'<tr><td>'+esc(n)+'</td><td class="num">'+rm(v)+'</td></tr>').join('')+'</table></div>';
 const comm={};
 mine.forEach(s=>(s.items||[]).forEach(i=>{
  const who=i.staffId||s.staffId;const u=stf(who);if(!u.id)return;
  const rate=i.kind==='service'?(svc(i.id).comm??u.commSvc??0):(u.commProd??0);
  comm[who]=comm[who]||{name:u.name,svc:0,prod:0,c:0};
  if(i.kind==='service')comm[who].svc+=i.price*i.qty;else if(i.kind==='product')comm[who].prod+=i.price*i.qty;
  comm[who].c+=i.price*i.qty*rate/100;}));
 h+='<div class="card"><h2>Commission</h2><div class="scroll"><table><tr><th>Team member</th>'+
  '<th class="num">Services</th><th class="num">Retail</th><th class="num">Commission</th></tr>'+
  (Object.values(comm).map(x=>'<tr><td>'+esc(x.name)+'</td><td class="num">'+rm(x.svc)+'</td><td class="num">'+
   rm(x.prod)+'</td><td class="num"><b>'+rm(x.c)+'</b></td></tr>').join('')||
   '<tr><td colspan="4" class="muted">No sales in this period.</td></tr>')+'</table></div>'+
  '<p class="tiny muted">Rates come from each service and each staff profile.</p></div>';
 return h;}
async function buildReport(){
 try{
  const from=ymd(addDays(new Date(),-repDays));
  const s=await getDocs(query(collection(db,'sales'),where('date','>=',from),orderBy('date','desc'),limit(1000)));
  REPSALES=s.docs.map(d=>({id:d.id,...d.data()}));
 }catch(e){REPSALES=[];toast(friendly(e));}
 if(TAB==='rep')render();
}
window.csvSales=()=>{
 if(!REPSALES){toast('Still loading');return;}
 const rows=[['Invoice','Date','Branch','Client','Staff','Items','Discount','SST','Total','Payments']];
 REPSALES.filter(s=>!s.voided).forEach(s=>rows.push([s.invoiceNo||s.id,s.date,
  (D.branches.find(b=>b.id===s.branchId)||{}).code||'',s.customerName||'Walk-in',s.staffName||'',
  (s.items||[]).map(i=>i.name+'×'+i.qty).join('; '),s.discount||0,s.sst||0,s.total,
  (s.payments||[]).map(p=>p.method+' '+p.amount).join('; ')]));
 const txt=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');
 a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('\ufeff'+txt);
 a.download='sales-'+today()+'.csv';a.click();toast('CSV downloaded');};

/* ============ images ============ */
/* Firebase Cloud Storage needs the paid Blaze plan, so pictures are shrunk in the
   browser and stored inline in the Firestore document. A document can hold 1 MB in
   total, so every picture is squeezed under a strict budget before it is saved. */
const IMG_BUDGET={logo:150000,product:110000,notice:420000};
function pickImage(kind){
 return new Promise(resolve=>{
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=async e=>{
   const file=e.target.files&&e.target.files[0];
   if(!file)return resolve(null);
   if(!/^image\//.test(file.type)){toast('That file is not an image');return resolve(null);}
   toast('Preparing the image…');
   try{resolve(await compressImage(file,kind));}
   catch(err){console.warn(err);toast('Could not read that image');resolve(null);}
  };
  inp.click();
 });
}
function compressImage(file,kind){
 const budget=IMG_BUDGET[kind]||200000;
 const maxPx=kind==='logo'?420:(kind==='product'?720:1600);
 return new Promise((resolve,reject)=>{
  const fr=new FileReader();
  fr.onerror=()=>reject(new Error('read failed'));
  fr.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error('decode failed'));
   img.onload=()=>{
    let w=img.width,h=img.height;
    const scale=Math.min(1,maxPx/Math.max(w,h));
    w=Math.round(w*scale);h=Math.round(h*scale);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const cx=cv.getContext('2d');
    const alpha=kind==='logo'&&/png|webp|svg/i.test(file.type);
    if(!alpha){cx.fillStyle='#ffffff';cx.fillRect(0,0,w,h);}
    cx.drawImage(img,0,0,w,h);
    // A logo is usually placed on a light receipt, so transparency is worth keeping.
    // Try PNG at full size, then at two thirds, before giving up and flattening to JPEG.
    if(alpha){
     const png=cv.toDataURL('image/png');
     if(png.length<=budget)return resolve(png);
     const cvS=document.createElement('canvas');
     cvS.width=Math.round(w*0.66);cvS.height=Math.round(h*0.66);
     cvS.getContext('2d').drawImage(img,0,0,cvS.width,cvS.height);
     const small=cvS.toDataURL('image/png');
     if(small.length<=budget)return resolve(small);
     // flattening loses transparency, so paint white behind it first
     cx.globalCompositeOperation='destination-over';
     cx.fillStyle='#ffffff';cx.fillRect(0,0,w,h);
     cx.globalCompositeOperation='source-over';
    }
    let q=0.86,out=cv.toDataURL('image/jpeg',q);
    while(out.length>budget&&q>0.36){q-=0.1;out=cv.toDataURL('image/jpeg',q);}
    if(out.length>budget){
     // still too heavy: shrink the pixels and try once more
     const cv2=document.createElement('canvas');
     cv2.width=Math.round(w*0.7);cv2.height=Math.round(h*0.7);
     const c2=cv2.getContext('2d');c2.fillStyle='#fff';c2.fillRect(0,0,cv2.width,cv2.height);
     c2.drawImage(img,0,0,cv2.width,cv2.height);
     out=cv2.toDataURL('image/jpeg',0.6);
    }
    if(out.length>budget)return reject(new Error('too large'));
    resolve(out);
   };
   img.src=fr.result;
  };
  fr.readAsDataURL(file);
 });
}
const kb=d=>Math.round((d||'').length/1024)+' KB';
/* a reusable image field: preview, replace, remove */
function imageField(id,current,kind,label){
 return '<label>'+(label||'Image')+' <span class="muted">— stored inside the record, kept small automatically</span></label>'+
  '<div class="imgfield" id="'+id+'-wrap">'+imageFieldInner(id,current,kind)+'</div>';
}
function imageFieldInner(id,current,kind){
 return current
  ?'<div class="imgprev"><img src="'+current+'" alt=""><div class="imgmeta">'+
   '<div class="tiny muted">'+kb(current)+'</div>'+
   '<div class="fabrow" style="margin:6px 0 0">'+
   '<button type="button" class="btn sm ghost" onclick="imgPick(\''+id+'\',\''+kind+'\')">'+
    ic('refresh',14)+'Replace</button>'+
   '<button type="button" class="btn sm ghost" style="color:var(--rose)" onclick="imgClear(\''+id+'\',\''+
    kind+'\')">'+ic('trash',14)+'Remove</button></div></div></div>'
  :'<button type="button" class="btn ghost" style="width:100%;justify-content:center" '+
   'onclick="imgPick(\''+id+'\',\''+kind+'\')">'+ic('upload',16)+'Choose a picture</button>';
}
const IMGVAL={};
window.imgPick=async(id,kind)=>{
 const d=await pickImage(kind);
 if(!d)return;
 IMGVAL[id]=d;
 const w=document.getElementById(id+'-wrap');
 if(w)w.innerHTML=imageFieldInner(id,d,kind);
 toast('Picture ready · '+kb(d));
};
window.imgClear=(id,kind)=>{
 IMGVAL[id]='';
 const w=document.getElementById(id+'-wrap');
 if(w)w.innerHTML=imageFieldInner(id,'',kind);
};
const imgValue=(id,fallback)=>IMGVAL[id]!==undefined?IMGVAL[id]:(fallback||'');
const imgReset=(id,initial)=>{IMGVAL[id]=initial||'';};

window.setTeamView=v=>{teamView=v;render();};
async function hashCode(code,salt){
 const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode((salt||'')+'::'+code));
 return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');}
async function loadAttendance(days){
 try{const from=ymd(addDays(new Date(),-(days||45)));
  const s=await getDocs(query(collection(db,'attendance'),where('date','>=',from),limit(600)));
  ATT=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.date).localeCompare(String(a.date)));}
 catch(e){ATT=[];console.warn('attendance',e);}}
const attToday=sid=>ATT.find(a=>a.staffId===sid&&a.date===today()&&a.branchId===ME.branchId);
const hhmm=iso=>iso?tstr(iso):'—';
function worked(a){
 if(!a||!a.clockIn||!a.clockOut)return null;
 const m=Math.round((new Date(a.clockOut)-new Date(a.clockIn))/6e4);
 return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';}

async function saveStaffForm(id){
 const name=$('#ts-n').value.trim();
 if(!name){toast('Name is required');return;}
 let uid=id;
 if(!uid){uid=($('#ts-id').value||'').trim();
  if(uid.length<10){toast('Paste the user ID from Firebase Authentication');return;}
  if(D.staff.find(x=>x.id===uid)){toast('That user already has a profile');return;}}
 const role=$('#ts-r').value;
 const data={name,phone:$('#ts-ph').value.trim(),email:$('#ts-em').value.trim(),
  idNo:$('#ts-ic').value.trim(),joined:$('#ts-jd').value,emergency:$('#ts-emg').value.trim(),
  note:$('#ts-note').value.trim(),role,branchId:$('#ts-b').value,
  commSvc:+$('#ts-cs').value||0,commProd:+$('#ts-cp').value||0,
  takes:$('#ts-t').checked,active:$('#ts-a').checked,
  perms:['therapist','frontdesk'].includes(role)?['booking','pos','customer']:[]};
 const pin=($('#ts-pin').value||'').trim();
 if(pin){
  if(!/^\d{4,8}$/.test(pin)){toast('The code must be 4 to 8 digits');return;}
  const salt=uid+':'+Math.random().toString(36).slice(2,10);
  data.attSalt=salt;data.attCode=await hashCode(pin,salt);
 }
 try{await setDoc(doc(db,'users',uid),data,{merge:true});
  await loadStatic();await audit(id?'Team member updated':'Team member added',name);
  window.closeModal();render();toast('Saved');}
 catch(e){toast(friendly(e));}}

window.clockPrompt=(sid,dir)=>{
 const s=stf(sid);
 if(!s.attCode){toast('No attendance code set for '+s.name+' yet');
  if(boss())window.editStaff(sid);return;}
 modal((dir==='in'?'Clock in':'Clock out')+' · '+s.name,'<div class="card">'+
  '<div class="chead"><div class="avatar">'+esc(initials(s.name))+'</div><div>'+
  '<h3>'+esc(s.name)+'</h3><div class="tiny muted">'+dstr(new Date())+' · '+tstr(new Date())+'</div></div></div>'+
  '<label>Enter your personal code</label>'+
  '<input class="f" id="ck-p" type="password" inputmode="numeric" autocomplete="off" '+
   'style="font-size:22px;letter-spacing:.35em;text-align:center">'+
  '<div id="ck-err" class="tiny" style="color:var(--rose);margin-bottom:8px"></div>'+
  '<button class="btn" style="width:100%;justify-content:center" id="ck-go">'+
   ic(dir==='in'?'login':'out',16)+(dir==='in'?'Confirm clock in':'Confirm clock out')+'</button>'+
  '<p class="tiny muted" style="margin-top:9px">Only this person should enter this code. '+
  'Every entry is written to the audit trail with the time and who was signed in.</p></div>',
 ()=>{
  const go=async()=>{
   const code=($('#ck-p').value||'').trim();
   if(!code){$('#ck-err').textContent='Enter your code.';return;}
   $('#ck-go').disabled=true;
   const h=await hashCode(code,s.attSalt||'');
   if(h!==s.attCode){$('#ck-err').textContent='That code does not match.';
    $('#ck-p').value='';$('#ck-go').disabled=false;return;}
   try{
    if(dir==='in'){
     await addDoc(collection(db,'attendance'),{staffId:sid,staffName:s.name,branchId:ME.branchId,
      date:today(),clockIn:new Date().toISOString(),clockOut:'',verified:true,
      recordedBy:UID,recordedByName:ME.name});
    }else{
     const a=attToday(sid);
     await updateDoc(doc(db,'attendance',a.id),{clockOut:new Date().toISOString(),
      closedBy:UID,closedByName:ME.name});
    }
    await loadAttendance();
    await audit(dir==='in'?'Clock in':'Clock out',s.name+' at '+tstr(new Date()));
    window.closeModal();render();toast(s.name+(dir==='in'?' clocked in':' clocked out'));
   }catch(e){$('#ck-err').textContent=friendly(e);$('#ck-go').disabled=false;}
  };
  $('#ck-go').onclick=go;
  $('#ck-p').onkeydown=e=>{if(e.key==='Enter')go();};});};
window.fixAtt=id=>{
 const a=ATT.find(x=>x.id===id);if(!a)return;
 const t=iso=>iso?new Date(iso).toTimeString().slice(0,5):'';
 modal('Adjust attendance · '+esc(a.staffName||''),'<div class="card">'+
  '<div class="grid g2"><div><label>Clock in</label><input class="f" type="time" id="fa-i" value="'+
   t(a.clockIn)+'"></div><div><label>Clock out</label><input class="f" type="time" id="fa-o" value="'+
   t(a.clockOut)+'"></div></div>'+
  '<label>Reason for the change *</label><input class="f" id="fa-r" placeholder="Forgot to clock out">'+
  '<button class="btn" style="width:100%;justify-content:center" id="fa-go">'+ic('check',16)+
  'Save adjustment</button>'+
  '<p class="tiny muted" style="margin-top:9px">Adjustments are recorded separately from the original '+
  'clock times, so payroll can always see what was changed and why.</p></div>',
 ()=>{$('#fa-go').onclick=async()=>{
  const why=$('#fa-r').value.trim();
  if(why.length<3){toast('Please give a reason');return;}
  const mk=v=>v?new Date(a.date+'T'+v+':00').toISOString():'';
  try{await updateDoc(doc(db,'attendance',id),{clockIn:mk($('#fa-i').value),clockOut:mk($('#fa-o').value),
    adjusted:true,adjustReason:why,adjustedBy:UID,adjustedByName:ME.name,
    adjustedAt:new Date().toISOString()});
   await loadAttendance();await audit('Attendance adjusted',(a.staffName||'')+' — '+why);
   window.closeModal();render();toast('Adjusted and logged');}
  catch(e){toast(friendly(e));}};});};
function teamSheet(){
 const days=30,from=ymd(addDays(new Date(),-days));
 const rows=D.staff.filter(s=>s.branchId===ME.branchId).map(s=>{
  const mine=ATT.filter(a=>a.staffId===s.id&&a.date>=from);
  const mins=mine.reduce((t,a)=>t+(a.clockIn&&a.clockOut?
   Math.round((new Date(a.clockOut)-new Date(a.clockIn))/6e4):0),0);
  const open=mine.filter(a=>a.clockIn&&!a.clockOut).length;
  return{s,days:mine.length,mins,open,adj:mine.filter(a=>a.adjusted).length};});
 return '<div class="sec-h"><h2>Last '+days+' days</h2>'+
  '<button class="btn sm ghost" onclick="csvAttendance()">'+ic('download',14)+'CSV</button></div>'+
  '<div class="scroll"><table><tr><th>Team member</th><th class="num">Days</th><th class="num">Hours</th>'+
  '<th class="num">Flags</th></tr>'+
  rows.map(r=>'<tr><td><b>'+esc(r.s.name)+'</b><div class="tiny muted">'+(ROLE[r.s.role]||r.s.role)+
   '</div></td><td class="num">'+r.days+'</td><td class="num">'+(r.mins/60).toFixed(1)+'</td>'+
   '<td class="num tiny">'+(r.open?'<span class="pill a">'+r.open+' open</span> ':'')+
   (r.adj?'<span class="pill">'+r.adj+' adjusted</span>':'')+(!r.open&&!r.adj?'—':'')+
   '</td></tr>').join('')+'</table></div>'+
  '<p class="tiny muted" style="margin-top:9px">“Open” means someone clocked in and never clocked out. '+
  'Fix those under Today before running payroll.</p>';}
window.csvAttendance=()=>{
 const rows=[['Date','Staff','Branch','Clock in','Clock out','Minutes','Adjusted','Reason','Recorded by']];
 ATT.forEach(a=>rows.push([a.date,a.staffName||'',(D.branches.find(b=>b.id===a.branchId)||{}).code||'',
  a.clockIn?tstr(a.clockIn):'',a.clockOut?tstr(a.clockOut):'',
  a.clockIn&&a.clockOut?Math.round((new Date(a.clockOut)-new Date(a.clockIn))/6e4):'',
  a.adjusted?'Yes':'No',a.adjustReason||'',a.recordedByName||'']));
 const txt=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 const el=document.createElement('a');
 el.href='data:text/csv;charset=utf-8,'+encodeURIComponent('\ufeff'+txt);
 el.download='attendance-'+today()+'.csv';el.click();toast('CSV downloaded');};

function dailyReportBody(d,shift){
 const b=D.meta.biz||{};
 const L=bizLines(b,branch().name);
 const f=dayFiguresFor(d);
 const att=ATT.filter(a=>a.date===d&&a.branchId===ME.branchId);
 const exp=(shift&&shift.expenses)||[];
 const iss=(shift&&shift.issues)||[];
 const pts=LOYLEDGER.filter(l=>l.date===d);
 const earned=pts.filter(l=>l.points>0).reduce((a,l)=>a+l.points,0);
 const spent=pts.filter(l=>l.points<0).reduce((a,l)=>a-l.points,0);
 const expTot=exp.reduce((a,e)=>a+(e.amount||0),0);
 const expect=((shift&&shift.openingFloat)||0)+f.cash-expTot;
 const counted=shift&&shift.closedAt?(shift.countedCash||0):null;

 /* per-therapist performance for the day */
 const perf={};
 f.sales.forEach(s=>(s.items||[]).forEach(i=>{
  const who=i.staffId||s.staffId;const u=stf(who);if(!u.id)return;
  perf[who]=perf[who]||{name:u.name,svc:0,prod:0,pkg:0,total:0};
  const line=i.price*i.qty;
  if(i.kind==='service')perf[who].svc+=line;
  else if(i.kind==='product')perf[who].prod+=line;
  else if(i.kind==='package')perf[who].pkg+=line;
  perf[who].total+=line;}));
 f.appts.filter(a=>a.status==='done').forEach(a=>{
  const u=stf(a.staffId);if(!u.id)return;
  perf[a.staffId]=perf[a.staffId]||{name:u.name,svc:0,prod:0,pkg:0,total:0};
  perf[a.staffId].done=(perf[a.staffId].done||0)+1;});

 const treat={};
 f.sales.forEach(s=>(s.items||[]).forEach(i=>{if(i.kind!=='service')return;
  treat[i.name]=treat[i.name]||{n:0,v:0};treat[i.name].n+=i.qty;treat[i.name].v+=i.price*i.qty;}));

 const sec=(n,title,body,extra)=>'<section class="rsec"><h2><span class="rnum">'+n+'</span>'+title+
  (extra?'<span class="rextra">'+extra+'</span>':'')+'</h2>'+body+'</section>';
 const none='<p class="rnone">Nothing recorded.</p>';
 const money=v=>rm(v);

 return ''+
 /* letterhead */
 '<header class="rhd">'+
  '<div class="rhd-l">'+(b.logo?'<img src="'+b.logo+'" alt="">':'')+
   '<div><div class="rbiz">'+esc(b.name||'')+'</div>'+
   (L.addr?'<div class="rsm">'+esc(L.addr)+'</div>':'')+
   (L.contact?'<div class="rsm">'+esc(L.contact)+'</div>':'')+
   (L.reg?'<div class="rsm">'+esc(L.reg)+'</div>':'')+'</div></div>'+
  '<div class="rhd-r"><div class="rtitle">Daily Summary</div>'+
   '<div class="rsm">'+esc(branch().name)+'</div>'+
   '<div class="rsm"><b>'+dstr(d)+'</b></div>'+
   '<div class="rsm">'+new Date(d).toLocaleDateString('en-MY',{weekday:'long'})+'</div></div>'+
 '</header>'+
 '<div class="rrule"></div>'+

 /* headline numbers */
 '<div class="rkpis">'+
  '<div><span>Takings</span><b>'+money(f.revenue)+'</b></div>'+
  '<div><span>Bills</span><b>'+f.bills+'</b></div>'+
  '<div><span>Average bill</span><b>'+money(f.bills?f.revenue/f.bills:0)+'</b></div>'+
  '<div><span>Showed up</span><b>'+f.showed+' / '+f.booked+'</b></div>'+
  '<div><span>No-shows</span><b>'+f.noShow+'</b></div>'+
 '</div>'+

 sec(1,'Trading summary',
  '<table class="rt"><tr><th>Line</th><th class="n">Amount</th><th class="n">Share</th></tr>'+
  ['service','product','package'].map(k=>{
   const v=f.items[k];
   return '<tr><td>'+({service:'Treatments',product:'Retail products',package:'Packages sold'}[k])+
    '</td><td class="n">'+money(v)+'</td><td class="n">'+
    (f.revenue?Math.round(v/f.revenue*100):0)+'%</td></tr>';}).join('')+
  '<tr class="rtot2"><td>Total takings</td><td class="n">'+money(f.revenue)+'</td><td class="n">100%</td></tr>'+
  (f.voided.length?'<tr><td colspan="3" class="rwarn">'+f.voided.length+
   ' bill(s) voided today, excluded from the figures above</td></tr>':'')+
  '</table>')+

 sec(2,'Payments received',
  '<table class="rt"><tr><th>Method</th><th class="n">Amount</th><th class="n">Share</th></tr>'+
  (Object.keys(f.byMethod).length?Object.keys(f.byMethod).map(m=>
   '<tr><td>'+esc(m)+'</td><td class="n">'+money(f.byMethod[m])+'</td><td class="n">'+
   (f.revenue?Math.round(f.byMethod[m]/f.revenue*100):0)+'%</td></tr>').join('')
   :'<tr><td colspan="3" class="rnone">No payments taken.</td></tr>')+

const LOY_DEFAULT={on:false,earnPer:10,pointsPer:1,ringgitPerPoint:0.10,minRedeem:50,
 expireMonths:12,tiers:[{name:'Member',at:0},{name:'Silver',at:1000},{name:'Gold',at:3000},

 return t?t.name:'Member';};
const nextTier=pts=>{const up=loy().tiers.slice().sort((a,b)=>a.at-b.at).find(x=>pts<x.at);
 return up?{name:up.name,need:up.at-pts}:null;};
const pointsFor=amount=>{const L=loy();
 return L.on?Math.floor((amount||0)/(L.earnPer||10))*(L.pointsPer||1):0;};

   {points:increment(pts),pointsEarned:increment(pts),lastPointsAt:new Date().toISOString()});
  await addDoc(collection(db,'loyalty'),{customerId,customerName,kind:'earn',points:pts,
   amount,ref:ref||'',branchId:ME.branchId,staffId:UID,staffName:ME.name,
   at:new Date().toISOString(),date:today()});

function dayFigures(d){
 d=d||today();
 const sales=SALES.filter(s=>s.date===d&&s.branchId===ME.branchId);
 const live=sales.filter(s=>!s.voided);
 const byMethod={};let cash=0;
 live.forEach(s=>(s.payments||[]).forEach(p=>{
  byMethod[p.method]=(byMethod[p.method]||0)+p.amount;
  if(/cash/i.test(p.method))cash+=p.amount;}));
 const ap=APPTS.filter(a=>a.date===d);
 const cats={};ap.forEach(a=>{const k=(visitOf(a.visitType)||{}).label||'Unspecified';
  cats[k]=(cats[k]||0)+1;});
 const items={service:0,product:0,package:0};
 live.forEach(s=>(s.items||[]).forEach(i=>{if(items[i.kind]!==undefined)items[i.kind]+=i.price*i.qty;}));
 return{sales:live,voided:sales.filter(s=>s.voided),revenue:live.reduce((a,s)=>a+s.total,0),
  bills:live.length,byMethod,cash,items,
  booked:ap.length,showed:ap.filter(a=>a.status==='done').length,
  inTreatment:ap.filter(a=>a.status==='in').length,
  noShow:ap.filter(a=>a.status==='no').length,
  cancelled:ap.filter(a=>a.status==='cancel').length,
  cats,deposits:ap.reduce((a,x)=>a+(x.deposit||0),0)};
}

function shiftSummary(f){

  (can('pos')?'<div class="card" style="box-shadow:none;margin:0 0 12px"><h3 style="margin-bottom:9px">'+
   ic('card',14)+' Payments taken</h3><table>'+

function shiftCash(f){
 if(!SHIFT)return '<div class="empty">Open the day first.</div>';
 const exp=SHIFT.expenses||[];
 return '<div class="grid g2" style="margin-bottom:12px">'+
  kpi('Opening float',rm(SHIFT.openingFloat||0),'','wallet')+
  kpi('Cash taken',rm(f.cash),'from bills today','money')+
  kpi('Paid out',rm(expTotal()),exp.length+' entries','out')+
  kpi('Should be in drawer',rm(expectedCash(f)),'float + cash − paid out','check')+'</div>'+
  '<div class="sec-h"><h3>Money paid out</h3><button class="btn sm" onclick="addExpense()">'+
   ic('plus',14)+'Add</button></div>'+
  (exp.length?exp.slice().reverse().map(e=>'<div class="item" style="cursor:default">'+
   '<div class="spread"><b>'+esc(e.category||'')+'</b><span>'+rm(e.amount)+'</span></div>'+
   '<div class="tiny muted">'+esc(e.note||'')+' · '+tstr(e.at)+' · '+esc(e.byName||'')+'</div></div>').join('')
   :'<div class="empty">'+ic('wallet',24)+'<div>Nothing paid out of the drawer today.</div></div>')+
  (SHIFT.closedAt?'<div class="card" style="box-shadow:none;margin-top:12px"><h3 style="margin-bottom:9px">'+
   'Closing count</h3><table>'+
   '<tr><td>Counted</td><td class="num">'+rm(SHIFT.countedCash||0)+'</td></tr>'+
   '<tr><td>Expected</td><td class="num">'+rm(SHIFT.expectedCash||0)+'</td></tr>'+
   '<tr><td><b>Difference</b></td><td class="num"><b style="color:'+
    (Math.abs(SHIFT.variance||0)<0.01?'var(--jade)':'var(--rose)')+'">'+
    rm(SHIFT.variance||0)+'</b></td></tr></table>'+
   (SHIFT.closeNote?'<div class="tiny muted" style="margin-top:8px">'+ic('note',12)+' '+
    esc(SHIFT.closeNote)+'</div>':'')+'</div>':'');}

 modal('Money out of the drawer','<div class="card">'+

 ()=>{$('#ex-go').onclick=async()=>{

const uidLite=()=>Math.random().toString(36).slice(2,10);
function shiftIssues(){
 if(!SHIFT)return '<div class="empty">Open the day first.</div>';
 const iss=SHIFT.issues||[];

 return '<div class="sec-h"><h3>Maintenance and operations</h3>'+

   '<div class="spread"><b>'+ic(i.type==='maintenance'?'tool':'flag',13)+' '+esc(i.title)+'</b>'+
   '<span class="pill '+({low:'',medium:'a',high:'r'}[i.severity]||'')+'">'+
    esc(i.severity||'')+'</span></div>'+
   '<div class="tiny muted" style="margin-top:4px">'+esc(i.detail||'')+'</div>'+
   '<div class="tiny muted" style="margin-top:5px">'+tstr(i.at)+' · '+esc(i.byName||'')+' · '+
   (i.status==='done'?'<span style="color:var(--jade)">'+ic('check',11)+' resolved</span>':
    '<span style="color:var(--amber)">open — tap to resolve</span>')+'</div></div>').join('')
   :'<div class="empty">'+ic('tool',24)+'<div>Nothing reported today. That is a good day.</div></div>');}
window.addIssue=()=>{
 modal('Report an issue','<div class="card">'+
  '<label>Type</label><select class="f" id="is-t">'+
   '<option value="maintenance">Maintenance — equipment, room, building</option>'+
   '<option value="operation">Operations — process, stock, staffing, client</option></select>'+
  '<label>Severity</label><select class="f" id="is-s">'+
   '<option value="low">Low — can wait</option><option value="medium" selected>Medium — this week</option>'+
   '<option value="high">High — blocking work today</option></select>'+
  '<label>Short title</label><input class="f" id="is-ti" placeholder="HIFU handpiece overheating">'+
  '<label>What happened</label><textarea class="f" id="is-d" rows="3"></textarea>'+
  '<button class="btn" style="width:100%;justify-content:center" id="is-go">'+ic('check',16)+
  'Submit report</button></div>',
 ()=>{$('#is-go').onclick=async()=>{
  const title=$('#is-ti').value.trim();
  if(title.length<3){toast('Give it a short title');return;}
  const i={id:uidLite(),type:$('#is-t').value,severity:$('#is-s').value,title,
   detail:$('#is-d').value.trim(),status:'open',at:new Date().toISOString(),by:UID,byName:ME.name};
  try{await updateDoc(doc(db,'shifts',shiftId()),{issues:[...(SHIFT.issues||[]),i]});
   SHIFT.issues=[...(SHIFT.issues||[]),i];
   await audit('Issue reported',i.type+' · '+title);
   window.closeModal();render();toast('Reported');}catch(e){toast(friendly(e));}};});};
window.toggleIssue=async id=>{
 const iss=(SHIFT.issues||[]).map(i=>i.id===id
  ?{...i,status:i.status==='done'?'open':'done',
    resolvedAt:i.status==='done'?'':new Date().toISOString(),
    resolvedByName:i.status==='done'?'':ME.name}:i);
 try{await updateDoc(doc(db,'shifts',shiftId()),{issues:iss});SHIFT.issues=iss;
  render();toast('Updated');}catch(e){toast(friendly(e));}};
window.closeShift=()=>{
 const f=dayFigures();
 const expect=expectedCash(f);
 modal('Close the day','<div class="card">'+
  '<table><tr><td>Opening float</td><td class="num">'+rm(SHIFT.openingFloat||0)+'</td></tr>'+
  '<tr><td>Cash taken today</td><td class="num">'+rm(f.cash)+'</td></tr>'+
  '<tr><td>Paid out</td><td class="num">-'+rm(expTotal())+'</td></tr>'+
  '<tr><td><b>Should be in the drawer</b></td><td class="num"><b>'+rm(expect)+'</b></td></tr></table>'+
  '<label style="margin-top:12px">Cash actually counted (RM)</label>'+
  '<input class="f" type="number" step="0.01" id="cs-c" value="'+expect.toFixed(2)+
   '" style="font-size:22px;text-align:center" oninput="cshDiff('+expect+')">'+
  '<div id="cs-d" class="tiny" style="text-align:center;margin-bottom:11px"></div>'+
  '<label>Notes on the day</label><textarea class="f" id="cs-n" rows="3" '+
   'placeholder="Anything the owner should know tomorrow"></textarea>'+
  '<button class="btn" style="width:100%;justify-content:center" id="cs-go">'+ic('check',16)+
  'Close the day</button>'+
  '<p class="tiny muted" style="margin-top:9px">Once closed the figures are locked for the day. '+
  'A difference is not an accusation — record it honestly so patterns can be spotted.</p></div>',
 ()=>{window.cshDiff(expect);
  $('#cs-go').onclick=async()=>{
   const counted=+$('#cs-c').value||0;
   try{await updateDoc(doc(db,'shifts',shiftId()),{closedAt:new Date().toISOString(),
     closedBy:UID,closedByName:ME.name,countedCash:counted,expectedCash:expect,
     variance:counted-expect,closeNote:$('#cs-n').value||'',
     revenue:f.revenue,bills:f.bills,cashTaken:f.cash,paidOut:expTotal(),
     showed:f.showed,booked:f.booked,noShow:f.noShow});
    await loadShift();
    await audit('Day closed','Counted '+rm(counted)+', difference '+rm(counted-expect));
    window.closeModal();render();toast('Day closed');}
   catch(e){toast(friendly(e));}};});};
window.cshDiff=expect=>{
 const el=$('#cs-d');if(!el)return;
 const d=(+($('#cs-c')||{}).value||0)-expect;
 el.innerHTML=Math.abs(d)<0.01?'<span style="color:var(--jade)">'+ic('check',12)+' Balances exactly</span>'
  :'<span style="color:var(--rose)">'+(d>0?'Over by ':'Short by ')+rm(Math.abs(d))+'</span>';};

function bindSettings(){
 const so=$('#signout');if(so)so.onclick=()=>signOut(auth);

  try{await updateDoc(doc(db,'users',UID),{branchId:sw.value});ME.branchId=sw.value;
   watchAppointments();render();bindSettings();toast('Branch switched');}catch(e){toast(friendly(e));}};
 imgReset('bz-logo',(D.meta.biz||{}).logo||'');
 const bg=$('#bz-go');if(bg)bg.onclick=saveBiz;
 const sd=$('#seed');if(sd)sd.onclick=seedDemo;
 const bk=$('#bk');if(bk)bk.onclick=async()=>{
  toast('Building backup…');
  const out={exportedAt:new Date().toISOString()};
  for(const n of ['branches','rooms','users','services','products','packages','stock','vouchers',
   'customers','customerPackages','appointments','sales']){
   try{const s=await getDocs(query(collection(db,n),limit(3000)));

  const a=document.createElement('a');
  a.href='data:application/json,'+encodeURIComponent(JSON.stringify(out));
  a.download='spatify-backup-'+today()+'.json';a.click();toast('Backup downloaded');};
 const ab=$('#auditbox');
 if(ab)getDocs(query(collection(db,'audit'),orderBy('at','desc'),limit(40)))
  .then(s=>{ab.innerHTML=s.docs.map(d=>{const a=d.data();
   return '<div style="padding:7px 0;border-bottom:1px solid var(--line-2)"><div class="spread">'+
    '<b class="tiny">'+esc(a.action)+'</b><span class="tiny muted">'+dstr(a.at)+' '+tstr(a.at)+'</span></div>'+
    '<div class="tiny muted">'+esc(a.detail||'')+' — '+esc(a.userName||'')+'</div></div>';}).join('')||
    '<div class="empty">Nothing logged yet.</div>';})
  .catch(e=>{ab.innerHTML='<div class="tiny muted">'+esc(friendly(e))+'</div>';});
}

/* ============ boot ============ */
(async()=>{
 let cfg=null;
 const forced=localStorage.getItem(FORCEKEY)==='1';
 let raw=localStorage.getItem(CFGKEY)||localStorage.getItem(CFGKEY_OLD);
 if(raw){try{cfg=JSON.parse(raw);}catch(e){cfg=null;}}
 if(!cfg&&!forced)cfg=BUILTIN_CFG;      // the normal path: nothing to set up
 if(!cfg){setupScreen();return;}
 try{app=initializeApp(cfg);auth=getAuth(app);db=getFirestore(app);}
 catch(e){setupScreen('Could not start Firebase: '+e.message);return;}
 onAuthStateChanged(auth,async user=>{
  if(!user){ME=null;UID=null;unsub.forEach(u=>{try{u();}catch(e){}});unsub=[];loginScreen();return;}
  UID=user.uid;
  $('#root').innerHTML='<div class="center"><div class="spin"></div></div>';
  try{
   const p=await getDoc(doc(db,'users',UID));
   if(!p.exists()){noProfileScreen();return;}
   ME={id:UID,...p.data()};
   if(ME.active===false){await signOut(auth);loginScreen('This account has been deactivated.');return;}
   await loadStatic();
   if(!D.branches.length)D.branches=[{id:ME.branchId||'b1',name:'Main branch',code:'MAIN'}];
   if(!D.staff.find(s=>s.id===UID))D.staff.push({...ME});
   render();
   watchAppointments();
   await Promise.all([loadCustomers(''),loadRecentSales(),loadHeld(),loadNotes(),loadAttendance(),loadShift(),loadLoyalty()]);
   render();
   if(TAB==='rep')buildReport();
  }catch(e){
   console.error(e);
   $('#root').innerHTML='<div class="center"><div class="card"><h2>Could not load your data</h2>'+
    '<p class="tiny dim">'+esc(friendly(e))+'</p>'+
    '<p class="tiny muted">This is usually the Firestore security rules. Publish the rules file in '+
    'Firebase console → Firestore Database → Rules, then reload.</p>'+
    '<button class="btn" onclick="location.reload()">Reload</button>'+
    '<button class="btn ghost sm" style="margin-top:8px" onclick="firebaseSignOut()">Sign out</button></div></div>';
  }
 });
 window.firebaseSignOut=()=>signOut(auth);
})();
window.go=(t)=>{TAB=t;window.closeModal();render();window.scrollTo(0,0);
 if(t==='rep'&&!REPSALES)buildReport();};
