<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpaAtur Cloud</title>
<style>
:root{
  --porcelain:#F2F5F4;--card:#FFF;--ink:#16262B;--ink-2:#485D64;--ink-3:#87999F;
  --jade:#1E6E5B;--jade-soft:#E2EEEA;--amber:#AC7418;--amber-soft:#FAEFDB;
  --rose:#A44F5D;--rose-soft:#F7E6E8;--line:#DCE3E2;--line-2:#ECF0EF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--porcelain);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;padding-bottom:78px}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.015em}
h1{font-size:19px}h2{font-size:16px}h3{font-size:13.5px}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}.ico{display:inline-flex;vertical-align:-3px}
.topbar{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:9px;background:var(--jade);display:grid;place-items:center;flex:none}
.topbar .who{margin-left:auto;text-align:right;font-size:11px;color:#9CB1B6;line-height:1.35}
.wrap{max-width:1140px;margin:0 auto;padding:14px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--card);border-top:1px solid var(--line);
 display:flex;overflow-x:auto;scrollbar-width:none;padding:5px 2px env(safe-area-inset-bottom)}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto;background:none;border:0;padding:7px 10px 8px;font-size:10.5px;color:var(--ink-3);
 display:grid;justify-items:center;gap:4px;border-radius:11px;cursor:pointer;min-width:62px}
.nav button.on{color:var(--jade);background:var(--jade-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:9px;align-items:center}.row.wrap2{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:640px){.g3{grid-template-columns:1fr 1fr}}
.muted{color:var(--ink-3)}.dim{color:var(--ink-2)}.tiny{font-size:11.5px}
.big{font-size:23px;font-weight:660;letter-spacing:-.03em}
.btn{background:var(--jade);color:#fff;border:0;border-radius:10px;padding:9px 13px;font-weight:560;cursor:pointer;
 display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--rose)}.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px;cursor:pointer;
 display:grid;place-items:center;color:var(--ink-2)}
label{display:block;font-size:11.5px;color:var(--ink-2);margin:0 0 4px}
.f{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:560;
 background:var(--line-2);color:var(--ink-2)}
.pill.g{background:var(--jade-soft);color:var(--jade)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.pill.r{background:var(--rose-soft);color:var(--rose)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--ink-3);font-weight:560;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.num{text-align:right}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.item{border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:8px;background:#fff;cursor:pointer}
.bar{height:7px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--jade)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12.5px;
 cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.empty{text-align:center;padding:26px 14px;color:var(--ink-3);font-size:13px}
.veil{position:fixed;inset:0;background:rgba(14,30,35,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.veil{align-items:center}}
.sheet{background:var(--porcelain);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:700px){.sheet{border-radius:16px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{background:none;border:0;cursor:pointer;color:var(--ink-3);padding:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:10px 16px;
 border-radius:11px;z-index:99;font-size:13px;max-width:88%}
.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px}
.kpi .lab{font-size:11px;color:var(--ink-3);margin-bottom:3px;display:flex;align-items:center;gap:5px}
.chart{display:flex;align-items:flex-end;gap:5px;height:112px;padding-top:6px}
.chart>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.chart .b{width:100%;background:var(--jade);border-radius:4px 4px 0 0;min-height:2px}
.warnbox{background:var(--amber-soft);border:1px solid #EBDCBA;border-radius:11px;padding:10px 12px;margin-bottom:10px;font-size:12.5px}
.errbox{background:var(--rose-soft);border:1px solid #E9CDD2;border-radius:11px;padding:10px 12px;margin-bottom:10px;font-size:12.5px}
.slot{border:1px solid var(--line);border-left:3px solid var(--jade);border-radius:9px;padding:9px 10px;margin-bottom:7px;
 cursor:pointer;background:#fff}
.slot.done{border-left-color:var(--ink-3);opacity:.75}
.slot.no{border-left-color:var(--rose)}
.calbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calbar .title{font-weight:620;font-size:15px;flex:1;text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mhead{font-size:10.5px;color:var(--ink-3);text-align:center;padding:4px 0 6px;font-weight:560}
.mcell{aspect-ratio:1/1.08;border:1px solid var(--line-2);border-radius:9px;padding:4px 5px;cursor:pointer;
 display:flex;flex-direction:column;gap:3px;background:#fff;overflow:hidden}
.mcell.off{background:var(--porcelain);color:var(--ink-3);opacity:.6}
.mcell.today{box-shadow:inset 0 0 0 1px var(--jade);border-color:var(--jade)}
.mcell.sel{background:var(--jade);color:#fff;border-color:var(--jade)}
.mcell .d{font-size:12px;font-weight:560}
.mcell .dots{display:flex;flex-wrap:wrap;gap:2px}
.mcell .dot{width:5px;height:5px;border-radius:99px;background:var(--jade)}
.mcell .dot.n{background:var(--rose)}.mcell .dot.f{background:var(--ink-3)}
.mcell.sel .dot{background:#fff}
.mcell .cnt{font-size:10px;margin-top:auto;color:var(--ink-3)}
.mcell.sel .cnt{color:#DCEFE9}
.tl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff}
.tlg{display:grid;min-width:max-content}
.tlh{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:7px 8px;font-size:11.5px;
 font-weight:560;text-align:center;border-left:1px solid var(--line-2)}
.tlh.first{border-left:0}
.tlh small{display:block;color:var(--ink-3);font-weight:400;font-size:10px}
.tlgut{position:relative;border-right:1px solid var(--line-2)}
.tlgut span{position:absolute;right:5px;font-size:10px;color:var(--ink-3);transform:translateY(-6px)}
.tlcol{position:relative;border-left:1px solid var(--line-2)}.tlcol.first{border-left:0}
.hline{position:absolute;left:0;right:0;border-top:1px solid var(--line-2)}
.hline.half{border-top-style:dotted}
.blk{position:absolute;left:3px;right:3px;border-radius:7px;padding:4px 6px;overflow:hidden;cursor:pointer;
 background:var(--jade-soft);border-left:3px solid var(--jade);font-size:11px;line-height:1.3}
.blk b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk small{color:var(--ink-2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk.done{background:var(--line-2);border-left-color:var(--ink-3)}
.blk.no{background:var(--rose-soft);border-left-color:var(--rose)}
.blk.in{background:var(--amber-soft);border-left-color:var(--amber)}
.buf{position:absolute;left:3px;right:3px;border-radius:0 0 6px 6px;
 background:repeating-linear-gradient(45deg,var(--line-2),var(--line-2) 4px,transparent 4px,transparent 8px)}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--rose);z-index:2}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--ink-3)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.center .card{max-width:440px;width:100%}
.step{display:flex;gap:10px;margin-bottom:12px}
.step .n{width:22px;height:22px;border-radius:99px;background:var(--jade);color:#fff;display:grid;place-items:center;
 font-size:11px;font-weight:600;flex:none;margin-top:1px}
code{background:var(--line-2);padding:1px 5px;border-radius:5px;font-size:12px;word-break:break-all}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--jade);border-radius:99px;
 animation:sp .7s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
canvas{border:1px dashed var(--line);border-radius:10px;background:#fff;width:100%;touch-action:none}
@media print{.nav,.topbar,.noprint{display:none!important}body{padding:0;background:#fff}.card{border:0;break-inside:avoid}}
</style>

<div id="root"><div class="center"><div class="spin"></div></div></div>
<div id="modal"></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,collectionGroup,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,
  query,where,orderBy,limit,onSnapshot,writeBatch,runTransaction,increment,serverTimestamp}
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ============ icons ============ */
const ICONS={
 home:'M3 10.8L12 3l9 7.8M5.5 9.4V21h4.2v-6.2h4.6V21h4.2V9.4',

 card:'M3.2 6.8h17.6v10.4H3.2zM3.2 10.6h17.6M6.4 14.3h3.4',

 chart:'M4 20.4V11M9.3 20.4V4.6M14.7 20.4v-6M20 20.4v-9.8M2.6 20.4h18.8',
 spark:'M12 3.4l1.7 4.9 4.9 1.7-4.9 1.7L12 16.6l-1.7-4.9L5.4 10l4.9-1.7z',
 gear:'M12 9.2a2.8 2.8 0 100 5.6 2.8 2.8 0 000-5.6zM12 3.4v2.4M12 18.2v2.4M20.6 12h-2.4M5.8 12H3.4M18.1 5.9l-1.7 1.7M7.6 16.4l-1.7 1.7M18.1 18.1l-1.7-1.7M7.6 7.6L5.9 5.9',

 close:'M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6',
 left:'M14.6 5.4L8 12l6.6 6.6',right:'M9.4 5.4L16 12l-6.6 6.6',

const ic=(n,s,st)=>'<span class="ico"><svg width="'+(s||18)+'" height="'+(s||18)+'" viewBox="0 0 24 24" fill="none" '+
 'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"'+(st?' style="'+st+'"':'')+
 '><path d="'+ICONS[n]+'"/></svg></span>';

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm=n=>'RM'+(Math.round((n||0)*100)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const ymd=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const today=()=>ymd(new Date());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const dstr=d=>new Date(d).toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'});
const dshort=d=>new Date(d).toLocaleDateString('en-MY',{day:'numeric',month:'short'});
const tstr=d=>new Date(d).toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit',hour12:false});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;
 document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function modal(title,html,onMount){
 $('#modal').innerHTML='<div class="veil" onclick="if(event.target===this)window.closeModal()"><div class="sheet">'+
  '<div class="sheet-h"><h2>'+esc(title)+'</h2><button class="x" onclick="window.closeModal()">'+ic('close',22)+'</button></div>'+
  html+'</div></div>';
 if(onMount)onMount();}
window.closeModal=()=>{$('#modal').innerHTML='';};

/* ============ state ============ */
const CFGKEY='spaatur:firebase';
let app,auth,db,ME=null,UID=null;
const D={branches:[],rooms:[],staff:[],services:[],products:[],packages:[],stock:[],vouchers:[],meta:{}};
let APPTS=[],CUSTS=[],SALES=[],unsub=[];
let TAB='home',calMode='day',calDate=today(),calBy='staff',calWin={from:'',to:''};
const ROLE={owner:'Owner',manager:'Manager',therapist:'Therapist',frontdesk:'Front desk',doctor:'Doctor'};
const svc=id=>D.services.find(s=>s.id===id)||{};
const prod=sku=>D.products.find(p=>p.id===sku)||{};
const stf=id=>D.staff.find(s=>s.id===id)||{};
const room=id=>D.rooms.find(r=>r.id===id)||{};
const cust=id=>CUSTS.find(c=>c.id===id)||null;
const branch=()=>D.branches.find(b=>b.id===(ME&&ME.branchId))||D.branches[0]||{name:'—',code:''};
const stockOf=(sku,b)=>D.stock.find(s=>s.sku===sku&&s.branchId===(b||ME.branchId));
const boss=()=>ME&&['owner','manager'].includes(ME.role);
const can=k=>{if(!ME)return false;if(['owner','manager'].includes(ME.role))return true;
 return (ME.perms||[]).includes(k);};

async function audit(action,detail){
 try{await addDoc(collection(db,'audit'),{action,detail,uid:UID,userName:ME.name,
  branchId:ME.branchId,at:new Date().toISOString()});}catch(e){console.warn('audit',e);}}

/* ============ setup screens ============ */
function setupScreen(err){
 $('#root').innerHTML='<div class="center"><div class="card">'+
  '<div class="row" style="margin-bottom:10px">'+ic('cloud',22)+'<h1>Connect your Firebase project</h1></div>'+
  (err?'<div class="errbox">'+esc(err)+'</div>':'')+
  '<div class="step"><div class="n">1</div><div class="tiny dim">Open <b>console.firebase.google.com</b> in another tab. '+
  'Pick your project, then the gear icon beside <b>Project Overview</b> → <b>Project settings</b>.</div></div>'+
  '<div class="step"><div class="n">2</div><div class="tiny dim">Scroll to <b>Your apps</b>. If there is no web app yet, tap the '+
  '<b>&lt;/&gt;</b> icon to add one — any nickname will do, and you can skip Firebase Hosting.</div></div>'+
  '<div class="step"><div class="n">3</div><div class="tiny dim">You will see a block starting with '+
  '<code>const firebaseConfig = {</code>. Copy it and paste the whole thing below.</div></div>'+
  '<textarea class="f" id="cfg" rows="9" placeholder="const firebaseConfig = {&#10;  apiKey: ...&#10;};"></textarea>'+
  '<button class="btn" style="width:100%;justify-content:center" id="cfgsave">'+ic('check',16)+'Connect</button>'+
  '<p class="tiny muted" style="margin-top:10px">'+ic('shield',13)+' These values are safe to paste. A Firebase web config is '+
  'public by design — your data is protected by the security rules, not by hiding this.</p></div></div>';
 $('#cfgsave').onclick=()=>{
  const raw=$('#cfg').value.trim();
  let cfg=null;
  try{
   const m=raw.match(/\{[\s\S]*\}/);
   if(!m)throw new Error('Could not find a { … } block in what you pasted.');
   cfg=(new Function('return ('+m[0]+')'))();
  }catch(e){setupScreen('That does not look like a Firebase config. '+e.message);return;}
  if(!cfg||!cfg.apiKey||!cfg.projectId){setupScreen('The config is missing apiKey or projectId. Copy the whole block.');return;}
  localStorage.setItem(CFGKEY,JSON.stringify(cfg));
  location.reload();};
}
function loginScreen(err){
 $('#root').innerHTML='<div class="center"><div class="card">'+
  '<div class="row" style="margin-bottom:12px"><div class="mark">'+ic('spark',17,'color:#fff')+'</div><h1>SpaAtur</h1></div>'+
  (err?'<div class="errbox">'+esc(err)+'</div>':'')+
  '<label>Email</label><input class="f" id="li-e" type="email" autocomplete="username">'+
  '<label>Password</label><input class="f" id="li-p" type="password" autocomplete="current-password">'+

function friendly(e){
 const c=(e&&e.code)||'';
 if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))
   return 'Email or password is not correct.';
 if(c.includes('too-many-requests'))return 'Too many attempts. Wait a few minutes and try again.';
 if(c.includes('network'))return 'No connection to Firebase. Check the tablet is online.';
 if(c.includes('permission-denied'))return 'Firestore rules blocked this. Publish the rules file, then try again.';
 if(c.includes('configuration-not-found')||c.includes('operation-not-allowed'))
   return 'Email/password sign-in is switched off. Turn it on in Firebase console → Authentication → Sign-in method.';
 return (e&&e.message)||'Something went wrong.';
}

async function saveAppt(){
 const btn=$('#n-go');btn.disabled=true;
 try{
  const s=svc($('#n-s').value);
  const start=new Date($('#n-d').value+'T'+$('#n-t').value+':00');
  if(isNaN(+start))throw new Error('Please pick a valid date and time.');
  const finish=new Date(+start+s.dur*6e4);
  const staffId=$('#n-st').value,roomId=$('#n-r').value;
  if(!staffId)throw new Error('No therapist selected.');
  if(!roomId)throw new Error('No room available for this treatment type.');
  const date=ymd(start);
  const day=await getDocs(query(collection(db,'appointments'),where('branchId','==',ME.branchId),where('date','==',date)));
  const s0=+start,e0=+finish+s.buffer*6e4;
  for(const dd of day.docs){
   const a=dd.data();
   if(a.status==='cancel'||a.status==='no')continue;
   const as=+new Date(a.start),ae=+new Date(a.finish)+(a.buffer||0)*6e4;
   if(!(e0<=as||s0>=ae)){
    if(a.staffId===staffId)throw new Error(stf(staffId).name+' already has a booking at '+tstr(a.start));
    if(a.roomId===roomId)throw new Error(room(roomId).name+' is occupied at '+tstr(a.start));
   }}
  const c=cust($('#n-c').value)||{};
  await addDoc(collection(db,'appointments'),{branchId:ME.branchId,customerId:$('#n-c').value,customerName:c.name||'',
   staffId,staffName:stf(staffId).name,serviceId:s.id,serviceName:s.name,roomId,date,
   start:start.toISOString(),finish:finish.toISOString(),duration:s.dur,buffer:s.buffer,status:'booked',
   deposit:+$('#n-dep').value||0,notes:$('#n-n').value||'',createdBy:UID,createdAt:new Date().toISOString()});
  await audit('Booking created',(c.name||'')+' · '+s.name+' · '+dstr(start)+' '+tstr(start));
  window.closeModal();calDate=ymd(start);calMode='day';render();
  if(needsWindow())watchAppointments();
  toast('Booking saved');
 }catch(e){const el=$('#n-err');if(el)el.textContent=friendly(e);btn.disabled=false;}
}

window.redeem=async(id,i)=>{
 const cp=HELD.find(x=>x.id===id);
 if(new Date(cp.expiry)<new Date()&&!confirm('This package has expired. Redeem anyway?'))return;
 try{
  await runTransaction(db,async tx=>{
   const ref=doc(db,'customerPackages',id);
   const snap=await tx.get(ref);
   if(!snap.exists())throw new Error('Package not found.');
   const bal=snap.data().balances.map(b=>({...b}));
   if(!(bal[i].left>0))throw new Error('No sessions left on this line.');
   bal[i].left-=1;
   tx.update(ref,{balances:bal,lastRedeemedAt:new Date().toISOString(),lastRedeemedBy:UID});
  });
  cp.balances[i].left-=1;
  const s=svc(cp.balances[i].serviceId);
  for(const u of (s.use||[])){const st=stockOf(u.sku);if(st){await updateDoc(doc(db,'stock',st.id),{qty:increment(-u.qty)});st.qty-=u.qty;}}

 const net=Math.max(0,sub-cart.discount-v);

 const total=net+sst,paid=cart.payments.reduce((a,p)=>a+p.amount,0);
 return{sub,v,net,sst,total,paid,balance:total-paid};}

window.checkout=async()=>{
 const btn=$('#co-go');if(btn)btn.disabled=true;
 const t=cartTotals();
 try{
  // prices are re-read from the catalogue, never trusted from the cart UI
  const items=cart.items.map(i=>{
   const src=i.kind==='service'?svc(i.id):prod(i.id);
   return{kind:i.kind,id:i.id,name:src.name,price:src.price,qty:i.qty,staffId:i.staffId};});
  const sub=items.reduce((a,i)=>a+i.price*i.qty,0);
  const v=cart.voucher?(cart.voucher.type==='pct'?sub*cart.voucher.value/100:cart.voucher.value):0;
  const net=Math.max(0,sub-cart.discount-v);
  const sst=D.meta.biz.sst?net*(D.meta.biz.sstRate||8)/100:0;
  const total=net+sst;
  const c=cust(cart.customerId);
  const ref=await addDoc(collection(db,'sales'),{branchId:ME.branchId,customerId:cart.customerId||'',
   customerName:c?c.name:'Walk-in',staffId:UID,staffName:ME.name,items,discount:cart.discount+v,
   voucher:cart.voucher?cart.voucher.id:'',sst,total,date:today(),at:new Date().toISOString(),
   voided:false,payments:cart.payments.slice(),createdBy:UID,
   invoiceNo:'INV-'+Date.now().toString().slice(-8)});
  for(const i of items){
   if(i.kind==='product'){const st=stockOf(i.id);if(st){await updateDoc(doc(db,'stock',st.id),{qty:increment(-i.qty)});st.qty-=i.qty;}}
   if(i.kind==='service'){for(const u of (svc(i.id).use||[])){const st=stockOf(u.sku);
    if(st){await updateDoc(doc(db,'stock',st.id),{qty:increment(-u.qty*i.qty)});st.qty-=u.qty*i.qty;}}}
  }
  if(cart.voucher){try{await updateDoc(doc(db,'vouchers',cart.voucher.id),{used:increment(1)});}catch(e){}}
  await audit('Bill completed',rm(total)+' · '+(c?c.name:'Walk-in'));
  cart={customerId:'',items:[],discount:0,voucher:null,payments:[]};
  await loadRecentSales();render();
  window.openSale(ref.id);
 }catch(e){toast(friendly(e));if(btn)btn.disabled=false;}};

 const S=REPSALES.filter(s=>!s.voided);

 const rev=mine.reduce((a,s)=>a+s.total,0);
 const uniq=new Set(mine.map(s=>s.customerId).filter(Boolean)).size;
 const cat={Services:0,Retail:0,Packages:0};
 mine.forEach(s=>(s.items||[]).forEach(i=>{
  if(i.kind==='service')cat.Services+=i.price*i.qty;

  '<div style="margin:9px 0"><div class="spread tiny"><span>'+k+'</span><span>'+rm(cat[k])+' · '+
  (rev?Math.round(cat[k]/rev*100):0)+'%</span></div><div class="bar"><i style="width:'+
  (rev?cat[k]/rev*100:0)+'%"></i></div></div>').join('')+
  '<p class="tiny muted">Packages count as revenue when sold. Redeemed sessions are not counted again.</p></div>';
 h+='<div class="card"><h2>Branch comparison</h2><div class="scroll"><table><tr><th>Branch</th>'+
  '<th class="num">Revenue</th><th class="num">Bills</th><th class="num">Average</th></tr>'+
  D.branches.map(b=>{const x=S.filter(s=>s.branchId===b.id),r=x.reduce((a,s)=>a+s.total,0);
   return '<tr><td>'+esc(b.name)+'</td><td class="num">'+rm(r)+'</td><td class="num">'+x.length+
   '</td><td class="num">'+rm(x.length?r/x.length:0)+'</td></tr>';}).join('')+'</table></div></div>';
 const top={};mine.forEach(s=>(s.items||[]).forEach(i=>{if(i.kind==='service')top[i.name]=(top[i.name]||0)+i.price*i.qty;}));
 h+='<div class="card"><h2>Top treatments</h2><table>'+Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,10)
  .map(([n,v])=>'<tr><td>'+esc(n)+'</td><td class="num">'+rm(v)+'</td></tr>').join('')+'</table></div>';
 const comm={};
 mine.forEach(s=>(s.items||[]).forEach(i=>{
  const who=i.staffId||s.staffId;const u=stf(who);if(!u.id)return;
  const rate=i.kind==='service'?(svc(i.id).comm??u.commSvc??0):(u.commProd??0);
  comm[who]=comm[who]||{name:u.name,svc:0,prod:0,c:0};
  if(i.kind==='service')comm[who].svc+=i.price*i.qty;else if(i.kind==='product')comm[who].prod+=i.price*i.qty;
  comm[who].c+=i.price*i.qty*rate/100;}));
 h+='<div class="card"><h2>Commission</h2><div class="scroll"><table><tr><th>Team member</th>'+
  '<th class="num">Services</th><th class="num">Retail</th><th class="num">Commission</th></tr>'+
  (Object.values(comm).map(x=>'<tr><td>'+esc(x.name)+'</td><td class="num">'+rm(x.svc)+'</td><td class="num">'+
   rm(x.prod)+'</td><td class="num"><b>'+rm(x.c)+'</b></td></tr>').join('')||
   '<tr><td colspan="4" class="muted">No sales in this period.</td></tr>')+'</table></div>'+
  '<p class="tiny muted">Rates come from each service and each staff profile.</p></div>';
 return h;}
async function buildReport(){
 try{
  const from=ymd(addDays(new Date(),-repDays));
  const s=await getDocs(query(collection(db,'sales'),where('date','>=',from),orderBy('date','desc'),limit(1000)));
  REPSALES=s.docs.map(d=>({id:d.id,...d.data()}));
 }catch(e){REPSALES=[];toast(friendly(e));}
 if(TAB==='rep')render();
}
window.csvSales=()=>{
 if(!REPSALES){toast('Still loading');return;}
 const rows=[['Invoice','Date','Branch','Client','Staff','Items','Discount','SST','Total','Payments']];
 REPSALES.filter(s=>!s.voided).forEach(s=>rows.push([s.invoiceNo||s.id,s.date,
  (D.branches.find(b=>b.id===s.branchId)||{}).code||'',s.customerName||'Walk-in',s.staffName||'',
  (s.items||[]).map(i=>i.name+'×'+i.qty).join('; '),s.discount||0,s.sst||0,s.total,
  (s.payments||[]).map(p=>p.method+' '+p.amount).join('; ')]));
 const txt=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');
 a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('\ufeff'+txt);
 a.download='sales-'+today()+'.csv';a.click();toast('CSV downloaded');};

  h+='<div class="card"><h2 style="margin-bottom:10px">Data</h2><div class="row wrap2">'+

   '<button class="btn sm ghost" id="bk">'+ic('download',14)+'Export backup JSON</button></div>'+
   '<p class="tiny muted" style="margin-top:8px">Demo data only fills what is missing. Your existing records are not overwritten.</p></div>';
  h+='<div class="card"><h2>Audit trail</h2><div id="auditbox"><div class="spin"></div></div></div>';
 }

function bindSettings(){
 const so=$('#signout');if(so)so.onclick=()=>signOut(auth);
 const sw=$('#sw-b');if(sw)sw.onchange=async()=>{
  try{await updateDoc(doc(db,'users',UID),{branchId:sw.value});ME.branchId=sw.value;
   watchAppointments();render();bindSettings();toast('Branch switched');}catch(e){toast(friendly(e));}};
 const bg=$('#bz-go');if(bg)bg.onclick=async()=>{
  const m={open:+$('#bz-o').value||9,close:+$('#bz-c').value||20,
   biz:{...(D.meta.biz||{}),name:$('#bz-n').value,ssm:$('#bz-s').value,tin:$('#bz-t').value,
    phone:$('#bz-p').value,sst:$('#bz-sst').checked?1:0,sstRate:(D.meta.biz||{}).sstRate||8}};
  try{await setDoc(doc(db,'meta','settings'),m,{merge:true});D.meta={...D.meta,...m};
   await audit('Settings updated',m.biz.name);toast('Saved');}catch(e){toast(friendly(e));}};
 const sd=$('#seed');if(sd)sd.onclick=seedDemo;
 const bk=$('#bk');if(bk)bk.onclick=async()=>{
  toast('Building backup…');
  const out={exportedAt:new Date().toISOString()};
  for(const n of ['branches','rooms','users','services','products','packages','stock','vouchers',
   'customers','customerPackages','appointments','sales']){
   try{const s=await getDocs(query(collection(db,n),limit(3000)));
    out[n]=s.docs.map(d=>({id:d.id,...d.data()}));}catch(e){out[n]='blocked: '+e.code;}}
  const a=document.createElement('a');
  a.href='data:application/json,'+encodeURIComponent(JSON.stringify(out));
  a.download='spaatur-backup-'+today()+'.json';a.click();toast('Backup downloaded');};
 const ab=$('#auditbox');
 if(ab)getDocs(query(collection(db,'audit'),orderBy('at','desc'),limit(40)))
  .then(s=>{ab.innerHTML=s.docs.map(d=>{const a=d.data();
   return '<div style="padding:7px 0;border-bottom:1px solid var(--line-2)"><div class="spread">'+
    '<b class="tiny">'+esc(a.action)+'</b><span class="tiny muted">'+dstr(a.at)+' '+tstr(a.at)+'</span></div>'+
    '<div class="tiny muted">'+esc(a.detail||'')+' — '+esc(a.userName||'')+'</div></div>';}).join('')||
    '<div class="empty">Nothing logged yet.</div>';})
  .catch(e=>{ab.innerHTML='<div class="tiny muted">'+esc(friendly(e))+'</div>';});
}
window.openStaff=id=>{
 const s=stf(id);
 modal(s.name,'<div class="card"><label>Service commission (%)</label>'+
  '<input class="f" type="number" id="st-cs" value="'+(s.commSvc||0)+'">'+
  '<label>Retail commission (%)</label><input class="f" type="number" id="st-cp" value="'+(s.commProd||0)+'">'+
  '<label>Role</label><select class="f" id="st-r">'+['therapist','frontdesk','manager','doctor','owner'].map(r=>
   '<option value="'+r+'"'+(s.role===r?' selected':'')+'>'+ROLE[r]+'</option>').join('')+'</select>'+
  '<label>Branch</label><select class="f" id="st-b">'+D.branches.map(b=>'<option value="'+b.id+'"'+
   (s.branchId===b.id?' selected':'')+'>'+esc(b.name)+'</option>').join('')+'</select>'+
  '<label class="row" style="gap:8px;margin-bottom:10px"><input type="checkbox" id="st-t"'+(s.takes?' checked':'')+
   '> Bookable column in the calendar</label>'+
  '<button class="btn" style="width:100%;justify-content:center" id="st-go">Save</button></div>',
 ()=>{$('#st-go').onclick=async()=>{
  const patch={commSvc:+$('#st-cs').value,commProd:+$('#st-cp').value,role:$('#st-r').value,
   branchId:$('#st-b').value,takes:$('#st-t').checked,
   perms:['therapist','frontdesk'].includes($('#st-r').value)?['booking','pos','customer']:[]};
  try{await updateDoc(doc(db,'users',id),patch);Object.assign(s,patch);
   await audit('Team settings updated',s.name);window.closeModal();render();bindSettings();toast('Saved');}
  catch(e){toast(friendly(e));}};});};

/* ============ after-render bindings ============ */
const _render=render;
render=function(){_render();if(TAB==='cust')bindCustSearch();if(TAB==='set')bindSettings();};
window.render=render;

/* ============ boot ============ */
(async()=>{
 const raw=localStorage.getItem(CFGKEY);
 if(!raw){setupScreen();return;}
 let cfg;try{cfg=JSON.parse(raw);}catch(e){localStorage.removeItem(CFGKEY);setupScreen('Saved config was unreadable.');return;}
 try{app=initializeApp(cfg);auth=getAuth(app);db=getFirestore(app);}
 catch(e){setupScreen('Could not start Firebase: '+e.message);return;}
 onAuthStateChanged(auth,async user=>{
  if(!user){ME=null;UID=null;unsub.forEach(u=>{try{u();}catch(e){}});unsub=[];loginScreen();return;}
  UID=user.uid;
  $('#root').innerHTML='<div class="center"><div class="spin"></div></div>';
  try{
   const p=await getDoc(doc(db,'users',UID));
   if(!p.exists()){noProfileScreen();return;}
   ME={id:UID,...p.data()};
   if(ME.active===false){await signOut(auth);loginScreen('This account has been deactivated.');return;}
   await loadStatic();
   if(!D.branches.length)D.branches=[{id:ME.branchId||'b1',name:'Main branch',code:'MAIN'}];
   if(!D.staff.find(s=>s.id===UID))D.staff.push({...ME});
   render();
   watchAppointments();
   await Promise.all([loadCustomers(''),loadRecentSales(),loadHeld()]);
   render();
   if(TAB==='rep')buildReport();
  }catch(e){
   console.error(e);
   $('#root').innerHTML='<div class="center"><div class="card"><h2>Could not load your data</h2>'+
    '<p class="tiny dim">'+esc(friendly(e))+'</p>'+
    '<p class="tiny muted">This is usually the Firestore security rules. Publish the rules file in '+
    'Firebase console → Firestore Database → Rules, then reload.</p>'+
    '<button class="btn" onclick="location.reload()">Reload</button>'+
    '<button class="btn ghost sm" style="margin-top:8px" onclick="firebaseSignOut()">Sign out</button></div></div>';
  }
 });
 window.firebaseSignOut=()=>signOut(auth);
})();
window.go=(t)=>{TAB=t;window.closeModal();render();window.scrollTo(0,0);
 if(t==='rep'&&!REPSALES)buildReport();};
</script>
