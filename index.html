<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luuna Skin Spa</title>
<meta name="description" content="Bookings, checkout, clients, stock and reports.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#14120F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luuna">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --cream:#F4F0E7; --surface:#FFFDF8; --surface-2:#FAF7F0;
  --ink:#14120F; --ink-2:#4A453C; --ink-3:#8C8577;
  --line:#E3DDD0; --line-2:#EFEAE0;
  --brass:#A67C3D; --brass-soft:#F3E9D8;
  --jade:#2E6B52; --jade-soft:#E4EEE8;
  --amber:#9C6B15; --amber-soft:#F8EEDA;
  --rose:#9B4A4A; --rose-soft:#F6E5E3;
  --r-lg:18px; --r-md:13px; --r-sm:10px;
  --shadow:0 1px 2px rgba(20,18,15,.04),0 8px 24px -12px rgba(20,18,15,.18);
  --shadow-lift:0 2px 6px rgba(20,18,15,.06),0 18px 40px -16px rgba(20,18,15,.28);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);
  background-image:radial-gradient(900px 420px at 88% -140px,rgba(166,124,61,.13),transparent 70%),
    radial-gradient(760px 380px at -8% -120px,rgba(46,107,82,.07),transparent 68%);
  background-attachment:fixed;background-repeat:no-repeat;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.022em}
h1{font-size:20px}h2{font-size:16.5px}h3{font-size:13.5px}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
.ico{display:inline-flex;vertical-align:-3px}

/* ---------- animation ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-320px 0}100%{background-position:320px 0}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.anim{animation:fadeUp .42s var(--ease) both}
.wrap>*{animation:fadeUp .38s var(--ease) both}
.wrap>*:nth-child(1){animation-delay:.02s}
.wrap>*:nth-child(2){animation-delay:.07s}
.wrap>*:nth-child(3){animation-delay:.12s}
.wrap>*:nth-child(4){animation-delay:.17s}
.wrap>*:nth-child(5){animation-delay:.21s}
.wrap>*:nth-child(n+6){animation-delay:.25s}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- chrome ---------- */

.mark{width:31px;height:31px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--brass),#7E5B26);color:#fff;
  box-shadow:0 2px 8px -2px rgba(166,124,61,.7)}
.brand{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.wrap{max-width:1140px;margin:0 auto;padding:15px}






/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:15px;margin-bottom:12px;box-shadow:var(--shadow);
  background-image:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0) 90px)}
.row{display:flex;gap:9px;align-items:center}.row.wrap2{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:640px){.g3{grid-template-columns:1fr 1fr}}
.muted{color:var(--ink-3)}.dim{color:var(--ink-2)}.tiny{font-size:11.5px}
.big{font-size:24px;font-weight:660;letter-spacing:-.035em}

/* ---------- buttons ---------- */
.btn{background:var(--ink);color:var(--cream);border:0;border-radius:var(--r-sm);
  padding:10px 14px;font-weight:560;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:transform .16s var(--ease),box-shadow .22s var(--ease),opacity .2s;
  box-shadow:0 1px 2px rgba(20,18,15,.16),0 8px 18px -10px rgba(20,18,15,.6)}
.btn:active{transform:translateY(1px) scale(.985);box-shadow:0 1px 2px rgba(20,18,15,.2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:active{background:var(--surface-2)}
.btn.brass{background:linear-gradient(145deg,var(--brass),#8A6530);color:#fff}
.btn.warn{background:var(--rose);color:#fff}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.iconbtn{background:rgba(255,253,248,.55);border:1px solid rgba(20,18,15,.10);
  border-radius:var(--r-sm);padding:8px;cursor:pointer;display:grid;place-items:center;
  color:var(--ink-2);backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  box-shadow:0 1px 2px rgba(20,18,15,.05),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .16s var(--ease),background .22s,color .22s,box-shadow .22s}
.iconbtn:active{transform:scale(.9);background:rgba(20,18,15,.88);color:var(--cream);
  box-shadow:0 6px 16px -6px rgba(20,18,15,.5)}
.btn.ghost{backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  background:rgba(255,253,248,.5);border-color:rgba(20,18,15,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.btn.ghost:active{background:rgba(20,18,15,.9);color:var(--cream)}
.qbtn{background:rgba(255,253,248,.58);border-color:rgba(20,18,15,.09);
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  box-shadow:0 1px 2px rgba(20,18,15,.05),inset 0 1px 0 rgba(255,255,255,.6)}
.x{background:rgba(255,253,248,.55);border-color:rgba(20,18,15,.10);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.fabrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}

/* ---------- forms ---------- */
label{display:block;font-size:11.5px;color:var(--ink-2);margin:0 0 5px;font-weight:530}
.f{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);margin-bottom:11px;transition:border-color .2s,box-shadow .2s}
.f:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,18,15,.07)}
.fieldset{border:1px solid var(--line-2);border-radius:var(--r-md);padding:12px;margin-bottom:12px;
  background:var(--surface-2)}
.fieldset>h3{margin-bottom:10px;display:flex;align-items:center;gap:7px;color:var(--ink-2);
  font-size:11.5px;text-transform:uppercase;letter-spacing:.07em}

/* ---------- pills & tables ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;
  font-weight:560;background:var(--line-2);color:var(--ink-2)}
.pill.g{background:var(--jade-soft);color:var(--jade)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.pill.r{background:var(--rose-soft);color:var(--rose)}
.pill.b{background:var(--brass-soft);color:var(--brass)}
.pill.dark{background:var(--ink);color:var(--cream)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;color:var(--ink-3);font-weight:560;padding:7px 8px;
  border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em}
td{padding:9px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.num{text-align:right}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.item{border:1px solid var(--line);border-radius:var(--r-md);padding:11px 12px;margin-bottom:8px;
  background:var(--surface);cursor:pointer;
  transition:transform .16s var(--ease),box-shadow .22s var(--ease),border-color .2s}
.item:active{transform:scale(.985);box-shadow:var(--shadow-lift);border-color:var(--ink-3)}
.bar{height:7px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:99px;
  transition:width .7s var(--ease)}
.bar>i.brass{background:linear-gradient(90deg,var(--brass),#C79A55)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:13px;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;
  transition:background .22s var(--ease),color .22s,border-color .22s,transform .16s var(--ease)}
.tabs button:active{transform:scale(.95)}
.tabs button.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.seg{display:flex;background:var(--line-2);border-radius:99px;padding:3px;gap:3px;margin-bottom:13px}
.seg button{flex:1;background:transparent;border:0;border-radius:99px;padding:8px 10px;font-size:12.5px;
  color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:background .25s var(--ease),color .25s,box-shadow .25s}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:560;box-shadow:var(--shadow)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:10px}
.empty{text-align:center;padding:30px 14px;color:var(--ink-3);font-size:13px}
.empty .ico{opacity:.4;margin-bottom:6px;justify-content:center}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(20,18,15,.44);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);z-index:80;
  display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .22s var(--ease)}
@media(min-width:700px){.veil{align-items:center}}
.sheet{width:100%;max-width:580px;max-height:92vh;overflow:auto;
  border-radius:26px 26px 0 0;padding:18px;animation:sheetUp .34s var(--ease);
  background:rgba(244,240,231,.86);backdrop-filter:blur(26px) saturate(170%);
  -webkit-backdrop-filter:blur(26px) saturate(170%);
  border:1px solid rgba(255,255,255,.5);border-bottom:0;
  box-shadow:0 -14px 60px -22px rgba(0,0,0,.6)}
@media(min-width:700px){.sheet{border-radius:22px;border-bottom:1px solid rgba(255,255,255,.5);
  animation:pop .28s var(--ease);margin:0 14px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.x{background:var(--surface);border:1px solid var(--line);border-radius:99px;cursor:pointer;
  color:var(--ink-2);padding:6px;display:grid;place-items:center;transition:transform .16s var(--ease)}
.x:active{transform:scale(.9) rotate(90deg)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:var(--cream);padding:11px 17px;
  border-radius:12px;z-index:99;font-size:13px;max-width:88%;animation:toastIn .3s var(--ease);
  box-shadow:0 14px 36px -14px rgba(0,0,0,.7)}

/* ---------- kpi & chart ---------- */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:12px 13px;
  box-shadow:var(--shadow);transition:transform .18s var(--ease);position:relative;overflow:hidden;
  background-image:linear-gradient(160deg,rgba(166,124,61,.07),rgba(255,255,255,0) 58%)}
.kpi:active{transform:scale(.98)}
.kpi .lab{font-size:10.5px;color:var(--ink-3);margin-bottom:4px;display:flex;align-items:center;gap:5px;
  text-transform:uppercase;letter-spacing:.06em}
.kpi.dark{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.kpi.dark .lab{color:#9A9285}
.chart{display:flex;align-items:flex-end;gap:6px;height:118px;padding-top:6px}
.chart>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.chart .b{width:100%;background:var(--ink);border-radius:5px 5px 2px 2px;min-height:3px;
  animation:grow .6s var(--ease) both}
@keyframes grow{from{height:0!important;opacity:.3}}
.warnbox{background:var(--amber-soft);border:1px solid #E8D9B8;border-radius:var(--r-md);
  padding:11px 13px;margin-bottom:11px;font-size:12.5px}
.errbox{background:var(--rose-soft);border:1px solid #E9CFCC;border-radius:var(--r-md);
  padding:11px 13px;margin-bottom:11px;font-size:12.5px}
.slot{border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:var(--r-md);
  padding:10px 11px;margin-bottom:8px;cursor:pointer;background:var(--surface);
  transition:transform .16s var(--ease),box-shadow .2s}
.slot:active{transform:scale(.985);box-shadow:var(--shadow-lift)}
.slot.done{border-left-color:var(--ink-3);opacity:.72}
.slot.no{border-left-color:var(--rose)}

/* ---------- client profile ---------- */
.avatar{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--ink),#3A342B);color:var(--cream);
  font-weight:600;font-size:18px;letter-spacing:-.02em;box-shadow:var(--shadow)}
.chead{display:flex;gap:13px;align-items:center;margin-bottom:13px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:7px 10px;font-size:13px}
.kv .k{color:var(--ink-3);font-size:11.5px;padding-top:1px}
.kv .v{color:var(--ink)}
.tline{position:relative;padding-left:26px}
.tline::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tev{position:relative;margin-bottom:12px;animation:fadeUp .35s var(--ease) both}
.tev .dot{position:absolute;left:-22px;top:3px;width:15px;height:15px;border-radius:99px;
  background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.tev .dot svg{width:9px;height:9px}
.tev.sale .dot{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.tev.pkg .dot{background:var(--brass);border-color:var(--brass);color:#fff}
.tev.redeem .dot{background:var(--jade);border-color:var(--jade);color:#fff}
.tev.no .dot{background:var(--rose);border-color:var(--rose);color:#fff}
.tev .when{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.tev .body{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:10px 12px;margin-top:4px}
.daysep{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;
  margin:16px 0 9px;display:flex;align-items:center;gap:9px}
.daysep::after{content:'';flex:1;height:1px;background:var(--line)}

/* ---------- calendar ---------- */
.calbar{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.calbar .title{font-weight:620;font-size:15.5px;flex:1;text-align:center;letter-spacing:-.015em}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mhead{font-size:10px;color:var(--ink-3);text-align:center;padding:4px 0 7px;font-weight:560;
  text-transform:uppercase;letter-spacing:.07em}
.mcell{aspect-ratio:1/1.08;border:1px solid var(--line-2);border-radius:11px;padding:5px 6px;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;background:var(--surface);overflow:hidden;
  transition:transform .16s var(--ease),background .22s,border-color .22s}
.mcell:active{transform:scale(.94)}
.mcell.off{background:transparent;color:var(--ink-3);opacity:.5}
.mcell.today{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.mcell.sel{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.mcell .d{font-size:12.5px;font-weight:570}
.mcell .dots{display:flex;flex-wrap:wrap;gap:2px}
.mcell .dot{width:5px;height:5px;border-radius:99px;background:var(--ink)}
.mcell .dot.n{background:var(--rose)}.mcell .dot.f{background:var(--ink-3)}
.mcell.sel .dot{background:var(--cream)}
.mcell .cnt{font-size:10px;margin-top:auto;color:var(--ink-3)}
.mcell.sel .cnt{color:#B5AEA1}
.tl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface)}
.tlg{display:grid;min-width:max-content}
.tlh{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);
  padding:8px;font-size:11.5px;font-weight:570;text-align:center;border-left:1px solid var(--line-2)}
.tlh.first{border-left:0}
.tlh small{display:block;color:var(--ink-3);font-weight:400;font-size:10px}
.tlgut{position:relative;border-right:1px solid var(--line-2);background:var(--surface-2)}
.tlgut span{position:absolute;right:6px;font-size:10px;color:var(--ink-3);transform:translateY(-6px)}
.tlcol{position:relative;border-left:1px solid var(--line-2)}.tlcol.first{border-left:0}
.hline{position:absolute;left:0;right:0;border-top:1px solid var(--line-2)}
.hline.half{border-top-style:dotted;opacity:.65}
.blk{position:absolute;left:3px;right:3px;border-radius:9px;padding:5px 7px;overflow:hidden;cursor:pointer;
  background:var(--ink);color:var(--cream);border-left:3px solid var(--brass);font-size:11px;line-height:1.32;
  animation:pop .3s var(--ease) both;transition:transform .16s var(--ease)}
.blk:active{transform:scale(.97)}
.blk b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk small{color:#B5AEA1;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk.done{background:var(--line-2);color:var(--ink-2);border-left-color:var(--ink-3)}
.blk.done small{color:var(--ink-3)}
.blk.no{background:var(--rose-soft);color:var(--rose);border-left-color:var(--rose)}
.blk.no small{color:var(--rose)}
.blk.in{background:var(--brass);color:#fff;border-left-color:#6E4E1E}
.blk.in small{color:#F1E2CB}
.buf{position:absolute;left:3px;right:3px;border-radius:0 0 8px 8px;
  background:repeating-linear-gradient(45deg,var(--line-2),var(--line-2) 4px,transparent 4px,transparent 8px)}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--brass);z-index:2;pointer-events:none}
.nowline::before{content:'';position:absolute;left:0;top:-4px;width:7px;height:7px;border-radius:99px;
  background:var(--brass)}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--ink-3)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ---------- misc ---------- */
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.center .card{max-width:450px;width:100%;animation:fadeUp .45s var(--ease) both}
.step{display:flex;gap:11px;margin-bottom:13px}
.step .n{width:23px;height:23px;border-radius:99px;background:var(--ink);color:var(--cream);
  display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;margin-top:1px}
code{background:var(--line-2);padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.spin{width:24px;height:24px;border:2px solid var(--line);border-top-color:var(--ink);
  border-radius:99px;animation:sp .7s linear infinite;margin:0 auto}
.skel{height:13px;border-radius:6px;margin:7px 0;
  background:linear-gradient(90deg,var(--line-2) 25%,var(--surface-2) 50%,var(--line-2) 75%);
  background-size:640px 100%;animation:shimmer 1.3s linear infinite}
canvas{border:1px dashed var(--line);border-radius:var(--r-md);background:var(--surface);width:100%;touch-action:none}
.imgfield{margin-bottom:11px}
.imgprev{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);
  border-radius:var(--r-md);padding:9px;background:var(--surface)}
.imgprev img{width:84px;height:84px;object-fit:cover;border-radius:var(--r-sm);flex:none;
  background:var(--line-2)}
.imgmeta{flex:1;min-width:0}
.noteimg{max-width:min(100%,240px);max-height:140px;width:auto;height:auto;display:block;

/* ---------- bottom navigation bar ---------- */
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:62;display:flex;flex-direction:column-reverse;

/* the drawer: animates from nothing to its natural height */
.bnpanel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s cubic-bezier(.2,.9,.25,1)}
.botnav.open .bnpanel{grid-template-rows:1fr}

  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:12px 0 8px}
.bnscroll::-webkit-scrollbar{display:none}
/* the same five columns as the bar underneath, so every icon sits on one grid */
.bngrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px 2px}
.bngl{grid-column:1/-1;font-size:9px;font-weight:650;letter-spacing:.2em;text-transform:uppercase;

  font-size:11px;font-weight:700;color:#1B1712;

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnout{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;
  border-radius:99px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);
  color:var(--cream);font-size:11px;font-weight:560;cursor:pointer}
.bnout:active{background:rgba(255,255,255,.16)}
.bnsep{height:1px;margin:0 10px 7px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.12),rgba(255,255,255,0))}
.bnpanel .bnitem{opacity:0;transform:translateY(8px) scale(.94);
  transition:opacity .16s ease,transform .16s ease,background .24s var(--ease),color .2s}
.botnav.open .bnpanel .bnitem{opacity:1;transform:none;
  transition:opacity .3s ease calc(60ms + var(--i,0) * 18ms),
    transform .38s cubic-bezier(.2,1.2,.4,1) calc(60ms + var(--i,0) * 18ms),background .24s var(--ease),color .2s}
.botnav.open .bnpanel .bnitem:active{transform:scale(.93)}
.botnav::before{content:'';position:absolute;left:50%;top:5px;width:34px;height:3px;border-radius:99px;
  transform:translateX(-50%);background:rgba(255,255,255,.14);pointer-events:none}
.bnitem{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:9px 3px 7px;border:0;background:transparent;color:#A49C90;border-radius:15px;
  cursor:pointer;font-size:9.8px;font-weight:560;letter-spacing:-.005em;position:relative;
  transition:background .24s var(--ease),color .2s,transform .16s var(--ease)}
.bnlab{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.bnitem:active{transform:scale(.93)}
.bnitem.on{background:var(--cream);color:var(--ink);font-weight:650}

  border-radius:99px;background:var(--brass);color:#fff;font-size:9.5px;font-weight:700;
  display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px rgba(20,18,15,.9)}
.bnitem.on .bndot{box-shadow:0 0 0 2px var(--cream)}
.bndot.plain{min-width:9px;width:9px;height:9px;padding:0;top:5px;left:calc(50% + 7px)}
.bnic{position:relative;width:19px;height:19px;display:block}
.bnic>span{position:absolute;inset:0;display:grid;place-items:center;
  transition:transform .42s cubic-bezier(.2,1.2,.4,1),opacity .22s ease}
.bnic .i2{opacity:0;transform:rotate(-120deg) scale(.4)}
.bnmore.open .bnic .i1{opacity:0;transform:rotate(120deg) scale(.4)}
.bnmore.open .bnic .i2{opacity:1;transform:none}
.bnmore{transition:background .24s var(--ease),color .2s,transform .16s var(--ease),box-shadow .35s var(--ease)}

/* while the bar is open, More is the only thing lit */
.botnav.open .bnrow .bnitem.on:not(.bnmore){background:transparent;color:#A49C90;font-weight:560}
.botnav.open .bnrow .bnitem.on:not(.bnmore) .ico{color:inherit}

/* the screen you are on shows inside the drawer as a quiet brass tint, not a second pill */
.bnpanel .bnitem.on{background:transparent;color:#E2C58F;font-weight:650}

.srow.late{border-style:dashed;opacity:.75}

.wkhead{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;
  margin:9px 2px 3px}


/* ---------- money owed ---------- */
.owe{color:var(--rose);font-weight:650;white-space:nowrap}
.odue{color:var(--rose)}

/* ---------- payment methods ---------- */
.pmrow{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:8px;align-items:center;margin-bottom:7px}
.pmrow .f{margin:0}
.pmrow.off .f{opacity:.5;text-decoration:line-through}
.pmmove{display:flex;flex-direction:column;gap:3px}
.pmmove .iconbtn{padding:3px}
.pmmove .iconbtn[disabled]{opacity:.3}
.pmopt{gap:5px;font-size:11.5px;color:var(--ink-2);margin:0;white-space:nowrap}

/* ---------- hands-on line on the bill ---------- */
.hoBtn{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:4px 9px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-size:11px;cursor:pointer;
  max-width:100%;text-align:left}
.hoBtn b{color:var(--ink);font-weight:600}
.hoBtn.need{border-color:var(--rose);background:var(--rose-soft);color:var(--rose)}
.hoBtn.need b{color:var(--rose)}

/* ---------- pay now, treat later ---------- */
.laterBtn{display:inline-flex;align-items:center;gap:5px;margin:5px 6px 0 0;padding:4px 9px;border-radius:99px;
  border:1px dashed var(--line);background:transparent;color:var(--ink-3);font-size:11px;cursor:pointer}
.laterBtn.on{border-style:solid;border-color:var(--brass);background:var(--brass-soft);color:var(--brass);font-weight:600}
.laterInfo{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:5px;font-size:11px;color:var(--brass)}
.laterInfo select{font-size:11px;padding:2px 4px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}

/* ---------- hero: one instrument — the clock and the weather ---------- */
.heroInst{flex:none;display:flex;align-items:stretch;position:relative;z-index:1;
  padding:10px 14px 10px 12px;border-radius:26px;
  border:1px solid rgba(244,240,231,.16);
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.heroInst .heroClock{gap:4px;align-content:center}
.instRule{width:1px;margin:4px 14px;flex:none;
  background:linear-gradient(180deg,rgba(244,240,231,0),rgba(244,240,231,.22),rgba(244,240,231,0))}
.instWx{display:grid;align-content:center;justify-items:start;gap:2px;min-width:112px;padding:0;border:0;
  background:none;color:var(--cream);cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.iwmain{display:flex;align-items:center;gap:6px}
.iwtemp{font-size:34px;font-weight:300;letter-spacing:-.04em;line-height:1}
.iwtemp sup{font-size:.5em;font-weight:400;vertical-align:.6em;margin-left:1px;color:#C79A55}
.iwcond{font-size:12px;font-weight:600;letter-spacing:.01em;color:#E9D5AE;margin-top:3px}
.iwmeta{font-size:10.5px;color:#A8A092;white-space:nowrap}
.iwrh{display:inline-flex;align-items:center;gap:3px}
.iwlive{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;color:#8C8577;margin-top:3px;
  letter-spacing:.02em;white-space:nowrap}
.iwlive i{width:6px;height:6px;border-radius:99px;background:#7FB48F;box-shadow:0 0 0 0 rgba(127,180,143,.6);
  animation:wxpulse 2.4s ease-out infinite}
.iwlive.fc i{background:#C79A55;animation:none}
.iwlive.stale i{background:#6F6A60;animation:none}
@keyframes wxpulse{0%{box-shadow:0 0 0 0 rgba(127,180,143,.55)}80%,100%{box-shadow:0 0 0 7px rgba(127,180,143,0)}}
.iwnext{display:none}
.instWx.empty .iwtemp{color:#8C8577}
.wxart{display:block;overflow:visible}
.wx-rays{animation:wxspin 24s linear infinite}
.wx-core{animation:wxglow 3.6s ease-in-out infinite}
.wx-cloud{animation:wxdrift 5.5s ease-in-out infinite alternate}
.wx-drop{opacity:0;animation:wxfall 1.1s linear infinite}
.wx-drop.fast{animation-duration:.7s}
.wx-bolt{opacity:0;animation:wxflash 3.8s linear infinite;filter:drop-shadow(0 0 5px rgba(199,154,85,.95))}
.wx-star{animation:wxtw 2.6s ease-in-out infinite}
.wx-moonb{animation:wxbob 6s ease-in-out infinite}
.wx-haze{animation:wxhaze 4.5s ease-in-out infinite alternate}
.wx-wind{stroke-dasharray:46 16;animation:wxwind 2.2s linear infinite}
@keyframes wxspin{to{transform:rotate(360deg)}}
@keyframes wxglow{50%{transform:scale(1.07)}}
@keyframes wxdrift{from{transform:translateX(-1.6px)}to{transform:translateX(2.2px)}}
@keyframes wxfall{0%{transform:translateY(-5px);opacity:0}25%{opacity:1}100%{transform:translateY(9px);opacity:0}}
@keyframes wxflash{0%,80%,100%{opacity:0}82%{opacity:1}85%{opacity:.25}88%{opacity:1}92%{opacity:0}}
@keyframes wxtw{50%{opacity:.18}}
@keyframes wxbob{50%{transform:translateY(-1.5px) rotate(-4deg)}}
@keyframes wxhaze{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@keyframes wxwind{to{stroke-dashoffset:-62}}
.wxnow{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--cream);border-color:var(--ink)}
.wxnowt{font-size:38px;font-weight:300;letter-spacing:-.04em;line-height:1}
.wxnowt small{font-size:14px;color:#C79A55;margin-left:2px}
.wxnow .muted{color:#A8A092}
.wxhours{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.wxhours>div,.wxdays>div{display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:14px;
  background:var(--ink);color:var(--cream)}
.wxhours .muted,.wxdays .muted{color:#A8A092}
.wxrow{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;margin-bottom:4px;
  background:rgba(20,18,15,.86);color:var(--cream)}
.wxrow b{display:block;font-size:13.5px}
.wxrow .muted{color:#A8A092}
.wxrow.now{background:var(--ink);box-shadow:0 0 0 2px var(--brass)}

  query as fsQuery,where as fsWhere,orderBy as fsOrderBy,limit as fsLimit,onSnapshot as fsOnSnapshot,
  writeBatch as fsWriteBatch,runTransaction as fsRunTransaction,increment as fsIncrement,serverTimestamp as fsServerTimestamp,
  initializeFirestore,persistentLocalCache,persistentMultipleTabManager}
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
/* ============ Training mode: a private, in-memory copy of the database ============ */
/* When training mode is on, every read and write the app makes goes to a copy held in
   this browser tab's memory instead of Firestore. The copy starts with the real
   catalogue, team and settings plus a handful of made-up clients and bookings, so staff
   can practise the whole flow (booking, checkout, packages, CRM) and nothing they do
   ever reaches the real records. Leaving training mode, or reloading, throws it away. */
let DEMO=false;
const DEMOKEY='spatify:demo';
const DMEM={};
const dClone=x=>x===undefined?x:JSON.parse(JSON.stringify(x));
const dCol=n=>DMEM[n]||(DMEM[n]={});
const dNewId=()=>'demo'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function dApply(old,data){
 const o={...(old||{})};
 for(const k in data){const v=data[k];
  if(v&&typeof v==='object'&&v.__dinc!==undefined)o[k]=(+o[k]||0)+v.__dinc;
  else if(v&&typeof v==='object'&&v.__dts)o[k]=new Date().toISOString();
  else o[k]=dClone(v);}
 return o;
}
function dSnapDoc(ref,d){return {id:ref.id,ref,exists:()=>d!==undefined,data:()=>dClone(d)};}
function dRun(q){
 let rows=Object.entries(dCol(q.col)).map(([id,d])=>({id,d}));
 const W=(q.q||[]).filter(x=>x.t==='w'),O=(q.q||[]).filter(x=>x.t==='o'),L=(q.q||[]).find(x=>x.t==='l');
 W.forEach(w=>{rows=rows.filter(r=>{const v=r.d[w.f];
  switch(w.o){case '==':return v===w.v;case '!=':return v!==w.v;case '>=':return v>=w.v;case '<=':return v<=w.v;
   case '>':return v>w.v;case '<':return v<w.v;case 'in':return (w.v||[]).includes(v);
   case 'array-contains':return Array.isArray(v)&&v.includes(w.v);default:return true;}});});
 rows.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
 if(O.length)rows.sort((a,b)=>{for(const o of O){const x=a.d[o.f],y=b.d[o.f];
  if(x===y)continue;const c=(x===undefined?-1:y===undefined?1:x<y?-1:1);return o.d==='desc'?-c:c;}return 0;});
 if(L)rows=rows.slice(0,L.n);
 const docs=rows.map(r=>dSnapDoc({col:q.col,id:r.id,__d:1},r.d));
 return {docs,size:docs.length,empty:!docs.length,forEach:f=>docs.forEach(f)};
}
const DLIS=new Set();
function dEmit(l){
 if(l.ref.id){const d=dCol(l.ref.col)[l.ref.id];l.cb(dSnapDoc(l.ref,d));return;}
 const snap=dRun(l.ref);const prev=l.seen||new Map(),now=new Map(),ch=[];
 snap.docs.forEach(d=>{const j=JSON.stringify(d.data());now.set(d.id,j);
  if(!prev.has(d.id))ch.push({type:'added',doc:d});else if(prev.get(d.id)!==j)ch.push({type:'modified',doc:d});});
 prev.forEach((v,k)=>{if(!now.has(k))ch.push({type:'removed',doc:{id:k,data:()=>JSON.parse(v),exists:()=>false}});});
 l.seen=now;snap.docChanges=()=>ch;l.cb(snap);
}
let DFIRE=0;
const dFire=()=>{clearTimeout(DFIRE);DFIRE=setTimeout(()=>DLIS.forEach(l=>{try{dEmit(l);}catch(e){console.warn('demo listener',e);}}),0);};
const dSet=(r,data,o)=>{const c=dCol(r.col);c[r.id]=o&&o.merge?dApply(c[r.id],data):dApply({},data);};
const dUpd=(r,data)=>{const c=dCol(r.col);if(!c[r.id])throw Object.assign(new Error('No document to update'),{code:'not-found'});c[r.id]=dApply(c[r.id],data);};

/* the Firestore calls the app uses: the real ones normally, the in-memory copy in training */
function collection(db,...p){return DEMO?{__d:1,col:p.join('/')}:fsCollection(db,...p);}
function doc(a,...p){
 if(!DEMO)return fsDoc(a,...p);
 if(a&&a.__d&&!a.id)return {__d:1,col:a.col,id:p[0]||dNewId()};
 const id=p.length>1?p[p.length-1]:dNewId();return {__d:1,col:p.slice(0,-1).join('/')||p[0],id};
}
function query(c,...q){return DEMO?{...c,q:[...(c.q||[]),...q]}:fsQuery(c,...q);}
function where(f,o,v){return DEMO?{t:'w',f,o,v}:fsWhere(f,o,v);}
function orderBy(f,d){return DEMO?{t:'o',f,d}:fsOrderBy(f,d);}
function limit(n){return DEMO?{t:'l',n}:fsLimit(n);}
function increment(n){return DEMO?{__dinc:n}:fsIncrement(n);}
function serverTimestamp(){return DEMO?{__dts:1}:fsServerTimestamp();}
async function getDoc(r){return DEMO?dSnapDoc(r,dClone(dCol(r.col)[r.id])):fsGetDoc(r);}
async function getDocs(q){return DEMO?dRun(q):fsGetDocs(q);}
async function setDoc(r,d,o){if(!DEMO)return fsSetDoc(r,d,o);dSet(r,d,o);dFire();}
async function addDoc(c,d){if(!DEMO)return fsAddDoc(c,d);const r={__d:1,col:c.col,id:dNewId()};dSet(r,d);dFire();return r;}
async function updateDoc(r,d){if(!DEMO)return fsUpdateDoc(r,d);dUpd(r,d);dFire();}
async function deleteDoc(r){if(!DEMO)return fsDeleteDoc(r);delete dCol(r.col)[r.id];dFire();}
function onSnapshot(ref,cb,err){
 if(!DEMO)return fsOnSnapshot(ref,cb,err);
 const l={ref,cb};DLIS.add(l);setTimeout(()=>{try{dEmit(l);}catch(e){err&&err(e);}},0);return ()=>DLIS.delete(l);
}
function writeBatch(db){
 if(!DEMO)return fsWriteBatch(db);
 const ops=[];
 return {set:(r,d,o)=>{ops.push(()=>dSet(r,d,o));},update:(r,d)=>{ops.push(()=>dUpd(r,d));},
  delete:r=>{ops.push(()=>{delete dCol(r.col)[r.id];});},
  commit:async()=>{ops.forEach(f=>f());dFire();}};
}
async function runTransaction(db,fn){
 if(!DEMO)return fsRunTransaction(db,fn);
 const ops=[];
 const tx={get:async r=>dSnapDoc(r,dClone(dCol(r.col)[r.id])),
  set(r,d,o){ops.push(()=>dSet(r,d,o));return tx;},update(r,d){ops.push(()=>dUpd(r,d));return tx;},
  delete(r){ops.push(()=>{delete dCol(r.col)[r.id];});return tx;}};
 const out=await fn(tx);ops.forEach(f=>f());dFire();return out;
}

function friendly(e){
 const c=(e&&e.code)||'';
 if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))
   return 'Email or password is not correct.';
 if(c.includes('too-many-requests'))return 'Too many attempts. Wait a few minutes and try again.';
 if(c.includes('network'))return 'No connection to Firebase. Check the tablet is online.';
 if(c.includes('permission-denied'))return 'Firestore rules blocked this. Publish the rules file, then try again.';
 if(c.includes('configuration-not-found')||c.includes('operation-not-allowed'))
   return 'Email/password sign-in is switched off. Turn it on in Firebase console → Authentication → Sign-in method.';
 return (e&&e.message)||'Something went wrong.';
}

/* ============ data loading ============ */
/* Firestore hands documents back in ID order: product codes sort as text ("10" before "2")
   and treatments/packages have random IDs. Everything is put in a human order once here,
   so every list, picker and report shows the same, predictable order. */
const natCmp=(a,b)=>String(a||'').localeCompare(String(b||''),'en',{numeric:true,sensitivity:'base'});
function sortCatalogue(){
 D.products.sort((a,b)=>(a.type===b.type?0:a.type==='retail'?-1:1)||natCmp(a.name,b.name)||natCmp(a.id,b.id));
 D.services.sort((a,b)=>natCmp(a.cat,b.cat)||natCmp(a.name,b.name));
 D.packages.sort((a,b)=>natCmp(a.name,b.name));
 (D.bundles||[]).sort((a,b)=>natCmp(a.name,b.name));
 D.stock.sort((a,b)=>natCmp(prod(a.sku).name||a.sku,prod(b.sku).name||b.sku));
}

 const snaps=await Promise.all(names.map(n=>getDocs(collection(db,n)).catch(e=>{if(n==='bundles')return{docs:[]};throw e;})));
 const g=i=>snaps[i].docs.map(d=>({id:d.id,...d.data()}));
 D.branches=g(0);D.rooms=g(1);D.staff=g(2);D.services=g(3);D.products=g(4);
 D.packages=g(5);D.stock=g(6);D.vouchers=g(7);D.bundles=g(8);
 sortCatalogue();
 try{const m=await getDoc(doc(db,'meta','settings'));D.meta=m.exists()?m.data():{};}catch(e){D.meta={};}
 if(!D.meta.open)D.meta={open:9,close:20,biz:{name:'My Spa',ssm:'',tin:'',sst:0,sstRate:8,phone:''},...D.meta};
}

let NOTEIDX=0,tickBound=false;
let WXMIN=-1;
function tickClock(){
 const d=new Date();
 /* each new minute the reading moves on; the sources are asked only when due.
    Keyed on the minute changing, so a skipped or throttled tick cannot miss it */
 const mk=Math.floor(+d/6e4);
 if(mk!==WXMIN){WXMIN=mk;if(document.getElementById('heroWx'))paintWx();wxNowLoad();wxLoad();}
 const ar=document.getElementById('att-run');
 if(ar&&ar.dataset.from)ar.textContent=runFor(ar.dataset.from);
 if(document.querySelectorAll)document.querySelectorAll('.trun').forEach(e=>{if(e.dataset.from)e.textContent=runFor(e.dataset.from);});
 const s=d.getSeconds(),m=d.getMinutes()+s/60,h=(d.getHours()%12)+m/60;
 const set=(id,deg)=>{const el=document.getElementById(id);
  if(el&&typeof el.setAttribute==='function')
   el.setAttribute('transform','rotate('+deg+' 50 50)');};
 set('ck-h',h*30);set('ck-m',m*6);set('ck-s',s*6);
 const dig=document.getElementById('ck-digital');
 if(dig)dig.textContent=d.toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit',hour12:false});
}

  if(TAB!=='home')return;

  const live=NOTES.filter(noteLive);
  if(live.length>1&&new Date().getSeconds()%8===0){
   NOTEIDX=(NOTEIDX+1)%live.length;paintNoteStrip();

 },1000);
}

 const a=attToday(UID);
 if(!me.attCode)return can('staff')
  ?'<button class="qbtn" onclick="editStaff(\''+UID+'\')">'+ic('idcard',20)+
   '<span>Set my code</span></button>'
  :'';
 if(!a)return '<button class="qbtn" onclick="clockPrompt(\''+UID+'\',\'in\')">'+ic('login',20)+
  '<span>Clock in</span></button>';
 if(!a.clockOut)return '<button class="qbtn" onclick="clockPrompt(\''+UID+'\',\'out\')">'+ic('out',20)+
  '<span>Clock out</span></button>';
 return '<button class="qbtn" onclick="go(\'team\')">'+ic('check',20)+
  '<span>'+worked(a)+' today</span></button>';
}

const STATUS={booked:['Booked',''],confirm:['Confirmed','g'],in:['In treatment','a'],done:['Completed','g'],
 no:['No-show','r'],cancel:['Cancelled','']};
/* a completed booking wears a solid jade tick; a paid one also shows a receipt mark */
const doneMark=a=>a.status==='done'?'<span class="donemark" title="Completed'+(a.saleId?' and paid':'')+'">'+ic('check',11)+'</span>'+
 (a.saleId?'<span class="paidmark" title="Paid">'+ic('receipt',10)+'</span>':''):'';
function apptRow(a){
 const st=STATUS[a.status]||['',''];
 return '<div class="slot '+({done:'done',no:'no'}[a.status]||'')+'" onclick="openAppt(\''+a.id+'\')">'+
  '<div class="spread"><div><b>'+tstr(a.start)+'</b> · '+esc(a.customerName||'')+'</div>'+
  '<span class="pill '+st[1]+'">'+(a.status==='done'?ic('check',11):'')+st[0]+(a.saleId?' · paid':'')+'</span></div>'+
  '<div class="tiny muted">'+esc(a.serviceName||'')+(a.undecided?' (to decide)':'')+' · '+esc(a.staffName||'')+' · '+esc(room(a.roomId).name||'—')+
  (a.deposit?' · deposit '+rm(a.deposit):'')+'</div></div>';}

const onDay=d=>APPTS.filter(a=>a.date===d&&a.status!=='cancel').sort((a,b)=>a.start.localeCompare(b.start));
const calNav=(label,step)=>'<div class="calbar"><button class="iconbtn" onclick="shiftCal(-'+step+')">'+ic('left',17)+
 '</button><div class="title">'+label+'</div><button class="iconbtn" onclick="shiftCal('+step+')">'+ic('right',17)+'</button></div>';
function calDay(){
 const ap=onDay(calDate);
 const key=calBy==='staff'?'staffId':'roomId';
 let cols=calBy==='staff'?D.staff.filter(s=>s.branchId===ME.branchId&&s.active!==false&&s.takes)
  :D.rooms.filter(r=>r.branchId===ME.branchId);
 // Anything booked against a therapist who is not marked bookable, or a room that
 // belongs to another branch, would otherwise render into thin air. Give it a home.
 const orphan=ap.filter(a=>!cols.some(c=>c.id===a[key]));
 if(orphan.length)cols=cols.concat([{id:'__none',name:'Unassigned'}]);
 const colOf=a=>cols.some(c=>c.id===a[key])?a[key]:'__none';
 const O=D.meta.open,C=D.meta.close,hrs=C-O,ROW=58,px=ROW/60;
 let h=calNav(new Date(calDate).toLocaleDateString('en-MY',{weekday:'long',day:'numeric',month:'long'}),1);
 if(holOf(calDate).length)h+='<div class="holbar">'+holTags(calDate)+'</div>';
 h+='<div class="tabs">'+[['staff','By therapist','user'],['room','By room','room']].map(x=>
  '<button class="'+(calBy===x[0]?'on':'')+'" onclick="setCalBy(\''+x[0]+'\')">'+ic(x[2],14)+x[1]+'</button>').join('')+
  '<span class="pill" style="align-self:center">'+ap.length+' booked</span></div>';
 if(!cols.length)return h+'<div class="empty">'+ic('room',26)+'<div>No bookable '+
  (calBy==='staff'?'therapists':'rooms')+' for this branch yet. Add them under Catalogue.</div></div>';
 if(orphan.length)h+='<div class="warnbox">'+ic('alert',14)+' '+orphan.length+
  ' booking'+(orphan.length>1?'s are':' is')+' shown under <b>Unassigned</b> — the therapist is not '+
  'marked bookable, or the room belongs to another branch. Open Catalogue to fix it.</div>';
 h+='<div class="tl"><div class="tlg" style="grid-template-columns:46px repeat('+cols.length+
  ',minmax(132px,1fr));grid-template-rows:auto '+(hrs*ROW)+'px"><div class="tlh first"></div>'+
  cols.map(c=>{const mins=ap.filter(a=>colOf(a)===c.id).reduce((t,a)=>t+(a.duration||0),0);
   const lv=calBy==='staff'?onLeave(c.id,calDate):null;
   return '<div class="tlh'+(lv?' onleave':'')+'">'+esc(c.name)+'<small>'+(lv?'On leave'+(lv.half?' ('+lv.half+')':'')+' · '+esc(lv.type):Math.round(mins/(hrs*60)*100)+'% booked')+'</small></div>';}).join('')+
  '<div class="tlgut">'+[...Array(hrs+1)].map((_,i)=>'<span style="top:'+(i*ROW)+'px">'+
   String(O+i).padStart(2,'0')+':00</span>').join('')+'</div>';
 const nowMin=(new Date().getHours()-O)*60+new Date().getMinutes();
 cols.forEach((c,ci)=>{
  h+='<div class="tlcol'+(ci===0?' first':'')+(calBy==='staff'&&onLeave(c.id,calDate)&&!onLeave(c.id,calDate).half?' onleave':'')+'">'+
   [...Array(hrs*2)].map((_,i)=>'<div class="hline'+(i%2?' half':'')+'" style="top:'+(i*ROW/2)+'px"></div>').join('')+
   (calDate===today()&&nowMin>0&&nowMin<hrs*60?'<div class="nowline" style="top:'+(nowMin*px)+'px"></div>':'');
  const inCol=ap.filter(a=>colOf(a)===c.id),LN=apptLanes(inCol);
  inCol.forEach(a=>{
   const t=new Date(a.start),top=((t.getHours()-O)*60+t.getMinutes())*px,hh=Math.max((a.duration||30)*px,26);
   const P=apptPal(a);
   const plain=['done','no'].includes(a.status);
   h+='<div class="blk '+(a.status==='done'?'done':a.status==='no'?'no':'')+(a.undecided?' undec':'')+
    (LN[a.id]&&LN[a.id].of>1?' lane':'')+
    '" style="top:'+top+'px;height:'+hh+'px'+laneCss(LN[a.id])+(plain?'':';background:'+P.bg+';color:'+P.fg+
     ';border-left-color:'+P.bd)+'" onclick="openAppt(\''+a.id+'\')">'+doneMark(a)+
    '<b>'+esc(a.customerName||'')+'</b><small'+(plain?'':' style="color:'+P.fg+';opacity:.78"')+'>'+
     tstr(a.start)+' · '+esc(a.serviceName||'')+'</small>'+
    (hh>52?'<small'+(plain?'':' style="color:'+P.fg+';opacity:.78"')+'>'+
     esc(calBy==='staff'?(room(a.roomId).name||''):(a.staffName||''))+
     ((visitOf(a.visitType)||{}).label?' · '+visitOf(a.visitType).label:'')+'</small>':'')+'</div>'+
    (a.buffer?'<div class="buf" style="top:'+(top+(a.duration||0)*px)+'px;height:'+(a.buffer*px)+'px'+laneCss(LN[a.id])+'"></div>':'');});
  h+='</div>';});
 h+='</div></div><div class="legend">'+VISITS.map(v=>'<span><i style="background:'+pal(v.color).bg+
  '"></i>'+v.label+'</span>').join('')+
  '<span><i class="lgdone">'+ic('check',9)+'</i>Completed</span>'+
  '<span><i class="lgpaid">'+ic('receipt',9)+'</i>Paid</span>'+
  '<span><i style="background:var(--rose-soft)"></i>No-show</span>'+
  '<span><i style="background:repeating-linear-gradient(45deg,var(--line-2),var(--line-2) 3px,transparent 3px,transparent 6px)"></i>Buffer</span></div>';
 return h;}
function calWeek(){
 const base=new Date(calDate),dow=(base.getDay()+6)%7,mon=addDays(base,-dow);
 const days=[...Array(7)].map((_,i)=>ymd(addDays(mon,i)));
 const O=D.meta.open,C=D.meta.close,hrs=C-O,ROW=52,px=ROW/60;
 let h=calNav(dshort(days[0])+' – '+dshort(days[6]),7);
 h+='<div class="tl"><div class="tlg" style="grid-template-columns:44px repeat(7,minmax(96px,1fr));'+
  'grid-template-rows:auto '+(hrs*ROW)+'px"><div class="tlh first"></div>'+
  days.map(d=>'<div class="tlh'+(isHoliday(d)?' hol':'')+'" style="'+(d===today()?'color:var(--jade)':'')+'" onclick="pickDate(\''+d+'\')">'+
   new Date(d).toLocaleDateString('en-MY',{weekday:'short'})+'<small>'+new Date(d).getDate()+' · '+
   onDay(d).length+'</small>'+(holOf(d).length?'<span class="wkhol">'+holTags(d,'mini')+'</span>':'')+'</div>').join('')+
  '<div class="tlgut">'+[...Array(hrs+1)].map((_,i)=>'<span style="top:'+(i*ROW)+'px">'+
   String(O+i).padStart(2,'0')+'</span>').join('')+'</div>';
 days.forEach((d,di)=>{
  h+='<div class="tlcol'+(di===0?' first':'')+'">'+
   [...Array(hrs)].map((_,i)=>'<div class="hline" style="top:'+(i*ROW)+'px"></div>').join('');
  const dayAp=onDay(d),LN=apptLanes(dayAp);
  dayAp.forEach(a=>{const t=new Date(a.start),top=((t.getHours()-O)*60+t.getMinutes())*px;
   const P=apptPal(a),plain=['done','no'].includes(a.status);
   h+='<div class="blk '+(a.status==='done'?'done':a.status==='no'?'no':'')+(LN[a.id]&&LN[a.id].of>1?' lane':'')+
    '" style="top:'+top+'px;height:'+Math.max((a.duration||30)*px,24)+'px'+laneCss(LN[a.id])+
    (plain?'':';background:'+P.bg+';color:'+P.fg+';border-left-color:'+P.bd)+
    '" onclick="openAppt(\''+a.id+'\')">'+doneMark(a)+
    '<b>'+tstr(a.start)+'</b><small'+(plain?'':' style="color:'+P.fg+';opacity:.78"')+'>'+
    esc((a.customerName||'').split(' ')[0])+'</small></div>';});
  h+='</div>';});
 return h+'</div></div>';}
function calMonthView(){

 const cells=[...Array(42)].map((_,i)=>ymd(addDays(start,i)));
 let h=calNav(base.toLocaleDateString('en-MY',{month:'long',year:'numeric'}),1);
 h+='<div class="mgrid">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>'<div class="mhead">'+d+'</div>').join('')+'</div>';
 h+='<div class="mgrid">'+cells.map(d=>{
  const ap=onDay(d),off=new Date(d).getMonth()!==m;
  const hl=holOf(d);
  return '<div class="mcell'+(off?' off':'')+(d===today()?' today':'')+(d===calDate?' sel':'')+
   (hl.some(x=>x.h)?' hol':(hl.length?' obs':''))+
   '" onclick="pickDate(\''+d+'\')"'+(hl.length?' title="'+esc(hl.map(x=>x.n).join(' · '))+'"':'')+
   '><div class="d">'+new Date(d).getDate()+'</div>'+(hl.length?'<div class="mhol">'+esc(hl[0].n)+'</div>':'')+'<div class="dots">'+
   ap.slice(0,6).map(a=>'<span class="dot '+(a.status==='no'?'n':a.status==='done'?'f':'')+
    '" style="background:'+(['done','no'].includes(a.status)?'':apptPal(a).bg)+'"></span>').join('')+
   '</div>'+(ap.length?'<div class="cnt">'+ap.length+'</div>':'')+'</div>';}).join('')+'</div>';
 const monthHols=cells.filter(d=>new Date(d).getMonth()===m).flatMap(d=>holOf(d).map(x=>({d,...x})));
 if(monthHols.length)h+='<div class="holmonth"><div class="sec-h" style="margin:12px 0 7px"><h3>'+ic('flag',14)+
  ' Cuti &amp; perayaan bulan ini</h3></div>'+monthHols.map(x=>'<button class="holrow'+(x.h?' ph':'')+'" onclick="pickDate(\''+x.d+'\')">'+

  '<span class="hn"><b>'+esc(x.n)+'</b><span>'+(x.h?'Cuti umum Johor':'Perayaan · bukan cuti')+(x.p?' · tarikh anggaran':'')+

 const sel=onDay(calDate);
 h+='<div style="margin-top:12px"><div class="sec-h"><h3>'+dstr(calDate)+'</h3>'+holTags(calDate)+'<span class="tiny muted">'+
  sel.length+' appointments</span></div>'+(sel.length?sel.map(apptRow).join(''):'<div class="empty">Nothing booked.</div>')+'</div>';
 return h;}

function bookPicked(id){

 if(vt&&c.createdAt&&daysBetween(c.createdAt,new Date())<1&&!APPTS.some(a=>a.customerId===id)){
  vt.value='new';if(typeof window.syncSwatch==='function')window.syncSwatch();}
 const st=document.getElementById('n-st');
 if(c.preferredStaff&&st&&D.staff.some(x=>x.id===c.preferredStaff&&x.takes&&x.branchId===ME.branchId)){
  st.value=c.preferredStaff;toast('Preferred therapist: '+stf(c.preferredStaff).name);}

function paintSwatches(){
 const box=document.getElementById('n-sw');if(!box)return;
 const vt=($('#n-vt')||{}).value;
 const auto=(visitOf(vt)||{}).color||'ink';
 [...(box.querySelectorAll?box.querySelectorAll('.sw'):[])].forEach(b=>{
  const chosen=NEWCOLOR?b.dataset.c===NEWCOLOR:b.dataset.c===auto;
  b.className='sw'+(chosen?' on':'')+(!NEWCOLOR&&b.dataset.c===auto?' auto':'');});

async function saveAppt(){
 const btn=$('#n-go');btn.disabled=true;
 try{
  const und=UNDEC.on;
  const s=und?{id:'',name:'Consultation — to decide',dur:UNDEC.dur||60,buffer:15}:svc($('#n-s').value);
  if(!und&&!s.id)throw new Error('Choose a treatment, or tick “Client hasn\'t decided”.');
  const start=new Date($('#n-d').value+'T'+$('#n-t').value+':00');
  if(isNaN(+start))throw new Error('Please pick a valid date and time.');
  const finish=new Date(+start+s.dur*6e4);
  const staffId=$('#n-st').value,roomId=$('#n-r').value;
  if(!staffId)throw new Error('No therapist selected.');
  {const lb=leaveBlock(staffId,start,finish);if(lb)throw new Error(lb);}
  if(!roomId)throw new Error(D.rooms.some(r=>r.branchId===ME.branchId&&(und||!s.room||r.type===s.room))
   ?'Every suitable room is taken at that time. Try another time.':'No room is set up for this treatment type yet.');
  const date=ymd(start);
  const day=await getDocs(query(collection(db,'appointments'),where('date','==',date)));
  const s0=+start,e0=+finish+s.buffer*6e4;
  /* one therapist may run more than one booking at a time, as long as each has its own room */
  const busy=busyAt(day.docs.map(d=>({id:d.id,...d.data()})),s0,e0,'');
  const inRoom=busy.find(a=>a.roomId===roomId);
  if(inRoom){
   const o=roomOptions(s,und,date,$('#n-t').value,'','');
   throw new Error(room(roomId).name+' is taken at '+tstr(inRoom.start)+
    (o.free?'. Pick another room — '+o.free+' still free.':'. Every suitable room is taken then — try another time.'));}
  const mine=busy.filter(a=>a.staffId===staffId);
  const wkey=date+s0+staffId+roomId;
  if(mine.length&&NWARN!==wkey){NWARN=wkey;btn.disabled=false;
   const el=$('#n-err');if(el)el.innerHTML=esc(stf(staffId).name||'')+' also has '+
    mine.map(a=>esc(a.customerName||'')+' at '+tstr(a.start)+' in '+esc(room(a.roomId).name||'another room')).join(', ')+
    '. Tap <b>Save booking</b> again to book both.';
   return;}
  const cid=cpValue('n-c');
  if(!cid||cid==='__walkin')throw new Error('Choose a client, or add a new one with the New client button.');
  const c=cust(cid)||{};
  await addDoc(collection(db,'appointments'),{visitType:($('#n-vt')||{}).value||'return',
   color:NEWCOLOR||'',branchId:ME.branchId,customerId:cid,customerName:c.name||'',
   staffId,staffName:stf(staffId).name,serviceId:s.id,serviceName:s.name,roomId,date,
   start:start.toISOString(),finish:finish.toISOString(),duration:s.dur,buffer:s.buffer,status:'booked',
   ...(und?{undecided:true,concerns:[...UNDEC.concerns],shortlist:[...UNDEC.short]}:{}),
   deposit:+$('#n-dep').value||0,notes:$('#n-n').value||'',createdBy:UID,createdAt:new Date().toISOString()});
  logEvent('booking','New booking · '+(c.name||''),(und?'Consultation — to decide':s.name)+' · '+dstr(start)+' '+
   tstr(start)+' with '+(stf(staffId).name||''),{refType:'appt'});
  await audit('Booking created',(c.name||'')+' · '+s.name+' · '+dstr(start)+' '+tstr(start));
  window.closeModal();calDate=ymd(start);calMode='day';render();
  if(needsWindow())watchAppointments();
  toast('Booking saved');
 }catch(e){const el=$('#n-err');if(el)el.textContent=friendly(e);btn.disabled=false;}
}

window.revertStat=async id=>{
 const a=APPTS.find(x=>x.id===id);
 const log=a.statusLog||[];
 if(!log.length){toast('No earlier status to go back to');return;}
 const last=log[log.length-1];
 const wasDone=a.status==='done';
 const svcUsed=a.stockDone==='sale'?[]:(svc(a.serviceId).use||[]);
 modal('Undo the last change','<div class="card">'+
  '<div class="kv"><div class="k">'+ic('history',12)+' Changed</div><div class="v">'+
   dstr(last.at)+' '+tstr(last.at)+'</div>'+
  '<div class="k">'+ic('user',12)+' By</div><div class="v">'+esc(last.byName||'')+'</div>'+
  '<div class="k">'+ic('refresh',12)+' Going back to</div><div class="v"><b>'+
   ((STATUS[last.from]||[last.from])[0])+'</b> <span class="muted">(from '+
   ((STATUS[last.to]||[last.to])[0])+')</span></div></div>'+
  (wasDone&&svcUsed.length?'<div class="warnbox" style="margin-top:11px">'+ic('alert',13)+
   ' Completing this treatment took backbar stock out. Undoing it will put '+
   svcUsed.map(u=>u.qty+' '+(prod(u.sku).unit||'')+' '+(prod(u.sku).name||u.sku)).join(', ')+
   ' back on the shelf.</div>':'')+
  '<label style="margin-top:11px">Reason * <span class="muted">— recorded in the audit trail</span></label>'+
  '<input class="f" id="rv-r" placeholder="Marked complete by mistake">'+
  '<button class="btn" style="width:100%;justify-content:center" id="rv-go">'+ic('refresh',16)+
  'Undo the change</button></div>',
 ()=>{$('#rv-go').onclick=async()=>{
  const why=($('#rv-r').value||'').trim();
  if(why.length<3){toast('Please give a reason');return;}
  try{
   await updateDoc(doc(db,'appointments',id),{status:last.from,...(wasDone&&a.stockDone!=='sale'?{stockDone:null}:{}),
    statusLog:[...log,{from:a.status,to:last.from,at:new Date().toISOString(),
      by:UID,byName:ME.name,reverted:true,reason:why}],
    updatedBy:UID,updatedAt:new Date().toISOString()});
   if(wasDone){
    for(const u of svcUsed){const st=stockOf(u.sku,a.branchId);
     if(st){await updateDoc(doc(db,'stock',st.id),{qty:increment(u.qty)});st.qty+=u.qty;}}
   }
   await audit('Booking status reverted',(a.customerName||'')+' → '+
    ((STATUS[last.from]||[last.from])[0])+' — '+why);
   window.closeModal();render();
   toast(wasDone&&svcUsed.length?'Reverted and stock returned':'Reverted');
  }catch(e){toast(friendly(e));}};});};

async function saveCustForm(id,thenBook){
 const name=$('#c-n').value.trim();
 if(!name){toast('Name is required');return;}
 const btn=$('#c-go');btn.disabled=true;
 const gob=document.getElementById('c-gob');if(gob)gob.disabled=true;
 const phone=$('#c-p').value.trim();
 const data={name,nameLower:name.toLowerCase(),phone,phoneDigits:digits(phone),keywords:kwFor(name,phone),
  phone2:$('#c-p2').value.trim(),email:$('#c-e').value.trim(),dob:$('#c-d').value,
  gender:$('#c-g').value,idNo:$('#c-ic').value.trim(),occupation:$('#c-occ').value.trim(),
  address:$('#c-a1').value.trim(),postcode:$('#c-pc').value.trim(),city:$('#c-city').value.trim(),
  state:$('#c-st').value.trim(),skin:$('#c-skin').value,allergy:$('#c-al').value.trim(),
  medical:$('#c-med').value.trim(),emergency:$('#c-em').value.trim(),source:$('#c-src').value,
  branchId:$('#c-br').value,referrerId:$('#c-ref').value,preferredStaff:$('#c-pref').value,
  tags:$('#c-tags').value.split(',').map(s=>s.trim()).filter(Boolean),
  note:$('#c-note').value.trim(),pdpa:$('#c-pdpa').checked,marketing:$('#c-mkt').checked,
  updatedAt:new Date().toISOString(),updatedBy:UID};
 try{
  if(id){
   await updateDoc(doc(db,'customers',id),data);
   Object.assign(cust(id),data);
   await audit('Client details updated',name);
  }else{
   data.createdAt=new Date().toISOString();data.createdBy=UID;data.active=true;data.wantNo=true;
   const r=await addDoc(collection(db,'customers'),data);
   CUSTS.unshift({id:r.id,...data});
   const no=await newClientNo(r.id);
   await audit('Client registered',name+(no?' · '+no:''));
   if(thenBook){window.closeModal();toast('Client created'+(no?' · '+no:'')+' — now pick a time');
    window.newAppt({customerId:r.id,visitType:'new'});return;}
   window.closeModal();render();bindCustSearch();newClientSheet(r.id);return;
  }
  window.closeModal();
  if(id)window.openCust(id);else{render();bindCustSearch();}
  toast(id?'Client updated':'Client created');
 }catch(e){toast(friendly(e));btn.disabled=false;if(gob)gob.disabled=false;}
}

let custView='profile',HIST=null,HISTFOR=null;
window.setCustView=(id,v)=>{custView=v;window.openCust(id,true);};
window.openCust=async(id,keep)=>{
 const c=cust(id);if(!c)return;
 if(!keep){custView='profile';HIST=null;HISTFOR=id;}
 const head='<div class="chead"><div class="avatar">'+esc(initials(c.name))+'</div>'+
  '<div style="flex:1;min-width:0"><h2 style="margin-bottom:2px">'+esc(c.name)+cnoTag(c)+'</h2>'+
  '<div class="tiny muted">'+esc(c.phone||'no phone')+(c.email?' · '+esc(c.email):'')+'</div>'+
  ((c.tags||[]).length?'<div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap">'+
   c.tags.map(t=>'<span class="pill b">'+esc(t)+'</span>').join('')+'</div>':'')+'</div></div>'+
  '<div class="seg"><button class="'+(custView==='profile'?'on':'')+'" onclick="setCustView(\''+id+
   '\',\'profile\')">'+ic('user',14)+'Profile</button>'+
  '<button class="'+(custView==='history'?'on':'')+'" onclick="setCustView(\''+id+'\',\'history\')">'+
   ic('history',14)+'History</button></div>';
 if(custView==='profile'){
  modal(c.name,head+custProfile(c));
  /* fetch this client's packages fresh, then redraw if anything changed */
  const before=JSON.stringify(HELD.filter(p=>p.customerId===id));
  loadClientPackages(id).then(()=>{
   if(custView!=='profile'||HISTFOR!==id)return;
   if(JSON.stringify(HELD.filter(p=>p.customerId===id))!==before)modal(c.name,head+custProfile(c));});
  return;}
 if(HIST&&HISTFOR===id){modal(c.name,head+custHistory(c));return;}
 modal(c.name,head+'<div class="card"><div class="skel" style="width:60%"></div><div class="skel"></div>'+
  '<div class="skel" style="width:80%"></div><div class="skel" style="width:45%"></div></div>');
 HIST=await loadHistory(id);HISTFOR=id;
 modal(c.name,head+custHistory(c));
};

async function loadHistory(id){
 const out={appts:[],sales:[],packages:[],redemptions:[]};
 const grab=async(col,field,val)=>{
  try{const s=await getDocs(query(collection(db,col),where(field,'==',val),limit(300)));
   return s.docs.map(d=>({id:d.id,...d.data()}));}catch(e){console.warn(col,e);return[];}};
 const [a,s,p,r]=await Promise.all([
  grab('appointments','customerId',id),grab('sales','customerId',id),
  grab('customerPackages','customerId',id),grab('redemptions','customerId',id)]);
 out.appts=a;out.sales=s;out.packages=p;out.redemptions=r;
 return out;}
function custHistory(c){
 const H=HIST||{appts:[],sales:[],packages:[],redemptions:[]};
 const paid=H.sales.filter(s=>!s.voided);
 const spend=paid.reduce((a,s)=>a+(s.total||0),0);
 const owing=paid.reduce((a,s)=>a+saleBalance(s),0);
 const done=H.appts.filter(a=>a.status==='done');
 const noshow=H.appts.filter(a=>a.status==='no');
 const dates=done.map(a=>a.start).sort();
 const tally=(arr,key)=>{const m={};arr.forEach(x=>{const k=x[key];if(k)m[k]=(m[k]||0)+1;});
  return Object.entries(m).sort((a,b)=>b[1]-a[1])[0];};
 const favSvc=tally(done,'serviceName'),favStf=tally(done,'staffName');
 const events=[];
 H.appts.forEach(a=>events.push({at:a.start,kind:a.status==='no'?'no':'appt',
  icon:a.status==='no'?'close':'calendar',
  title:a.serviceName||'Appointment',
  meta:(a.staffName||'')+(a.roomId?' · '+(room(a.roomId).name||''):''),
  tag:(STATUS[a.status]||[a.status])[0]}));
 paid.forEach(s=>events.push({at:s.at,kind:'sale',icon:'receipt',open:"showReceipt('"+s.id+"')",
  title:'Bill '+(s.invoiceNo||'')+(saleBalance(s)>0?' · '+rm(saleBalance(s))+' owing':''),amount:s.total,
  meta:(s.items||[]).map(i=>i.name+(i.qty>1?' ×'+i.qty:'')).join(', '),
  tag:(s.payments||[]).filter(p=>!p.date||p.date===s.date).map(p=>p.method).join(' + ')||'Nothing paid on the day'}));
 paid.forEach(s=>(s.payments||[]).filter(p=>p.date&&p.date!==s.date).forEach(p=>events.push({
  at:p.at||p.date,kind:'sale',icon:'wallet',open:"showReceipt('"+s.id+"')",
  title:'Instalment · '+(s.invoiceNo||''),amount:p.amount,
  meta:(p.byName?'Taken by '+p.byName:''),tag:p.method})));
 H.sales.filter(s=>s.voided).forEach(s=>events.push({at:s.voidedAt||s.at,kind:'no',icon:'close',
  title:'Bill voided '+(s.invoiceNo||''),meta:s.voidReason||'',tag:'Voided'}));
 H.packages.forEach(p=>{
  events.push({at:p.soldAt,kind:'pkg',icon:'package',title:(p.prepaid?'Prepaid ':'Bought ')+cpName(p),
   amount:p.price,meta:'Valid until '+dstr(p.expiry),
   tag:(p.balances||[]).reduce((a,b)=>a+b.total,0)+' sessions'});});
 H.redemptions.forEach(r=>events.push({at:r.at,kind:'redeem',icon:'check',
  open:"redeemDetail('"+r.id+"')",
  title:'Redeemed '+(r.serviceName||'session'),meta:(r.staffName||'')+
  (r.remaining!==undefined?' · '+r.remaining+' left after this':''),tag:'Package'}));
 events.sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
 const pkgCard=H.packages.length?'<div class="card"><div class="sec-h"><h3>'+ic('package',15)+
  ' Packages and balances</h3><span class="pill">'+H.packages.length+'</span></div>'+
  H.packages.map(p=>{
   const pk={name:cpName(p)};
   const tot=(p.balances||[]).reduce((a,b)=>a+b.total,0);
   const left=(p.balances||[]).reduce((a,b)=>a+b.left,0);
   const d=daysBetween(new Date(),p.expiry);
   const reds=H.redemptions.filter(r=>r.customerPackageId===p.id)
     .sort((a,b)=>String(b.at).localeCompare(String(a.at)));
   return '<div class="item" style="cursor:default"><div class="spread"><b>'+esc(pk.name||'Package')+'</b>'+
    (d<0?'<span class="pill r">Expired '+dshort(p.expiry)+'</span>':
     '<span class="pill '+(d<=45?'a':'g')+'">'+d+' days left</span>')+'</div>'+
    '<div class="tiny muted" style="margin:6px 0">Bought '+dstr(p.soldAt)+' for '+rm(p.price)+
    ' · value still owed '+rm(tot?p.price*left/tot:0)+'</div>'+
    (p.balances||[]).map(b=>'<div style="margin:7px 0">'+
     '<div class="spread tiny"><span>'+esc(svc(b.serviceId).name||b.serviceId)+'</span>'+
     '<span><b>'+b.left+'</b> of '+b.total+' left</span></div>'+
     '<div class="bar"><i class="brass" style="width:'+(b.total?(b.total-b.left)/b.total*100:0)+
     '%"></i></div></div>').join('')+
    (reds.length?'<div class="tiny muted" style="margin-top:9px">'+ic('history',12)+' Sessions used</div>'+
     reds.map(r=>'<div class="item" style="margin:6px 0 0;padding:8px 10px" onclick="redeemDetail(\''+
      r.id+'\')"><div class="spread"><span class="tiny">'+esc(r.serviceName||'')+'</span>'+
      '<span class="tiny muted">'+dshort(r.at)+' · '+tstr(r.at)+'</span></div>'+
      '<div class="tiny muted">'+esc(r.staffName||'')+
      (r.remaining!==undefined?' · '+r.remaining+' left after':'')+'</div></div>').join('')
     :'<div class="tiny muted" style="margin-top:8px">No sessions used yet.</div>')+
    '</div>';}).join('')+'</div>':'';
 let h='<div class="grid g3" style="margin-bottom:12px">'+
  '<div class="kpi dark"><div class="lab">'+ic('money',12)+'Lifetime spend</div><div class="big">'+
   rm(spend)+'</div><div class="tiny" style="color:#9A9285">'+paid.length+' bills</div></div>'+
  kpi('Visits',done.length,(noshow.length?noshow.length+' no-show':'perfect attendance'),'check')+
  (owing>0?'<div class="kpi" style="border-color:var(--rose)"><div class="lab">'+ic('wallet',12)+
   'Still owing</div><div class="big" style="color:var(--rose)">'+rm(owing)+'</div>'+
   '<div class="tiny muted">on '+paid.filter(s=>saleBalance(s)>0).length+' bill(s)</div></div>':
   kpi('Average bill',rm(paid.length?spend/paid.length:0),'','chart'))+'</div>';
 h+='<div class="card"><div class="kv">'+
  (dates.length?'<div class="k">'+ic('calendar',12)+' First visit</div><div class="v">'+dstr(dates[0])+'</div>'+
   '<div class="k">'+ic('clock',12)+' Last visit</div><div class="v">'+dstr(dates[dates.length-1])+
   ' <span class="muted">('+daysBetween(dates[dates.length-1],new Date())+' days ago)</span></div>':'')+
  (favSvc?'<div class="k">'+ic('star',12)+' Favourite</div><div class="v">'+esc(favSvc[0])+
   ' <span class="muted">×'+favSvc[1]+'</span></div>':'')+
  (favStf?'<div class="k">'+ic('user',12)+' Usual therapist</div><div class="v">'+esc(favStf[0])+
   ' <span class="muted">×'+favStf[1]+'</span></div>':'')+
  '<div class="k">'+ic('package',12)+' Packages</div><div class="v">'+H.packages.length+' bought · '+
   H.redemptions.length+' sessions redeemed</div>'+
  '</div></div>';
 h+=pkgCard;
 if(!events.length)return h+'<div class="card"><div class="empty">'+ic('history',26)+
  '<div>Nothing recorded for this client yet.</div></div></div>';
 let last='';
 h+='<div class="card"><div class="sec-h"><h3>Everything, newest first</h3>'+
  '<span class="pill">'+events.length+' events</span></div><div class="tline">';
 events.forEach((e,i)=>{
  const mon=e.at?new Date(e.at).toLocaleDateString('en-MY',{month:'long',year:'numeric'}):'Undated';
  if(mon!==last){h+='</div><div class="daysep">'+esc(mon)+'</div><div class="tline">';last=mon;}
  h+='<div class="tev '+e.kind+'" style="animation-delay:'+Math.min(i*30,400)+'ms">'+
   '<div class="dot">'+ic(e.icon,12)+'</div>'+
   '<div class="when">'+(e.at?dshort(e.at)+' · '+tstr(e.at):'')+'</div>'+
   '<div class="body"'+(e.open?' onclick="'+e.open+'" style="cursor:pointer"':'')+
   '><div class="spread"><b>'+esc(e.title)+(e.open?' '+ic('right',12):'')+'</b>'+
    (e.amount!==undefined?'<span>'+rm(e.amount)+'</span>':
     (e.tag?'<span class="pill">'+esc(e.tag)+'</span>':''))+'</div>'+
   (e.meta?'<div class="tiny muted" style="margin-top:2px">'+esc(e.meta)+'</div>':'')+
   (e.amount!==undefined&&e.tag?'<div class="tiny muted">'+esc(e.tag)+'</div>':'')+
   '</div></div>';});
 h+='</div></div>';
 return h;}
window.soapNote=id=>{
 modal('Treatment note','<div class="card"><label>Observation on arrival</label>'+

/* ============ client search and picker ============ */
/* One control for choosing a client anywhere: booking, checkout, programmes.
   It filters the clients already loaded instantly, then asks Firestore, and can
   register a new client inline without leaving the form you are in. */

/* search keywords saved on each client: every word prefix of the name (2 letters and
   up) plus the phone number and its last four digits. Firestore can only match whole
   array entries, so storing prefixes is what makes "aisy" find "Nur Aisyah". */
function kwFor(name,phone){
 const out=new Set();
 String(name||'').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean).forEach(w=>{
  for(let i=2;i<=Math.min(w.length,12);i++)out.add(w.slice(0,i));});
 const d=digits(phone);
 if(d.length>=4){out.add(d);out.add(d.slice(-4));}
 return [...out].slice(0,80);
}
function matchClients(term,max){
 const t=String(term||'').trim().toLowerCase();
 const pool=CUSTS.filter(c=>c.active!==false);
 if(!t)return pool.slice(0,max||8);
 const dg=digits(t),words=t.split(/\s+/).filter(Boolean);
 const no=(/[a-z]/.test(t)||dg.length<=5)?normNo(t):'';
 const hits=pool.filter(c=>{
  const n=String(c.name||'').toLowerCase();
  const byName=words.every(w=>n.includes(w));
  const byPhone=dg.length>=3&&(digits(c.phone).includes(dg)||digits(c.phone2).includes(dg));
  return byName||byPhone||(!!no&&(c.clientNo===no||c.memberNo===no));});
 /* names that start with what was typed come first */
 hits.sort((a,b)=>{
  const as=no&&(a.clientNo===no||a.memberNo===no)?-1:String(a.name||'').toLowerCase().startsWith(t)?0:1;
  const bs=no&&(b.clientNo===no||b.memberNo===no)?-1:String(b.name||'').toLowerCase().startsWith(t)?0:1;
  return as-bs||String(a.name).localeCompare(String(b.name));});
 return hits.slice(0,max||12);
}
async function searchClients(term){
 const t=String(term||'').trim().toLowerCase();
 if(!t)return;
 const qs=[];
 const dg=digits(t);
 const no=(/[a-z]/.test(t)||dg.length<=5)?normNo(t):'';
 if(no)qs.push(query(collection(db,'customers'),where(isMem(no)?'memberNo':'clientNo','==',no),limit(2)));
 if(dg.length>=3&&/^[0-9+\-\s()]+$/.test(t)){
  qs.push(query(collection(db,'customers'),orderBy('phoneDigits'),
   where('phoneDigits','>=',dg),where('phoneDigits','<=',dg+''),limit(20)));
  qs.push(query(collection(db,'customers'),where('keywords','array-contains',dg),limit(20)));
 }else{
  const w=t.split(/\s+/)[0].slice(0,12);
  if(w.length>=2)qs.push(query(collection(db,'customers'),
   where('keywords','array-contains',w),limit(25)));
  qs.push(query(collection(db,'customers'),orderBy('nameLower'),
   where('nameLower','>=',t),where('nameLower','<=',t+''),limit(20)));
 }
 const res=await Promise.allSettled(qs.map(q=>getDocs(q)));
 const found=[];
 res.forEach(r=>{if(r.status==='fulfilled')r.value.docs.forEach(d=>found.push({id:d.id,...d.data()}));});
 const seen=new Set(CUSTS.map(c=>c.id));
 found.filter(c=>c.active!==false).forEach(c=>{
  if(seen.has(c.id))Object.assign(CUSTS.find(x=>x.id===c.id),c);
  else{CUSTS.push(c);seen.add(c.id);}});
}

/* ============ instalments and outstanding balances ============ */
/* A bill can be saved with part of it still owed, but only against a named client
   so there is someone to collect from. Every payment carries its own date, which is
   what the Day screen and the cash drawer count — not the date of the bill. */
let OUTSTANDING=[],COLLECT_ID='';
const r2=n=>Math.round((+n||0)*100)/100;
/* bills from before instalments existed were always paid in full */
const saleBalance=s=>s&&s.balance!==undefined?r2(s.balance):0;
const salePaid=s=>s&&s.paid!==undefined?r2(s.paid):r2((s&&s.total)||0);
const isOverdue=s=>!!(s.dueDate&&s.dueDate<today());
async function loadOutstanding(){
 try{
  const s=await getDocs(query(collection(db,'sales'),where('balance','>',0),limit(400)));
  OUTSTANDING=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!x.voided)
   .sort((a,b)=>String(a.dueDate||a.date).localeCompare(String(b.dueDate||b.date)));
 }catch(e){OUTSTANDING=[];console.warn('outstanding',e);}
}
const owedBy=cid=>OUTSTANDING.filter(s=>s.customerId===cid&&saleBalance(s)>0);
const owedSum=list=>r2(list.reduce((a,s)=>a+saleBalance(s),0));
function oweRow(s){
 const od=isOverdue(s),pc=s.total?Math.min(100,salePaid(s)/s.total*100):0;
 return '<div class="item" onclick="collectPayment(\''+s.id+'\')">'+

  ' of '+rm(s.total)+' paid'+(s.dueDate?' · <span class="'+(od?'odue':'')+'">'+
   (od?'overdue since ':'due ')+dshort(s.dueDate)+'</span>':'')+'</div>'+
  '<div class="bar" style="margin-top:7px"><i style="width:'+pc+'%"></i></div></div>';
}

/* ============ come-back vouchers ============ */
/* After a bill, the counter can hand the client a voucher for their next visit. The
   owner sets the offer once in Settings; each voucher gets its own code, belongs to one
   client, can be used once, and only from a later day, so it brings them back rather
   than discounting today's bill. */
const RV_DEFAULT={on:false,mode:'button',type:'rm',value:20,min:100,minBill:100,validDays:60,startDays:1,
 prefix:'BACK',ownerOnly:true,
 message:'Hi {name}, terima kasih datang ke {biz}! Ini voucher {worth} untuk lawatan seterusnya. '+
  'Kod: {code}. Boleh guna dari {from} hingga {expiry}{min}. Jumpa lagi!'};
const rvSet=()=>({...RV_DEFAULT,...(((D.meta||{}).returnVoucher)||{})});
const rvWorth=v=>v.type==='pct'?(+v.value||0)+'% off':rm(+v.value||0)+' off';
const isReturnV=v=>!!v&&v.kind==='return';
const RV_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';        // no 0/O or 1/I to misread
function rvCodeFor(saleId,salt){
 let h=2166136261;const s=String(saleId)+'#'+(salt||0);
 for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
 let out='';for(let i=0;i<6;i++){out+=RV_CHARS[h%32];h=Math.floor(h/32);}
 return out;
}
const rvPrefix=p=>String(p||'BACK').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8)||'BACK';
const rvForSale=id=>D.vouchers.find(v=>isReturnV(v)&&v.saleId===id);
const rvOf=cid=>D.vouchers.filter(v=>(v.kind==='return'||v.kind==='prize')&&v.customerId===cid);
const rvUsed=v=>(v.used||0)>=(v.cap||1);
const rvState=v=>rvUsed(v)?'used':v.expiry<today()?'expired':(v.validFrom&&v.validFrom>today())?'waiting':'ready';
/* why a bill cannot earn a voucher, or '' when it can */
function rvWhyNot(s){
 const R=rvSet();
 if(!R.on)return 'Come-back vouchers are switched off in Settings.';
 if(!s)return 'Bill not found.';
 if(s.voided)return 'This bill has been voided.';
 if(!s.customerId)return 'Walk-in bills cannot earn a voucher. Register the client first.';
 if((+s.total||0)<(+R.minBill||0))return 'Bills from '+rm(R.minBill)+' earn a voucher. This one is '+rm(s.total||0)+'.';
 if(rvForSale(s.id))return 'A voucher was already issued for this bill.';
 return '';
}
async function issueRV(s){
 const R=rvSet(),now=new Date();
 const data={kind:'return',type:R.type==='pct'?'pct':'rm',value:+R.value||0,min:+R.min||0,cap:1,used:0,
  firstOnly:false,ownerOnly:R.ownerOnly!==false,
  validFrom:ymd(addDays(now,+R.startDays||0)),expiry:ymd(addDays(now,+R.validDays||60)),
  customerId:s.customerId,customerName:s.customerName||'',saleId:s.id,invoiceNo:s.invoiceNo||'',
  branchId:s.branchId||ME.branchId,issuedBy:UID,issuedByName:ME.name,issuedAt:now.toISOString()};
 let code='',existing=null;
 await runTransaction(db,async tx=>{
  for(let salt=0;salt<6;salt++){
   const c=rvPrefix(R.prefix)+'-'+rvCodeFor(s.id,salt);
   const snap=await tx.get(doc(db,'vouchers',c));
   if(!snap.exists()){tx.set(doc(db,'vouchers',c),data);code=c;return;}
   if(snap.data().saleId===s.id){code=c;existing=snap.data();return;}
  }
  throw new Error('Could not make a unique voucher code. Try again.');
 });
 const v={id:code,...(existing||data)};
 if(!D.vouchers.some(x=>x.id===code))D.vouchers.push(v);
 if(!existing)await audit('Come-back voucher issued',code+' · '+rvWorth(v)+' · '+(s.customerName||'')+
  ' · '+(s.invoiceNo||''));
 return v;
}
window.issueReturnVoucher=async id=>{
 const s=findSale(id);
 const why=rvWhyNot(s);if(why){toast(why);return;}
 try{const v=await issueRV(s);window.showRV(v.id);}
 catch(e){toast(friendly(e));}
};

}

/* ---------- redeeming any voucher at checkout ---------- */
/* one place that decides whether a voucher can go on this bill */
function voucherProblem(v,sub,customerId,line){
 if(!v)return 'That code does not exist.';
 if(v.expiry&&v.expiry<today())return 'This voucher expired on '+dstr(v.expiry)+'.';
 if(v.validFrom&&v.validFrom>today())return 'This voucher can be used from '+dstr(v.validFrom)+
  ' — it is for the next visit, not today\'s.';
 if(v.cap&&(v.used||0)>=v.cap)return isClientV(v)?'This voucher has already been used'+
  (v.usedInvoice?' ('+v.usedInvoice+')':'')+'.':'This voucher\'s quota is used up.';
 if(v.serviceId){
  if(!line)return 'This voucher is for '+(v.serviceName||svc(v.serviceId).name||'one treatment')+' — it goes on that treatment\'s line.';
  if(line.id!==v.serviceId||!['service'].includes(line.kind))return 'This voucher is only for '+(v.serviceName||svc(v.serviceId).name||'another treatment')+'.';
 }
 if(isClientV(v)&&v.ownerOnly!==false){
  if(!customerId)return 'Choose the client first — this voucher belongs to '+(v.customerName||'a client')+'.';
  if(v.customerId!==customerId)return 'This voucher belongs to '+(v.customerName||'another client')+'.';
 }
 if(sub<(+v.min||0))return 'Minimum spend is '+rm(v.min)+'. The bill is '+rm(sub)+'.';
 return '';
}

/* the voucher is spent inside a transaction, so two counters cannot use one code twice */
async function spendVoucher(v,invoiceNo,customerId){
 if(!v.cap){try{await updateDoc(doc(db,'vouchers',v.id),{used:increment(1)});}catch(e){}return;}
 let after=null;
 await runTransaction(db,async tx=>{
  const ref=doc(db,'vouchers',v.id);
  const snap=await tx.get(ref);
  if(!snap.exists())throw new Error('Voucher '+v.id+' no longer exists. Remove it and try again.');
  const d=snap.data();
  if((d.used||0)>=(d.cap||1))throw new Error('Voucher '+v.id+' was just used on another bill. Remove it and try again.');
  after={used:(d.used||0)+1,usedAt:new Date().toISOString(),usedBy:UID,usedInvoice:invoiceNo,
   usedCustomerId:customerId||''};
  tx.update(ref,after);
 });
 const local=D.vouchers.find(x=>x.id===v.id);if(local)Object.assign(local,after);
}

const LIB_SVC=[

 ['script','Scripts','msg'],['policy','Policy','flag']];

/* every page the library can show: catalogue guides (written or not) and articles */
function libEntries(){
 const out=[];
 D.services.filter(s=>s.active!==false).forEach(s=>{const d=libDoc('svc_'+s.id)||{};
  out.push({id:'svc_'+s.id,kind:'service',refId:s.id,title:s.name,sub:(s.cat||'Treatment')+' · '+(s.dur||0)+' min',
   doc:d,filled:LIB_SVC.filter(f=>String((d.sections||{})[f[0]]||'').trim()).length,of:LIB_SVC.length});});
 D.products.filter(p=>p.type==='retail'&&p.active!==false).forEach(p=>{const d=libDoc('prd_'+p.id)||{};
  out.push({id:'prd_'+p.id,kind:'product',refId:p.id,title:p.name,sub:'Retail · '+rm(p.price||0),doc:d,
   filled:LIB_PRD.filter(f=>String((d.sections||{})[f[0]]||'').trim()).length,of:LIB_PRD.length,image:p.image});});
 LIB.filter(x=>x.kind==='article').forEach(a=>out.push({id:a.id,kind:'article',cat:a.cat,title:a.title||'Untitled',
  sub:libCat(a.cat)[1],doc:a,filled:String(a.body||'').trim()?1:0,of:1}));
 return out;
