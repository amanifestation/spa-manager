/* a new code means a new document: copy it, move stock and links, then remove the old one */
async function renameProduct(from,to,data){
 const old=prod(from);
 const b=writeBatch(db);
 const {id:_oid,...oldRest}=old;
 b.set(doc(db,'products',to),{...oldRest,...data,renamedFrom:from});
 D.stock.filter(s=>s.sku===from).forEach(s=>{
  const {id:sid,...rest}=s;
  b.set(doc(db,'stock',s.branchId+'_'+to),{...rest,sku:to});
  b.delete(doc(db,'stock',sid));});
 D.services.filter(sv=>(sv.use||[]).some(u=>u.sku===from)).forEach(sv=>
  b.set(doc(db,'services',sv.id),{use:sv.use.map(u=>u.sku===from?{...u,sku:to}:u)},{merge:true}));
 if(typeof LIB!=='undefined'){
  const g=LIB.find(x=>x.id==='prd_'+from);
  if(g){const {id:gid,...rest}=g;b.set(doc(db,'library','prd_'+to),{...rest,refId:to});b.delete(doc(db,'library',gid));}
  LIB.filter(x=>(x.pairs||[]).includes('prd_'+from)).forEach(x=>
   b.set(doc(db,'library',x.id),{pairs:x.pairs.map(y=>y==='prd_'+from?'prd_'+to:y)},{merge:true}));
 }
 b.delete(doc(db,'products',from));
 await b.commit();
 if(typeof LIB!=='undefined')try{await loadLibrary();}catch(e){}
}

/* ============ images ============ */
/* Firebase Cloud Storage needs the paid Blaze plan, so pictures are shrunk in the
   browser and stored inline in the Firestore document. A document can hold 1 MB in
   total, so every picture is squeezed under a strict budget before it is saved. */
const IMG_BUDGET={logo:150000,product:110000,notice:420000};
function pickImage(kind){
 return new Promise(resolve=>{
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=async e=>{
   const file=e.target.files&&e.target.files[0];
   if(!file)return resolve(null);
   if(!/^image\//.test(file.type)){toast('That file is not an image');return resolve(null);}
   toast('Preparing the image…');
   try{resolve(await compressImage(file,kind));}
   catch(err){console.warn(err);toast('Could not read that image');resolve(null);}
  };
  inp.click();
 });
}
function compressImage(file,kind){
 const budget=IMG_BUDGET[kind]||200000;
 const maxPx=kind==='logo'?420:(kind==='product'?720:1600);
 return new Promise((resolve,reject)=>{
  const fr=new FileReader();
  fr.onerror=()=>reject(new Error('read failed'));
  fr.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error('decode failed'));
   img.onload=()=>{
    let w=img.width,h=img.height;
    const scale=Math.min(1,maxPx/Math.max(w,h));
    w=Math.round(w*scale);h=Math.round(h*scale);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const cx=cv.getContext('2d');
    const alpha=kind==='logo'&&/png|webp|svg/i.test(file.type);
    if(!alpha){cx.fillStyle='#ffffff';cx.fillRect(0,0,w,h);}
    cx.drawImage(img,0,0,w,h);
    // A logo is usually placed on a light receipt, so transparency is worth keeping.
    // Try PNG at full size, then at two thirds, before giving up and flattening to JPEG.
    if(alpha){
     const png=cv.toDataURL('image/png');
     if(png.length<=budget)return resolve(png);
     const cvS=document.createElement('canvas');
     cvS.width=Math.round(w*0.66);cvS.height=Math.round(h*0.66);
     cvS.getContext('2d').drawImage(img,0,0,cvS.width,cvS.height);
     const small=cvS.toDataURL('image/png');
     if(small.length<=budget)return resolve(small);
     // flattening loses transparency, so paint white behind it first
     cx.globalCompositeOperation='destination-over';
     cx.fillStyle='#ffffff';cx.fillRect(0,0,w,h);
     cx.globalCompositeOperation='source-over';
    }
    let q=0.86,out=cv.toDataURL('image/jpeg',q);
    while(out.length>budget&&q>0.36){q-=0.1;out=cv.toDataURL('image/jpeg',q);}
    if(out.length>budget){
     // still too heavy: shrink the pixels and try once more
     const cv2=document.createElement('canvas');
     cv2.width=Math.round(w*0.7);cv2.height=Math.round(h*0.7);
     const c2=cv2.getContext('2d');c2.fillStyle='#fff';c2.fillRect(0,0,cv2.width,cv2.height);
     c2.drawImage(img,0,0,cv2.width,cv2.height);
     out=cv2.toDataURL('image/jpeg',0.6);
    }
    if(out.length>budget)return reject(new Error('too large'));
    resolve(out);
   };
   img.src=fr.result;
  };
  fr.readAsDataURL(file);
 });
}

async function saveStaffForm(id){

  perms:['therapist','frontdesk'].includes(role)?['booking','pos','customer']:[]};
 const pin=($('#ts-pin').value||'').trim();
 if(pin){

  const salt=uid+':'+Math.random().toString(36).slice(2,10);
  data.attSalt=salt;data.attCode=await hashCode(pin,salt);
 }
 try{await setDoc(doc(db,'users',uid),data,{merge:true});

  window.closeModal();render();toast('Saved');}
 catch(e){toast(friendly(e));}}

/* ============ the matching engine ============ */
/* ---- scheduling: one treatment per visit day ---- */
/* Every session gets its own date. The client also gets rest days between visits,
   and a full week after anything tagged high intensity (peels, HIFU), because
   stacking treatments on healing skin is where complaints come from. */
const WEEKDAYS=[['1','Mon'],['2','Tue'],['3','Wed'],['4','Thu'],['5','Fri'],['6','Sat'],['0','Sun']];
const recoveryDays=(intensity,rest)=>intensity==='high'?Math.max(rest,7):rest;
function scheduleVisits(plan,p){
 const rest=Math.max(1,+p.restDays||3);
 const allowed=(p.days&&p.days.length?p.days:[0,1,2,3,4,5,6]).map(Number);
 const okDay=new Set(allowed);
 const s0=new Date((p.start||today())+'T00:00:00');
 const dayAt=d=>addDays(s0,d);
 /* every session starts from its ideal day: the treatment's own interval */
 const want=[];
 plan.forEach((l,li)=>{for(let i=0;i<l.sessions;i++)want.push({l,li,i,ideal:i*l.interval});});
 want.sort((a,b)=>a.ideal-b.ideal||(a.l.tier==='core'?0:1)-(b.l.tier==='core'?0:1)||a.li-b.li);
 const taken=[],lastOf={},visits=[];
 let moved=0;
 for(const w of want){
  const rec=recoveryDays(w.l.intensity,rest);
  const earliest=Math.max(w.ideal,lastOf[w.li]!==undefined?lastOf[w.li]+w.l.interval:0);
  let d=earliest;
  for(let guard=0;guard<1000;guard++,d++){
   if(!okDay.has(dayAt(d).getDay()))continue;
   /* respect the recovery of whatever came before, and give this one room before the next */
   const clash=taken.some(t=>(t.day<=d&&d-t.day<t.rec)||(t.day>d&&t.day-d<rec));
   if(!clash)break;
  }
  if(d>earliest)moved++;
  taken.push({day:d,rec});lastOf[w.li]=d;
  visits.push({day:d,at:dayAt(d),id:w.l.id,name:w.l.name,tier:w.l.tier,
   intensity:w.l.intensity,n:w.i+1,of:w.l.sessions});
 }
 visits.sort((a,b)=>a.day-b.day);
 return{visits,moved,rest};
}
function buildProgram(p){
 const weeks=p.weeks||12;
 const scored=[],blocked=[];
 D.services.filter(s=>s.active!==false).forEach(s=>{
  const hit=(s.concerns||[]).filter(c=>p.concerns.includes(c));
  if(!hit.length)return;
  const clash=(s.avoid||[]).filter(f=>p.flags.includes(f));
  if(clash.length){blocked.push({s,clash});return;}
  let score=hit.length*4;
  if((s.skins||[]).length)score+=(s.skins||[]).includes(p.skin)?3:-2;
  if(p.sensitive&&s.intensity==='high')score-=3;
  if(p.minutes&&s.dur>p.minutes)score-=4;
  scored.push({s,hit,score});
 });
 scored.sort((a,b)=>b.score-a.score||a.s.price-b.s.price);

 /* one core treatment per concern, then up to two supporting ones */
 const core=[];
 p.concerns.forEach(c=>{
  const pick=scored.find(x=>x.hit.includes(c)&&!core.some(y=>y.s.id===x.s.id));
  if(pick)core.push(pick);
 });
 const support=scored.filter(x=>!core.some(y=>y.s.id===x.s.id)).slice(0,2);

 const plan=[];
 const addLine=(x,tier)=>{
  const interval=x.s.intervalDays||14;
  /* the first session is on day zero, so a 24-week window at 90-day spacing
     fits two sessions (day 0 and day 90), not one */
  const days=weeks*7;
  const capacity=Math.max(1,Math.floor((days-1)/interval)+1);
  const wanted=x.s.courseSessions||4;
  const n=Math.max(1,Math.min(wanted,capacity));
  plan.push({id:x.s.id,name:x.s.name,tier,sessions:n,interval,price:x.s.price,
   dur:x.s.dur,subtotal:n*x.s.price,treats:x.hit,score:x.score,intensity:x.s.intensity||'medium'});
 };
 core.forEach(x=>addLine(x,'core'));
 support.forEach(x=>addLine(x,'support'));

 /* trim to budget: shave sessions first, drop the weakest line only as a last resort */
 const total=()=>plan.reduce((a,l)=>a+l.subtotal,0);
 const trimmed=[];
 if(p.budget>0){
  let guard=0;
  while(total()>p.budget&&guard++<80){
   const cand=plan.filter(l=>l.sessions>1).sort((a,b)=>a.score-b.score)[0];
   if(cand){cand.sessions--;cand.subtotal=cand.sessions*cand.price;continue;}
   if(plan.length<=1)break;
   const drop=plan.filter(l=>l.tier==='support').sort((a,b)=>a.score-b.score)[0]
     ||plan.slice().sort((a,b)=>a.score-b.score)[0];
   trimmed.push(drop.name);plan.splice(plan.indexOf(drop),1);
  }
 }

 const home=D.products.filter(x=>x.type==='retail'&&x.active!==false)
  .map(x=>({x,hit:(x.concerns||[]).filter(c=>p.concerns.includes(c))}))
  .filter(o=>o.hit.length)
  .sort((a,b)=>b.hit.length-a.hit.length)
  .slice(0,4)
  .map(o=>({sku:o.x.id,name:o.x.name,price:o.x.price,step:o.x.step||'',treats:o.hit}));

 const S=scheduleVisits(plan,p);
 const visits=S.visits;
 const lastDay=visits.length?visits[visits.length-1].day:0;
 const weeksActual=Math.max(weeks,Math.ceil((lastDay+1)/7));
 const late=visits.filter(v=>v.day>=weeks*7).length;

 const sub=total();
 const homeTotal=home.reduce((a,h)=>a+h.price,0);
 const bundle=Math.round(sub*(1-(p.bundleOff||0)/100));
 const sessions=plan.reduce((a,l)=>a+l.sessions,0);
 const warn=[];
 if(p.flags.includes('pregnant'))warn.push('Client is pregnant or breastfeeding. '+
  'Machine-based and chemical treatments need the doctor to clear them first.');
 if(p.flags.includes('accutane'))warn.push('Recent oral acne medication. Resurfacing and peels '+
  'are normally deferred — confirm with the doctor before booking.');
 if(p.sensitive)warn.push('Sensitivity noted. Start at the lowest setting and patch test first.');
 if(!plan.length)warn.push('Nothing in the catalogue is tagged for these concerns yet.');
 if(late)warn.push(late+' session'+(late>1?'s':'')+' land after week '+weeks+
  ' once each visit has its own day. The full course runs '+weeksActual+' weeks — extend the '+
  'programme length, or allow fewer rest days between visits.');

 return{plan,home,visits,blocked,trimmed,sub,homeTotal,bundle,sessions,weeks,weeksActual,late,
  moved:S.moved,rest:S.rest,warn,params:p};
}

const LOY_DEFAULT={on:false,earnPer:10,pointsPer:1,ringgitPerPoint:0.10,minRedeem:50,
 expireMonths:12,tiers:[{name:'Member',at:0},{name:'Silver',at:1000},{name:'Gold',at:3000},
 {name:'Platinum',at:8000}]};
const loy=()=>({...LOY_DEFAULT,...(D.meta.loyalty||{})});
const tierOf=pts=>{const t=loy().tiers.slice().sort((a,b)=>b.at-a.at).find(x=>pts>=x.at);
 return t?t.name:'Member';};
const nextTier=pts=>{const up=loy().tiers.slice().sort((a,b)=>a.at-b.at).find(x=>pts<x.at);
 return up?{name:up.name,need:up.at-pts}:null;};
const pointsFor=amount=>{const L=loy();
 return L.on?Math.floor((amount||0)/(L.earnPer||10))*(L.pointsPer||1):0;};
const pointsWorth=p=>(p||0)*(loy().ringgitPerPoint||0);
let LOYLIST=[],LOYLEDGER=[],loyView='members';
window.setLoyView=v=>{loyView=v;render();};
async function loadLoyalty(){
 try{const s=await getDocs(query(collection(db,'customers'),orderBy('points','desc'),limit(50)));
  LOYLIST=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.active!==false&&(c.points||0)>0);}
 catch(e){LOYLIST=[];}
 try{const s=await getDocs(query(collection(db,'loyalty'),orderBy('at','desc'),limit(60)));
  LOYLEDGER=s.docs.map(d=>({id:d.id,...d.data()}));}catch(e){LOYLEDGER=[];}
}
async function awardPoints(customerId,customerName,amount,ref){
 const L=loy();if(!L.on||!customerId)return 0;
 const pts=pointsFor(amount);if(pts<=0)return 0;
 try{
  await updateDoc(doc(db,'customers',customerId),
   {points:increment(pts),pointsEarned:increment(pts),lastPointsAt:new Date().toISOString()});
  await addDoc(collection(db,'loyalty'),{customerId,customerName,kind:'earn',points:pts,
   amount,ref:ref||'',branchId:ME.branchId,staffId:UID,staffName:ME.name,
   at:new Date().toISOString(),date:today()});
  const c=cust(customerId);if(c)c.points=(c.points||0)+pts;
  return pts;
 }catch(e){console.warn('points',e);return 0;}
}
async function spendPoints(customerId,customerName,pts,ref){
 if(!(pts>0))return;
 await updateDoc(doc(db,'customers',customerId),
  {points:increment(-pts),pointsRedeemed:increment(pts)});
 await addDoc(collection(db,'loyalty'),{customerId,customerName,kind:'redeem',points:-pts,
  amount:pointsWorth(pts),ref:ref||'',branchId:ME.branchId,staffId:UID,staffName:ME.name,
  at:new Date().toISOString(),date:today()});
 const c=cust(customerId);if(c)c.points=Math.max(0,(c.points||0)-pts);
}

function dayFigures(d){
 d=d||today();
 const sales=SALES.filter(s=>s.date===d&&s.branchId===ME.branchId);
 const live=sales.filter(s=>!s.voided);
 /* money is counted on the day it was paid, so an instalment collected today on an
    older bill lands in today's drawer, and the unpaid part of today's bill does not */
 const byMethod={};let cash=0,collected=0,instalments=0;
 SALES.filter(s=>s.branchId===ME.branchId&&!s.voided).forEach(s=>(s.payments||[]).forEach(p=>{
  if((p.date||s.date)!==d)return;
  byMethod[p.method]=(byMethod[p.method]||0)+p.amount;
  collected+=p.amount;
  if(s.date!==d)instalments+=p.amount;
  if(isCashMethod(p.method))cash+=p.amount;}));
 const owedToday=live.reduce((a,s)=>a+saleBalance(s),0);
 const ap=APPTS.filter(a=>a.date===d);
 const cats={};ap.forEach(a=>{const k=(visitOf(a.visitType)||{}).label||'Unspecified';
  cats[k]=(cats[k]||0)+1;});
 const items={service:0,product:0,package:0};
 live.forEach(s=>(s.items||[]).forEach(i=>{const k=retailKind(i.kind)?'product':i.kind;if(items[k]!==undefined)items[k]+=lineAmt(i);}));
 return{sales:live,voided:sales.filter(s=>s.voided),revenue:live.reduce((a,s)=>a+s.total,0),
  bills:live.length,byMethod,cash,items,collected:r2(collected),instalments:r2(instalments),
  owedToday:r2(owedToday),
  booked:ap.length,showed:ap.filter(a=>a.status==='done').length,
  inTreatment:ap.filter(a=>a.status==='in').length,
  noShow:ap.filter(a=>a.status==='no').length,
  cancelled:ap.filter(a=>a.status==='cancel').length,
  cats,deposits:ap.reduce((a,x)=>a+(x.deposit||0),0)};
}

  const patch={commSvc:+$('#st-cs').value,commProd:+$('#st-cp').value,role:$('#st-r').value,
   branchId:$('#st-b').value,takes:$('#st-r').value==='branch'?false:$('#st-t').checked,
   perms:['therapist','frontdesk'].includes($('#st-r').value)?['booking','pos','customer']:[]};
  try{await updateDoc(doc(db,'users',id),patch);Object.assign(s,patch);
   await audit('Team settings updated',s.name);window.closeModal();render();bindSettings();toast('Saved');}
  catch(e){toast(friendly(e));}};});};

/* ============ after-render bindings ============ */
const _render=render;
render=function(){_render();
 if(TAB==='home'){tickClock();paintNoteStrip();}
 if(TAB==='cust')bindCustSearch();if(TAB==='set')bindSettings();if(TAB==='loy'&&loyView==='rules')bindLoyalty();};
window.render=render;

/* ============ boot ============ */
(async()=>{
 let cfg=null;
 const forced=localStorage.getItem(FORCEKEY)==='1';
 let raw=localStorage.getItem(CFGKEY)||localStorage.getItem(CFGKEY_OLD);
 if(raw){try{cfg=JSON.parse(raw);}catch(e){cfg=null;}}
 if(!cfg&&!forced)cfg=BUILTIN_CFG;      // the normal path: nothing to set up
 if(!cfg){setupScreen();return;}
 try{
  app=initializeApp(cfg);auth=getAuth(app);
  /* the staff app keeps a copy of its records on the device, so a dropped line does not
     stop the counter; the client's feedback page has nothing to keep, so it stays plain */
  const pub=new URLSearchParams(location.search).has('fb');
  if(pub)db=getFirestore(app);
  else{
   try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
    OFFLINE_DB=true;}
   catch(e){console.warn('offline cache unavailable',e);db=getFirestore(app);}
  }
 }
 catch(e){setupScreen('Could not start Firebase: '+e.message);return;}
 pwaInit();
 /* a client opening their feedback link sees only the rating page, never the login */
 const fbq=new URLSearchParams(location.search).get('fb');
 if(fbq){feedbackPage(fbq.replace(/[^a-z0-9]/gi,'').slice(0,40));return;}
 onAuthStateChanged(auth,async user=>{
  if(!user){ME=null;UID=null;unsub.forEach(u=>{try{u();}catch(e){}});unsub=[];APPTSUB=null;
   EVENTS=[];EVIDS=new Set();loginScreen();return;}
  UID=user.uid;
  $('#root').innerHTML='<div class="center"><div class="spin"></div></div>';
  try{
   const p=await getDoc(doc(db,'users',UID));
   if(!p.exists()){noProfileScreen();return;}
   ME={id:UID,...p.data()};
   noteBranchDevice();bindIdleGuard();
   pwaShortcut();
   if(ME.active===false){await signOut(auth);loginScreen('This account has been deactivated.');return;}
   await loadStatic();
   try{document.title=((D.meta.biz||{}).name||'Spatify')+' · Spatify';}catch(e){}
   if(!D.branches.length)D.branches=[{id:ME.branchId||'b1',name:'Main branch',code:'MAIN'}];
   if(!D.staff.find(s=>s.id===UID))D.staff.push({...ME});
   render();
   bindNavAutoHide();
   startClock();
   loadSeen();
   watchAppointments();
   watchEvents();
   watchReviews();
   await Promise.all([loadCustomers(''),loadRecentSales(),loadHeld(),loadNotes(),loadAttendance(),loadShift(),loadLoyalty(),loadPrograms(),loadOutstanding(),loadLibrary(),loadFeedback()]);
   render();
   if(TAB==='rep')buildReport();
  }catch(e){
   console.error(e);
   $('#root').innerHTML='<div class="center"><div class="card"><h2>Could not load your data</h2>'+
    '<p class="tiny dim">'+esc(friendly(e))+'</p>'+
    '<p class="tiny muted">This is usually the Firestore security rules. Publish the rules file in '+
    'Firebase console → Firestore Database → Rules, then reload.</p>'+
    '<button class="btn" onclick="location.reload()">Reload</button>'+
    '<button class="btn ghost sm" style="margin-top:8px" onclick="firebaseSignOut()">Sign out</button></div></div>';
  }
 });
 window.firebaseSignOut=()=>signOut(auth);
})();
window.go=(t)=>{if(t==='lib'){LIBOPEN='';LIBCTX={};}TAB=t;navOpen=false;window.closeModal();render();window.scrollTo(0,0);
 if(t==='rep'&&!REPSALES)buildReport();};
/* More grows the bar itself upward; it is never rebuilt to open or close, only its
   classes change, so the drawer can animate both ways */
function paintNavState(){
 const nav=document.getElementById('botnav'),v=document.getElementById('trayveil'),
  more=document.getElementById('bnmore'),panel=document.getElementById('bnpanel');
 if(!nav)return;
 if(panel){
  if(navOpen){const sc=panel.querySelector('.bnscroll');if(sc)sc.scrollTop=0;}
  panel.setAttribute('aria-hidden',navOpen?'false':'true');panel.inert=!navOpen;}
 nav.classList.toggle('open',navOpen);
 if(v)v.className='navveil'+(navOpen?' on':'');
 if(more){
  more.classList.toggle('open',navOpen);
  more.classList.toggle('on',navOpen||more.dataset.here!=='1');
  more.setAttribute('aria-expanded',navOpen?'true':'false');}
 if(!navOpen)setTimeout(()=>{if(!navOpen)window.paintBotNav();},450);
}
window.toggleNav=()=>{if(!document.getElementById('botnav')){navOpen=!navOpen;render();return;}
 navOpen=!navOpen;paintNavState();};
window.hideNav=()=>{if(navOpen){navOpen=false;paintNavState();}};
let navBound=false;
function bindNavAutoHide(){
 if(navBound)return;navBound=true;
 /* the counters on the bottom bar keep up even while another screen is open */
 setInterval(()=>{if(!document.hidden)window.paintBotNav();},15000);
 /* the menu is an overlay, so it gets out of the way the moment attention moves */
 window.addEventListener('scroll',()=>window.hideNav(),{passive:true});
 window.addEventListener('resize',()=>window.hideNav());
 window.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if($('#modal').innerHTML)window.closeModal();
  else if(document.getElementById('reportwrap').innerHTML)window.closeReport();
  else window.hideNav();});
}
</script>
