window.clockPrompt=(sid,dir)=>{
 const s=stf(sid);
 if(!s.attCode){toast('No attendance code set for '+s.name+' yet');
  if(boss())window.editStaff(sid);return;}
 modal((dir==='in'?'Clock in':'Clock out')+' · '+s.name,'<div class="card">'+
  '<div class="chead"><div class="avatar">'+esc(initials(s.name))+'</div><div>'+
  '<h3>'+esc(s.name)+'</h3><div class="tiny muted">'+dstr(new Date())+' · '+tstr(new Date())+'</div></div></div>'+
  '<label>Enter your personal code</label>'+
  '<input class="f" id="ck-p" type="password" inputmode="numeric" autocomplete="off" '+
   'style="font-size:22px;letter-spacing:.35em;text-align:center">'+
  '<div id="ck-err" class="tiny" style="color:var(--rose);margin-bottom:8px"></div>'+
  '<button class="btn" style="width:100%;justify-content:center" id="ck-go">'+
   ic(dir==='in'?'login':'out',16)+(dir==='in'?'Confirm clock in':'Confirm clock out')+'</button>'+
  '<p class="tiny muted" style="margin-top:9px">Only this person should enter this code. '+
  'Every entry is written to the audit trail with the time and who was signed in.</p></div>',
 ()=>{
  const go=async()=>{
   const code=($('#ck-p').value||'').trim();
   if(!code){$('#ck-err').textContent='Enter your code.';return;}
   $('#ck-go').disabled=true;
   const h=await hashCode(code,s.attSalt||'');
   if(h!==s.attCode){$('#ck-err').textContent='That code does not match.';
    $('#ck-p').value='';$('#ck-go').disabled=false;return;}
   try{
    if(dir==='in'){
     await addDoc(collection(db,'attendance'),{staffId:sid,staffName:s.name,branchId:ME.branchId,
      date:today(),clockIn:new Date().toISOString(),clockOut:'',verified:true,
      recordedBy:UID,recordedByName:ME.name});
    }else{
     const a=attToday(sid);
     await updateDoc(doc(db,'attendance',a.id),{clockOut:new Date().toISOString(),
      closedBy:UID,closedByName:ME.name});
    }
    await loadAttendance();
    logEvent('attendance',s.name+(dir==='in'?' clocked in':' clocked out'),tstr(new Date())+' · '+branch().name,
     {refType:'attendance',refId:sid});
    await audit(dir==='in'?'Clock in':'Clock out',s.name+' at '+tstr(new Date()));
    window.closeModal();render();toast(s.name+(dir==='in'?' clocked in':' clocked out'));
   }catch(e){$('#ck-err').textContent=friendly(e);$('#ck-go').disabled=false;}
  };
  $('#ck-go').onclick=go;
  $('#ck-p').onkeydown=e=>{if(e.key==='Enter')go();};});};
window.fixAtt=id=>{
 const a=ATT.find(x=>x.id===id);if(!a)return;
 const t=iso=>iso?new Date(iso).toTimeString().slice(0,5):'';
 modal('Adjust attendance · '+esc(a.staffName||''),'<div class="card">'+
  '<div class="grid g2"><div><label>Clock in</label><input class="f" type="time" id="fa-i" value="'+
   t(a.clockIn)+'"></div><div><label>Clock out</label><input class="f" type="time" id="fa-o" value="'+
   t(a.clockOut)+'"></div></div>'+
  '<label>Reason for the change *</label><input class="f" id="fa-r" placeholder="Forgot to clock out">'+
  '<button class="btn" style="width:100%;justify-content:center" id="fa-go">'+ic('check',16)+
  'Save adjustment</button>'+
  '<p class="tiny muted" style="margin-top:9px">Adjustments are recorded separately from the original '+
  'clock times, so payroll can always see what was changed and why.</p></div>',
 ()=>{$('#fa-go').onclick=async()=>{
  const why=$('#fa-r').value.trim();
  if(why.length<3){toast('Please give a reason');return;}
  const mk=v=>v?new Date(a.date+'T'+v+':00').toISOString():'';
  try{await updateDoc(doc(db,'attendance',id),{clockIn:mk($('#fa-i').value),clockOut:mk($('#fa-o').value),
    adjusted:true,adjustReason:why,adjustedBy:UID,adjustedByName:ME.name,
    adjustedAt:new Date().toISOString()});
   await loadAttendance();await audit('Attendance adjusted',(a.staffName||'')+' — '+why);
   window.closeModal();render();toast('Adjusted and logged');}
  catch(e){toast(friendly(e));}};});};
function teamSheet(){
 const days=30,from=ymd(addDays(new Date(),-days));
 const rows=D.staff.filter(s=>s.branchId===ME.branchId).map(s=>{
  const mine=ATT.filter(a=>a.staffId===s.id&&a.date>=from);
  const mins=mine.reduce((t,a)=>t+(a.clockIn&&a.clockOut?
   Math.round((new Date(a.clockOut)-new Date(a.clockIn))/6e4):0),0);
  const open=mine.filter(a=>a.clockIn&&!a.clockOut).length;
  return{s,days:mine.length,mins,open,adj:mine.filter(a=>a.adjusted).length};});
 return '<div class="sec-h"><h2>Last '+days+' days</h2>'+
  '<button class="btn sm ghost" onclick="csvAttendance()">'+ic('download',14)+'CSV</button></div>'+
  '<div class="scroll"><table><tr><th>Team member</th><th class="num">Days</th><th class="num">Hours</th>'+
  '<th class="num">Flags</th></tr>'+
  rows.map(r=>'<tr><td><b>'+esc(r.s.name)+'</b><div class="tiny muted">'+(ROLE[r.s.role]||r.s.role)+
   '</div></td><td class="num">'+r.days+'</td><td class="num">'+(r.mins/60).toFixed(1)+'</td>'+
   '<td class="num tiny">'+(r.open?'<span class="pill a">'+r.open+' open</span> ':'')+
   (r.adj?'<span class="pill">'+r.adj+' adjusted</span>':'')+(!r.open&&!r.adj?'—':'')+
   '</td></tr>').join('')+'</table></div>'+
  '<p class="tiny muted" style="margin-top:9px">“Open” means someone clocked in and never clocked out. '+
  'Fix those under Today before running payroll.</p>';}
window.csvAttendance=()=>{
 const rows=[['Date','Staff','Branch','Clock in','Clock out','Minutes','Adjusted','Reason','Recorded by']];
 ATT.forEach(a=>rows.push([a.date,a.staffName||'',(D.branches.find(b=>b.id===a.branchId)||{}).code||'',
  a.clockIn?tstr(a.clockIn):'',a.clockOut?tstr(a.clockOut):'',
  a.clockIn&&a.clockOut?Math.round((new Date(a.clockOut)-new Date(a.clockIn))/6e4):'',
  a.adjusted?'Yes':'No',a.adjustReason||'',a.recordedByName||'']));
 const txt=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 const el=document.createElement('a');
 el.href='data:text/csv;charset=utf-8,'+encodeURIComponent('\ufeff'+txt);
 el.download='attendance-'+today()+'.csv';el.click();toast('CSV downloaded');};

function dailyReportBody(d,shift){
 const b=D.meta.biz||{};
 const L=bizLines(b,branch().name);
 const f=dayFiguresFor(d);
 const att=ATT.filter(a=>a.date===d&&a.branchId===ME.branchId);
 const exp=(shift&&shift.expenses)||[];
 const iss=(shift&&shift.issues)||[];
 const pts=LOYLEDGER.filter(l=>l.date===d);
 const earned=pts.filter(l=>l.points>0).reduce((a,l)=>a+l.points,0);
 const spent=pts.filter(l=>l.points<0).reduce((a,l)=>a-l.points,0);
 const expTot=exp.reduce((a,e)=>a+(e.amount||0),0);
 const expect=((shift&&shift.openingFloat)||0)+f.cash-expTot;
 const counted=shift&&shift.closedAt?(shift.countedCash||0):null;

 /* per-therapist performance for the day */
 const perf={};
 f.sales.forEach(s=>(s.items||[]).forEach(i=>{
  const who=i.staffId||s.staffId;const u=stf(who);if(!u.id)return;
  perf[who]=perf[who]||{name:u.name,svc:0,prod:0,pkg:0,total:0};
  const line=lineAmt(i);
  if(i.kind==='service')perf[who].svc+=line;
  else if(retailKind(i.kind))perf[who].prod+=line;
  else if(i.kind==='package')perf[who].pkg+=line;
  perf[who].total+=line;}));
 Object.values(handsOnTotals(f.sales)).forEach(o=>{
  perf[o.id]=perf[o.id]||{name:o.name,svc:0,prod:0,pkg:0,total:0};
  perf[o.id].ho=o.comm;perf[o.id].hs=o.sessions;});
 f.appts.filter(a=>a.status==='done').forEach(a=>{
  const u=stf(a.staffId);if(!u.id)return;
  perf[a.staffId]=perf[a.staffId]||{name:u.name,svc:0,prod:0,pkg:0,total:0};
  perf[a.staffId].done=(perf[a.staffId].done||0)+1;});

 const treat={};
 f.sales.forEach(s=>(s.items||[]).forEach(i=>{if(i.kind!=='service')return;
  treat[i.name]=treat[i.name]||{n:0,v:0};treat[i.name].n+=i.qty;treat[i.name].v+=lineAmt(i);}));

 const sec=(n,title,body,extra)=>'<section class="rsec"><h2><span class="rnum">'+n+'</span>'+title+
  (extra?'<span class="rextra">'+extra+'</span>':'')+'</h2>'+body+'</section>';

 return ''+
 /* letterhead */
 '<header class="rhd">'+
  '<div class="rhd-l">'+(b.logo?'<img src="'+b.logo+'" alt="">':'')+
   '<div><div class="rbiz">'+esc(b.name||'')+'</div>'+
   (L.addr?'<div class="rsm">'+esc(L.addr)+'</div>':'')+
   (L.contact?'<div class="rsm">'+esc(L.contact)+'</div>':'')+
   (L.reg?'<div class="rsm">'+esc(L.reg)+'</div>':'')+'</div></div>'+
  '<div class="rhd-r"><div class="rtitle">Daily Summary</div>'+
   '<div class="rsm">'+esc(branch().name)+'</div>'+

 '</header>'+
 '<div class="rrule"></div>'+

 /* headline numbers */
 '<div class="rkpis">'+
  '<div><span>Takings</span><b>'+money(f.revenue)+'</b></div>'+
  '<div><span>Bills</span><b>'+f.bills+'</b></div>'+
  '<div><span>Average bill</span><b>'+money(f.bills?f.revenue/f.bills:0)+'</b></div>'+
  '<div><span>Showed up</span><b>'+f.showed+' / '+f.booked+'</b></div>'+
  '<div><span>No-shows</span><b>'+f.noShow+'</b></div>'+
 '</div>'+

 sec(1,'Trading summary',
  '<table class="rt"><tr><th>Line</th><th class="n">Amount</th><th class="n">Share</th></tr>'+
  ['service','product','package'].map(k=>{
   const v=f.items[k];
   return '<tr><td>'+({service:'Treatments',product:'Retail products',package:'Packages sold'}[k])+

  '<tr class="rtot2"><td>Total takings</td><td class="n">'+money(f.revenue)+'</td><td class="n">100%</td></tr>'+
  (f.voided.length?'<tr><td colspan="3" class="rwarn">'+f.voided.length+

 sec(2,'Payments received',

  '<tr class="rtot2"><td>Collected today</td><td class="n">'+money(f.collected)+'</td><td class="n">100%</td></tr>'+

  (f.deposits?'<tr><td>Deposits held on bookings</td><td class="n">'+money(f.deposits)+
   '</td><td class="n">—</td></tr>':'')+
  '</table>')+

 sec(3,'Cash reconciliation',
  shift?'<table class="rt">'+
   '<tr><td>Day opened by</td><td class="n">'+esc(shift.openedByName||'—')+' · '+tstr(shift.openedAt)+'</td></tr>'+
   (shift.closedAt?'<tr><td>Day closed by</td><td class="n">'+esc(shift.closedByName||'—')+' · '+tstr(shift.closedAt)+'</td></tr>':'')+

   '<tr class="rtot2"><td>Expected in drawer</td><td class="n">'+money(expect)+'</td></tr>'+
   (counted!==null?'<tr><td>Counted at close</td><td class="n">'+money(counted)+'</td></tr>'+

/* ============ the matching engine ============ */
/* ---- scheduling: one treatment per visit day ---- */
/* Every session gets its own date. The client also gets rest days between visits,
   and a full week after anything tagged high intensity (peels, HIFU), because
   stacking treatments on healing skin is where complaints come from. */
const WEEKDAYS=[['1','Mon'],['2','Tue'],['3','Wed'],['4','Thu'],['5','Fri'],['6','Sat'],['0','Sun']];
const recoveryDays=(intensity,rest)=>intensity==='high'?Math.max(rest,7):rest;
function scheduleVisits(plan,p){
 const rest=Math.max(1,+p.restDays||3);
 const allowed=(p.days&&p.days.length?p.days:[0,1,2,3,4,5,6]).map(Number);
 const okDay=new Set(allowed);
 const s0=new Date((p.start||today())+'T00:00:00');
 const dayAt=d=>addDays(s0,d);
 /* every session starts from its ideal day: the treatment's own interval */
 const want=[];
 plan.forEach((l,li)=>{for(let i=0;i<l.sessions;i++)want.push({l,li,i,ideal:i*l.interval});});
 want.sort((a,b)=>a.ideal-b.ideal||(a.l.tier==='core'?0:1)-(b.l.tier==='core'?0:1)||a.li-b.li);
 const taken=[],lastOf={},visits=[];
 let moved=0;
 for(const w of want){
  const rec=recoveryDays(w.l.intensity,rest);
  const earliest=Math.max(w.ideal,lastOf[w.li]!==undefined?lastOf[w.li]+w.l.interval:0);
  let d=earliest;
  for(let guard=0;guard<1000;guard++,d++){
   if(!okDay.has(dayAt(d).getDay()))continue;
   /* respect the recovery of whatever came before, and give this one room before the next */
   const clash=taken.some(t=>(t.day<=d&&d-t.day<t.rec)||(t.day>d&&t.day-d<rec));
   if(!clash)break;
  }
  if(d>earliest)moved++;
  taken.push({day:d,rec});lastOf[w.li]=d;
  visits.push({day:d,at:dayAt(d),id:w.l.id,name:w.l.name,tier:w.l.tier,
   intensity:w.l.intensity,n:w.i+1,of:w.l.sessions});
 }
 visits.sort((a,b)=>a.day-b.day);
 return{visits,moved,rest};
}
function buildProgram(p){
 const weeks=p.weeks||12;
 const scored=[],blocked=[];
 D.services.filter(s=>s.active!==false).forEach(s=>{
  const hit=(s.concerns||[]).filter(c=>p.concerns.includes(c));
  if(!hit.length)return;
  const clash=(s.avoid||[]).filter(f=>p.flags.includes(f));
  if(clash.length){blocked.push({s,clash});return;}
  let score=hit.length*4;
  if((s.skins||[]).length)score+=(s.skins||[]).includes(p.skin)?3:-2;
  if(p.sensitive&&s.intensity==='high')score-=3;
  if(p.minutes&&s.dur>p.minutes)score-=4;
  scored.push({s,hit,score});
 });
 scored.sort((a,b)=>b.score-a.score||a.s.price-b.s.price);

 /* one core treatment per concern, then up to two supporting ones */
 const core=[];
 p.concerns.forEach(c=>{
  const pick=scored.find(x=>x.hit.includes(c)&&!core.some(y=>y.s.id===x.s.id));
  if(pick)core.push(pick);
 });
 const support=scored.filter(x=>!core.some(y=>y.s.id===x.s.id)).slice(0,2);

 const plan=[];
 const addLine=(x,tier)=>{
  const interval=x.s.intervalDays||14;
  /* the first session is on day zero, so a 24-week window at 90-day spacing
     fits two sessions (day 0 and day 90), not one */
  const days=weeks*7;
  const capacity=Math.max(1,Math.floor((days-1)/interval)+1);
  const wanted=x.s.courseSessions||4;
  const n=Math.max(1,Math.min(wanted,capacity));
  plan.push({id:x.s.id,name:x.s.name,tier,sessions:n,interval,price:x.s.price,
   dur:x.s.dur,subtotal:n*x.s.price,treats:x.hit,score:x.score,intensity:x.s.intensity||'medium'});
 };
 core.forEach(x=>addLine(x,'core'));
 support.forEach(x=>addLine(x,'support'));

 /* trim to budget: shave sessions first, drop the weakest line only as a last resort */
 const total=()=>plan.reduce((a,l)=>a+l.subtotal,0);
 const trimmed=[];
 if(p.budget>0){
  let guard=0;
  while(total()>p.budget&&guard++<80){
   const cand=plan.filter(l=>l.sessions>1).sort((a,b)=>a.score-b.score)[0];
   if(cand){cand.sessions--;cand.subtotal=cand.sessions*cand.price;continue;}
   if(plan.length<=1)break;
   const drop=plan.filter(l=>l.tier==='support').sort((a,b)=>a.score-b.score)[0]
     ||plan.slice().sort((a,b)=>a.score-b.score)[0];
   trimmed.push(drop.name);plan.splice(plan.indexOf(drop),1);
  }
 }

 const home=D.products.filter(x=>x.type==='retail'&&x.active!==false)
  .map(x=>({x,hit:(x.concerns||[]).filter(c=>p.concerns.includes(c))}))
  .filter(o=>o.hit.length)
  .sort((a,b)=>b.hit.length-a.hit.length)
  .slice(0,4)
  .map(o=>({sku:o.x.id,name:o.x.name,price:o.x.price,step:o.x.step||'',treats:o.hit}));

 const S=scheduleVisits(plan,p);
 const visits=S.visits;
 const lastDay=visits.length?visits[visits.length-1].day:0;
 const weeksActual=Math.max(weeks,Math.ceil((lastDay+1)/7));
 const late=visits.filter(v=>v.day>=weeks*7).length;

 const sub=total();
 const homeTotal=home.reduce((a,h)=>a+h.price,0);
 const bundle=Math.round(sub*(1-(p.bundleOff||0)/100));
 const sessions=plan.reduce((a,l)=>a+l.sessions,0);
 const warn=[];
 if(p.flags.includes('pregnant'))warn.push('Client is pregnant or breastfeeding. '+
  'Machine-based and chemical treatments need the doctor to clear them first.');
 if(p.flags.includes('accutane'))warn.push('Recent oral acne medication. Resurfacing and peels '+
  'are normally deferred — confirm with the doctor before booking.');
 if(p.sensitive)warn.push('Sensitivity noted. Start at the lowest setting and patch test first.');
 if(!plan.length)warn.push('Nothing in the catalogue is tagged for these concerns yet.');
 if(late)warn.push(late+' session'+(late>1?'s':'')+' land after week '+weeks+
  ' once each visit has its own day. The full course runs '+weeksActual+' weeks — extend the '+
  'programme length, or allow fewer rest days between visits.');

 return{plan,home,visits,blocked,trimmed,sub,homeTotal,bundle,sessions,weeks,weeksActual,late,
  moved:S.moved,rest:S.rest,warn,params:p};
}

const LOY_DEFAULT={on:false,earnPer:10,pointsPer:1,ringgitPerPoint:0.10,minRedeem:50,
 expireMonths:12,tiers:[{name:'Member',at:0},{name:'Silver',at:1000},{name:'Gold',at:3000},
 {name:'Platinum',at:8000}]};
const loy=()=>({...LOY_DEFAULT,...(D.meta.loyalty||{})});
const tierOf=pts=>{const t=loy().tiers.slice().sort((a,b)=>b.at-a.at).find(x=>pts>=x.at);
 return t?t.name:'Member';};
const nextTier=pts=>{const up=loy().tiers.slice().sort((a,b)=>a.at-b.at).find(x=>pts<x.at);
 return up?{name:up.name,need:up.at-pts}:null;};
const pointsFor=amount=>{const L=loy();
 return L.on?Math.floor((amount||0)/(L.earnPer||10))*(L.pointsPer||1):0;};
const pointsWorth=p=>(p||0)*(loy().ringgitPerPoint||0);
let LOYLIST=[],LOYLEDGER=[],loyView='members';
window.setLoyView=v=>{loyView=v;render();};
async function loadLoyalty(){
 try{const s=await getDocs(query(collection(db,'customers'),orderBy('points','desc'),limit(50)));
  LOYLIST=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.active!==false&&(c.points||0)>0);}
 catch(e){LOYLIST=[];}
 try{const s=await getDocs(query(collection(db,'loyalty'),orderBy('at','desc'),limit(60)));
  LOYLEDGER=s.docs.map(d=>({id:d.id,...d.data()}));}catch(e){LOYLEDGER=[];}
}
async function awardPoints(customerId,customerName,amount,ref){
 const L=loy();if(!L.on||!customerId)return 0;
 const pts=pointsFor(amount);if(pts<=0)return 0;
 try{
  await updateDoc(doc(db,'customers',customerId),
   {points:increment(pts),pointsEarned:increment(pts),lastPointsAt:new Date().toISOString()});
  await addDoc(collection(db,'loyalty'),{customerId,customerName,kind:'earn',points:pts,
   amount,ref:ref||'',branchId:ME.branchId,staffId:UID,staffName:ME.name,
   at:new Date().toISOString(),date:today()});
  const c=cust(customerId);if(c)c.points=(c.points||0)+pts;
  return pts;
 }catch(e){console.warn('points',e);return 0;}
}
async function spendPoints(customerId,customerName,pts,ref){
 if(!(pts>0))return;
 await updateDoc(doc(db,'customers',customerId),
  {points:increment(-pts),pointsRedeemed:increment(pts)});
 await addDoc(collection(db,'loyalty'),{customerId,customerName,kind:'redeem',points:-pts,
  amount:pointsWorth(pts),ref:ref||'',branchId:ME.branchId,staffId:UID,staffName:ME.name,
  at:new Date().toISOString(),date:today()});
 const c=cust(customerId);if(c)c.points=Math.max(0,(c.points||0)-pts);
}

async function loadShift(d){
 try{const r=await getDoc(doc(db,'shifts',shiftId(d)));
  SHIFT=r.exists()?{id:r.id,...r.data()}:null;}catch(e){SHIFT=null;console.warn('shift',e);}
}
function dayFigures(d){
 d=d||today();
 const sales=SALES.filter(s=>s.date===d&&s.branchId===ME.branchId);
 const live=sales.filter(s=>!s.voided);
 /* money is counted on the day it was paid, so an instalment collected today on an
    older bill lands in today's drawer, and the unpaid part of today's bill does not */
 const byMethod={};let cash=0,collected=0,instalments=0;
 SALES.filter(s=>s.branchId===ME.branchId&&!s.voided).forEach(s=>(s.payments||[]).forEach(p=>{
  if((p.date||s.date)!==d)return;
  byMethod[p.method]=(byMethod[p.method]||0)+p.amount;
  collected+=p.amount;
  if(s.date!==d)instalments+=p.amount;
  if(isCashMethod(p.method))cash+=p.amount;}));
 const owedToday=live.reduce((a,s)=>a+saleBalance(s),0);
 const ap=APPTS.filter(a=>a.date===d);
 const cats={};ap.forEach(a=>{const k=(visitOf(a.visitType)||{}).label||'Unspecified';
  cats[k]=(cats[k]||0)+1;});
 const items={service:0,product:0,package:0};
 live.forEach(s=>(s.items||[]).forEach(i=>{const k=retailKind(i.kind)?'product':i.kind;if(items[k]!==undefined)items[k]+=lineAmt(i);}));
 return{sales:live,voided:sales.filter(s=>s.voided),revenue:live.reduce((a,s)=>a+s.total,0),
  bills:live.length,byMethod,cash,items,collected:r2(collected),instalments:r2(instalments),
  owedToday:r2(owedToday),
  booked:ap.length,showed:ap.filter(a=>a.status==='done').length,
  inTreatment:ap.filter(a=>a.status==='in').length,
  noShow:ap.filter(a=>a.status==='no').length,
  cancelled:ap.filter(a=>a.status==='cancel').length,
  cats,deposits:ap.reduce((a,x)=>a+(x.deposit||0),0)};
}
const expTotal=()=>((SHIFT&&SHIFT.expenses)||[]).reduce((a,e)=>a+(e.amount||0),0);

window.closeShift=()=>{
 const f=dayFigures();
 const expect=expectedCash(f);
 modal('Close the day','<div class="card">'+
  '<table><tr><td>Opening float</td><td class="num">'+rm(SHIFT.openingFloat||0)+'</td></tr>'+
  '<tr><td>Cash taken today</td><td class="num">'+rm(f.cash)+'</td></tr>'+
  '<tr><td>Paid out</td><td class="num">-'+rm(expTotal())+'</td></tr>'+
  '<tr><td><b>Should be in the drawer</b></td><td class="num"><b>'+rm(expect)+'</b></td></tr></table>'+
  '<label style="margin-top:12px">Cash actually counted (RM)</label>'+
  '<input class="f" type="number" step="0.01" id="cs-c" value="'+expect.toFixed(2)+
   '" style="font-size:22px;text-align:center" oninput="cshDiff('+expect+')">'+
  '<div id="cs-d" class="tiny" style="text-align:center;margin-bottom:11px"></div>'+
  '<label>Notes on the day</label><textarea class="f" id="cs-n" rows="3" '+
   'placeholder="Anything the owner should know tomorrow"></textarea>'+dayWhoHTML('cs','Closed by')+
  '<div id="cs-e" class="tiny" style="color:var(--rose);margin-bottom:8px"></div>'+
  '<button class="btn" style="width:100%;justify-content:center" id="cs-go">'+ic('check',16)+
  'Close the day</button>'+
  '<p class="tiny muted" style="margin-top:9px">Once closed the figures are locked for the day. '+
  'A difference is not an accusation — record it honestly so patterns can be spotted.</p></div>',
 ()=>{window.cshDiff(expect);window.dayWhoPaint('cs');
  $('#cs-go').onclick=async()=>{
   const counted=+$('#cs-c').value||0;let who;
   try{who=await dayWho('cs');}catch(err){$('#cs-e').textContent=err.message;return;}
   $('#cs-go').disabled=true;
   try{await updateDoc(doc(db,'shifts',shiftId()),{closedAt:new Date().toISOString(),
     closedBy:UID,closedById:who.id,closedByName:who.name,closedVerified:who.verified,closedOnAccount:ME.name,countedCash:counted,expectedCash:expect,
     variance:counted-expect,closeNote:$('#cs-n').value||'',
     revenue:f.revenue,bills:f.bills,cashTaken:f.cash,paidOut:expTotal(),
     showed:f.showed,booked:f.booked,noShow:f.noShow});
    await loadShift();
    logEvent('day','Day closed by '+who.name+' · '+rm(f.revenue)+' taken',f.bills+' bills · counted '+rm(counted)+
     ' · difference '+rm(counted-expect),{refType:'shift',urgent:Math.abs(counted-expect)>20});
    await audit('Day closed','By '+who.name+(who.verified?'':' (no code)')+' · counted '+rm(counted)+', difference '+rm(counted-expect));
    window.closeModal();render();toast('Day closed by '+who.name);}
   catch(e){$('#cs-e').textContent=friendly(e);$('#cs-go').disabled=false;}};});};
window.cshDiff=expect=>{
 const el=$('#cs-d');if(!el)return;
 const d=(+($('#cs-c')||{}).value||0)-expect;
 el.innerHTML=Math.abs(d)<0.01?'<span style="color:var(--jade)">'+ic('check',12)+' Balances exactly</span>'
  :'<span style="color:var(--rose)">'+(d>0?'Over by ':'Short by ')+rm(Math.abs(d))+'</span>';};

/* ============ checkout, redesigned ============ */
/* One screen, four steps: who is paying, what they are paying for, how they pay, done.
   Today's clients sit beside the bill so the counter picks one with a tap (or scans the
   QR on their form). Items are added from a menu grouped by category, each one flying
   into the bill. Any treatment line can carry add-ons from the catalogue, each with its
   own commission. Card and pay-later payments need the reference number from the
   terminal or app before the bill can be completed. */
ICONS.bag='M5 8.5h14l-1.2 11.5H6.2zM9 8.5V7a3 3 0 016 0v1.5';
ICONS.minus='M6 12h12';
ICONS.layers='M12 4l8 4-8 4-8-4zM4 12l8 4 8-4M4 16l8 4 8-4';

/* ---------------- add-ons, kept in the catalogue (meta/settings.addons) ---------------- */
const addons=()=>((D.meta&&Array.isArray(D.meta.addons))?D.meta.addons:[]);
const addonOf=id=>addons().find(a=>a.id===id)||null;
const addonFits=(a,line)=>a.active!==false&&(a.applies==='all'||['service','redeem'].includes(line.kind));
/* commission on an add-on line: a percentage of what was charged, or a fixed ringgit per unit */
function addonComm(a,line){
 if(!a)return 0;
 const amt=lineAmt(line);
 return r2(a.commType==='rm'?(+a.commVal||0)*(line.qty||1):amt*(+a.commVal||0)/100);
}
const commLabel=a=>a.commType==='rm'?rm(+a.commVal||0)+' each':(+a.commVal||0)+'%';

function posSteps(step){
 const S=[['user','Client'],['bag','Items'],['card','Payment'],['check','Complete']];

  return '<div class="posstep'+(n<step?' done':n===step?' on':'')+'"><span>'+(n<step?ic('check',13):n)+'</span><b>'+s[1]+'</b></div>';})
  .join('<i></i>')+'</div>';
}

function posRecent(){
 const td=APPTS.filter(a=>a.date===today()&&a.branchId===ME.branchId&&a.customerId&&!['cancel','no'].includes(a.status));
 const rank=a=>a.saleId?3:(['in','done'].includes(a.status)?0:1);
 td.sort((x,y)=>rank(x)-rank(y)||String(x.start).localeCompare(String(y.start)));
 const seen=new Set(),today_=[],recent=[];
 td.forEach(a=>{if(seen.has(a.customerId))return;seen.add(a.customerId);today_.push({cid:a.customerId,a});});
 SALES.filter(s=>s.branchId===ME.branchId&&s.customerId&&!s.voided).forEach(s=>{
  if(seen.has(s.customerId)||recent.length>=8)return;seen.add(s.customerId);recent.push({cid:s.customerId,s});});
 return {today:today_,recent};
}

  staffId:(g('ae-s')||{}).value||z.staffId,discNote:String((g('ae-n')||{}).value||'').trim(),commManual:AEC==='rm'};
 d.commRaw=String((g('ae-c')||{}).value||'').trim();
 d.commAmt=d.commManual?r2(+d.commRaw||0):addonComm(addonOf(z.id),d);

function aeProblem(z,d){
 const list=+((addonOf(z.id)||{}).price||0),changed=Math.abs(d.price-list)>0.004;
 if(!(d.price>=0))return 'Enter a price.';
 if(changed&&!canPrice())return 'Only a manager can change the price.';
 if(changed&&coRules().needNote&&!d.discNote)return 'Add a short reason for the price.';
 if(d.commManual&&!canComm())return 'Only a manager can change commission.';
 if(d.commManual&&d.commRaw==='')return 'Enter the commission in RM.';
 if(d.commManual&&d.commAmt>lineAmt(d)+0.004)return 'Commission cannot be more than the add-on itself ('+rm(lineAmt(d))+').';
 return '';
}

function flyToCart(from){

 if(!from||!to||!from.getBoundingClientRect||!document.body.animate)return;
 const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
 const d=document.createElement('div');d.className='flyer';
 const ico=from.querySelector('.pk2ico');d.innerHTML=ico?ico.innerHTML:'';
 const x0=a.left+a.width/2-20,y0=a.top+a.height/2-20,x1=b.left+Math.min(34,b.width/2)-20,y1=b.top+b.height/2-20;
 d.style.left=x0+'px';d.style.top=y0+'px';document.body.appendChild(d);
 const mx=(x1-x0)*0.5,my=Math.min(y1-y0,0)-120;
 const an=d.animate([
  {transform:'translate(0,0) scale(1)',opacity:1},
  {transform:'translate('+mx+'px,'+my+'px) scale(1.15)',opacity:1,offset:0.45},
  {transform:'translate('+(x1-x0)+'px,'+(y1-y0)+'px) scale(.35)',opacity:.2}],{duration:560,easing:'cubic-bezier(.3,.7,.4,1)'});
 an.onfinish=()=>{d.remove();popCart();};
 from.animate&&from.animate([{transform:'scale(1)'},{transform:'scale(.95)'},{transform:'scale(1)'}],{duration:260});
}

/* A package can be priced three ways. "Custom" is the old way: pick the sessions, type the
   price. "Buy X, free Y" is one treatment: the client pays for X sessions and gets X+Y.
   "Discount" is any mix of sessions at a percentage off what they would cost one by one.
   The price is worked out when the package is saved, so a bill always uses a fixed price. */

function pkgDeal(p){
 if(!p)return '';
 if(pkgType(p)==='bxgy')return 'Buy '+p.buy+' free '+p.free;
 if(pkgType(p)==='disc')return (+p.pct||0)+'% off';
 return '';

function pkdCalc(){
 const P=PKD;
 if(P.type==='bxgy'){
  const s=svc(P.serviceId);const unit=+s.price||0;
  const items=P.serviceId?[{serviceId:P.serviceId,n:P.buy+P.free}]:[];
  return {items,price:r2(unit*P.buy),worth:r2(unit*(P.buy+P.free)),unit};
 }
 const items=P.items.filter(i=>i.serviceId&&i.n>0);
 const worth=r2(items.reduce((a,i)=>a+(svc(i.serviceId).price||0)*i.n,0));
 if(P.type==='disc'){let price=worth*(1-(+P.pct||0)/100);price=P.round?Math.round(price):r2(price);return {items,price,worth};}
 return {items,price:r2(+P.price||0),worth};
}

/* ============ smart checkout: heads-up for upsell, cross-sell and promotions ============ */
/* Every time the bill changes, the checkout looks at what is on it, who the client is,
   what they have on their account, what sells together, and which promotions are running,
   and suggests what would help. New suggestions pop up in the corner so the cashier does
   not miss them; all of them stay listed on the bill. Nothing is added without a tap. */
let SMART={who:null,shown:new Set(),gone:new Set(),list:[],idx:0,timer:null};
let SMART_OFF=false;try{SMART_OFF=localStorage.getItem('luuna:smartOff')==='1';}catch(e){}
const promoWorth=v=>v.type==='pct'?(+v.value||0)+'% off':rm(+v.value||0)+' off';
/* what sells together: counted over the bills this tablet already holds */
function coBought(){
 const pairs={},seen={};
 SALES.filter(s=>!s.voided&&s.branchId===ME.branchId).forEach(s=>{
  const ids=[...new Set((s.items||[]).filter(i=>['service','product'].includes(i.kind)).map(i=>i.kind+':'+i.id))];
  ids.forEach(a=>{seen[a]=(seen[a]||0)+1;ids.forEach(b=>{if(a!==b){pairs[a]=pairs[a]||{};pairs[a][b]=(pairs[a][b]||0)+1;}});});
 });
 return {pairs,seen};
}
function addonRate(serviceName,addonName){
 let n=0,w=0;
 SALES.filter(s=>!s.voided).forEach(s=>{const hasS=(s.items||[]).some(i=>i.kind==='service'&&i.name===serviceName);
  if(!hasS)return;n++;if((s.items||[]).some(i=>i.kind==='addon'&&i.name===addonName&&i.parentName===serviceName))w++;});
 return {n,w};
}
function smartList(){
 const out=[];
 if(!cart.items.length)return out;
 const c=cust(cart.customerId);
 const t=cartTotals(),sub=t.sub;
 const inCart=(kind,id)=>cart.items.some(i=>i.kind===kind&&i.id===id);
 const first=c?c.name.split(' ')[0]:'The client';
 /* 1. they already own sessions of what they are about to pay for */
 if(c)cart.items.forEach((i,x)=>{
  if(i.kind!=='service'||i.later)return;
  const l=redeemLines(c.id).find(z=>z.serviceId===i.id&&z.left-redeemInCart(z.cpId,z.line)>0&&!z.expired);
  if(!l)return;
  out.push({key:'own:'+i.id,kind:'save',icon:'package',prio:100,
   title:first+' already has '+i.name+' in a package',
   body:(l.left-redeemInCart(l.cpId,l.line))+' session'+(l.left>1?'s':'')+' left in '+l.pkgName+'. Use one instead of charging '+rm(lineAmt(i))+'.',
   label:'Use a session',run:()=>{cart.items.splice(x,1);window.pickAdd('redeem',l.key);window.closeModal();}});
 });
 /* 2. vouchers and promotions */
 if(!cart.voucher){
  const mine=c?rvOf(c.id).filter(v=>rvState(v)==='ready'):[];
  mine.forEach(v=>{const p=voucherProblem(v,sub,cart.customerId);
   if(!p)out.push({key:'rv:'+v.id,kind:'save',icon:'gift',prio:90,title:first+' has a voucher: '+promoWorth(v),
    body:v.id+(v.expiry?' · until '+dshort(v.expiry):'')+'. It can be used on this bill.',label:'Apply voucher',run:()=>window.applyVoucherCode(v.id)});
   else if(+v.min>sub&&!v.serviceId)out.push({key:'rvgap:'+v.id,kind:'promo',icon:'gift',prio:85,
    title:'Add '+rm(r2(+v.min-sub))+' more to use '+first+'\'s voucher',

/* what could close a promotion gap: the nearest priced item that covers it */
function gapPick(gap){
 const pool=[...addons().filter(a=>a.active!==false&&cart.items.some(i=>addonFits(a,i))).map(a=>({kind:'addon',id:a.id,name:a.name,price:+a.price||0})),
  ...D.products.filter(p=>p.type==='retail'&&p.active!==false&&(stockOf(p.id)||{}).qty>0).map(p=>({kind:'product',id:p.id,name:p.name,price:+p.price||0}))];
 return pool.filter(x=>x.price>=gap).sort((a,b)=>a.price-b.price)[0]||pool.sort((a,b)=>b.price-a.price)[0]||null;
}
const gapIdea=gap=>{const x=gapPick(gap);if(!x)return '';
 return x.price>=gap?' e.g. '+x.name+' ('+rm(x.price)+').':' e.g. start with '+x.name+' ('+rm(x.price)+'), '+rm(r2(gap-x.price))+' still to go.';};
function gapAction(gap){
 const x=gapPick(gap);if(!x)return {label:'Browse products',run:()=>window.pickItem('product')};
 return {label:'Add '+x.name,run:()=>{
  if(x.kind==='addon'){const i=cart.items.findIndex(z=>addonFits(addonOf(x.id),z));if(i>=0)window.addonAdd(i,x.id);}
  else{window.pickAdd('product',x.id);window.closeModal();}}};
}

/* last visit per client over the past four months, for "not seen for a while" */
async function loadLapsed(){
 if(LASTV)return;
 try{const from=ymd(addDays(new Date(),-120));
  const s=await getDocs(query(collection(db,'sales'),where('date','>=',from),limit(1500)));
  const m={};s.docs.forEach(d=>{const x=d.data();if(x.voided||!x.customerId||x.branchId!==ME.branchId)return;
   if(!m[x.customerId]||x.date>m[x.customerId].date)m[x.customerId]={date:x.date,name:x.customerName||''};});
  LASTV=m;if(TAB==='crm'&&CRMV==='tasks')render();
 }catch(e){LASTV={};}
}
const taskState=k=>CRMTASKS.find(t=>t.id===k.replace(/[\/\s]/g,'_'));
function crmTasks(){
 const out=[],td=today(),biz=(D.meta.biz||{}).name||'';
 /* leads due */
 LEADS.filter(l=>myBranch(l)&&openLead(l)&&l.nextAt&&l.nextAt<=td&&(boss()||!l.assignedTo||l.assignedTo===UID)).forEach(l=>out.push({
  key:'lead:'+l.id+':'+l.nextAt,type:'lead',icon:'target',leadId:l.id,phone:l.phone,prio:l.nextAt<td?0:1,
  title:(l.stage==='new'?'Reply to new lead ':'Follow up ')+l.name,sub:(l.interest||l.source||'')+(l.nextAt<td?' · overdue since '+dshort(l.nextAt):' · due today'),
  msg:tplFill(l.stage==='new'?'lead':'leadfu',{name:l.name.split(' ')[0],service:l.interest||'rawatan kami'})}));
 /* after-treatment check: done 1–3 days ago */
 APPTS.filter(a=>a.status==='done'&&a.customerId&&a.branchId===ME.branchId&&a.date<td&&a.date>=ymd(addDays(new Date(),-3))).forEach(a=>{
  const c=cust(a.customerId)||{};out.push({key:'after:'+a.id,type:'after',icon:'spark',phone:c.phone,prio:2,customerId:a.customerId,
   title:'How is '+(a.customerName||'').split(' ')[0]+' after '+a.serviceName+'?',sub:'Treated '+dshort(a.date)+' by '+(a.staffName||''),
   msg:tplFill('after',{name:(a.customerName||'').split(' ')[0],service:a.serviceName||''})});});
 /* packages running out */
 HELD.filter(p=>!p.prepaid&&(p.balances||[]).some(b=>b.left>0)&&!pkgExpired(p)&&daysBetween(td,p.expiry)<=21&&(!p.branchId||p.branchId===ME.branchId)).forEach(p=>{
  const c=cust(p.customerId)||{},left=(p.balances||[]).reduce((a,b)=>a+b.left,0);
  out.push({key:'pkg:'+p.id+':'+p.expiry,type:'pkg',icon:'package',phone:c.phone,prio:3,customerId:p.customerId,
   title:(p.customerName||c.name||'')+': '+left+' session'+(left>1?'s':'')+' left in '+cpName(p),sub:'Expires '+dstr(p.expiry)+' · in '+daysBetween(td,p.expiry)+' days',
   msg:tplFill('pkg',{name:(p.customerName||c.name||'').split(' ')[0],pkg:cpName(p),left,expiry:dstr(p.expiry)})});});
 /* birthdays in the coming week */
 const wk=[...Array(8)].map((_,i)=>ymd(addDays(new Date(),i)).slice(5));
 CUSTS.filter(c=>c.active!==false&&c.dob&&wk.includes(c.dob.slice(5))&&myBranch(c)).forEach(c=>{

async function mktRevenue(){
 const since=ymd(addDays(new Date(),-MKTDAYS));
 const conv=LEADS.filter(l=>myBranch(l)&&l.customerId&&String(l.createdAt).slice(0,10)>=since);
 const key=MKTDAYS+':'+conv.map(l=>l.customerId).join(',');
 if(MKTREV[key])return;
 const ids=[...new Set(conv.map(l=>l.customerId))];const by={};
 try{
  for(let i=0;i<ids.length;i+=10){
   const s=await getDocs(query(collection(db,'sales'),where('customerId','in',ids.slice(i,i+10)),limit(500)));
   s.docs.forEach(d=>{const x=d.data();if(x.voided)return;(by[x.customerId]=by[x.customerId]||[]).push(x);});
  }
 }catch(e){console.warn('mkt revenue',e);}
 MKTREV[key]=by;if(TAB==='crm'&&CRMV==='mkt')render();
}
function mktRev(l){
 const since=ymd(addDays(new Date(),-MKTDAYS));
 const conv=LEADS.filter(x=>myBranch(x)&&x.customerId&&String(x.createdAt).slice(0,10)>=since);
 const by=MKTREV[MKTDAYS+':'+conv.map(x=>x.customerId).join(',')];
 if(!by)return null;
 return (by[l.customerId]||[]).filter(s=>String(s.at)>=String(l.convertedAt||l.createdAt)).reduce((a,s)=>a+(+s.total||0),0);
}

  return {n:xs.length,cont:xs.filter(l=>l.firstContactAt||!['new'].includes(l.stage)).length,booked:xs.filter(l=>['booked','won'].includes(l.stage)||l.customerId).length,

/* ================= owner: delete a client's package, with the reason kept ================= */
/* The package record is removed so it no longer shows as sessions owed, but a full copy of
   it, the reason and who removed it are kept in pkgDeleted (and the audit trail), so the
   owner can always see what was deleted and why. The bill that sold it is not touched. */
const isOwnerMe=()=>!!ME&&ME.role==='owner'&&ME.active!==false;
const PKGDEL_REASONS=['Sold by mistake','Wrong package chosen','Duplicate record','Refunded to the client','Client cancelled','Transferred to another client','Other'];
let PKGDEL=null;
async function loadPkgDeleted(force){
 if(!boss()||(PKGDEL&&!force))return;
 try{const s=await getDocs(query(collection(db,'pkgDeleted'),limit(300)));
  PKGDEL=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!x.branchId||x.branchId===ME.branchId)
   .sort((a,b)=>String(b.deletedAt).localeCompare(String(a.deletedAt)));}
 catch(e){PKGDEL=[];console.warn('deleted packages',e);}
 if(TAB==='pkg')render();
}
function pkgDeletedCard(){
 if(!boss())return '';
 if(PKGDEL===null){setTimeout(()=>loadPkgDeleted(),0);return '';}
 if(!PKGDEL.length)return '';
 return '<div class="card"><details class="pkdel"><summary><b>'+ic('trash',14)+' Deleted packages</b><span class="pill">'+PKGDEL.length+'</span></summary>'+
  PKGDEL.map(x=>'<div class="pkdelrow"><div class="spread"><b>'+esc(x.customerName||'')+' · '+esc(x.pkgName||'')+'</b><span class="tiny muted">'+rm(x.price||0)+'</span></div>'+

   '<div class="tiny"><span class="pill r">'+esc(x.reason||'')+'</span> '+esc(x.note||'')+'</div>'+
   '<div class="tiny muted">Deleted by '+esc(x.deletedByName||'')+' · '+dstr(x.deletedAt)+' '+tstr(x.deletedAt)+'</div></div>').join('')+

/* ================= Data refresh: this device, or every device at once ================= */
/* Tapping the refresh button reloads everything this screen shows straight from the
   database (catalogue, prices, team, clients, packages, bills, the day, CRM) and checks for
   a newer version of the app. The owner or a manager can also send a refresh to every
   device: each one listens to meta/sync and reloads when it changes, unless someone is in
   the middle of a bill, in which case it asks first so nothing on screen is lost. */
let LASTSYNC=Date.now(),SYNCING=false,SYNCSEEN=null,SYNCPEND=null;
async function dataRefresh(opt){
 opt=opt||{};
 if(SYNCING)return;
 SYNCING=true;syncPaint();
 try{
  if(!DEMO)try{const p=await getDoc(doc(db,'users',UID));if(p.exists())ME={id:UID,...p.data()};}catch(e){}
  await loadStatic();
  if(!D.staff.find(s=>s.id===UID))D.staff.push({...ME});
  LASTV=null;MKTREV={};PKGDEL=null;
  await Promise.all([loadCustomers(''),loadRecentSales(),loadHeld(),loadNotes(),loadAttendance(),loadShift(),loadLoyalty(),
   loadPrograms(),loadOutstanding(),loadLibrary(),loadFeedback(),loadCrm()].map(p=>Promise.resolve(p).catch(e=>console.warn('refresh',e))));
  try{watchAppointments();}catch(e){}
  try{if('serviceWorker' in navigator){const r=await navigator.serviceWorker.getRegistration();if(r)r.update();}}catch(e){}
  LASTSYNC=Date.now();SYNCPEND=null;
  const bar=document.getElementById('syncbar');if(bar)bar.remove();
  if(TAB==='rep'&&typeof buildReport==='function')try{buildReport();}catch(e){}
  render();
  toast(opt.by?'Data refreshed · sent by '+opt.by:(navigator.onLine===false?'Offline — showing the last saved data':'Data up to date · '+tstr(new Date())));
 }catch(e){toast('Could not refresh: '+friendly(e));}
 finally{SYNCING=false;syncPaint();}
}
function syncPaint(){
 const b=document.getElementById('syncbtn');if(b)b.classList.toggle('spin',SYNCING);
}
window.dataRefresh=o=>dataRefresh(o);
window.syncSheet=()=>{
 const mins=Math.round((Date.now()-LASTSYNC)/6e4);
 modal('Data refresh','<div class="card">'+
  '<div class="syncinfo">'+ic('refresh',16)+'<div><b>Last refreshed '+(mins<1?'just now':mins+' min ago')+'</b>'+
   '<small>'+(navigator.onLine===false?'This device is offline — changes will sync when it reconnects.':'Online · bookings, bills, packages, stock, the day, attendance, new clients and leads update live by themselves. This reloads everything else (prices, catalogue, team, settings).')+'</small></div></div>'+
  '<button class="btn" style="width:100%;justify-content:center;margin-top:12px" onclick="closeModal();dataRefresh()">'+ic('refresh',16)+'Refresh this device</button>'+
  (boss()&&!DEMO?'<button class="btn ghost" id="sy-all" style="width:100%;justify-content:center;margin-top:8px" onclick="syncAll()">'+ic('users',16)+'Refresh all devices</button>'+
   '<p class="tiny muted" style="margin:8px 0 0">Use after changing prices, packages, staff or settings. Every open device reloads within seconds; '+
   'a device in the middle of a bill is asked first so nothing is lost.</p>':'')+
  (DEMO?'<p class="tiny muted" style="margin:8px 0 0">Training mode: this refreshes the training copy only.</p>':'')+'</div>');
};

 if(!boss())return;
 const at=new Date().toISOString();SYNCSEEN=at;
 const btn=document.getElementById('sy-all');if(btn)btn.disabled=true;
 try{await setDoc(doc(db,'meta','sync'),{at,by:UID,byName:(typeof actorName==='function'?actorName():ME.name),branchId:ME.branchId});

/* ================= Live data: bills, packages, stock, the day, attendance, new clients ================= */
/* Like the calendar, these now follow the database as it changes: a bill paid at one
   counter shows in the other device's bill list and Day figures within a second or two,
   a session redeemed on one tablet lowers the balance on every other screen, and so on.
   The screen is redrawn only when nobody is in the middle of something — with a form or
   sheet open, or while typing, the update waits and is applied the moment it is closed. */
let LIVESUBS=[],LIVEPEND=false,LIVET=0,LIVEDAY='';
const liveTabs=new Set();
function liveBusy(){
 if(document.querySelector('#modal .sheet'))return true;
 const a=document.activeElement;
 return !!(a&&a.closest&&a.closest('#root')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function liveRender(tabs){
 (tabs||[]).forEach(t=>liveTabs.add(t));
 clearTimeout(LIVET);
 LIVET=setTimeout(()=>{
  const hit=liveTabs.has(TAB);liveTabs.clear();
  if(!hit){try{window.paintBotNav();}catch(e){}return;}
  if(liveBusy()){LIVEPEND=true;return;}
  LIVEPEND=false;render();
 },250);
}
function liveFlush(){if(LIVEPEND&&!liveBusy()){LIVEPEND=false;render();}}
const liveCloseBase=window.closeModal;
window.closeModal=(...a)=>{const r=liveCloseBase(...a);if(LIVEPEND)setTimeout(liveFlush,60);return r;};
document.addEventListener('focusout',()=>{if(LIVEPEND)setTimeout(liveFlush,400);});
const liveMerge=(arr,docs,keep)=>{
 const m=new Map(arr.map(x=>[x.id,x]));
 docs.forEach(d=>m.set(d.id,d));
 return [...m.values()].filter(x=>!keep||keep(x));
};
/* each listener only acts when what it watches really changed */
function liveKey(s){
 try{if(s&&s.docs)return JSON.stringify(s.docs.map(d=>[d.id,d.data()]));
  return JSON.stringify(s&&s.exists&&s.exists()?s.data():null);}catch(e){return String(Math.random());}
}
function liveOn(q,fn,label){
 let last=null;
 try{const u=onSnapshot(q,s=>{const k=liveKey(s);if(k===last)return;last=k;
   try{fn(s);}catch(e){console.warn('live '+label,e);}},e=>console.warn('live '+label,e));
  LIVESUBS.push(u);unsub.push(u);}
 catch(e){console.warn('live '+label,e);}
}
function watchLive(){
 LIVESUBS.forEach(u=>{try{u();}catch(e){}});LIVESUBS=[];
 LIVEDAY=today();
 const from=ymd(addDays(new Date(),-2));
 /* bills of the last few days, merged into what was loaded at start */
 liveOn(query(collection(db,'sales'),where('date','>=',from)),s=>{
  const fresh=s.docs.map(d=>({id:d.id,...d.data()}));
  const gone=new Set((s.docChanges?s.docChanges():[]).filter(c=>c.type==='removed').map(c=>c.doc.id));
  SALES=liveMerge(SALES,fresh,x=>!gone.has(x.id)).sort((a,b)=>String(b.at||b.date).localeCompare(String(a.at||a.date)));
  liveRender(['home','pos','shift']);
 },'sales');
 /* instalments paid today on older bills */
 liveOn(query(collection(db,'sales'),where('lastPaidDate','>=',from)),s=>{
  SALES=liveMerge(SALES,s.docs.map(d=>({id:d.id,...d.data()})));liveRender(['home','pos','shift']);
 },'instalments');
 /* clients' packages and their balances */
 liveOn(query(collection(db,'customerPackages'),limit(500)),s=>{
  HELD=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.expiry).localeCompare(String(b.expiry)));
  liveRender(['pkg','pos','home','cust']);
 },'packages');
 /* stock levels */
 liveOn(collection(db,'stock'),s=>{
  D.stock=s.docs.map(d=>({id:d.id,...d.data()}));liveRender(['inv','pos','home']);
 },'stock');
 /* today's shift: open, cash paid out, close */
 liveOn(doc(db,'shifts',shiftId()),s=>{
  let d=null;
  if(s&&typeof s.data==='function'&&!s.docs)d=s.exists()?{id:s.id,...s.data()}:null;
  else if(s&&s.docs){const x=s.docs.find(z=>z.id===shiftId());d=x?{id:x.id,...x.data()}:null;}
  SHIFT=d;liveRender(['shift','home','pos']);
 },'shift');
 /* who is clocked in today */
 liveOn(query(collection(db,'attendance'),where('date','==',today())),s=>{
  const td=today(),fresh=s.docs.map(d=>({id:d.id,...d.data()}));
  const ids=new Set(fresh.map(x=>x.id));
  ATT=[...fresh,...ATT.filter(a=>a.date!==td&&!ids.has(a.id))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  liveRender(['home','team','shift','pos']);
 },'attendance');
 /* newly registered or edited clients */
 liveOn(query(collection(db,'customers'),orderBy('createdAt','desc'),limit(30)),s=>{
  const fresh=s.docs.map(d=>({id:d.id,...d.data()}));
  const have=new Set(CUSTS.map(c=>c.id));
  const added=fresh.filter(c=>!have.has(c.id));
  CUSTS=CUSTS.map(c=>fresh.find(f=>f.id===c.id)||c);
  if(added.length)CUSTS=[...added,...CUSTS];
  liveRender(['cust','pos','home']);
 },'customers');
}

/* Phase 1 of HR inside the same app.
   - Staff files (IC, bank, KWSP/PERKESO, salary, contract) live in hrStaff and only the owner
     can read or write them; they are never loaded on other devices.
   - Leave is applied for by the staff member (or on the counter tablet with their attendance
     code), approved by the owner or a manager, and an approved leave blocks that therapist
     on the calendar.
   - Claims are submitted with a photo of the receipt and approved, then marked paid.
   - "My HR" shows each person their own attendance, commission this month, leave balance,
     leave and claims. Leave balances start from the Employment Act 1955 minimums by years of
     service unless the owner sets a different number. */
ICONS.leave='M4 20h16M6.5 20V9.5L12 5l5.5 4.5V20M9.5 20v-5h5v5';
ICONS.hr='M8.5 11a3.2 3.2 0 100-6.4 3.2 3.2 0 000 6.4zM3.5 19.5c.6-3.2 2.6-5 5-5s4.4 1.8 5 5M16 8.5h5M16 12h5M16 15.5h3';

function hrComm(sid,from,to){
 const mine=SALES.filter(s=>!s.voided&&s.branchId===ME.branchId&&s.date>=from&&s.date<=to);
 let c=0,sales=0;
 mine.forEach(s=>(s.items||[]).forEach(i=>{const who=i.staffId||s.staffId;if(who!==sid)return;
  const u=stf(who);if(!u.id)return;c+=lineComm(i,salesRate(i,u));sales+=lineAmt(i);}));
 const ho=(handsOnTotals(mine)||{})[sid]||Object.values(handsOnTotals(mine)||{}).find(o=>o.id===sid)||{};
 return {total:r2(c+(ho.comm||0)),sales:r2(sales),sessions:ho.sessions||0,sc:r2(c),ho:r2(ho.comm||0)};
}

/* receipts are shrunk on the phone before saving, so each one stays small */
window.claimPhoto=inp=>{
 const f=inp.files&&inp.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
  const k=Math.min(1,1100/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  CLRCPT=c.toDataURL('image/jpeg',.62);
  const pv=$('#cl-pv');if(pv)pv.innerHTML='<img src="'+CLRCPT+'" class="clthumb" alt="Receipt">';};img.src=r.result;};r.readAsDataURL(f);
};

function hrMonth(){
 const td=today(),m0=td.slice(0,8)+'01';
 const rows=hrPeople().map(s=>{
  const att=ATT.filter(a=>a.staffId===s.id&&a.date>=m0&&a.clockIn);
  const mins=att.reduce((t,a)=>t+(a.clockOut?(new Date(a.clockOut)-new Date(a.clockIn))/6e4:0),0);
  const lv=LEAVES.filter(l=>l.staffId===s.id&&l.status==='approved'&&l.to>=m0&&l.from<=td);
  const lvd=lv.reduce((t,l)=>{let n=0;for(let d=l.from;d<=l.to&&d<=td;d=ymd(addDays(d,1)))if(d>=m0)n++;return t+(l.half?Math.min(n,.5):n);},0);
  const unpaid=lv.filter(l=>l.type==='UL').reduce((t,l)=>t+lvDays(l),0);
  const c=hrComm(s.id,m0,td);
  const cl=(CLAIMS||[]).filter(x=>x.staffId===s.id&&['approved','paid'].includes(x.status)&&x.date>=m0).reduce((t,x)=>t+x.amount,0);
  return {s,days:att.length,mins,lvd,unpaid,c,cl};});
 return '<div class="card"><div class="sec-h"><h3 style="margin:0">'+ic('chart',15)+' '+new Date(td).toLocaleDateString('en-MY',{month:'long',year:'numeric'})+' so far</h3></div>'+

  rows.map(r=>'<tr><td>'+esc(r.s.name)+'</td><td class="num">'+r.days+'</td><td class="num">'+Math.floor(r.mins/60)+'h'+String(Math.round(r.mins%60)).padStart(2,'0')+'</td>'+
   '<td class="num">'+r.lvd+(r.unpaid?'<div class="tiny" style="color:var(--rose)">'+r.unpaid+' unpaid</div>':'')+'</td><td class="num">'+rm(r.c.sc)+'</td><td class="num">'+rm(r.c.ho)+'</td>'+

  await audit('Staff file updated',stf(sid).name||sid);
  window.closeModal();render();toast('Staff file saved');}
 catch(e){$('#hf-e').textContent=friendly(e);$('#hf-go').disabled=false;}
};

/* ---------------- home: what HR needs today ---------------- */
function hrAlerts(al){
 if(boss()){
  const pl=LEAVES.filter(l=>l.status==='pending'&&myBranch(l));
  if(pl.length)al.push({i:'leave',t:pl.length+' leave request'+(pl.length>1?'s':'')+' to approve',d:pl.slice(0,3).map(l=>(l.staffName||'').split(' ')[0]+' '+dshort(l.from)).join(', '),go:"hrGo('leave')"});
  const pc=(CLAIMS||[]).filter(c=>c.status==='pending'&&myBranch(c));
  if(pc.length)al.push({i:'receipt',t:pc.length+' claim'+(pc.length>1?'s':'')+' to approve',d:rm(pc.reduce((t,c)=>t+c.amount,0)),go:"hrGo('claims')"});
 }
 if(isOwnerMe()&&HRSTAFF){const soon=ymd(addDays(new Date(),30)),td=today();
  const ce=hrPeople().filter(s=>{const f=HRSTAFF[s.id]||{};return f.contractEnd&&f.contractEnd>=td&&f.contractEnd<=soon;});
  if(ce.length)al.push({i:'idcard',t:ce.length+' contract'+(ce.length>1?'s':'')+' ending within 30 days',d:ce.map(s=>s.name).join(', '),go:"hrGo('staff')"});}
 const off=hrPeople().filter(s=>onLeave(s.id,today()));
 if(off.length&&can('booking'))al.push({i:'leave',t:off.length+' on leave today',d:off.map(s=>s.name+' ('+onLeave(s.id,today()).type+')').join(', '),go:"go('book')"});
}
window.hrGo=v=>{HRV=v;window.go('hr');};

/* ---------------- the calendar respects approved leave ---------------- */
function leaveBlock(sid,start,finish){
 const l=onLeave(sid,ymd(new Date(start)));if(!l)return '';
 if(l.half==='AM'&&new Date(start).getHours()>=13)return '';
 if(l.half==='PM'&&new Date(finish).getHours()<13)return '';
 return (stf(sid).name||'')+' is on '+lvName(l.type).toLowerCase()+(l.half?' ('+(l.half==='AM'?'morning':'afternoon')+')':'')+' on '+dstr(ymd(new Date(start)))+'. Choose another therapist or day.';
}
function leaveNote(sid,date){
 const l=sid&&date?onLeave(sid,date):null;
 return l?'<span class="pill r">'+ic('leave',11)+esc(stf(sid).name||'')+' on leave'+(l.half?' ('+l.half+')':'')+'</span>':'';
}

</script>
