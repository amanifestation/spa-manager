const libText=e=>[e.title,e.sub,e.doc.title,e.doc.body,(e.doc.tags||[]).join(' '),
 ...Object.values(e.doc.sections||{})].join('\n');
const libUnread=d=>!!d&&!!d.mustRead&&(!LIBREADS[d.id]||(LIBREADS[d.id].version||0)<(d.version||1));
const libUnreadCount=()=>LIB.filter(libUnread).length;

/* ---------- a small, safe text format: ## heading, - bullet, 1. numbered, **bold** ---------- */
function libInline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
function libMd(t){
 const lines=String(t||'').replace(/\r/g,'').split('\n');
 let h='',list='';
 const close=()=>{if(list){h+='</'+list+'>';list='';}};
 for(const raw of lines){
  const l=raw.trim();
  if(!l){close();continue;}
  let m;
  if((m=l.match(/^#{1,3}\s+(.*)/))){close();h+='<h4>'+libInline(m[1])+'</h4>';}
  else if((m=l.match(/^[-•*]\s+(.*)/))){if(list!=='ul'){close();h+='<ul>';list='ul';}h+='<li>'+libInline(m[1])+'</li>';}
  else if((m=l.match(/^\d+[.)]\s+(.*)/))){if(list!=='ol'){close();h+='<ol>';list='ol';}h+='<li>'+libInline(m[1])+'</li>';}
  else{close();h+='<p>'+libInline(l)+'</p>';}
 }
 close();return h;
}
const libLines=t=>String(t||'').split('\n').map(l=>l.trim().replace(/^([-•*]|\d+[.)])\s+/,'')).filter(Boolean);
function libSteps(t){
 const L=libLines(t);
 return '<ol class="libsteps">'+L.map(l=>'<li>'+libInline(l)+'</li>').join('')+'</ol>';
}
function libQA(t){
 const out=[];let cur=null;
 String(t||'').split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
  const q=l.match(/^(Q|S)\s*[:.]\s*(.*)/i),a=l.match(/^(A|J)\s*[:.]\s*(.*)/i);
  if(q){cur={q:q[2],a:''};out.push(cur);}
  else if(a&&cur)cur.a+=(cur.a?' ':'')+a[2];
  else if(cur)cur.a+=(cur.a?' ':'')+l;
  else out.push({q:l,a:''});});
 return out.map(x=>'<details class="libqa"><summary>'+libInline(x.q)+'</summary>'+
  (x.a?'<div>'+libInline(x.a)+'</div>':'')+'</details>').join('');
}
function libSection(key,label,icon,text){
 if(!String(text||'').trim())return '';
 let body;
 if(key==='steps'||key==='howto')body=libSteps(text);
 else if(key==='faq'||key==='objections')body=libQA(text);
 else if(key==='aftercareMsg')body='<div class="libmsg">'+esc(text).replace(/\n/g,'<br>')+'</div>';
 else body=libMd(text);
 return '<section class="libsec'+(key==='contra'||key==='caution'?' warn':'')+'" id="ls-'+key+'">'+
  '<h3>'+ic(icon,15)+' '+esc(label)+'</h3>'+body+'</section>';
}

function libSnippet(text,q){
 const t=String(text).replace(/\s+/g,' '),i=t.toLowerCase().indexOf(q);
 if(i<0)return '';
 const a=Math.max(0,i-40),s=t.slice(a,i+q.length+60);
 const j=s.toLowerCase().indexOf(q);
 return (a?'…':'')+esc(s.slice(0,j))+'<mark>'+esc(s.slice(j,j+q.length))+'</mark>'+esc(s.slice(j+q.length))+'…';
}
function libRows(q){
 const t=String(q||'').trim().toLowerCase();
 let list=libEntries().filter(e=>LIBCAT==='all'||e.kind===LIBCAT||e.cat===LIBCAT||
  (LIBCAT==='unread'&&libUnread(e.doc)));
 if(t)list=list.filter(e=>libText(e).toLowerCase().includes(t))
  .sort((a,b)=>(b.title.toLowerCase().includes(t)?1:0)-(a.title.toLowerCase().includes(t)?1:0));
 if(!boss()&&!t)list=list.sort((a,b)=>(b.filled?1:0)-(a.filled?1:0));
 if(!list.length)return '<div class="empty">'+ic('search',22)+'<div>'+
  (t?'Nothing in the library mentions “'+esc(q)+'”.':'Nothing here yet.')+'</div></div>';
 return list.map(e=>{
  const icon=e.kind==='service'?ic('spark',18):e.kind==='product'?(e.image?'<img src="'+e.image+'" alt="">':ic('stock',18)):
   ic(libCat(e.cat)[2],18);
  const snip=t&&!e.title.toLowerCase().includes(t)?libSnippet(libText(e),t):'';
  const status=!e.filled?'<span class="pill">No guide yet</span>':
   libUnread(e.doc)?'<span class="pill a">Please read</span>':
   (boss()&&e.of>1&&e.filled<e.of?'<span class="pill b">'+e.filled+'/'+e.of+'</span>':'');
  return '<button type="button" class="pkrow'+(e.filled?'':' libempty')+'" onclick="openLib(\''+esc(e.id)+'\')">'+
   '<span class="pkico">'+icon+'</span><span class="cpmeta"><b>'+esc(e.title)+'</b><span>'+
   (snip||esc(e.sub))+'</span></span>'+status+'</button>';}).join('');
}

  if((s.use||[]).length)rows.push(['Backbar used',(s.use||[]).map(u=>esc(prod(u.sku).name||u.sku)+' × '+u.qty).join(', ')]);
  if(s.concerns&&s.concerns.length)rows.push(['Concerns',esc(s.concerns.join(', '))]);
  if(s.interval)rows.push(['Repeat every',s.interval+' days']);}
 const pairs=(e.doc||{}).pairs||[];
 if(pairs.length)rows.push(['Linked',pairs.map(x=>{const t=libMeta(x);
  return t?'<a href="javascript:void 0" onclick="openLib(\''+esc(x)+'\')">'+esc(t.title)+'</a>':'';}).filter(Boolean).join(' · ')]);

  '<div class="fabrow" style="margin:0" id="la-go">'+libWaBtn(phone,txt)+'</div></div>');

/* ============ per-line pricing at checkout ============ */
/* Every line on a bill can carry its own price, discount (percent, ringgit or a voucher
   code), a reason for the discount, who is credited, a commission override and a note
   for the receipt. What the line is worth after its own discount is the base for bill
   totals, reports and commission. Owner and manager may change anything; the owner
   decides in Settings how far other staff may go. */
function lineGross(i){return r2((+i.price||0)*(i.qty||1));}
function lineAmt(i){return Math.max(0,r2(lineGross(i)-(+i.lineDisc||0)));}
function lineComm(i,rate){
 return (i.commAmt!==undefined&&i.commAmt!==null&&i.commAmt!=='')?r2(+i.commAmt):r2(lineAmt(i)*(+rate||0)/100);}
function salesRate(i,u){
 if(i.kind==='service')return svc(i.id).comm??u.commSvc??0;
 if(i.kind==='redeem')return 0;
 return u.commProd??0;
}
const retailKind=k=>k==='product'||k==='set';
const CO_DEFAULT={staffPrice:false,staffDiscMax:10,staffComm:false,needNote:true};
const coRules=()=>({...CO_DEFAULT,...(((D.meta||{}).checkoutRules)||{})});
const canPrice=()=>boss()||!!coRules().staffPrice;
const canComm=()=>boss()||!!coRules().staffComm;
const discCap=()=>boss()?100:Math.max(0,+coRules().staffDiscMax||0);
/* the discount on one line, worked out again whenever price, quantity or code changes */
function recalcLine(i){
 const g=lineGross(i);let d=0;
 if(i.dType==='pct')d=g*(+i.dVal||0)/100;
 else if(i.dType==='rm')d=+i.dVal||0;
 else if(i.dType==='code'&&i.discCode){const v=findVoucher(i.discCode);
  if(v)d=v.type==='pct'?g*(+v.value||0)/100:(+v.value||0);}
 i.lineDisc=r2(Math.min(g,Math.max(0,d)));
 return i;
}
const lineEdited=i=>!!(i.priceEdited||i.dType||i.commAmt!==undefined&&i.commAmt!==null&&i.commAmt!==''||i.lineNote);
function lineInfo(i){
 const bits=[];
 const list=+((itemSrc(i.kind==='redeem'?'service':i.kind,i.id)||{}).price||0);
 if(i.priceEdited&&i.kind!=='redeem'&&Math.abs(list-(+i.price||0))>0.004)
  bits.push('price '+rm(i.price)+' <s class="muted">'+rm(list)+'</s>');
 if(i.lineDisc>0)bits.push((i.dType==='pct'?(+i.dVal)+'% off':i.dType==='code'?'code '+esc(i.discCode):'discount')+
  ' −'+rm(i.lineDisc)+(i.discNote?' · '+esc(i.discNote):''));
 if(i.commAmt!==undefined&&i.commAmt!==null&&i.commAmt!=='')bits.push('commission '+rm(i.commAmt));
 if(i.lineNote)bits.push('“'+esc(i.lineNote)+'”');
 return bits.length?'<div class="tiny lineinfo">'+bits.join(' · ')+'</div>':'';
}

   (canComm()?'':' disabled')+' placeholder="Automatic" oninput="elPreview('+x+')">'+
  '<div class="tiny muted" style="margin:-4px 0 10px" id="el-cr">Automatic: '+rate+'% of the line = '+rm(lineAmt(i)*rate/100)+'</div>'+
  '<label>Note on the receipt <span class="muted">— optional</span></label>'+
  '<input class="f" id="el-ln" value="'+esc(i.lineNote||'')+'" placeholder="e.g. Free gift wrap">'+
  '<div class="fieldset" id="el-pv" style="margin:6px 0 10px"></div>'+
  '<div id="el-e" class="tiny" style="color:var(--rose);margin-bottom:8px"></div>'+
  '<button class="btn" style="width:100%;justify-content:center" onclick="saveLine('+x+')">'+ic('check',16)+'Save line</button>'+
  (lineEdited(i)?'<button class="btn ghost sm" style="width:100%;justify-content:center;margin-top:8px" onclick="resetLine('+x+
   ')">'+ic('refresh',14)+'Back to catalogue price, no discount</button>':'')+'</div>');
 ELTYPE=i.dType||'';window.elPreview(x);
};
let ELTYPE='';
window.elType=(x,t)=>{ELTYPE=t;
 const seg=document.getElementById('el-dt');
 if(seg&&seg.querySelectorAll)[...seg.querySelectorAll('button')].forEach(b=>b.className=b.dataset.v===t?'on':'');
 const a=document.getElementById('el-dv-w'),c=document.getElementById('el-code-w');
 if(a&&a.style)a.style.display=['pct','rm'].includes(t)?'':'none';
 if(c&&c.style)c.style.display=t==='code'?'':'none';
 window.elPreview(x);};
/* the line as it would be saved, from what is on the form */
function elDraft(x){
 const i=cart.items[x];const g=id=>document.getElementById(id);
 const d={...i};
 if(i.kind!=='redeem'){
  const pe=g('el-p');if(pe)d.price=r2(pe.value);
  const qe=g('el-q');if(qe)d.qty=Math.max(1,Math.round(+qe.value||1));
  d.dType=ELTYPE;d.dVal=['pct','rm'].includes(ELTYPE)?(+((g('el-dv')||{}).value)||0):0;
  d.discCode=ELTYPE==='code'?String((g('el-code')||{}).value||'').trim().toUpperCase().replace(/\s/g,''):'';
  d.discNote=String((g('el-n')||{}).value||'').trim();
 }
 d.staffId=(g('el-s')||{}).value||i.staffId;
 const cv=(g('el-c')||{}).value;d.commAmt=cv===''||cv===undefined?undefined:r2(cv);
 d.lineNote=String((g('el-ln')||{}).value||'').trim();
 recalcLine(d);return d;
}
function elProblem(i,d){
 if(i.kind==='redeem')return '';
 const list=+((itemSrc(i.kind,i.id)||{}).price||0);
 if(!(d.price>=0))return 'Enter a price.';
 if(Math.abs(d.price-list)>0.004&&!canPrice())return 'Only a manager can change the price.';
 if(d.dType==='code'){
  if(!d.discCode)return 'Type the code.';
  const v=findVoucher(d.discCode);
  const p=voucherProblem(v,lineGross(d),cart.customerId,d);if(p)return p;
  const others=cart.items.filter((z,k)=>k!==cart.items.indexOf(i)&&z.discCode===d.discCode).length+
   (cart.voucher&&cart.voucher.id===v.id?1:0);
  if(v.cap&&(v.used||0)+others+1>v.cap)return 'Code '+v.id+' is already used on this bill.';
 }
 if(['pct','rm'].includes(d.dType)){
  if(d.dType==='pct'&&d.dVal>100)return 'A discount cannot be more than 100%.';
  const pct=lineGross(d)?d.lineDisc/lineGross(d)*100:0;
  if(pct>discCap()+0.01)return 'That is '+Math.round(pct)+'% off. Staff can give up to '+discCap()+'% — ask a manager.';
 }
 if(d.commAmt!==undefined&&!canComm()&&d.commAmt!==i.commAmt)return 'Only a manager can change commission.';
 const changed=Math.abs(d.price-list)>0.004||(['pct','rm'].includes(d.dType)&&d.lineDisc>0);
 if(changed&&coRules().needNote&&!d.discNote)return 'Add a short note saying why.';
 return '';
}

/* the saved form of one line: re-priced from the catalogue unless a permitted override
   applies, with only the fields that are set (Firestore refuses undefined values) */
function lineForSale(i,base){
 const out={...base};
 if(i.kind==='redeem'){
  if(i.commAmt!==undefined&&i.commAmt!==null&&i.commAmt!=='')out.commAmt=r2(i.commAmt);
  if(i.lineNote)out.lineNote=i.lineNote;
  return out;}
 const list=+base.price||0;
 if(i.priceEdited&&Math.abs((+i.price||0)-list)>0.004){
  if(!canPrice())throw new Error('Only a manager can change the price of '+base.name+'.');
  out.price=r2(i.price);out.listPrice=list;}
 const draft={...out,qty:i.qty,dType:i.dType||'',dVal:+i.dVal||0,discCode:i.discCode||''};
 recalcLine(draft);
 if(draft.lineDisc>0){
  const g=lineGross(draft);
  if(['pct','rm'].includes(draft.dType)&&g&&draft.lineDisc/g*100>discCap()+0.01)
   throw new Error(base.name+': discount is more than staff may give ('+discCap()+'%). Ask a manager.');
  if(draft.dType==='code'){
   const v=findVoucher(draft.discCode);
   const p=voucherProblem(v,g,cart.customerId,base);if(p)throw new Error(base.name+' · code '+draft.discCode+': '+p);}
  out.lineDisc=draft.lineDisc;out.discType=draft.dType;
  if(['pct','rm'].includes(draft.dType))out.discVal=draft.dVal;
  if(draft.dType==='code')out.discCode=draft.discCode;
 }
 const changed=out.listPrice!==undefined||(out.lineDisc>0&&out.discType!=='code');
 if(changed&&coRules().needNote&&!i.discNote)throw new Error('Add a note saying why '+base.name+' was discounted.');
 if(i.discNote&&(changed||out.lineDisc>0))out.discNote=i.discNote;
 if(i.commAmt!==undefined&&i.commAmt!==null&&i.commAmt!==''){
  if(!canComm())throw new Error('Only a manager can change commission.');
  out.commAmt=r2(i.commAmt);}
 if(i.lineNote)out.lineNote=i.lineNote;
 return out;
}
/* receipt wording for one line's extras */
function lineNotes(i){
 const n=[];
 if(i.listPrice!==undefined&&i.listPrice>i.price)n.push('Usual price '+rm(i.listPrice));
 if(i.lineDisc>0)n.push((i.discType==='pct'?(+i.discVal)+'% discount':i.discType==='code'?'Code '+i.discCode:'Discount')+
  (i.discNote?' ('+i.discNote+')':'')+' −'+rm(i.lineDisc));
 if(i.kind==='set'){const b=setOf(i.id);const it=i.setItems||b.items||[];
  if(it.length)n.push('Set: '+it.map(z=>z.qty+'× '+(z.name||prod(z.sku).name||z.sku)).join(' + '));}
 if(i.lineNote)n.push(i.lineNote);
 return n;
}

/* A set is a fixed group of retail products sold together at one price. Selling a set
   takes each product in it out of stock. */
const setOf=id=>(D.bundles||[]).find(b=>b.id===id)||{};
const setWorth=b=>(b.items||[]).reduce((a,z)=>a+(+prod(z.sku).price||0)*(+z.qty||1),0);
const setLabel=b=>(b.items||[]).map(z=>z.qty+'× '+(prod(z.sku).name||z.sku)).join(' + ');
/* what stops n of a set being sold here, or '' */
function setShort(id,n){
 const b=setOf(id);
 for(const z of (b.items||[])){
  const st=stockOf(z.sku),need=(+z.qty||1)*(n||1);
  if(!st||st.qty<need)return 'Not enough '+(prod(z.sku).name||z.sku)+' for '+(n||1)+' set'+((n||1)>1?'s':'')+
   ' — '+(st?st.qty:0)+' in stock.';

}

function buildPriceListPDF(o,jsPDF){

 let y=0;

   font(16,'bold');T(b.name||'',lx,y+1);

   font(20,'bold',BRASS);T('PRICE LIST',W-M,y+1,{align:'right'});
   font(8,'normal',MUTED);T('Effective '+dstr(new Date()),W-M,y+6.5,{align:'right'});
   y+=15;doc.setDrawColor(...LINE);doc.setLineWidth(0.3);doc.line(M,y,W-M,y);y+=8;
  }else{font(8,'normal',MUTED);T((b.name||'')+' · Price list (continued)',M,y);y+=8;}
 };
 const need=h=>{if(y+h>H-20){doc.addPage();top(false);}};
 const head=(title,sub)=>{need(18);font(12,'bold');T(title,M,y);
  if(sub){font(8,'normal',MUTED);T(sub,W-M,y,{align:'right'});}

 doc.setProperties({title:(b.name||'')+' price list',creator:'Spatify'});
 return doc;
}

/* a single place that marks a booking complete: logs it, and takes backbar stock
   unless it was already taken (by checkout, or an earlier completion) */
async function completeAppt(a,extra){
 extra=extra||{};
 const now=new Date().toISOString();
 const patch={status:'done',updatedBy:UID,updatedAt:now,completedAt:a.completedAt||now,
  statusLog:[...(a.statusLog||[]),{from:a.status,to:'done',at:now,by:UID,byName:ME.name,
   ...(extra.saleId?{via:'payment'}:{})}]};
 const warn=[];
 if(!a.stockDone&&!extra.skipStock){
  for(const u of (svc(a.serviceId).use||[])){const st=stockOf(u.sku,a.branchId);if(!st)continue;
   await updateDoc(doc(db,'stock',st.id),{qty:increment(-u.qty)});st.qty-=u.qty;if(st.qty<=st.reorder)warn.push(prod(u.sku).name);}
  patch.stockDone='appt';
 }
 if(extra.stockBySale&&!a.stockDone)patch.stockDone='sale';
 if(extra.saleId){patch.saleId=extra.saleId;patch.invoiceNo=extra.invoiceNo||'';patch.paidAt=now;}
 if(extra.serviceId&&extra.serviceId!==a.serviceId){patch.serviceId=extra.serviceId;patch.serviceName=extra.serviceName||'';
  patch.undecided=false;}
 await updateDoc(doc(db,'appointments',a.id),patch);
 Object.assign(a,patch);
 return warn;
}

/* after a bill is saved, today's bookings for the treatments on it are completed and linked */
async function completeFromSale(saleId,invoiceNo,customerId,items){
 if(!customerId)return {done:0,stockAppts:new Set()};
 const lines=items.filter(i=>(i.kind==='service'&&!i.later)||i.kind==='redeem');
 const used=new Set();let done=0;
 for(const l of lines){
  let a=l.apptId?APPTS.find(x=>x.id===l.apptId):null;
  if(!a)a=APPTS.find(x=>!used.has(x.id)&&x.customerId===customerId&&x.date===today()&&x.serviceId===l.id&&
   !x.saleId&&['booked','confirm','in','done'].includes(x.status));
  if(!a)a=APPTS.find(x=>!used.has(x.id)&&x.customerId===customerId&&x.date===today()&&x.undecided&&
   !x.saleId&&['booked','confirm','in'].includes(x.status));
  if(!a)continue;used.add(a.id);
  try{
   if(a.status==='done')await updateDoc(doc(db,'appointments',a.id),{saleId,invoiceNo,paidAt:new Date().toISOString()});
   else{await completeAppt(a,{saleId,invoiceNo,skipStock:true,stockBySale:true,
     serviceId:a.undecided?l.id:'',serviceName:a.undecided?l.name:''});done++;}
   a.saleId=saleId;a.invoiceNo=invoiceNo;
  }catch(e){console.warn('auto-complete',e);}
 }
 return {done};
}

  five:st.filter(v=>v===5).length,points:fromFb+manual,fromFb,manual,list,tags};

/* ============ scratch & win after a review ============ */
/* Every client who sends a review gets one scratch card. The prize is drawn by the spa's
   app when the link is made (from the odds the owner sets), so the client's phone cannot
   pick its own prize. The winning voucher is written together with the review, and the
   security rules accept it only when it matches the drawn prize exactly and the review
   exists — no review, no voucher. */
const SW_DEFAULT={on:false,validDays:60,startDays:0,lose:25,
 prizes:[{label:'RM10 off',type:'rm',value:10,min:50,weight:40},{label:'RM20 off',type:'rm',value:20,min:100,weight:20},
  {label:'10% off',type:'pct',value:10,min:0,weight:15},{label:'Free treatment',type:'free',value:100,serviceId:'',min:0,weight:0}]};
const swSet=()=>{const m=((D.meta||{}).scratch)||{};return{...SW_DEFAULT,...m,prizes:Array.isArray(m.prizes)?m.prizes:SW_DEFAULT.prizes};};
const isClientV=v=>!!v&&(v.kind==='return'||v.kind==='prize');
const swPrizeOk=p=>p&&+p.weight>0&&(p.type==='free'?!!svc(p.serviceId).id:+p.value>0);
function swOdds(){
 const S=swSet(),list=S.prizes.filter(swPrizeOk),tot=list.reduce((a,p)=>a+(+p.weight||0),0)+Math.max(0,+S.lose||0);
 return{list,tot,lose:Math.max(0,+S.lose||0)};
}
function swDraw(customerName){
 const S=swSet(),O=swOdds();
 if(!S.on||!O.tot)return null;
 const a=new Uint32Array(1);crypto.getRandomValues(a);
 let x=a[0]/4294967296*O.tot;
 const hit=O.list.find(p=>(x-=+p.weight)<0);
 if(!hit)return{lose:true};
 const b=new Uint8Array(6);crypto.getRandomValues(b);
 const code='WIN-'+Array.from(b,v=>RV_CHARS[v%32]).join('');
 const now=new Date(),fbDays=Math.max(1,+fbSet().validDays||7);
 const free=hit.type==='free';
 return{code,label:String(hit.label||'').slice(0,60)||(free?'Free '+svc(hit.serviceId).name:rvWorth(hit)),
  type:free?'pct':(hit.type==='pct'?'pct':'rm'),value:free?100:+hit.value,min:+hit.min||0,
  serviceId:free?hit.serviceId:'',serviceName:free?(svc(hit.serviceId).name||''):'',
  validFrom:ymd(addDays(now,+S.startDays||0)),expiry:ymd(addDays(now,fbDays+Math.max(1,+S.validDays||60))),
  customerName:String(customerName||'')};
}

/* ============ installable app (PWA) ============ */
/* The app is a web page, but on a tablet it should behave like an app: its own icon,
   full screen, and it still opens when the line drops. A service worker keeps the last
   good copy of the page; Firestore keeps the data. Updates are never silent-stuck —
   the page is always fetched from the network first, and when a new version is waiting
   the team gets a tap-to-update prompt. */
let SWREG=null,SWNEW=null,INSTALLP=null,PWAVER='';
const standalone=()=>{try{return window.matchMedia('(display-mode: standalone)').matches||
 window.matchMedia('(display-mode: minimal-ui)').matches||navigator.standalone===true;}catch(e){return false;}};
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||
 (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function pwaInit(){
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALLP=e;
  if(TAB==='set'&&typeof render==='function')render();});
 window.addEventListener('appinstalled',()=>{INSTALLP=null;toast('Luuna is on your home screen');});
 window.addEventListener('online',paintOffline);
 window.addEventListener('offline',paintOffline);
 paintOffline();
 if(!('serviceWorker' in navigator))return;
 navigator.serviceWorker.addEventListener('message',e=>{
  if(e.data&&e.data.type==='VERSION')PWAVER=e.data.version;
  if(e.data&&e.data.type==='GO'&&e.data.go&&typeof window.go==='function'&&ME)window.go(e.data.go);});
 navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(reg=>{
  SWREG=reg;
  if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage('VERSION');
  if(reg.waiting&&navigator.serviceWorker.controller)swReady(reg.waiting);
  reg.addEventListener('updatefound',()=>{
   const w=reg.installing;if(!w)return;
   w.addEventListener('statechange',()=>{
    if(w.state==='installed'&&navigator.serviceWorker.controller)swReady(w);});
  });
  /* look for a new version when the app is opened and every half hour it stays open */
  setInterval(()=>{try{reg.update();}catch(e){}},1800000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){try{reg.update();}catch(e){}}});
 }).catch(e=>console.warn('service worker',e));
 let reloading=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{
  if(reloading)return;reloading=true;location.reload();});
}
function swReady(worker){
 SWNEW=worker;
 const b=document.getElementById('updbar');
 if(b){b.className='updbar on';
  b.innerHTML='<span>'+ic('refresh',14)+' A newer version of the app is ready.</span>'+
   '<button class="btn sm" onclick="pwaUpdate()">Update now</button>'+
   '<button class="iconbtn" onclick="document.getElementById(\'updbar\').className=\'updbar\'" aria-label="Later">'+
   ic('close',14)+'</button>';}
}
window.pwaUpdate=()=>{
 if(SWNEW){SWNEW.postMessage('SKIP_WAITING');setTimeout(()=>location.reload(),900);}
 else location.reload();
};
function paintOffline(){
 const b=document.getElementById('offbar');if(!b)return;

/* ============ live alerts and notifications ============ */
/* Whatever happens at the counter — a bill paid, a booking made, someone clocking in —
   is written to a small events feed. Every device with the app open watches that feed,
   shows it under the bell, and raises a real notification on the device when the person
   has switched to another app. Each person chooses on their own device what is worth
   a buzz, so the owner can watch money while a therapist only hears about bookings. */
const ALERT_KINDS={
 sale:      {label:'Bill completed',            icon:'card',     boss:true,  staff:false},
 payment:   {label:'Instalment collected',      icon:'wallet',   boss:true,  staff:false},
 booking:   {label:'Booking made or changed',   icon:'calendar', boss:true,  staff:true},
 attendance:{label:'Clock in and out',          icon:'clock',    boss:true,  staff:false},
 day:       {label:'Day opened and closed',     icon:'home',     boss:true,  staff:false},
 feedback:  {label:'Client review',             icon:'star',     boss:true,  staff:true},
 stock:     {label:'Stock running low',         icon:'stock',    boss:true,  staff:false}};
const NKEY='luunaNotify';
let EVENTS=[],EVSEEN=0,EVBOOT=Date.now(),EVIDS=new Set(),NPREF=null;
function notifPrefs(){
 if(NPREF)return NPREF;
 let p=null;try{p=JSON.parse(localStorage.getItem(NKEY)||'null');}catch(e){}
 if(!p){
  const b=boss();const kinds={};
  Object.keys(ALERT_KINDS).forEach(k=>kinds[k]=b?ALERT_KINDS[k].boss:ALERT_KINDS[k].staff);
  p={on:false,kinds,quietFrom:0,quietTo:0,sound:true,mine:false,bgOnly:false,v:2};
 }
 /* the first build shipped with 10pm–8am quiet by default, which silently swallowed every
    alert during an evening test; anyone who never chose their own hours is moved off it */
 if(p.v!==2){if(+p.quietFrom===22&&+p.quietTo===8){p.quietFrom=0;p.quietTo=0;}p.v=2;NPREF=p;saveNotifPrefs();return p;}
 NPREF=p;return p;
}
function saveNotifPrefs(){try{localStorage.setItem(NKEY,JSON.stringify(NPREF));}catch(e){}}
const quietNow=()=>{
 const p=notifPrefs(),h=new Date().getHours(),a=+p.quietFrom,b=+p.quietTo;
 if(a===b)return false;
 return a<b?(h>=a&&h<b):(h>=a||h<b);
};
/* record something the team should know about; never blocks the action that caused it */
function logEvent(kind,title,body,extra){
 try{
  const e={kind,title:String(title||'').slice(0,90),body:String(body||'').slice(0,160),
   branchId:ME.branchId,by:UID,byName:ME.name,at:new Date().toISOString(),date:today(),...(extra||{})};
  return addDoc(collection(db,'events'),e).catch(err=>console.warn('event',err));
 }catch(err){console.warn('event',err);return Promise.resolve();}
}
let EVFEED=false;
function watchEvents(){
 try{
  const from=ymd(addDays(new Date(),-1));
  const q=query(collection(db,'events'),where('date','>=',from));
  unsub.push(onSnapshot(q,s=>{
   const fresh=[];
   s.docChanges().forEach(c=>{
    if(c.type!=='added')return;
    const e={id:c.doc.id,...c.doc.data()};
    if(e.branchId!==ME.branchId||EVIDS.has(e.id))return;
    EVIDS.add(e.id);EVENTS.push(e);
    if(+new Date(e.at)>EVBOOT)fresh.push(e);
   });
   EVFEED=true;
   EVENTS.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
   if(EVENTS.length>120)EVENTS=EVENTS.slice(0,120);
   fresh.forEach(alertOf);
   if(fresh.length)paintBell();
  },err=>console.warn('events',err)));
 }catch(e){console.warn('events',e);}
}
/* new reviews arrive from the client's phone, so they are watched directly */
function watchReviews(){
 try{
  const q=query(collection(db,'feedback'),where('branchId','==',ME.branchId));
  unsub.push(onSnapshot(q,s=>{
   s.docChanges().forEach(c=>{
    if(c.type!=='added')return;
    const f={id:c.doc.id,...c.doc.data()};
    if(!FEEDBACK.some(x=>x.id===f.id))FEEDBACK.unshift(f);
    if(+new Date(f.at)<=EVBOOT||EVIDS.has('fb'+f.id))return;
    EVIDS.add('fb'+f.id);
    const st=star(f.overall);
    const e={id:'fb'+f.id,kind:'feedback',at:f.at,by:'',byName:f.firstName||'Client',branchId:f.branchId,
     title:st+'★ review from '+(f.firstName||'a client'),
     body:(f.comment||(f.services||[]).join(', ')||'')+(st<=3?' · needs follow-up':''),
     refType:'feedback',refId:f.id,urgent:st<=3};
    EVENTS.unshift(e);alertOf(e);paintBell();
   });
  },err=>console.warn('reviews',err)));
 }catch(e){console.warn('reviews',e);}
}
let NLAST='';
/* post a notification to the device tray, and remember exactly why if it does not go */
async function showNote(title,body,data,urgent){
 const p=notifPrefs();
 if(typeof Notification==='undefined'){NLAST='This browser has no notifications';return NLAST;}
 if(Notification.permission!=='granted'){NLAST='Permission is '+Notification.permission;return NLAST;}
 const opt={body:body||'',icon:'./icon-192.png',badge:'./favicon-32.png',
  tag:(data&&data.tag)||('n'+Date.now()),renotify:true,requireInteraction:!!urgent,
  data:data||{go:'home'},vibrate:urgent?[90,60,90]:[60]};
 let reg=SWREG;
 if(!reg&&navigator.serviceWorker){try{reg=await navigator.serviceWorker.ready;SWREG=reg;}catch(e){}}
 if(reg&&reg.showNotification){
  try{await reg.showNotification(title,opt);NLAST='ok';return '';}
  catch(e){NLAST='Service worker refused it: '+(e&&e.message||e);}
 }else NLAST='The app service is not registered — upload sw.js and reload over https';
 /* a page notification still works on a laptop, so try it before giving up */
 try{const n=new Notification(title,opt);n.onclick=()=>{window.focus();};NLAST='ok (page)';return '';}
 catch(e){NLAST=NLAST+' · '+(e&&e.message||e);}
 return NLAST;
}
/* one event: buzz the device if this person asked for that kind */
function alertOf(e){
 const p=notifPrefs();
 const force=!!e.test;
 if(!p.kinds[e.kind]&&!force)return;
 /* whatever happens while you are looking at the app is always shown on screen;
    only the buzz on the device is filtered by the settings */
 if(!document.hidden)alertBanner(e);
 if(e.by===UID&&!p.mine&&!force)return;
 const quiet=quietNow()&&!e.urgent&&!force;
 /* the tray gets it whether or not the app is in front, unless this device asked
    for background-only alerts */
 if(p.on&&!quiet&&(document.hidden||!p.bgOnly))
  showNote(e.title,e.body,{go:evTab(e),refType:e.refType||'',refId:e.refId||'',tag:e.id},e.urgent);
 if(p.sound&&!quiet)beep(e.urgent);
}
/* a tappable banner in the corner, so nothing is missed while the app is open */
function alertBanner(e){
 const box=document.getElementById('albox');if(!box)return;
 const k=ALERT_KINDS[e.kind]||{icon:'note'};
 const el=document.createElement('button');
 el.type='button';el.className='albanner'+(e.urgent?' urgent':'');
 el.innerHTML='<span class="alertico">'+ic(k.icon,16)+'</span><span class="cpmeta"><b>'+esc(e.title)+
  '</b><span>'+esc(e.body||'')+'</span></span>'+ic('right',14);
 el.onclick=()=>{el.remove();window.openAlert(e.id);};
 box.prepend(el);
 while(box.children.length>3)box.lastChild.remove();
 setTimeout(()=>{el.classList.add('out');setTimeout(()=>{try{el.remove();}catch(x){}},420);},9000);
}
const evTab=e=>({sale:'pos',payment:'pos',booking:'book',attendance:'team',day:'shift',feedback:'merit',stock:'inv'}[e.kind]||'home');
function beep(urgent){
 try{
  const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  const c=new A();const o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.type='sine';
  o.frequency.setValueAtTime(urgent?660:880,c.currentTime);
  o.frequency.setValueAtTime(urgent?520:1170,c.currentTime+0.12);
  g.gain.setValueAtTime(0.0001,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.14,c.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.34);
  o.start();o.stop(c.currentTime+0.36);
  setTimeout(()=>{try{c.close();}catch(e){}},800);
 }catch(e){}
}

/* ---- weather ----
   Two sources, both free for business use under CC BY 4.0:
   · MET Norway (api.met.no) — hour-by-hour model values for this exact spot, polled every
     10 minutes and eased minute by minute, so the reading moves through the day.
   · MET Malaysia via data.gov.my — the official pagi / petang / malam forecast and the days
     ahead; also the fallback whenever MET Norway cannot be reached. */
const WXKEY='luuna:wx',WXNKEY='luuna:wxn';
let WX=null,WXBUSY=false,WXERR='',WXPER='';
let WXN=null,WXNBUSY=false,WXNERR='';
try{WX=JSON.parse(localStorage.getItem(WXKEY)||'null');}catch(e){}
try{WXN=JSON.parse(localStorage.getItem(WXNKEY)||'null');}catch(e){}
const wxLoc=()=>(branch().wxLoc||'Kulai');
const wxLat=()=>+(branch().wxLat||1.6561),wxLon=()=>+(branch().wxLon||103.6032);
function wxPeriod(d){const h=(d||new Date()).getHours();
 return h>=6&&h<12?'morning':(h>=12&&h<19?'afternoon':'night');}
const WXWHEN={morning:'Pagi',afternoon:'Petang',night:'Malam'};
const WXNAME={storm:'Ribut petir',heavy:'Hujan lebat',rain:'Hujan',drizzle:'Hujan renyai',sun:'Cerah',
 moon:'Cerah',psun:'Berawan',pmoon:'Berawan',haze:'Berjerebu',fog:'Berkabus',wind:'Berangin',cloud:'Mendung'};
/* MET Malaysia wording → picture */
function wxKind(text,night){
 const t=String(text||'').toLowerCase();
 if(t.includes('ribut petir'))return 'storm';
 if(t.includes('hujan lebat'))return 'heavy';
 if(t.includes('tiada hujan'))return night?'moon':'sun';
 if(t.includes('hujan'))return 'rain';
 if(t.includes('jerebu'))return 'haze';
 if(t.includes('berangin'))return 'wind';
 if(t.includes('mendung')||t.includes('berawan'))return 'cloud';
 return night?'moon':'sun';
}
/* MET Norway symbol codes → picture */
function symKind(sym){
 const s=String(sym||'');const night=s.endsWith('_night');
 if(s.includes('thunder'))return 'storm';
 if(s.startsWith('heavyrain')||s.startsWith('heavysleet'))return 'heavy';
 if(/rain|sleet|snow/.test(s))return s.startsWith('light')?'drizzle':'rain';
 if(s.startsWith('fog'))return 'fog';
 if(s.startsWith('cloudy'))return 'cloud';
 if(s.startsWith('partlycloudy')||s.startsWith('fair'))return night?'pmoon':'psun';
 if(s.startsWith('clearsky'))return night?'moon':'sun';
 return 'cloud';
}
const wxDay=date=>(WX&&WX.rows||[]).find(r=>r.date===date)||null;

async function wxLoad(force){
 if(WXBUSY)return;
 const fresh=WX&&WX.loc===wxLoc()&&WX.at&&(Date.now()-WX.at<3600e3)&&wxDay(today());
 if(fresh&&!force)return;
 WXBUSY=true;
 try{
  const r=await fetch('https://api.data.gov.my/weather/forecast?contains='+
   encodeURIComponent(wxLoc())+'@location__location_name&limit=14');
  if(!r.ok)throw new Error('the weather service answered '+r.status);
  const want=wxLoc().toLowerCase();
  const rows=(await r.json()).filter(x=>x&&x.location&&
   String(x.location.location_name).toLowerCase()===want);
  if(!rows.length)throw new Error('no forecast is published for '+wxLoc());
  WX={loc:wxLoc(),at:Date.now(),rows:rows.map(x=>({date:x.date,morning:x.morning_forecast,
   afternoon:x.afternoon_forecast,night:x.night_forecast,summary:x.summary_forecast,
   when:x.summary_when,min:x.min_temp,max:x.max_temp})).sort((a,b)=>a.date<b.date?-1:1)};
  WXERR='';
  try{localStorage.setItem(WXKEY,JSON.stringify(WX));}catch(e){}
 }catch(e){WXERR=String(e&&e.message||e);}
 WXBUSY=false;
 paintWx();
}
async function wxNowLoad(force){
 if(WXNBUSY)return;
 const lat=wxLat().toFixed(4),lon=wxLon().toFixed(4);
 const fresh=WXN&&WXN.lat===lat&&WXN.lon===lon&&(Date.now()-WXN.at<600e3)&&wxNow();
 if(fresh&&!force)return;
 WXNBUSY=true;
 try{
  /* a plain GET, so the browser identifies the app by its Origin as MET Norway asks,
     and its HTTP cache honours their Expires header between polls */
  const r=await fetch('https://api.met.no/weatherapi/locationforecast/2.0/compact?lat='+lat+'&lon='+lon);
  if(!r.ok)throw new Error('MET Norway answered '+r.status);
  const j=await r.json();
  const ts=((j.properties||{}).timeseries||[]).slice(0,30).map(x=>{
   const d=(x.data||{}),i=(d.instant||{}).details||{},n1=d.next_1_hours||d.next_6_hours||{};
   return {t:x.time,temp:i.air_temperature,rh:i.relative_humidity,wind:i.wind_speed,
    cloud:i.cloud_area_fraction,sym:(n1.summary||{}).symbol_code||'',
    pr:((d.next_1_hours||{}).details||{}).precipitation_amount};}).filter(x=>x.temp!=null);
  if(!ts.length)throw new Error('MET Norway sent no readings');
  WXN={at:Date.now(),lat,lon,updated:((j.properties||{}).meta||{}).updated_at||'',ts};
  WXNERR='';
  try{localStorage.setItem(WXNKEY,JSON.stringify(WXN));}catch(e){}
 }catch(e){WXNERR=String(e&&e.message||e);}
 WXNBUSY=false;
 paintWx();
}
/* the reading for this minute: eased between the hour either side */
function wxNow(at){
 const ts=WXN&&WXN.ts;if(!ts||!ts.length)return null;
 const now=+(at||new Date());
 let i=-1;for(let k=0;k<ts.length;k++){if(+new Date(ts[k].t)<=now)i=k;else break;}
 if(i<0||now-+new Date(ts[i].t)>2*3600e3)return null;
 const a=ts[i],b=ts[i+1]||a;
 const span=Math.max(1,+new Date(b.t)-+new Date(a.t)),f=b===a?0:Math.min(1,(now-+new Date(a.t))/span);
 const mix=(x,y)=>x==null?y:(y==null?x:x+(y-x)*f);
 const temp=mix(a.temp,b.temp),rh=mix(a.rh,b.rh);
 return {temp,rh,wind:mix(a.wind,b.wind),sym:a.sym,pr:a.pr,feels:heatIndex(temp,rh),
  kind:symKind(a.sym),next:ts.slice(i+1,i+7)};
}
/* how hot it feels — the heat index, for Kulai's humid afternoons */
function heatIndex(c,rh){
 if(c==null||rh==null)return c;
 const T=c*9/5+32;
 let hi=0.5*(T+61+((T-68)*1.2)+rh*0.094);
 if(hi>=80)hi=-42.379+2.04901523*T+10.14333127*rh-.22475541*T*rh-.00683783*T*T-.05481717*rh*rh+
  .00122874*T*T*rh+.00085282*T*rh*rh-.00000199*T*T*rh*rh;
 return (hi-32)*5/9;
}

 const moon=(cx,cy,s)=>'<g transform="translate('+(cx-30*s)+' '+(cy-30*s)+') scale('+s+')">'+

  cloud:cloud(8,-6,.7,.55)+cloud(-2,4),
  drizzle:cloud(0,-6)+drops(3),
  rain:cloud(0,-6)+drops(4),
  heavy:cloud(0,-6)+drops(6,true),
  storm:cloud(0,-6)+drops(2)+'<path class="wx-bolt" d="M34 40l-7 10h5.5l-3 9 10-12.5h-5.5l3.5-6.5z" fill="'+B+'"/>',
  haze:sun(32,24,8,.5)+'<g class="wx-haze" stroke="'+C+'" stroke-width="2.2" stroke-linecap="round" fill="none">'+
   '<path d="M10 42q6-4 12 0t12 0 12 0 12 0"/><path d="M14 50q6-4 12 0t12 0 12 0" opacity=".6"/></g>',
  fog:'<g class="wx-haze" stroke="'+C+'" stroke-width="2.2" stroke-linecap="round" fill="none">'+

 return '<svg class="wxart wx-'+k+'" width="'+sz+'" height="'+sz+'" viewBox="0 0 64 64" aria-hidden="true">'+

const wxhm=iso=>new Date(iso).toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit',hour12:false});

function paintWx(){

/* ---- overlapping bookings in one column sit side by side ---- */
function apptLanes(list){
 const out={};
 const xs=list.map(a=>({a,s:+new Date(a.start),e:+new Date(a.finish||(+new Date(a.start)+(a.duration||30)*6e4))}))
  .sort((x,y)=>x.s-y.s||y.e-x.e);
 let cluster=[],ends=[],clEnd=-1;
 const close=()=>{const n=Math.max(1,ends.length);cluster.forEach(c=>{out[c.a.id]={lane:c.lane,of:n};});cluster=[];ends=[];};
 xs.forEach(x=>{
  if(x.s>=clEnd&&cluster.length)close();
  let lane=ends.findIndex(e=>e<=x.s);
  if(lane<0){lane=ends.length;ends.push(x.e);}else ends[lane]=x.e;
  x.lane=lane;cluster.push(x);clEnd=Math.max(clEnd,x.e);
 });
 if(cluster.length)close();
 return out;
}
const laneCss=L=>!L||L.of<2?'':';left:calc(3px + (100% - 6px) * '+L.lane+' / '+L.of+');'+
 'width:calc((100% - 6px) / '+L.of+' - 2px);right:auto';

/* ---- who and what is busy at a given time ---- */
function busyAt(list,s0,e0,exceptId){
 return list.filter(a=>a.id!==exceptId&&a.branchId===ME.branchId&&!['cancel','no'].includes(a.status)).filter(a=>{
  const as=+new Date(a.start),ae=+new Date(a.finish)+(a.buffer||0)*6e4;return !(e0<=as||s0>=ae);});
}
/* rooms that suit the treatment, marked free or taken, the chosen one kept if still free */
function roomOptions(s,undec,date,time,exceptId,keep){
 const rooms=D.rooms.filter(r=>r.branchId===ME.branchId&&(undec||!s.room||r.type===s.room));
 const st=new Date(date+'T'+(time||'00:00')+':00');
 const ok=!isNaN(+st);
 const busy=ok?busyAt(APPTS.filter(a=>a.date===date),+st,+st+((s.dur||60)+(s.buffer||0))*6e4,exceptId):[];
 const taken=new Set(busy.map(a=>a.roomId));
 const free=rooms.filter(r=>!taken.has(r.id));
 const pick=keep&&free.some(r=>r.id===keep)?keep:(free[0]||{}).id||'';
 return {html:rooms.map(r=>'<option value="'+r.id+'"'+(taken.has(r.id)?' disabled':'')+(r.id===pick?' selected':'')+'>'+
   esc(r.name)+(taken.has(r.id)?' — taken':'')+'</option>').join('')||'<option value="">No suitable room</option>',
  free:free.length,total:rooms.length,busy};
}

  (mine.length&&free?'<span class="slotpill warn">'+ic('user',12)+esc(stf(staffId).name||'Therapist')+' also has '+
   mine.map(a=>esc(a.customerName||'')+' '+tstr(a.start)).join(', ')+'</span>':'');
}

 ()=>{
  let warned='';

   const o=roomOptions({room:s.room,dur,buffer:buf},!!a.undecided||!a.serviceId,$('#mv-d').value,$('#mv-t').value,id,

/* ============ client numbers and the paper file ============ */
/* Every client gets a short number, e.g. KUL-00123: branch code and a running count kept in
   clientSeq/{branchId}, handed out one at a time in a transaction so no two clients share one.
   The same number is written on the paper file at the spa, printed as a QR code on the forms
   and the folder label, and scanning or typing it opens the client in the app. Folders are
   kept in number order, a fixed count per box, so the number alone says which box to open. */
ICONS.qr='M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2.5v2.5H14zM18 18h2v2h-2zM18 14h2M14 19.5h2';
ICONS.folder='M3.5 6.5h6l2 2h9v10.5h-17z';
ICONS.scan='M4 8.5V4h4.5M15.5 4H20v4.5M20 15.5V20h-4.5M8.5 20H4v-4.5M7 12h10';

const CNO_RE=/^\s*([a-z]{2,5})?[\s\-]*0*(\d{1,6})\s*$/i;
const brOf=bid=>D.branches.find(b=>b.id===bid)||branch();
const brCode=bid=>{const b=brOf(bid)||{};
 return (String(b.code||'').replace(/[^A-Za-z]/g,'')||String(b.name||'').replace(/[^A-Za-z]/g,'').slice(0,3)||'LU')
  .toUpperCase().slice(0,5);};
const fmtNo=(code,n)=>code+'-'+String(n).padStart(5,'0');
/* members carry their own series: KUL-M00012 */
const fmtMem=(code,n)=>code+'-M'+String(n).padStart(5,'0');
const isMem=no=>/-M\d/.test(String(no||''));
const idOf=c=>(c&&(c.memberNo||c.clientNo))||'';
/* 'kul 123', 'KUL-00123', '123' → 'KUL-00123'; 'm12', 'KUL-M12', 'kulm12' → 'KUL-M00012'.
   A bare number is read as this branch. */
function normNo(t){
 const s=String(t||'').toUpperCase().replace(/\s+/g,'');
 const m=s.match(/^([A-Z]*)-?(M?)-?0*(\d{1,6})$/);
 if(!m||!+m[3])return '';
 let code=m[1],mem=!!m[2];
 const codes=(D.branches||[]).map(b=>brCode(b.id));
 if(code==='M'){code='';mem=true;}
 else if(!mem&&code.length>2&&code.endsWith('M')&&!codes.includes(code)&&codes.includes(code.slice(0,-1))){code=code.slice(0,-1);mem=true;}
 code=code||brCode(ME.branchId);
 return mem?fmtMem(code,+m[3]):fmtNo(code,+m[3]);
}
const noNum=no=>+(String(no||'').split('-').pop().replace(/\D/g,'')||0);
const cnoOf=id=>id?idOf(cust(id)):'';
const PAPER=()=>({per:50,...((D.meta&&D.meta.paper)||{})});
function boxOf(no){
 if(!no)return null;
 const n=noNum(no),per=Math.max(1,+PAPER().per||50),b=Math.ceil(n/per),pre=String(no).replace(/\d+$/,'');
 const lo=String((b-1)*per+1).padStart(5,'0'),hi=String(b*per).padStart(5,'0');
 return {b,label:(isMem(no)?'Box M':'Box ')+b,range:pre+lo+' – '+pre+hi,short:pre+lo+'–'+hi,mem:isMem(no)};
}
const cnoTag=c=>c&&c.memberNo?'<span class="cno mem" title="Member">'+esc(c.memberNo)+'</span>'
 :c&&c.clientNo?'<span class="cno">'+esc(c.clientNo)+'</span>':'';

/* ---- handing out a number ---- */
async function assignClientNo(cid){
 const c=cust(cid);
 const bid=(c&&c.branchId)||ME.branchId,code=brCode(bid);
 const seqRef=doc(db,'clientSeq',bid),cref=doc(db,'customers',cid);
 const now=new Date().toISOString();
 const no=await runTransaction(db,async tx=>{
  const cs=await tx.get(cref);
  if(!cs.exists())throw new Error('Client not found.');
  if(cs.data().clientNo)return cs.data().clientNo;
  const ss=await tx.get(seqRef);
  const n=(ss.exists()?(+ss.data().n||0):0)+1;
  const no=fmtNo(code,n);
  if(ss.exists())tx.update(seqRef,{n,code,at:now});else tx.set(seqRef,{n,code,at:now});
  tx.update(cref,{clientNo:no,clientNoAt:now,clientNoBy:UID,wantNo:false});
  return no;
 });
 if(c){c.clientNo=no;c.wantNo=false;}
 return no;
}

 try{

  return no;

}

/* ---- QR codes: a small library, fetched the first time and kept for offline ---- */
let QR_P=null;
function loadQR(){
 if(window.qrcode)return Promise.resolve(window.qrcode);
 if(QR_P)return QR_P;
 const srcs=['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'];
 QR_P=new Promise((res,rej)=>{
  let i=0;
  const next=()=>{
   if(i>=srcs.length){QR_P=null;rej(new Error('Could not load the QR maker — check the internet connection.'));return;}
   const sc=document.createElement('script');sc.src=srcs[i++];sc.async=true;
   sc.onload=()=>window.qrcode?res(window.qrcode):next();sc.onerror=next;
   (document.head||document.body).appendChild(sc);
  };
  next();
 });
 return QR_P;
}
function qrMods(text){const q=window.qrcode(0,'M');q.addData(String(text));q.make();
 return {n:q.getModuleCount(),at:(r,c)=>q.isDark(r,c)};}
function qrSVG(text,px){
 const m=qrMods(text);let d='';
 for(let r=0;r<m.n;r++)for(let c=0;c<m.n;c++)if(m.at(r,c))d+='M'+c+' '+r+'h1v1h-1z';
 return '<svg viewBox="-2 -2 '+(m.n+4)+' '+(m.n+4)+'" width="'+px+'" height="'+px+'" shape-rendering="crispEdges" '+
  'role="img" aria-label="QR code '+esc(text)+'"><rect x="-2" y="-2" width="'+(m.n+4)+'" height="'+(m.n+4)+'" fill="#fff"/>'+
  '<path d="'+d+'" fill="#14120F"/></svg>';
}
/* fill every QR placeholder on screen */
function paintQRs(){
 if(typeof document==='undefined'||!document.querySelectorAll)return;
 const els=[...document.querySelectorAll('[data-qr]')].filter(e=>!e.dataset.done);
 if(!els.length)return;
 loadQR().then(()=>els.forEach(e=>{e.innerHTML=qrSVG(e.dataset.qr,+e.dataset.px||84);e.dataset.done='1';}))
  .catch(()=>els.forEach(e=>{e.classList.add('noqr');}));
}
/* draw a QR into a PDF, merging dark runs so the file stays small */
function pdfQR(doc,text,x,y,size){
 if(!window.qrcode)return false;
 const m=qrMods(text),u=size/m.n;
 doc.setFillColor(20,18,15);
 for(let r=0;r<m.n;r++){let c=0;
  while(c<m.n){if(!m.at(r,c)){c++;continue;}let e=c;while(e<m.n&&m.at(r,e))e++;
   doc.rect(x+c*u,y+r*u,(e-c)*u+0.02,u+0.02,'F');c=e;}}
 return true;
}

async function pickByNo(raw,cb){
 const hit=String(raw||'').match(/[A-Za-z]{1,5}\s*-?\s*M?\s*-?\s*\d{1,6}/i);
 const no=normNo(hit?hit[0]:raw);if(!no)return false;
 const hasNo=x=>x.clientNo===no||x.memberNo===no;
 let c=CUSTS.find(hasNo);
 if(!c){try{const s=await getDocs(query(collection(db,'customers'),where(isMem(no)?'memberNo':'clientNo','==',no),limit(2)));
  s.docs.forEach(d=>{const x={id:d.id,...d.data()};if(!CUSTS.find(y=>y.id===x.id))CUSTS.push(x);});}catch(e){}
  c=CUSTS.find(hasNo);}
 if(!c||c.active===false)return false;
 stopScan();cb(c);return true;
}

 /* whoever has ever bought a real package is a member, numbered in the order they first bought one */

 cps.filter(p=>p.customerId&&p.packageId&&!p.prepaid).forEach(p=>{
  if(first[p.customerId]===undefined||String(p.soldAt||'')<String(first[p.customerId]))first[p.customerId]=p.soldAt||'';});

 };

/* ============ members: buying a package makes a client a member ============ */
/* A client who only comes for single treatments keeps a client number (KUL-00123).
   The first real package they buy gives them a member number from a separate series
   (KUL-M00012), kept in clientSeq/{branch}_M. The old client number stays on record. */
async function assignMemberNo(cid,extra){
 const c=cust(cid);
 const bid=(c&&c.branchId)||ME.branchId,code=brCode(bid);
 const seqRef=doc(db,'clientSeq',bid+'_M'),cref=doc(db,'customers',cid);
 const now=new Date().toISOString();
 const res=await runTransaction(db,async tx=>{
  const cs=await tx.get(cref);if(!cs.exists())throw new Error('Client not found.');
  const d=cs.data();if(d.memberNo)return {no:d.memberNo,fresh:false};
  const ss=await tx.get(seqRef);const n=(ss.exists()?(+ss.data().n||0):0)+1;
  const no=fmtMem(code,n);
  ss.exists()?tx.update(seqRef,{n,code,at:now}):tx.set(seqRef,{n,code,at:now});
  tx.update(cref,{memberNo:no,memberSince:now,memberBy:UID,memberSaleId:(extra&&extra.saleId)||'',wantMember:false});
  return {no,fresh:true};});
 if(c){c.memberNo=res.no;c.wantMember=false;if(res.fresh){c.memberSince=now;c.memberSaleId=(extra&&extra.saleId)||'';}}
 return res;
}
/* right after a package is paid for; offline, the client is flagged and numbered later */
async function makeMember(cid,extra){
 if(!cid)return null;
 try{
  const r=await Promise.race([assignMemberNo(cid,extra),new Promise((_,rej)=>setTimeout(()=>rej(new Error('slow')),6000))]);
  if(r.fresh){const c=cust(cid)||{};
   await audit('New member',r.no+' · '+(c.name||'')+(c.clientNo?' (was client '+c.clientNo+')':''));
   logEvent('sale','New member '+r.no,(c.name||'')+' bought a package',{refType:'cust',refId:cid});}
  return r;
 }catch(e){
  console.warn('member no',e);
  try{await updateDoc(doc(db,'customers',cid),{wantMember:true});const c=cust(cid);if(c)c.wantMember=true;}catch(_){}
  toast('Package saved — the member number is given once the tablet is back online');
  return null;
 }
}
let MEMTRY={};
function retryMember(c){

}

function drawConsult(P,c){
 const {doc}=P,k=25.4/72,H=841.89,X=v=>v*k,Y=v=>(H-v)*k;
 const rgb=a=>a.map(v=>Math.round(v*255));
 const replay=ops=>ops.forEach(o=>{switch(o[0]){
  case 'c':doc.setFillColor(...rgb(o.slice(1)));doc.setTextColor(...rgb(o.slice(1)));break;
  case 'C':doc.setDrawColor(...rgb(o.slice(1)));break;
  case 'w':doc.setLineWidth(o[1]*k);break;
  case 'L':doc.line(X(o[1]),Y(o[2]),X(o[3]),Y(o[4]));break;
  case 'R':doc.rect(X(o[1]),Y(o[2]+o[4]),o[3]*k,o[4]*k);break;
  case 'O':doc.circle(X(o[1]),Y(o[2]),o[3]*k,'F');break;
  case 'T':doc.setFont('helvetica',o[4]?'bold':'normal');doc.setFontSize(o[3]);
   doc.text(pdfText(o[5]),X(o[1]),Y(o[2]),o[6]?{align:o[6]==='c'?'center':'right'}:undefined);break;}});
 const no=c?idOf(c):'';
 const top=()=>{
  try{doc.addImage(LUUNA_LOGO,'PNG',X(219.18),Y(826.99),151.08*k,44.34*k);}catch(e){}
  if(no){pdfQR(doc,no,176,5.5,19);doc.setFont('helvetica','bold');doc.setFontSize(7.2);doc.setTextColor(34,31,28);
   doc.text(no,185.5,27.4,{align:'center'});}
 };
 const put=(pg,label,v)=>{const f=CONSULT[pg+'f'][label];if(!f||!v)return;
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(20,18,15);
  doc.text(doc.splitTextToSize(pdfText(v),(f[2]-f[0]-4)*k)[0]||'',X(f[0]+2),Y(f[1]+2.4));};

function drawTreatSheet(P,c,o){
 const {doc,T,font}=P;
 const INK=[34,31,28],GREY=[110,105,98],RULE=[160,154,146],BAND=[232,228,222],FRAME=[150,145,138];
 o=o||{};
 const no=idOf(c);
 /* logo, centred */
 try{doc.addImage(LUUNA_LOGO,'PNG',80.5,6.6,49,14.4);}catch(e){font(22,'normal',INK);T('LUUNA',105,17,{align:'center'});}
 /* the member's QR and number, top right */
 if(no){pdfQR(doc,no,176,5.5,19);font(7.2,'bold',INK);T(no,185.5,27.4,{align:'center'});}
 font(12.5,'normal',INK);T('REKOD SESI RAWATAN PELANGGAN',105,29.2,{align:'center'});
 font(7.6,'normal',INK);T('Lampiran kepada Borang Rundingan Pelanggan '+'\u2022'+' Empat sesi setiap helaian',105,34.6,{align:'center'});
 /* who and what */
 const line=(x1,x2,y)=>{doc.setDrawColor(...RULE);doc.setLineWidth(0.25);doc.line(x1,y,x2,y);};
 const fill=(v,x,y,w)=>{if(!v)return;font(9.2,'bold',INK);doc.text(doc.splitTextToSize(pdfText(v),w)[0],x+1,y-1.1);};
 font(8.6,'normal',INK);T('Nama pelanggan:',12.7,42.2);line(43.5,132.4,43.4);fill(c.name,43.5,43.4,88);
 font(8.6,'normal',INK);T('No. pelanggan:',137.8,42.2);line(164.5,197.2,43.4);fill(no,164.5,43.4,32);
 font(8.6,'normal',INK);T('Program / pakej:',12.7,49.5);line(41.5,132.4,50.7);fill(o.program,41.5,50.7,90);
 font(8.6,'normal',INK);T('Helaian no.:',137.8,49.5);line(159.4,197.2,50.7);fill(o.sheet,159.4,50.7,37);
 font(7,'normal',INK);T('Semak borang rundingan sebelum setiap sesi. Catat sebarang perubahan yang berkaitan.',12.7,55.8);
 /* four session blocks */
 const X0=12.7,X1=197.2,W=X1-X0,LAB=60.6;
 for(let k=0;k<4;k++){
  const top=61+k*53.7;
  doc.setFillColor(...BAND);doc.rect(X0,top,W,7,'F');
  doc.setDrawColor(...FRAME);doc.setLineWidth(0.3);doc.rect(X0,top,W,50.8);
  const sn=o.start?o.start+k:0;
  font(7.4,'bold',INK);T('SESI KE:',15.9,top+4.8);
  if(sn&&(!o.total||sn<=o.total)){font(9,'bold',INK);T(String(sn)+(o.total?' / '+o.total:''),28.6,top+4.8);}
  else{doc.setDrawColor(...INK);doc.setLineWidth(0.2);doc.line(28.4,top+5.2,38,top+5.2);}
  font(7.4,'normal',INK);T('Tarikh:',64,top+4.8);line(75.6,116,top+5.3);T('Masa:',123.5,top+4.8);line(133.7,194,top+5.3);
  const rows=[['Sebelum rawatan','Aduan lalu / perubahan*'],['Rawatan dijalankan','Produk / alat / tetapan'],['Selepas rawatan','Reaksi / tindakan / susulan']];
  rows.forEach((r,i)=>{const y=top+7+i*10.7;
   doc.setDrawColor(...FRAME);doc.setLineWidth(0.2);doc.line(X0,y,X1,y);
   font(7.6,'bold',INK);T(r[0],15.9,y+3.9);font(6.2,'normal',INK);T(r[1],15.9,y+7.4);
   line(63.5,194,y+5.2);line(63.5,194,y+9.2);});
  doc.setDrawColor(...FRAME);doc.setLineWidth(0.2);
  doc.line(LAB,top+7,LAB,top+39.1);
  const sy=top+39.1;doc.line(X0,sy,X1,sy);doc.line(74.6,sy,74.6,top+50.8);doc.line(135.9,sy,135.9,top+50.8);
  font(6.4,'bold',INK);
  T('Tandatangan pelanggan',15.9,sy+3.2);T('selepas rawatan',15.9,sy+6);
  T('Nama & tandatangan',77.2,sy+3.2);T('terapis',77.2,sy+6);
  T('Nama & tandatangan perunding /',138.4,sy+3.2);T('pengurus cawangan',138.4,sy+6);
  line(15.9,71.5,sy+10.2);line(77.2,133,sy+10.2);line(138.4,194.5,sy+10.2);
 }
 font(7,'normal',INK);
 T('*Catat maklum balas sesi lalu serta perubahan kulit, kesihatan, ubat atau produk.',12.7,277.1);
 T('Tandatangan pelanggan mengesahkan sesi telah dijalankan dan arahan penjagaan telah diterangkan.',12.7,281.8);
 font(6.8,'normal',INK);T('SULIT '+'\u2022'+' REKOD PELANGGAN'+(no?'  '+'\u2022'+'  '+no:''),12.7,289.6);
 T('Kepilkan bersama borang rundingan.',197.2,289.6,{align:'right'});
}
/* as many sheets as the package has sessions, numbered through: sheet 1 has sessions 1–4 */
function drawPkgSheets(P,c,cps,first){
 const total=cps.reduce((a,cp)=>a+(cp.balances||[]).reduce((x,b)=>x+(+b.total||0),0),0);
 const program=cps.map(cp=>cpName(cp)).join(' + ');
 const n=Math.max(1,Math.ceil(total/4));
 for(let i=0;i<n;i++){
  if(i||!first)P.doc.addPage();
  drawTreatSheet(P,c,{program,sheet:(i+1)+' / '+n,start:i*4+1,total});
 }
 return n;
}
window.pkgConfPDF=async(saleId,how)=>{
 const s=findSale(saleId);if(!s){toast('Bill not found');return;}
 let c=cust(s.customerId);
 if(!c&&s.customerId){try{const d=await getDoc(doc(db,'customers',s.customerId));if(d.exists()){c={id:d.id,...d.data()};CUSTS.push(c);}}catch(e){}}
 if(!c){toast('This bill has no registered client');return;}
 if(!c.memberNo){const r=await makeMember(c.id,{saleId});if(!r){return;}}
 toast('Preparing the PDF…');
 try{
  const [jsPDF]=await Promise.all([loadJsPDF(),loadQR().catch(()=>null)]);
  const cps=await salePkgs(s);
  const P=paperDoc(jsPDF);
  drawPkgConf(P,c,s,cps);
  drawPkgSheets(P,c,cps,false);
  const name='Pengesahan-Pakej-'+c.memberNo+'-'+String(s.invoiceNo||'').replace(/[^\w-]/g,'')+'.pdf';
  window.__lastPDF={kind:'pkgconf',name,doc:P.doc};
  if(how==='share'&&navigator.canShare){
   const file=new File([P.doc.output('blob')],name,{type:'application/pdf'});
   if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name.replace('.pdf','')});return;}
  }
  P.doc.save(name);
  await audit('Printed','Package confirmation · '+c.memberNo+' '+c.name+' · '+(s.invoiceNo||''));
 }catch(e){if(e&&e.name==='AbortError')return;console.error(e);toast(friendly(e));}
};
/* signed and back in the member's folder: recorded on each package the bill bought */
window.pkgSigned=async(saleId,from)=>{
 const cps=HELD.filter(p=>p.saleId===saleId&&!p.prepaid);
 if(!cps.length){toast('Package not loaded yet');return;}
 const on=!cps.every(p=>p.confirmSigned);
 const v=on?{at:new Date().toISOString(),by:(typeof actorId==='function'&&actorId())||UID,
  byName:typeof actorName==='function'?actorName():ME.name}:null;
 try{
  for(const p of cps){await updateDoc(doc(db,'customerPackages',p.id),{confirmSigned:v});p.confirmSigned=v;}
  const s=findSale(saleId)||{};
  if(on)await audit('Package confirmation signed',cnoOf(s.customerId)+' '+(s.customerName||'')+' · '+(s.invoiceNo||''));
  if(from==='list')window.pkgFormList();
  else if(from==='receipt')window.showReceipt(saleId);
  else rerenderClient(cps[0].customerId);
 }catch(e){toast(friendly(e));}
};
/* the strip at the top of a receipt that bought a package */
function pkgBanner(s){
 if(!saleHasPkg(s)||!s.customerId||s.voided)return '';
 const c=cust(s.customerId)||{};
 const cps=HELD.filter(p=>p.saleId===s.id&&!p.prepaid);
 const signed=cps.length&&cps.every(p=>p.confirmSigned);
 const fresh=c.memberSaleId===s.id;
 setTimeout(paintQRs,0);
 return '<div class="card memban noprint">'+
  (c.memberNo?'<span class="pfqr" data-qr="'+esc(c.memberNo)+'" data-px="64" style="width:64px;height:64px"></span>':'<span class="pfqr empty">'+ic('qr',24)+'</span>')+
  '<div style="flex:1;min-width:0"><div class="tiny muted">'+(fresh?'<span class="memtag">'+ic('star',11)+'New member</span>':
   '<span class="memtag">'+ic('star',11)+'Member</span>')+(fresh&&c.clientNo?' · <span style="white-space:nowrap">was client '+esc(c.clientNo)+'</span>':'')+'</div>'+
  '<div class="pfno" style="font-size:19px">'+esc(c.memberNo||'number coming')+'</div>'+
  '<div class="tiny muted">'+(signed?ic('check',12)+' Confirmation signed by the member':'Print the package confirmation for the member to sign')+'</div></div>'+
  '<div class="membtns"><button class="btn sm" onclick="pkgConfPDF(\''+s.id+'\')">'+ic('print',14)+'Package confirmation form</button>'+
  (cps.length?'<button class="btn sm ghost" onclick="pkgSigned(\''+s.id+'\',\'receipt\')">'+ic('check',14)+(signed?'Signed · undo':'Mark signed')+'</button>':'')+
  '</div></div>';
}

function pkgConfLine(p){

  '<button class="btn sm ghost" onclick="pkgConfPDF(\''+p.saleId+'\')">'+ic('print',13)+'Confirmation form</button>'+
  (p.confirmSigned?'<span class="pill g">'+ic('check',11)+'signed '+dshort(p.confirmSigned.at)+'</span>'
   :'<button class="btn sm ghost" onclick="pkgSigned(\''+p.saleId+'\')">'+ic('check',13)+'Mark signed</button>')+'</div>';
}
/* packages sold lately whose confirmation is not yet signed and filed */
function pkgFormsDue(){
 const by={};

/* ============ hands-on therapist and commission ============ */
/* Two different people can earn from one treatment: whoever sold it (the existing
   sales commission) and whoever actually performed it (hands-on commission). Each
   treatment in the catalogue carries a hands-on rule; checkout fills the amount from
   it and lets the counter adjust it before the bill is saved. */
const isTreatment=i=>i.kind==='service'||i.kind==='redeem';
/* a treatment paid for now but done on a later visit has nobody's hands on it yet */
const needsHandsOn=i=>isTreatment(i)&&!i.later;
/* the display name of any balance on a client's account */
const cpName=cp=>(cp&&cp.name)||((typeof pkgOf==='function'?pkgOf(cp&&cp.packageId):{}).name)||'Package';
function handsOnRule(serviceId){
 const s=svc(serviceId)||{};
 if(s.handsOnType==='rm')return 'RM'+r2(s.handsOnValue||0).toFixed(2)+' per session';
 if(s.handsOnType==='pct')return (+s.handsOnValue||0)+'% of '+rm(s.price||0);
 return 'no hands-on rule set';
}
function handsOnFor(serviceId,qty){
 const s=svc(serviceId)||{},q=qty||1;
 if(s.handsOnType==='rm')return r2((+s.handsOnValue||0)*q);
 if(s.handsOnType==='pct')return r2((+s.price||0)*(+s.handsOnValue||0)/100*q);
 return 0;
}
const handsOnStaff=()=>D.staff.filter(x=>x.branchId===ME.branchId&&x.active!==false&&x.role!=='branch')
 .sort((a,b)=>(b.takes?1:0)-(a.takes?1:0)||String(a.name).localeCompare(String(b.name)));
/* best guess at who did it: today's appointment for this client and treatment */
function guessHandsOn(serviceId,creditedId){
 const a=APPTS.filter(x=>x.customerId===cart.customerId&&x.serviceId===serviceId&&x.date===today()&&
  ['in','done','confirm','booked'].includes(x.status)).sort((x,y)=>
  (['in','done'].includes(y.status)?1:0)-(['in','done'].includes(x.status)?1:0))[0];
 if(a&&a.staffId)return a.staffId;
 const cr=stf(creditedId);
 return cr&&cr.takes?creditedId:'';
}
function applyHandsOn(line){
 if(!isTreatment(line)||line.later)return line;
 if(line.handsOnId===undefined)line.handsOnId=guessHandsOn(line.id,line.staffId);
 if(!line.handsOnEdited)line.handsOnComm=handsOnFor(line.id,line.qty);

function handsOnTotals(sales){

/* ============ professional PDF receipt ============ */
/* Drawn as a real A4 document (text stays sharp and searchable), not a screenshot.
   jsPDF is fetched only the first time someone asks for a PDF. */
let JSPDF_P=null;
function loadJsPDF(){
 if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve(window.jspdf.jsPDF);
 if(JSPDF_P)return JSPDF_P;
 const srcs=['https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
 JSPDF_P=new Promise((res,rej)=>{
  let i=0;
  const next=()=>{
   if(i>=srcs.length){JSPDF_P=null;rej(new Error('Could not load the PDF tool — check the internet connection.'));return;}
   const sc=document.createElement('script');sc.src=srcs[i++];sc.async=true;
   sc.onload=()=>(window.jspdf&&window.jspdf.jsPDF)?res(window.jspdf.jsPDF):next();
   sc.onerror=next;
   (document.head||document.body).appendChild(sc);
  };
  next();
 });
 return JSPDF_P;
}

window.checkout=async()=>{
 const btn=$('#co-go');if(btn)btn.disabled=true;
 const t=cartTotals();
 if(isBranch()&&!cashierValid()){if(btn)btn.disabled=false;toast('Choose the cashier first');window.pickCashier();return;}
 try{
  // prices are re-read from the catalogue, never trusted from the cart UI
  const items=cart.items.map(i=>{
   const ho=needsHandsOn(i)?{handsOnId:i.handsOnId||'',handsOnName:i.handsOnId?(stf(i.handsOnId).name||''):'',
    handsOnComm:r2(i.handsOnComm||0)}:(i.later?{later:true,laterDays:i.laterDays||prepaidDays()}:{});
   if(i.later&&!cart.customerId)
    throw new Error('A treatment paid now and done later has to be kept on a client\'s account. Choose the client.');
   if(needsHandsOn(i)&&!i.handsOnId)
    throw new Error('Choose who did the hands-on for '+i.name+' — tap the line under it.');
   const ap=i.apptId?{apptId:i.apptId}:{};
   if(i.kind==='redeem'){const sv=svc(i.id);
    return lineForSale(i,{kind:'redeem',id:i.id,name:sv.name||i.name,price:0,qty:i.qty,staffId:i.staffId,
     cpId:i.cpId,line:i.line,pkgName:i.pkgName||'',...ho,...ap});}
   if(i.kind==='addon'){const a=addonOf(i.id);
    if(!a)throw new Error(i.name+' is no longer an add-on in the catalogue. Remove it and add it again.');
    const out=lineForSale({...i,commAmt:undefined},{kind:'addon',id:i.id,name:a.name,price:+a.price||0,qty:i.qty,staffId:i.staffId,
     parentName:i.parentName||''});
    if(i.commManual){if(!canComm())throw new Error('Only a manager can change commission on '+a.name+'.');
     out.commAmt=r2(+i.commAmt||0);out.commManual=true;}
    else out.commAmt=addonComm(a,out);
    return out;}
   const src=itemSrc(i.kind,i.id);
   if(!src||!src.name)throw new Error(i.name+' is no longer in the catalogue. Remove it and add it again.');
   const setBits=i.kind==='set'?{setItems:(src.items||[]).map(z=>({sku:z.sku,qty:+z.qty||1,name:prod(z.sku).name||z.sku}))}:{};
   return lineForSale(i,{kind:i.kind,id:i.id,name:src.name,price:src.price,qty:i.qty,staffId:i.staffId,...ho,...ap,...setBits});});
  items.forEach((it,k)=>{const src=cart.items[k];if(src&&src.tip)it.tip=src.tip;});
  if(items.some(i=>i.kind==='package'||i.kind==='redeem')&&!cart.customerId)
   throw new Error('A package needs a client. Choose the client before taking payment.');
  const sub=r2(items.reduce((a,i)=>a+lineAmt(i),0));
  const lineDiscTotal=r2(items.reduce((a,i)=>a+(+i.lineDisc||0),0));
  for(const i of items.filter(x=>x.kind==='set')){const sh=setShort(i.id,items.filter(z=>z.kind==='set'&&z.id===i.id).reduce((a,z)=>a+z.qty,0));
   if(sh)throw new Error(sh);}
  if(cart.voucher){const fresh=D.vouchers.find(x=>x.id===cart.voucher.id)||null;
   const vp=voucherProblem(fresh,sub,cart.customerId);
   if(vp)throw new Error('Voucher '+cart.voucher.id+': '+vp+' Remove it to continue.');
   cart.voucher=fresh;}
  const v=cart.voucher?(cart.voucher.type==='pct'?sub*cart.voucher.value/100:cart.voucher.value):0;
  const pd=pointsWorth(cart.points||0);
  const net=Math.max(0,sub-cart.discount-v-pd);
  const sst=D.meta.biz.sst?net*(D.meta.biz.sstRate||8)/100:0;
  const total=net+sst;
  const c=cust(cart.customerId);
  const invoiceNo=(DEMO?'DEMO-':'INV-')+Date.now().toString().slice(-8);
  /* what was handed over, what was given back, and what is still owed */
  const nowIso=new Date().toISOString();
  const tendered=r2(cart.payments.reduce((a,p)=>a+p.amount,0));
  const change=Math.max(0,r2(tendered-total));
  const pays=cart.payments.map(p=>({method:p.method,amount:r2(p.amount),...(p.ref?{ref:String(p.ref)}:{}),at:nowIso,date:today(),
   by:actorId()||UID,byName:actorName()}));
  if(change>0){ /* the change comes back out of the last cash payment */
   const cashP=[...pays].reverse().find(p=>isCashMethod(p.method))||pays[pays.length-1];
   cashP.amount=r2(cashP.amount-change);cashP.tendered=r2(cashP.amount+change);
  }
  const paid=r2(Math.min(tendered,total)),balance=Math.max(0,r2(total-paid));
  if(balance>0.009){
   if(!cart.customerId||!cart.instal)throw new Error('The bill is not fully paid. Take the rest, '+
    'or tick "Pay the rest later" for a registered client.');
   if(paid<=0&&!confirm('Nothing is being paid today. Record the whole '+rm(total)+' as owed by '+
    (c?c.name:'the client')+'?'))throw new Error('Cancelled — nothing saved.');
  }
  /* package sessions are taken off first, so a bill is never saved for sessions that are gone */
  const reds=items.filter(i=>i.kind==='redeem');
  for(const cpId of [...new Set(reds.map(r=>r.cpId))]){
   const lines=reds.filter(r=>r.cpId===cpId);
   let after=null;
   await runTransaction(db,async tx=>{
    const pref=doc(db,'customerPackages',cpId);
    const snap=await tx.get(pref);
    if(!snap.exists())throw new Error('A package on this bill no longer exists.');
    const d=snap.data();
    if(d.customerId!==cart.customerId)throw new Error('That package belongs to another client.');
    const bal=(d.balances||[]).map(b=>({...b}));
    for(const r of lines){
     if(!bal[r.line]||bal[r.line].left<r.qty)
      throw new Error('Not enough sessions left for '+r.name+'. Someone may have just redeemed one.');
     bal[r.line].left-=r.qty;r.remaining=bal[r.line].left;r.packageId=d.packageId;
    }
    tx.update(pref,{balances:bal,lastRedeemedAt:nowIso,lastRedeemedBy:UID});
    after=bal;
   });
   const local=HELD.find(h=>h.id===cpId);if(local)local.balances=after;
  }
  if(cart.voucher)await spendVoucher(cart.voucher,invoiceNo,cart.customerId);
  for(const i of items.filter(x=>x.discCode)){const lv=findVoucher(i.discCode);if(lv)await spendVoucher(lv,invoiceNo,cart.customerId);}
  const ref=await addDoc(collection(db,'sales'),{branchId:ME.branchId,customerId:cart.customerId||'',
   customerName:c?c.name:'Walk-in',customerNo:idOf(c),...(cart.upsell&&cart.upsell.length?{upsell:[...new Set(cart.upsell)]}:{}),staffId:actorId()||UID,staffName:actorName(),items,
   cashierId:actorId()||UID,cashierName:actorName(),cashierVerified:cashierValid()||!isBranch(),
   discount:cart.discount+v+pd,pointsUsed:cart.points||0,
   voucher:cart.voucher?cart.voucher.id:'',voucherKind:cart.voucher?(cart.voucher.kind||'campaign'):'',
   voucherAmt:r2(v),lineDiscTotal,sst,total,date:today(),at:new Date().toISOString(),
   voided:false,payments:pays,createdBy:UID,invoiceNo,
   net:r2(net),paid,balance,status:balance>0?'partial':'paid',
   dueDate:balance>0?(cart.dueDate||''):'',tendered,change,
   lastPaidDate:paid>0?today():'',lastPaidAt:paid>0?nowIso:''});
  cashierUsed();
  if(balance>0)OUTSTANDING.unshift({id:ref.id,branchId:ME.branchId,customerId:cart.customerId,
   customerName:c?c.name:'',items,total,net:r2(net),paid,balance,status:'partial',
   dueDate:cart.dueDate||'',payments:pays,invoiceNo,date:today(),at:nowIso});
  /* one redemption record per session used, for the client's history */
  for(const r of reds){
   for(let k=0;k<r.qty;k++){
    await addDoc(collection(db,'redemptions'),{customerId:cart.customerId,customerName:c?c.name:'',
     customerPackageId:r.cpId,packageId:r.packageId||'',serviceId:r.id,serviceName:r.name,
     remaining:r.remaining+(r.qty-1-k),branchId:ME.branchId,staffId:actorId()||UID,staffName:actorName(),
     therapistId:r.handsOnId||r.staffId,therapistName:r.handsOnName||stf(r.staffId).name||'',
     handsOnComm:r.qty?r2((r.handsOnComm||0)/r.qty):0,saleId:ref.id,invoiceNo,
     at:nowIso,date:today()});
   }
  }
  /* each package on the bill becomes a balance on the client's account. Its value is
     what was actually paid for it after bill discounts, so package liability stays true. */
  const share=sub>0?net/sub:1;
  const newPkgs=[];
  for(const i of items.filter(x=>x.kind==='package')){
   const pk=pkgOf(i.id);
   for(let k=0;k<i.qty;k++){
    const paid=Math.round(lineAmt(i)/(i.qty||1)*share*100)/100;
    const r=await addDoc(collection(db,'customerPackages'),{customerId:cart.customerId,
     customerName:c?c.name:'',packageId:pk.id,price:paid,listPrice:pk.price,branchId:ME.branchId,
     soldAt:new Date().toISOString(),expiry:ymd(addDays(new Date(),pk.days||365)),soldBy:i.staffId||UID,
     saleId:ref.id,invoiceNo,
     balances:(pk.items||[]).map(z=>({serviceId:z.serviceId,left:z.n,total:z.n}))});
    newPkgs.push(pk.name);
   }
  }
  /* the first real package makes the client a member, with a member number of their own */
  const memb=(items.some(x=>x.kind==='package')&&cart.customerId)?await makeMember(cart.customerId,{saleId:ref.id}):null;
  /* treatments paid now, done later: each becomes a one-treatment balance to redeem */
  for(const i of items.filter(x=>x.later)){
   const sv=svc(i.id);
   const paid=Math.round(lineAmt(i)*share*100)/100;
   await addDoc(collection(db,'customerPackages'),{customerId:cart.customerId,customerName:c?c.name:'',
    packageId:'',prepaid:true,name:(sv.name||i.name)+' (prepaid)',price:paid,listPrice:r2((i.price||0)*i.qty),
    branchId:ME.branchId,soldAt:new Date().toISOString(),
    expiry:ymd(addDays(new Date(),i.laterDays||prepaidDays())),soldBy:i.staffId||UID,saleId:ref.id,invoiceNo,
    balances:[{serviceId:i.id,left:i.qty,total:i.qty}]});
   newPkgs.push((sv.name||i.name)+' (prepaid)');
  }
  const lowAfter=[];
  for(const i of items){
   if(i.kind==='product'){const st=stockOf(i.id);if(st){await updateDoc(doc(db,'stock',st.id),{qty:increment(-i.qty)});st.qty-=i.qty;}}
   if(i.kind==='set')for(const z of (i.setItems||[])){const st=stockOf(z.sku);const n=(+z.qty||1)*i.qty;
    if(st){await updateDoc(doc(db,'stock',st.id),{qty:increment(-n)});st.qty-=n;}}
   if(((i.kind==='service'&&!i.later)||i.kind==='redeem')&&!stockTakenByAppt(i,cart.customerId)){for(const u of (svc(i.id).use||[])){const st=stockOf(u.sku);
    if(st){await updateDoc(doc(db,'stock',st.id),{qty:increment(-u.qty*i.qty)});st.qty-=u.qty*i.qty;}}}
  }
  D.stock.filter(st=>st.branchId===ME.branchId&&st.qty<=st.reorder&&
   items.some(i=>i.id===st.sku||(i.setItems||[]).some(z=>z.sku===st.sku)||(svc(i.id).use||[]).some(u=>u.sku===st.sku)))
   .forEach(st=>lowAfter.push((prod(st.sku).name||st.sku)+' ('+st.qty+' left)'));
  if(lowAfter.length)logEvent('stock','Stock running low',lowAfter.join(', '),{refType:'stock'});
  let earned=0;
  if(cart.customerId){
   if(cart.points>0)await spendPoints(cart.customerId,c?c.name:'',cart.points,invoiceNo);
   /* points on what was paid today; later instalments earn the rest as they come in */
   earned=await awardPoints(cart.customerId,c?c.name:'',total>0?net*paid/total:0,invoiceNo);
  }
  const auto=await completeFromSale(ref.id,invoiceNo,cart.customerId,items);
  logEvent('sale','Bill '+invoiceNo+' · '+rm(total),(c?c.name:'Walk-in')+' · '+
   items.map(i=>i.qty+'× '+i.name).join(', ').slice(0,120)+(balance>0?' · '+rm(balance)+' outstanding':''),
   {refType:'sale',refId:ref.id,amount:r2(total)});
  await audit('Bill completed',invoiceNo+' · '+rm(total)+' · '+(c?c.name:'Walk-in')+
   (newPkgs.length?' · packages: '+newPkgs.join(', '):'')+(auto.done?' · '+auto.done+' booking(s) completed':''));
  const ov=items.filter(i=>i.listPrice!==undefined||i.lineDisc>0||i.commAmt!==undefined);
  if(ov.length)await audit('Line price or discount',invoiceNo+' · '+ov.map(i=>i.name+(i.listPrice!==undefined?' '+rm(i.listPrice)+'→'+rm(i.price):'')+
   (i.lineDisc>0?' −'+rm(i.lineDisc)+(i.discCode?' ('+i.discCode+')':i.discNote?' ('+i.discNote+')':''):'')+
   (i.commAmt!==undefined?' comm '+rm(i.commAmt):'')).join('; '));
  cart={customerId:'',items:[],discount:0,voucher:null,payments:[],points:0,walkin:false,
   instal:false,dueDate:''};
  await loadRecentSales();
  /* come-back voucher: issued here when the owner chose "automatically" */
  let autoRV=null;
  if(rvSet().on&&rvSet().mode==='auto'){
   const saved=findSale(ref.id)||{id:ref.id,customerId:c?c.id:'',customerName:c?c.name:'',total,invoiceNo,
    branchId:ME.branchId,voided:false};
   if(!rvWhyNot(saved)){try{autoRV=await issueRV(saved);}catch(e){}}
  }
  if(newPkgs.length)await loadHeld();
  render();
  if(balance>0)toast('Saved · '+rm(balance)+' outstanding for '+(c?c.name:'the client'));
  else if(reds.length)toast(reds.reduce((a,r)=>a+r.qty,0)+' package session'+
   (reds.reduce((a,r)=>a+r.qty,0)>1?'s':'')+' redeemed');
  else if(newPkgs.length)toast(newPkgs.length+' balance'+(newPkgs.length>1?'s':'')+' added to '+(c?c.name:'the client')+
   (items.some(x=>x.later)?' — redeem at the visit':''));
  else if(earned)toast('Bill saved · '+earned+' loyalty points earned');
  if(autoRV)toast('Bill saved · come-back voucher '+autoRV.id+' issued');
  window.openSale(ref.id);
  if(memb&&memb.fresh)toast((c?c.name:'Client')+' is now a member · '+memb.no);
 }catch(e){toast(friendly(e));if(btn)btn.disabled=false;}};

window.deleteCust=id=>{
 const c=cust(id);if(!c)return;
 modal('Remove '+c.name,'<div class="card">'+
  '<div class="warnbox">'+ic('alert',14)+' Bills, appointments and package records keep their own copy of '+
  'the name, so your accounts and history stay complete either way.</div>'+
  '<label>Reason * <span class="muted">— recorded in the audit trail</span></label>'+
  '<textarea class="f" id="dc-r" rows="3" placeholder="Duplicate record, client asked to be removed, entered by mistake"></textarea>'+
  '<label>What should happen</label>'+
  '<label class="row" style="gap:9px"><input type="radio" name="dcmode" value="archive" checked> '+
   '<span><b>Archive</b> — hidden from lists and search, record kept</span></label>'+
  (ME.role==='owner'?'<label class="row" style="gap:9px;margin-top:6px"><input type="radio" name="dcmode" '+
   'value="erase"> <span><b>Erase permanently</b> — the client record is destroyed and cannot be recovered</span></label>':
   '<p class="tiny muted" style="margin-top:6px">Only the owner can erase a record permanently.</p>')+
  '<div id="dc-err" class="tiny" style="color:var(--rose);margin:8px 0"></div>'+
  '<button class="btn warn" style="width:100%;justify-content:center;margin-top:10px" id="dc-go">'+
   ic('trash',16)+'Continue</button></div>',
 ()=>{$('#dc-go').onclick=async()=>{
  const why=($('#dc-r').value||'').trim();
  if(why.length<5){$('#dc-err').textContent='Please write a reason of at least five characters.';return;}
  const mode=(document.querySelector('input[name=dcmode]:checked')||{value:'archive'}).value;
  if(mode==='erase'&&!confirm('Erase '+c.name+' permanently? This cannot be undone.'))return;
  $('#dc-go').disabled=true;
  try{
   if(mode==='erase'){
    await addDoc(collection(db,'audit'),{action:'Client erased',
     detail:c.name+' ('+(c.phone||'no phone')+') — '+why,uid:UID,userName:ME.name,
     branchId:ME.branchId,at:new Date().toISOString()});
    await deleteDoc(doc(db,'customers',id));
   }else{
    await updateDoc(doc(db,'customers',id),{active:false,archivedAt:new Date().toISOString(),
     archivedBy:UID,archivedByName:ME.name,archiveReason:why});
    await audit('Client archived',c.name+' — '+why);
   }
   CUSTS=CUSTS.filter(x=>x.id!==id);
   window.closeModal();TAB='cust';render();bindCustSearch();
   toast(mode==='erase'?'Record erased and logged':'Client archived');
  }catch(e){$('#dc-err').textContent=friendly(e);$('#dc-go').disabled=false;}};});};

/* a new code means a new document: copy it, move stock and links, then remove the old one */
async function renameProduct(from,to,data){
 const old=prod(from);
 const b=writeBatch(db);
 const {id:_oid,...oldRest}=old;
 b.set(doc(db,'products',to),{...oldRest,...data,renamedFrom:from});
 D.stock.filter(s=>s.sku===from).forEach(s=>{
  const {id:sid,...rest}=s;
  b.set(doc(db,'stock',s.branchId+'_'+to),{...rest,sku:to});
  b.delete(doc(db,'stock',sid));});
 D.services.filter(sv=>(sv.use||[]).some(u=>u.sku===from)).forEach(sv=>
  b.set(doc(db,'services',sv.id),{use:sv.use.map(u=>u.sku===from?{...u,sku:to}:u)},{merge:true}));
 if(typeof LIB!=='undefined'){
  const g=LIB.find(x=>x.id==='prd_'+from);
  if(g){const {id:gid,...rest}=g;b.set(doc(db,'library','prd_'+to),{...rest,refId:to});b.delete(doc(db,'library',gid));}
  LIB.filter(x=>(x.pairs||[]).includes('prd_'+from)).forEach(x=>
   b.set(doc(db,'library',x.id),{pairs:x.pairs.map(y=>y==='prd_'+from?'prd_'+to:y)},{merge:true}));
 }
 b.delete(doc(db,'products',from));
 await b.commit();
 if(typeof LIB!=='undefined')try{await loadLibrary();}catch(e){}
}

/* ============ images ============ */
/* Firebase Cloud Storage needs the paid Blaze plan, so pictures are shrunk in the
   browser and stored inline in the Firestore document. A document can hold 1 MB in
   total, so every picture is squeezed under a strict budget before it is saved. */
const IMG_BUDGET={logo:150000,product:110000,notice:420000,paylogo:26000};
function pickImage(kind){
 return new Promise(resolve=>{
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=async e=>{
   const file=e.target.files&&e.target.files[0];
   if(!file)return resolve(null);
   if(!/^image\//.test(file.type)){toast('That file is not an image');return resolve(null);}
   toast('Preparing the image…');
   try{resolve(await compressImage(file,kind));}
   catch(err){console.warn(err);toast('Could not read that image');resolve(null);}
  };
  inp.click();
 });
}
function compressImage(file,kind){
 const budget=IMG_BUDGET[kind]||200000;
 const maxPx=kind==='logo'?420:kind==='paylogo'?180:(kind==='product'?720:1600);
 return new Promise((resolve,reject)=>{
  const fr=new FileReader();
  fr.onerror=()=>reject(new Error('read failed'));
  fr.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error('decode failed'));
   img.onload=()=>{
    let w=img.width,h=img.height;
    const scale=Math.min(1,maxPx/Math.max(w,h));
    w=Math.round(w*scale);h=Math.round(h*scale);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const cx=cv.getContext('2d');
    const alpha=(kind==='logo'||kind==='paylogo')&&/png|webp|svg/i.test(file.type);
    if(!alpha){cx.fillStyle='#ffffff';cx.fillRect(0,0,w,h);}
    cx.drawImage(img,0,0,w,h);
    // A logo is usually placed on a light receipt, so transparency is worth keeping.
    // Try PNG at full size, then at two thirds, before giving up and flattening to JPEG.
    if(alpha){
     const png=cv.toDataURL('image/png');
     if(png.length<=budget)return resolve(png);
     const cvS=document.createElement('canvas');
     cvS.width=Math.round(w*0.66);cvS.height=Math.round(h*0.66);
     cvS.getContext('2d').drawImage(img,0,0,cvS.width,cvS.height);
     const small=cvS.toDataURL('image/png');
     if(small.length<=budget)return resolve(small);
     // flattening loses transparency, so paint white behind it first
     cx.globalCompositeOperation='destination-over';
     cx.fillStyle='#ffffff';cx.fillRect(0,0,w,h);
     cx.globalCompositeOperation='source-over';
    }
    let q=0.86,out=cv.toDataURL('image/jpeg',q);
    while(out.length>budget&&q>0.36){q-=0.1;out=cv.toDataURL('image/jpeg',q);}
    if(out.length>budget){
     // still too heavy: shrink the pixels and try once more
     const cv2=document.createElement('canvas');
     cv2.width=Math.round(w*0.7);cv2.height=Math.round(h*0.7);
     const c2=cv2.getContext('2d');c2.fillStyle='#fff';c2.fillRect(0,0,cv2.width,cv2.height);
     c2.drawImage(img,0,0,cv2.width,cv2.height);
     out=cv2.toDataURL('image/jpeg',0.6);
    }
    if(out.length>budget)return reject(new Error('too large'));
    resolve(out);
   };
   img.src=fr.result;
  };
  fr.readAsDataURL(file);
 });
}
