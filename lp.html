<style>
:root{--cream:#FAF9F6;--surface:#FFFFFF;--surface-2:#F5F2ED;--ink:#0D0D0D;--ink-2:#4E4944;--ink-3:#7D756D;--line:#E6DFD4;--line-2:#EFEBE4;
 --brass:#B2996E;--brass-2:#C4AE8A;--brass-soft:#F1EBE1;--jade:#836E4A;--jade-soft:#F1EBE1;--rose:#9B4A4A;--rose-soft:#F6E5E3;--gold:#D7C5AA;
 --ease:cubic-bezier(.22,.61,.36,1);--shadow:0 1px 2px rgba(13,13,13,.04),0 10px 30px -14px rgba(13,13,13,.22);--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.6 'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body.sheet-open{overflow:hidden}
body.pvm{padding-top:26px}body.pvm .top{top:26px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
.ico{display:inline-flex;flex:none}.ico svg{display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.15}
h2{font-family:var(--serif);font-size:clamp(26px,4.4vw,38px);font-weight:500}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.eyebrow::before{content:'';width:22px;height:1px;background:currentColor}
.sec{padding:64px 0}.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sec-h p{margin:8px 0 0;color:var(--ink-2);max-width:560px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:99px;padding:14px 24px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;
 transition:transform .18s var(--ease),box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--gold);box-shadow:0 14px 30px -14px rgba(13,13,13,.7)}
.btn.pri:hover{box-shadow:0 18px 36px -14px rgba(13,13,13,.8);transform:translateY(-1px)}
.btn.wa{background:#0D0D0D;color:#fff;box-shadow:0 14px 30px -16px rgba(13,13,13,.8)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.light{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:10px 16px;font-size:13.5px}
.btn[disabled]{opacity:.55;pointer-events:none}
/* top bar */
.top{position:sticky;top:0;z-index:40;background:rgba(250,249,246,.86);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid transparent;transition:border-color .2s}
.top.sc{border-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand img,.brand .mk{width:38px;height:38px;border-radius:11px;object-fit:cover;background:var(--ink);color:var(--gold);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:22px;margin-left:auto;font-size:14px}.nav a{text-decoration:none;color:var(--ink-2)}.nav a:hover{color:var(--ink)}
.top .btn{margin-left:14px}
@media(max-width:860px){.nav{display:none}.top .btn{margin-left:auto}}
/* hero */
.hero{padding:34px 0 56px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:-200px -200px auto auto;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(178,153,110,.18),transparent 65%);pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;position:relative}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(36px,6.4vw,62px);letter-spacing:-.03em;line-height:1.04;margin:14px 0 16px}
.hero h1 em{font-style:italic;color:var(--brass)}
.hero .sub{font-size:clamp(16px,2vw,18px);color:var(--ink-2);max-width:520px;margin:0 0 22px}
.rate{text-decoration:none;display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 13px 6px 10px;font-size:13px;margin-bottom:6px}
.rate .st{color:#B2996E;letter-spacing:1px}.rate b{font-weight:700}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.ticks{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);margin:0;padding:0;list-style:none}
.ticks li{display:flex;align-items:center;gap:6px}.ticks .ico{color:var(--jade)}
.hoffer{display:flex;align-items:center;gap:12px;width:100%;max-width:540px;text-align:left;cursor:pointer;border:0;font:inherit;color:var(--cream);background:linear-gradient(120deg,#141414,#1E1C1A);border-radius:18px;padding:13px 14px 13px 16px;margin:2px 0 16px;position:relative;overflow:hidden;box-shadow:0 18px 40px -24px rgba(13,13,13,.7)}
.hoffer::after{content:'';position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(215,197,170,.3),transparent 70%);pointer-events:none}
.hoL{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.hoL small{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.hoL b{font-size:16px;color:#fff;font-weight:600}.hoP{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.hoP strong{font-family:var(--serif);font-size:30px;line-height:1.05;color:var(--gold);font-weight:600;letter-spacing:-.02em}
.hoP s{color:#9B9289;font-size:13.5px}.hoP em{font-style:normal;font-size:11.5px;font-weight:700;background:#B2996E;color:#fff;border-radius:99px;padding:2px 8px}.hoN{font-size:12px;color:#C9C1B6}
.hoR{flex:none;display:flex;align-items:center;gap:4px;background:var(--gold);color:var(--ink);font-weight:700;font-size:13px;border-radius:12px;padding:10px 12px;position:relative;z-index:1}
.hprobs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-8px 0 16px;max-width:540px}.hprobs>span{font-size:12.5px;color:var(--ink-3);margin-right:2px}
.hprobs button{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 11px 5px 8px;cursor:pointer}
.hprobs button .ico{color:var(--jade)}.hprobs button:hover{border-color:var(--brass)}
.hvid{width:100%;height:100%;object-fit:cover;display:block;background:#0D0D0D}
.scap{position:absolute;left:14px;top:14px;z-index:3;background:rgba(13,13,13,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#FAF9F6;font-size:12px;font-weight:600;border-radius:99px;padding:5px 11px;max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scap[hidden]{display:none}
.hplay{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:3;display:flex;align-items:center;gap:8px;border:0;cursor:pointer;font:inherit;font-weight:600;font-size:14px;background:rgba(255,255,255,.94);color:var(--ink);border-radius:99px;padding:8px 18px 8px 8px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
.hplay .ico{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center}
.ytw{position:relative;aspect-ratio:9/16;max-height:78vh;margin:0 auto;border-radius:16px;overflow:hidden;background:#000}.ytw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tbar{position:relative;z-index:2;margin:-26px 0 26px}
.tbin{display:grid;grid-template-columns:repeat(var(--n,4),1fr);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 40px -30px rgba(13,13,13,.45);overflow:hidden}
.tbin.n1{--n:1}.tbin.n2{--n:2}.tbin.n3{--n:3}.tbin.n4{--n:4}
.ti{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 7px;padding:14px 12px;font-size:13.5px;color:var(--ink-2);text-decoration:none;border-left:1px solid var(--line);min-width:0;text-align:center}
.ti:first-child{border-left:0}.ti b{color:var(--ink);font-size:15px;font-weight:700}.ti .st{color:#B2996E;font-size:17px;line-height:1}.ti .ico{color:var(--brass)}a.ti:hover{background:var(--brass-soft)}
@media(max-width:860px){.tbar{margin:-18px 0 18px}.tbin,.tbin.n3,.tbin.n4{grid-template-columns:1fr 1fr}.tbin.n1{grid-template-columns:1fr}.tbin.n3 .ti:first-child{grid-column:1/-1}
 .ti{padding:11px 8px;font-size:12.5px;border-left:0;border-top:1px solid var(--line)}.ti b{font-size:14px}
 .tbin.n2 .ti:nth-child(2),.tbin.n4 .ti:nth-child(2n),.tbin.n3 .ti:nth-child(3){border-left:1px solid var(--line)}
 .tbin.n1 .ti,.tbin.n2 .ti,.tbin.n3 .ti:first-child,.tbin.n4 .ti:nth-child(-n+2){border-top:0}
 .hoffer{padding:12px}.hoP strong{font-size:26px}.hoR{padding:9px 10px;font-size:12.5px}.hprobs{margin:-6px 0 14px}}
.art.car:has(.scap:not([hidden])) .dots{left:auto;right:16px;justify-content:flex-end;top:22px}
@media(max-width:860px){.hprobs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}.hprobs::-webkit-scrollbar{display:none}.hprobs>span{display:none}.hprobs button{flex:none}
 .hero .sub{font-size:15.5px;margin-bottom:16px}}
.hero .wrap>*{min-width:0}
.promo-strip{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--cream);border-radius:14px;padding:10px 14px;margin:0 0 18px;text-decoration:none;max-width:520px;cursor:pointer;border:0;width:100%;text-align:left}
.promo-strip .bdg{flex:none;background:var(--gold);color:var(--ink);font-weight:700;font-size:12.5px;border-radius:8px;padding:3px 8px}
.promo-strip span:nth-child(2){flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo-strip small{flex:none;color:var(--gold);font-size:12px}
.art{position:relative;aspect-ratio:4/5;border-radius:30px;overflow:hidden;background:linear-gradient(160deg,#1E1C1A,#0D0D0D);box-shadow:0 40px 80px -40px rgba(13,13,13,.6)}
.art img{width:100%;height:100%;object-fit:cover}
.art .orb{position:absolute;border-radius:50%;filter:blur(2px)}
.art .o1{width:70%;aspect-ratio:1;left:-12%;top:-8%;background:radial-gradient(circle at 35% 35%,#D7C5AA,#B2996E 55%,transparent 72%);opacity:.75}
.art .o2{width:55%;aspect-ratio:1;right:-10%;bottom:6%;background:radial-gradient(circle at 40% 40%,#FAF9F6,#C4AE8A 50%,transparent 72%);opacity:.5}
.art .o3{width:30%;aspect-ratio:1;right:22%;top:30%;background:radial-gradient(circle,#fff,transparent 70%);opacity:.25}
.art .cap{position:absolute;left:18px;right:18px;bottom:18px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:18px;padding:13px 15px;display:flex;align-items:center;gap:12px}
.art .cap .dot{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--gold);display:grid;place-items:center;flex:none}
.art .cap b{display:block;font-size:14px}.art .cap small{display:block;color:var(--ink-3);font-size:12.5px}
.art .wm{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--serif);font-size:clamp(40px,7vw,72px);color:rgba(250,249,246,.9);letter-spacing:-.02em}
@media(max-width:860px){.hero{padding:14px 0 36px}.hero .wrap{grid-template-columns:1fr;gap:24px}.art{aspect-ratio:16/10;border-radius:24px}.art .wm{top:24%}
 .ctas .btn{flex:1 1 100%}.hero h1{margin:10px 0 12px}}
/* usps */
.usps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:-10px}
.usp{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;gap:13px;align-items:flex-start}
.usp .i{width:40px;height:40px;border-radius:12px;background:var(--brass-soft);color:var(--brass);display:grid;place-items:center;flex:none}
.usp b{display:block;font-size:15px;margin-bottom:2px}.usp span{font-size:13.5px;color:var(--ink-2)}
/* promos */
.promos{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start}
.pc{position:relative;background:var(--ink);color:var(--cream);border-radius:24px;padding:22px;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:250px}
.pc::after{content:'';position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(215,197,170,.28),transparent 70%)}
.pc .bdg{align-self:flex-start;font-family:var(--serif);font-size:34px;line-height:1;color:var(--gold);font-weight:600;letter-spacing:-.02em}
.pc h3{font-size:19px;color:#fff}.pc p{margin:0;color:#C9C1B6;font-size:14px}
.pc .tags{display:flex;flex-wrap:wrap;gap:6px}.pc .tg{font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 9px;background:rgba(255,255,255,.1);color:#E9E1D5}
.pc .tg.hot{background:#B2996E;color:#fff}
.pc .qbar{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}.pc .qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#E6D8C2);border-radius:99px}
.pc .meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#C9C1B6}.pc .meta b{color:var(--gold)}
.pc .acts{display:flex;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.pc .btn.pri{background:var(--gold);color:var(--ink)}
.pc .btn.light{background:transparent;color:var(--cream);border-color:rgba(255,255,255,.25)}
/* treatments */
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-size:14px;cursor:pointer;color:var(--ink-2)}
.cats button.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sv{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .2s,transform .2s}
.sv:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.sv.hasimg{padding-top:0;overflow:hidden}
.sv .ph{display:block;width:calc(100% + 36px);margin:0 -18px 4px;aspect-ratio:16/10;border:0;padding:0;cursor:pointer;position:relative;
 background:linear-gradient(150deg,#1E1C1A,#0D0D0D) center/cover no-repeat;transition:filter .3s}
.sv .ph span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:54px;color:rgba(215,197,170,.55);transition:opacity .3s}
.sv .ph.on span{opacity:0}.sv .ph.blank{background:radial-gradient(circle at 30% 30%,rgba(215,197,170,.35),transparent 60%),linear-gradient(150deg,#1E1C1A,#0D0D0D)}
.sv h3[data-sv]{cursor:pointer}
@media(max-width:600px){.sv .ph{aspect-ratio:16/8}}
.shimg{margin:-22px -20px 16px;aspect-ratio:16/10;background:linear-gradient(150deg,#1E1C1A,#0D0D0D) center/cover no-repeat;border-radius:26px 26px 0 0}
.shpr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px}.shpr b{font-size:22px}.shpr s{color:var(--ink-3)}.shpr .now{color:var(--rose)}
.shpr .ptag{font-size:11.5px;font-weight:700;background:var(--rose-soft);color:var(--rose);border-radius:99px;padding:2px 9px}
.shx{color:var(--ink-2);margin:0 0 16px;white-space:pre-line}.shacts{display:flex;flex-direction:column;gap:8px}
.sv .hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sv h3{font-size:17px}.sv .c{font-size:12px;color:var(--ink-3);margin-top:2px}
.sv .pr{text-align:right;flex:none}.sv .pr b{font-size:17px;display:block;white-space:nowrap}.sv .pr s{font-size:12.5px;color:var(--ink-3);display:block}
.sv .pr .now{color:var(--rose)}
.sv p{margin:0;font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sv .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.sv .dur{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-3)}
.sv .ptag{display:inline-block;font-size:11px;font-weight:700;background:var(--rose-soft);color:var(--rose);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.more{text-align:center;margin-top:18px}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.step{position:relative;padding:22px 20px 20px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line-2)}
.step::before{counter-increment:s;content:counter(s);font-family:var(--serif);font-size:44px;line-height:1;color:var(--brass);opacity:.55;display:block;margin-bottom:10px}
.step b{display:block;font-size:16px;margin-bottom:4px}.step span{font-size:14px;color:var(--ink-2)}
@media(max-width:760px){.steps{grid-template-columns:1fr}}
/* reviews */
.revs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;margin:0;position:relative}
.rv::before{content:'“';position:absolute;right:16px;bottom:-18px;font-family:var(--serif);font-size:64px;line-height:1;color:var(--brass-soft)}
.rvh{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative}
.rv .st{color:#B2996E;letter-spacing:2px;font-size:15px}
.rsrc{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:99px;padding:3px 9px;background:var(--line-2);color:var(--ink-2)}.rsrc.ok{background:var(--jade-soft);color:var(--jade)}
.rv blockquote{margin:0;font-size:15px;line-height:1.6;color:var(--ink);position:relative}
.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}.clamp.open{-webkit-line-clamp:unset;display:block}
.rv figcaption{display:flex;align-items:center;gap:10px;margin-top:auto}
.rv .av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:17px;flex:none}
.rv figcaption b{display:block;font-size:14px}.rv figcaption small{display:block;color:var(--ink-3);font-size:12.5px}
.rsum{display:flex;gap:28px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 24px;margin-bottom:16px}

/* ---- smooth scroll animations ---- */

.rv0{opacity:0;transform:translateY(26px) scale(.985);filter:blur(6px);transition:opacity .8s var(--ease),transform .9s var(--ease),filter .8s var(--ease);transition-delay:var(--d,0s)}

/* ================= Luuna brand layer =================
   Jet Black #0D0D0D · Porcelain White #FAF9F6 · Champagne Beige #D7C5AA · Brushed Gold #B2996E · Mushroom Grey #9B9289
   Montserrat for everything you read, Cormorant Garamond for headings and prices.
   Calm and clean: porcelain space, hairline borders, one accent (gold), photos in soft light. */
:root{--jet:#0D0D0D;--porcelain:#FAF9F6;--champagne:#D7C5AA;--gbrush:#B2996E;--mushroom:#9B9289;

 --serif:'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif;--sans:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 --r:22px;--hair:1px solid var(--line);--lift:0 1px 2px rgba(13,13,13,.03),0 22px 48px -32px rgba(13,13,13,.22)}
body{font-family:var(--sans);font-size:15px;line-height:1.72;letter-spacing:.003em;background:var(--porcelain);color:var(--jet)}

.hero h1 em{color:var(--gbrush);font-weight:500}
.hero .sub{font-size:clamp(15.5px,1.8vw,17.5px);line-height:1.75;color:var(--ink-2);max-width:540px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.26em;color:var(--brass)}
.eyebrow::before{width:30px;background:var(--gbrush)}
.sec-h p{font-size:15.5px;line-height:1.75;color:var(--ink-2)}

 clearInterval(ABTIMER);const all=[...document.querySelectorAll('#abm .abx')];if(all.length<2)return;let i=0;
 ABTIMER=setInterval(()=>{if(document.hidden)return;all[i].classList.remove('on');i=(i+1)%all.length;all[i].classList.add('on');const c=$('#abc');if(c)c.dataset.claim=all[i].dataset.claim;},4500);
}
function schedulePop(){
 clearTimeout(POPT);const L=livePromos();if(!L.length||P.promoPop===false)return;
 try{if(sessionStorage.getItem('lppop'))return;}catch(e){}
 POPT=setTimeout(()=>{if(SHEET||document.getElementById('pop'))return;const p=livePromos()[0];if(!p)return;try{sessionStorage.setItem('lppop','1');}catch(e){}
  const im=promoImg(p),el=document.createElement('div');el.className='pop';el.id='pop';el.setAttribute('role','dialog');
  el.innerHTML=(im?'<div class="popimg" data-img="'+esc(im)+'"></div>':'<div class="popimg none">'+ic('gift',30)+'</div>')+'<div class="popb"><span class="popk">'+ic('fire',13)+T('offer')+'</span><b class="popbdg">'+esc(pBadge(p))+'</b><h4>'+esc(p.t)+'</h4>'+

   '<button type="button" class="btn pri sm" data-claim="'+esc(p.id)+'">'+ic('gift',15)+T('claimNow')+'</button></div><button type="button" class="popx" data-popx="1" aria-label="'+T('dismiss')+'">'+ic('x',15)+'</button>';

function reveal(){
 document.querySelectorAll('.sec-h:not(.rv0):not(.rv1)').forEach(e=>e.classList.add('rv0'));
 document.querySelectorAll('.revs .rv0,.locs .rv0').forEach((e,i)=>e.style.setProperty('--d',(i%3)*0.08+'s'));
 const els=[...document.querySelectorAll('.rv0:not(.rv1)')];
 if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('rv1'));return;}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('rv1');io.unobserve(e.target);countUp(e.target);}}),{rootMargin:'0px 0px -60px 0px',threshold:.08});
 els.forEach(e=>io.observe(e));setTimeout(()=>els.forEach(e=>e.classList.add('rv1')),4000);
}
/* the rating counts up when it comes into view */
function countUp(root){const el=root.querySelector&&root.querySelector('.rbig .big');if(!el||el.dataset.done)return;el.dataset.done=1;
 const to=parseFloat(el.textContent)||0,t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-k,3);el.textContent=(to*e).toFixed(1);if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
/* gentle depth while scrolling: soft colours drift, category photos glide, a thin progress line at the top */
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let PTICK=false;
function onScrollFx(){
 if(PTICK)return;PTICK=true;requestAnimationFrame(()=>{PTICK=false;
  const H=document.documentElement,max=H.scrollHeight-innerHeight,pr=$('#sprog');if(pr)pr.style.transform='scaleX('+(max>0?Math.min(1,scrollY/max):0)+')';
  if(RM)return;const vh=innerHeight;
  document.querySelectorAll('[data-par]').forEach(el=>{const r=el.parentNode.getBoundingClientRect();if(r.bottom<-200||r.top>vh+200)return;const c=r.top+r.height/2-vh/2;el.style.transform='translate3d(0,'+(c*-(+el.dataset.par)).toFixed(1)+'px,0)';});
  document.querySelectorAll('.cath.on').forEach(el=>{const r=el.getBoundingClientRect();if(r.bottom<0||r.top>vh)return;const k=(r.top+r.height/2)/vh-.5;el.style.backgroundPosition='center '+(50+k*18).toFixed(1)+'%';});
  const art=document.querySelector('.hero .art');if(art&&scrollY<vh*1.2)art.style.transform='translate3d(0,'+(scrollY*0.06).toFixed(1)+'px,0)';
 });}
addEventListener('scroll',onScrollFx,{passive:true});addEventListener('resize',onScrollFx);

function bindForm(k,o){

 f.onsubmit=async ev=>{ev.preventDefault();
  const n=document.getElementById(k+'-n').value.trim(),p=document.getElementById(k+'-p').value.trim(),e=document.getElementById(k+'-e');

   lp:{ctx:o.ctx||(o.mode==='wa'?'wa':o.promo?'promo':o.quiz?'quiz':'form'),...(o.mg?{mg:o.mg}:{}),d:x.d||'',ad:x.a||'',land:x.l||'',dev:dev(),lang:LANG,first:a.first&&a.first!==a.last?(a.first.s+' · '+a.first.m+(a.first.c?' · '+a.first.c:'')+' · '+String(a.first.at).slice(0,10)):''}};
  if(interest)d.interest=interest.slice(0,200);
  {const oi=document.getElementById(k+'-oi');if(oi&&oi.checked)d.optin=true;}
  /* the note is for the spa team, so it stays in Malay whichever language the page was in */
  const nt=[o.quiz||'',q&&q.value.trim(),TS.size?'Masa sesuai: '+[...TS].join(', '):'',o.mode==='wa'?'Klik WhatsApp dari laman web':'',LANG==='en'?'(borang dalam English)':''].filter(Boolean).join(' · ');if(nt)d.note=nt.slice(0,500);

   hit(o.mode==='wa'?'wa':'lead');track('lead',{content_name:interest||'konsultasi'});

  R.addEventListener('scroll',()=>{clearTimeout(R._t);R._t=setTimeout(paint,80);},{passive:true});
