<style>
:root{--cream:#F4F0E7;--surface:#FFFDF8;--surface-2:#FAF7F0;--ink:#14120F;--ink-2:#4A453C;--ink-3:#8C8577;--line:#E3DDD0;--line-2:#EFEAE0;
 --brass:#A67C3D;--brass-2:#C9A36A;--brass-soft:#F3E9D8;--jade:#2E6B52;--jade-soft:#E4EEE8;--rose:#9B4A4A;--rose-soft:#F6E5E3;--gold:#E2C58F;
 --ease:cubic-bezier(.22,.61,.36,1);--shadow:0 1px 2px rgba(20,18,15,.04),0 10px 30px -14px rgba(20,18,15,.22);--serif:'Fraunces',Georgia,'Times New Roman',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.6 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body.sheet-open{overflow:hidden}
body.pvm{padding-top:26px}body.pvm .top{top:26px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
.ico{display:inline-flex;flex:none}.ico svg{display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.15}
h2{font-family:var(--serif);font-size:clamp(26px,4.4vw,38px);font-weight:500}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.eyebrow::before{content:'';width:22px;height:1px;background:currentColor}
.sec{padding:64px 0}.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sec-h p{margin:8px 0 0;color:var(--ink-2);max-width:560px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:99px;padding:14px 24px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;
 transition:transform .18s var(--ease),box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--gold);box-shadow:0 14px 30px -14px rgba(20,18,15,.7)}
.btn.pri:hover{box-shadow:0 18px 36px -14px rgba(20,18,15,.8);transform:translateY(-1px)}
.btn.wa{background:#1F8F55;color:#fff;box-shadow:0 14px 30px -16px rgba(31,143,85,.8)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.light{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:10px 16px;font-size:13.5px}
.btn[disabled]{opacity:.55;pointer-events:none}
/* top bar */
.top{position:sticky;top:0;z-index:40;background:rgba(244,240,231,.86);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid transparent;transition:border-color .2s}
.top.sc{border-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand img,.brand .mk{width:38px;height:38px;border-radius:11px;object-fit:cover;background:var(--ink);color:var(--gold);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:22px;margin-left:auto;font-size:14px}.nav a{text-decoration:none;color:var(--ink-2)}.nav a:hover{color:var(--ink)}
.top .btn{margin-left:14px}
@media(max-width:860px){.nav{display:none}.top .btn{margin-left:auto}}
/* hero */
.hero{padding:34px 0 56px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:-200px -200px auto auto;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(166,124,61,.18),transparent 65%);pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;position:relative}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(36px,6.4vw,62px);letter-spacing:-.03em;line-height:1.04;margin:14px 0 16px}
.hero h1 em{font-style:italic;color:var(--brass)}
.hero .sub{font-size:clamp(16px,2vw,18px);color:var(--ink-2);max-width:520px;margin:0 0 22px}
.rate{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 13px 6px 10px;font-size:13px;margin-bottom:6px}
.rate .st{color:#C8912E;letter-spacing:1px}.rate b{font-weight:700}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.ticks{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);margin:0;padding:0;list-style:none}
.ticks li{display:flex;align-items:center;gap:6px}.ticks .ico{color:var(--jade)}
.promo-strip{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--cream);border-radius:14px;padding:10px 14px;margin:0 0 18px;text-decoration:none;max-width:520px;cursor:pointer;border:0;width:100%;text-align:left}
.promo-strip .bdg{flex:none;background:var(--gold);color:var(--ink);font-weight:700;font-size:12.5px;border-radius:8px;padding:3px 8px}
.promo-strip span:nth-child(2){flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo-strip small{flex:none;color:var(--gold);font-size:12px}
.art{position:relative;aspect-ratio:4/5;border-radius:30px;overflow:hidden;background:linear-gradient(160deg,#2a241c,#14120F);box-shadow:0 40px 80px -40px rgba(20,18,15,.6)}
.art img{width:100%;height:100%;object-fit:cover}
.art .orb{position:absolute;border-radius:50%;filter:blur(2px)}
.art .o1{width:70%;aspect-ratio:1;left:-12%;top:-8%;background:radial-gradient(circle at 35% 35%,#E2C58F,#A67C3D 55%,transparent 72%);opacity:.75}
.art .o2{width:55%;aspect-ratio:1;right:-10%;bottom:6%;background:radial-gradient(circle at 40% 40%,#F4F0E7,#C9A36A 50%,transparent 72%);opacity:.5}
.art .o3{width:30%;aspect-ratio:1;right:22%;top:30%;background:radial-gradient(circle,#fff,transparent 70%);opacity:.25}
.art .cap{position:absolute;left:18px;right:18px;bottom:18px;background:rgba(255,253,248,.92);backdrop-filter:blur(10px);border-radius:18px;padding:13px 15px;display:flex;align-items:center;gap:12px}
.art .cap .dot{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--gold);display:grid;place-items:center;flex:none}
.art .cap b{display:block;font-size:14px}.art .cap small{display:block;color:var(--ink-3);font-size:12.5px}
.art .wm{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--serif);font-size:clamp(40px,7vw,72px);color:rgba(244,240,231,.9);letter-spacing:-.02em}
@media(max-width:860px){.hero{padding:14px 0 36px}.hero .wrap{grid-template-columns:1fr;gap:24px}.art{aspect-ratio:16/10;border-radius:24px}.art .wm{top:24%}
 .ctas .btn{flex:1 1 100%}.hero h1{margin:10px 0 12px}}
/* usps */
.usps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:-10px}
.usp{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;gap:13px;align-items:flex-start}
.usp .i{width:40px;height:40px;border-radius:12px;background:var(--brass-soft);color:var(--brass);display:grid;place-items:center;flex:none}
.usp b{display:block;font-size:15px;margin-bottom:2px}.usp span{font-size:13.5px;color:var(--ink-2)}
/* promos */
.promos{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.pc{position:relative;background:var(--ink);color:var(--cream);border-radius:24px;padding:22px;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:250px}
.pc::after{content:'';position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(226,197,143,.28),transparent 70%)}
.pc .bdg{align-self:flex-start;font-family:var(--serif);font-size:34px;line-height:1;color:var(--gold);font-weight:600;letter-spacing:-.02em}
.pc h3{font-size:19px;color:#fff}.pc p{margin:0;color:#CFC7B8;font-size:14px}
.pc .tags{display:flex;flex-wrap:wrap;gap:6px}.pc .tg{font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 9px;background:rgba(255,255,255,.1);color:#EDE6D8}
.pc .tg.hot{background:#B5533F;color:#fff}
.pc .qbar{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}.pc .qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#F0D9A8);border-radius:99px}
.pc .meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#CFC7B8}.pc .meta b{color:var(--gold)}
.pc .acts{display:flex;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.pc .btn.pri{background:var(--gold);color:var(--ink)}
.pc .btn.light{background:transparent;color:var(--cream);border-color:rgba(255,255,255,.25)}
/* treatments */
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-size:14px;cursor:pointer;color:var(--ink-2)}
.cats button.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sv{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .2s,transform .2s}
.sv:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.sv .hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sv h3{font-size:17px}.sv .c{font-size:12px;color:var(--ink-3);margin-top:2px}
.sv .pr{text-align:right;flex:none}.sv .pr b{font-size:17px;display:block;white-space:nowrap}.sv .pr s{font-size:12.5px;color:var(--ink-3);display:block}
.sv .pr .now{color:var(--rose)}
.sv p{margin:0;font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sv .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.sv .dur{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-3)}
.sv .ptag{display:inline-block;font-size:11px;font-weight:700;background:var(--rose-soft);color:var(--rose);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.more{text-align:center;margin-top:18px}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.step{position:relative;padding:22px 20px 20px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line-2)}
.step::before{counter-increment:s;content:counter(s);font-family:var(--serif);font-size:44px;line-height:1;color:var(--brass);opacity:.55;display:block;margin-bottom:10px}
.step b{display:block;font-size:16px;margin-bottom:4px}.step span{font-size:14px;color:var(--ink-2)}
@media(max-width:760px){.steps{grid-template-columns:1fr}}
/* reviews */
.revs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.rv .st{color:#C8912E;letter-spacing:2px;font-size:15px}.rv q{font-size:15px;line-height:1.55;quotes:'“' '”'}
.rv small{color:var(--ink-3);font-size:12.5px;margin-top:auto}
.revsum{display:flex;align-items:center;gap:14px}.revsum .big{font-family:var(--serif);font-size:48px;line-height:1}
.revsum .st{color:#C8912E;letter-spacing:2px}.revsum small{display:block;color:var(--ink-3);font-size:13px}
/* location */
.locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.loc{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.loc .map{height:240px;background:var(--line-2);border:0;width:100%;display:block}
.locs.one{grid-template-columns:1fr}.locs.one .loc{display:grid;grid-template-columns:1fr 1.15fr}.locs.one .loc .map{height:100%;min-height:320px;order:2}
@media(max-width:760px){.locs.one .loc{grid-template-columns:1fr}.locs.one .loc .map{order:0;min-height:0;height:220px}}
.loc .bd{padding:18px;display:flex;flex-direction:column;gap:10px}
.loc h3{font-size:18px}.loc .ln{display:flex;gap:10px;font-size:14px;color:var(--ink-2)}.loc .ln .ico{color:var(--brass);margin-top:3px}
.open{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--jade-soft);color:var(--jade);align-self:flex-start}
.open.no{background:var(--rose-soft);color:var(--rose)}.open i{width:7px;height:7px;border-radius:50%;background:currentColor}
.loc .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
/* faq */
.faq{max-width:780px}
.faq details{border-bottom:1px solid var(--line)}.faq summary{list-style:none;cursor:pointer;padding:18px 40px 18px 0;font-weight:600;font-size:16px;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';position:absolute;right:6px;top:12px;font-size:26px;font-weight:300;color:var(--brass);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0 0 18px;color:var(--ink-2);white-space:pre-line}
/* final + form */
.final{background:var(--ink);color:var(--cream);border-radius:32px;padding:clamp(24px,5vw,54px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(22px,4vw,54px);position:relative;overflow:hidden}
.final::before{content:'';position:absolute;left:-120px;bottom:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(226,197,143,.22),transparent 70%)}
.final h2{color:#fff}.final>div:first-child p{color:#CFC7B8}
.final .ticks{color:#CFC7B8}.final .ticks .ico{color:var(--gold)}
@media(max-width:860px){.final{grid-template-columns:1fr;border-radius:26px}}
.final>*{min-width:0}
.form{background:var(--surface);color:var(--ink);border-radius:22px;padding:22px;position:relative;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.form label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.form label:first-child{margin-top:0}
.form .f{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:13px;padding:12px 14px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.form .f:focus{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.form textarea.f{resize:vertical;min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:7px 13px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.form .consent,.consent{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);margin:14px 0 4px;font-weight:400!important;cursor:pointer}
.consent input{margin-top:3px;width:17px;height:17px;accent-color:var(--ink);flex:none}
.err{color:var(--rose);font-size:13px;min-height:18px;margin:6px 0}
.form .btn{width:100%}
.done{text-align:center;padding:10px 0}.done .ok{width:62px;height:62px;border-radius:50%;background:var(--jade-soft);color:var(--jade);display:grid;place-items:center;margin:0 auto 12px}
.done h3{font-family:var(--serif);font-size:24px;font-weight:500;margin-bottom:6px}.done p{color:var(--ink-2);margin:0 0 16px}
.done .btn{margin:4px}
/* footer */
footer{padding:40px 0 120px;color:var(--ink-3);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.soc{display:flex;gap:8px}.soc a{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);background:var(--surface)}
/* sticky bar & floating */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,253,248,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border-top:1px solid var(--line);display:none;gap:10px;transform:translateY(110%);transition:transform .3s var(--ease)}
.bar.on{transform:none}.bar .btn{flex:1;padding:13px 10px}
.fwa{position:fixed;right:22px;bottom:22px;z-index:45;width:60px;height:60px;border-radius:50%;background:#1F8F55;color:#fff;display:grid;place-items:center;border:0;cursor:pointer;box-shadow:0 16px 34px -12px rgba(31,143,85,.8);transition:transform .2s}
.fwa:hover{transform:scale(1.06)}
@media(max-width:760px){.bar{display:flex}.fwa{display:none}}
/* sheet */
.veil{position:fixed;inset:0;z-index:60;background:rgba(20,18,15,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:su .28s var(--ease);position:relative}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 36px 4px 0}.sheet .lead{margin:0 0 14px;color:var(--ink-2);font-size:14px}
.sheet .x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--line-2);cursor:pointer;display:grid;place-items:center}
.sheet .form{padding:0;box-shadow:none}
.skip{display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--ink-3);background:none;border:0;cursor:pointer;text-decoration:underline;width:100%}
.brpick button{display:flex;width:100%;text-align:left;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:16px;padding:14px;margin-bottom:8px;cursor:pointer}
.brpick b{display:block}.brpick small{color:var(--ink-3)}
@media(min-width:700px){.veil{align-items:center}.sheet{border-radius:26px}}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(40px);opacity:0}}
.rv0{opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease),transform .6s var(--ease)}.rv1{opacity:1;transform:none}
.skel{min-height:100vh;display:grid;place-items:center}.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brass);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pv{position:fixed;top:0;left:0;right:0;z-index:70;height:26px;background:#9C6B15;color:#fff;text-align:center;font-size:12.5px;padding:5px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

<body>
<div id="app"><div class="skel"><div class="spin"></div></div></div>
<noscript><p style="padding:20px">Sila hidupkan JavaScript untuk melihat halaman ini.</p></noscript>
<script>
/* Luuna landing page. One small page that reads the public details the spa app publishes
   (public/landing: treatments, prices, promotions, branches, reviews) and writes two things:
   the enquiry itself (leads) and a light visit counter (lpHits). It talks to Firestore over
   plain HTTPS so it loads fast on a phone from an Instagram or TikTok link. Where each visitor
   came from is worked out on arrival (link tags, ad click ids, the in-app browser, the page
   they came from) and kept for 30 days, so the lead lands in the CRM already sorted by source,
   and a booking made later on the booking page carries the same source. */

   ['Konsultasi & rawatan','Therapist semak keadaan kulit anda dahulu, kemudian rawatan dibuat ikut keperluan kulit anda.'],
   ['Nasihat penjagaan','Anda pulang dengan tips penjagaan di rumah dan cadangan sesi seterusnya.']].map(s=>'<div class="step rv0"><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>').join('')+'</div></div></section>';
 /* reviews */
 const RV=P.reviews||[];
 if(RV.length)h+='<section class="sec" id="ulasan" style="padding-top:0"><div class="wrap"><div class="sec-h"><div><span class="eyebrow">Ulasan pelanggan</span><h2>Kata mereka</h2></div>'+
  (R.n>=3?'<div class="revsum"><span class="big">'+R.avg.toFixed(1)+'</span><span><span class="st">'+stars(R.avg)+'</span><small>'+R.n+' ulasan selepas rawatan</small></span></div>':'')+'</div>'+
  '<div class="revs">'+RV.slice(0,6).map(r=>'<figure class="rv rv0" style="margin:0"><span class="st">'+stars(r.s)+'</span><q>'+esc(r.t)+'</q><small>'+esc(r.n)+(r.svc?' · '+esc(r.svc):'')+(r.d?' · '+dshort(r.d):'')+'</small></figure>').join('')+'</div></div></section>';
 /* location */
 h+='<section class="sec" id="lokasi" style="padding-top:0"><div class="wrap"><div class="sec-h"><div><span class="eyebrow">Lokasi</span><h2>Jumpa kami di sini</h2></div></div><div class="locs'+((P.branches||[]).length===1?' one':'')+'">'+
  (P.branches||[]).map(x=>{const o=openNow(x),q=encodeURIComponent(x.mapsQ||x.addr||x.name||'');
   return '<article class="loc rv0">'+(x.addr||x.mapsQ?'<iframe class="map" loading="lazy" title="Peta '+esc(x.name)+'" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q='+q+'&output=embed"></iframe>':'')+
    '<div class="bd"><h3>'+esc(x.name)+'</h3><span class="open'+(o.on?'':' no')+'"><i></i>'+esc(o.t)+'</span>'+
    (x.addr?'<div class="ln">'+ic('pin',16)+'<span>'+esc(x.addr)+'</span></div>':'')+
    '<div class="ln">'+ic('clock',16)+'<span>'+esc(daysTxt(x.days))+' · '+hm(+x.open||9)+' – '+hm(+x.close||20)+'</span></div>'+
    (x.phone?'<div class="ln">'+ic('phone',16)+'<span>'+esc(x.phone)+'</span></div>':'')+
    '<div class="acts">'+(x.addr||x.mapsQ?'<a class="btn light sm" target="_blank" rel="noopener" href="'+esc(x.maps||'https://www.google.com/maps/search/?api=1&query='+q)+'" data-hit="map">'+ic('map',16)+'Google Maps</a>'+
      '<a class="btn light sm" target="_blank" rel="noopener" href="https://waze.com/ul?q='+q+'&navigate=yes" data-hit="map">Waze</a>':'')+
     (x.phone?'<a class="btn light sm" href="tel:'+esc(digits(x.phone))+'" data-hit="call">'+ic('phone',16)+'Call</a>':'')+
     '<button class="btn pri sm" data-book-br="'+esc(x.id)+'">'+ic('cal',16)+'Book di sini</button></div></div></article>';}).join('')+'</div></div></section>';
 /* faq */
 const F=(P.faq||[]).filter(f=>f&&f.q);
 if(F.length)h+='<section class="sec" id="soalan" style="padding-top:0"><div class="wrap"><div class="sec-h"><div><span class="eyebrow">Soalan lazim</span><h2>Ada soalan?</h2></div></div><div class="faq">'+
  F.map((f,i)=>'<details'+(i===0?' open':'')+'><summary>'+esc(f.q)+'</summary><p>'+esc(f.a||'')+'</p></details>').join('')+'</div></div></section>';
 /* final: the form */
 h+='<section class="sec" id="konsultasi" style="padding-top:0"><div class="wrap"><div class="final"><div class="rv0"><span class="eyebrow" style="color:var(--gold)">Konsultasi percuma</span>'+
  '<h2 style="margin:12px 0 12px">Tak pasti rawatan mana yang sesuai?</h2><p>Beritahu kami sedikit tentang kulit anda. Team kami akan WhatsApp anda dengan cadangan rawatan dan slot yang ada — tanpa sebarang komitmen.</p>'+
  '<ul class="ticks" style="margin-top:16px;flex-direction:column;gap:8px"><li>'+ic('check',16)+'Balasan melalui WhatsApp dalam waktu operasi</li><li>'+ic('check',16)+'Cadangan ikut jenis & masalah kulit anda</li><li>'+ic('check',16)+'Maklumat anda dilindungi (PDPA)</li></ul></div>'+
  '<div class="form rv0" id="fbox">'+formHTML('f',{})+'</div></div></div></section>';
 h+='<footer><div class="wrap"><span>© '+new Date().getFullYear()+' '+esc(b.name||'')+(b.ssm?' ('+esc(b.ssm)+')':'')+'</span><div class="soc">'+
  (b.ig?'<a target="_blank" rel="noopener" aria-label="Instagram" href="https://instagram.com/'+esc(String(b.ig).replace(/^@|.*instagram\.com\//,''))+'">'+ic('ig',18)+'</a>':'')+
  (b.tt?'<a target="_blank" rel="noopener" aria-label="TikTok" href="https://www.tiktok.com/@'+esc(String(b.tt).replace(/^@|.*tiktok\.com\/@?/,''))+'">'+ic('tt',18)+'</a>':'')+
  (b.fb?'<a target="_blank" rel="noopener" aria-label="Facebook" href="'+esc(/^https?:/.test(b.fb)?b.fb:'https://facebook.com/'+b.fb)+'">'+ic('fb',18)+'</a>':'')+
  (b.wa?'<a href="#" data-go="wa" aria-label="WhatsApp">'+ic('wa',18)+'</a>':'')+'</div></div></footer>';
 h+='<div class="bar" id="bar"><button class="btn wa" data-go="wa">'+ic('wa',18)+'WhatsApp</button><button class="btn pri" data-go="book">'+ic('cal',18)+(P.bookOn?'Book sekarang':'Tempah')+'</button></div>'+
  '<button class="fwa" data-go="wa" aria-label="WhatsApp">'+ic('wa',28)+'</button>';
 $('#app').innerHTML=h;
 paintSvcs();bindForm('f');reveal();
 const t=$('#top'),bar=$('#bar');
 const onS=()=>{t.classList.toggle('sc',scrollY>8);bar.classList.toggle('on',scrollY>420);};addEventListener('scroll',onS,{passive:true});onS();
 setInterval(()=>document.querySelectorAll('[data-end]').forEach(e=>{const en=e.dataset.end;if(en)e.innerHTML=left(en)?'Tamat dalam <b>'+left(en)+'</b>':'Tamat';}),30000);
}
function paintSvcs(){
 const el=$('#svcs');if(!el)return;
 const S=(P.services||[]),cats=[...new Set(S.map(s=>s.c||'Lain-lain'))];
 const list=S.filter(s=>!CAT||(s.c||'Lain-lain')===CAT),lim=SHOWALL||CAT?list.length:9;
 el.innerHTML=(cats.length>1?'<div class="cats"><button class="'+(CAT?'':'on')+'" data-cat="">Semua</button>'+cats.map(c=>'<button class="'+(CAT===c?'on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>':'')+
  '<div class="svcs">'+list.slice(0,lim).map(s=>{const bp=P.showPrices===false?null:bestPromo(s);
   return '<article class="sv"><div class="hd"><div><h3>'+esc(s.n)+(bp?'<span class="ptag">'+esc(bp.p.badge)+'</span>':'')+'</h3>'+(s.c?'<div class="c">'+esc(s.c)+'</div>':'')+'</div>'+
    '<div class="pr">'+(P.showPrices===false?'':bp?'<s>'+rm(s.p)+'</s><b class="now">'+rm(bp.v)+'</b>':s.p?'<b>'+rm(s.p)+'</b>':'')+'</div></div>'+
    (s.x?'<p>'+esc(s.x)+'</p>':'')+'<div class="ft"><span class="dur">'+ic('clock',14)+(s.d||60)+' minit</span>'+
    (P.bookOn&&s.b!==false?'<button class="btn pri sm" data-book="'+esc(s.id)+'">Book</button>':'<button class="btn light sm" data-ask="'+esc(s.id)+'">'+ic('wa',15)+'Tanya</button>')+'</div></article>';}).join('')+'</div>'+
  (list.length>lim?'<div class="more"><button class="btn light" data-more="1">Lihat semua '+list.length+' rawatan</button></div>':'');
}
function reveal(){
 const els=[...document.querySelectorAll('.rv0')];
 if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('rv1'));return;}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('rv1');io.unobserve(e.target);}}),{rootMargin:'0px 0px -40px 0px'});
 els.forEach(e=>io.observe(e));setTimeout(()=>els.forEach(e=>e.classList.add('rv1')),2500);
}

/* ---------- the enquiry form (inline and in the sheet) ---------- */
function formHTML(k,o){
 const S=P.services||[],brs=P.branches||[];
 return '<form id="'+k+'-form" novalidate>'+
  '<label for="'+k+'-n">Nama</label><input class="f" id="'+k+'-n" autocomplete="name" placeholder="Nama anda" required>'+
  '<label for="'+k+'-p">No. WhatsApp</label><input class="f" id="'+k+'-p" type="tel" inputmode="tel" autocomplete="tel" placeholder="012-345 6789" required>'+
  (o.mode==='wa'?'':'<label for="'+k+'-i">Berminat dengan</label><select class="f" id="'+k+'-i"><option value="">Belum pasti — nak nasihat</option>'+
   (o.promo?'<option selected>'+esc(o.promo)+'</option>':'')+S.map(s=>'<option'+(o.interest===s.n?' selected':'')+'>'+esc(s.n)+'</option>').join('')+'</select>')+
  (brs.length>1?'<label for="'+k+'-b">Cawangan</label><select class="f" id="'+k+'-b">'+brs.map(b=>'<option value="'+esc(b.id)+'"'+(o.br===b.id?' selected':'')+'>'+esc(b.name)+'</option>').join('')+'</select>':'')+
  (o.mode==='wa'?'':'<label>Masa yang sesuai</label><div class="chips" id="'+k+'-t">'+['Pagi','Tengah hari','Petang','Malam','Hujung minggu'].map(t=>'<button type="button" data-t="'+t+'">'+t+'</button>').join('')+'</div>'+
   '<label for="'+k+'-q">Masalah kulit / soalan <span style="font-weight:400;color:var(--ink-3)">(pilihan)</span></label><textarea class="f" id="'+k+'-q" rows="2" placeholder="Contoh: jerawat, jeragat, kulit kusam"></textarea>')+
  '<label class="consent"><input type="checkbox" id="'+k+'-ok"><span>Saya setuju '+esc((P.biz||{}).name||'kami')+' menghubungi saya melalui WhatsApp dan menyimpan maklumat ini (Akta Perlindungan Data Peribadi 2010).</span></label>'+
  '<div class="err" id="'+k+'-e" role="alert"></div>'+
  '<button class="btn '+(o.mode==='wa'?'wa':'pri')+'" type="submit" id="'+k+'-go">'+(o.mode==='wa'?ic('wa',18)+'Teruskan ke WhatsApp':o.promo?ic('gift',18)+'Claim promo ini':ic('arrow',18)+'Hantar — kami WhatsApp anda')+'</button></form>';
}
function bindForm(k,o){
 o=o||{};const f=document.getElementById(k+'-form');if(!f)return;const T=new Set();
 f.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=b.dataset.t;T.has(t)?T.delete(t):T.add(t);b.classList.toggle('on');});
 f.onsubmit=async ev=>{ev.preventDefault();
  const n=document.getElementById(k+'-n').value.trim(),p=document.getElementById(k+'-p').value.trim(),e=document.getElementById(k+'-e');
  const it=document.getElementById(k+'-i'),q=document.getElementById(k+'-q'),bs=document.getElementById(k+'-b');
  if(n.length<2){e.textContent='Sila isi nama anda.';return;}
  if(digits(p).length<9||digits(p).length>15){e.textContent='Sila isi nombor telefon yang betul.';return;}
  if(!document.getElementById(k+'-ok').checked){e.textContent='Sila tandakan persetujuan untuk kami menghubungi anda.';return;}
  e.textContent='';const go=document.getElementById(k+'-go');go.disabled=true;
  const x=touch(),a=attrLoad(),br=(bs&&bs.value)||o.br||((P.branches||[])[0]||{}).id||'';
  const interest=(it&&it.value)||o.promo||o.interest||'';
  const d={name:n.slice(0,80),phone:p.slice(0,20),source:x.s,medium:x.m,campaign:(x.c||'').slice(0,24),branchId:br,stage:'new',createdAt:new Date().toISOString(),
   createdBy:'landing',web:true,consent:true,
   lp:{ctx:o.mode==='wa'?'wa':o.promo?'promo':'form',d:x.d||'',land:x.l||'',dev:dev(),first:a.first&&a.first!==a.last?(a.first.s+' · '+a.first.m+(a.first.c?' · '+a.first.c:'')+' · '+String(a.first.at).slice(0,10)):''}};
  if(interest)d.interest=interest.slice(0,200);
  const nt=[q&&q.value.trim(),T.size?'Masa sesuai: '+[...T].join(', '):'',o.mode==='wa'?'Klik WhatsApp dari laman web':''].filter(Boolean).join(' · ');if(nt)d.note=nt.slice(0,500);
  if(PREVIEW){e.textContent='Pratonton: borang tidak dihantar.';go.disabled=false;return;}
  try{const id=await add('leads',d);try{localStorage.setItem('luunaLead',JSON.stringify({id,at:d.createdAt}));}catch(_){}
   hit(o.mode==='wa'?'wa':'lead');track('lead',{content_name:interest||'konsultasi'});
   if(o.mode==='wa'){closeSheet();openWa(o.msg,n);return;}
   const box=k==='f'?$('#fbox'):document.querySelector('.sheet .form');
   box.innerHTML='<div class="done"><div class="ok">'+ic('check',30)+'</div><h3>Terima kasih, '+esc(n.split(' ')[0])+'!</h3><p>Team kami akan WhatsApp anda secepat mungkin dalam waktu operasi.'+(o.promo?' Slot promo anda sedang kami simpan.':'')+'</p>'+
    (P.bookOn?'<button class="btn pri" data-go="book">'+ic('cal',18)+'Terus pilih slot sekarang</button>':'')+'<button class="btn light" data-go="wa-direct">'+ic('wa',18)+'WhatsApp kami</button></div>';}
  catch(err){console.warn(err);e.textContent='Maaf, tidak dapat dihantar. Sila cuba lagi atau WhatsApp kami terus.';go.disabled=false;}};
}

/* ---------- sheets ---------- */
function sheet(html){closeSheet();const v=document.createElement('div');v.className='veil';v.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><button class="x" aria-label="Tutup" data-x="1">'+ic('x',18)+'</button>'+html+'</div>';
 v.addEventListener('click',e=>{if(e.target===v||e.target.closest('[data-x]'))closeSheet();});document.body.appendChild(v);document.body.classList.add('sheet-open');SHEET=v;}
function closeSheet(){if(SHEET){SHEET.remove();SHEET=null;}document.body.classList.remove('sheet-open');}
function waText(ctx){const b=P.biz||{};return (P.waMsg||'Hi {nama}, saya nak tanya tentang rawatan.').replace('{nama}',b.name||'').replace('{bisnes}',b.name||'')+(ctx?' ('+ctx+')':'');}
function openWa(msg,name){const b=P.biz||{},num=waNum(b.wa||b.phone||'');
 const t=(msg||waText())+(name?'\n\nNama: '+name:'');hit('wa');track('wa');
 location.href='https://wa.me/'+num+'?text='+encodeURIComponent(t);}
function waSheet(ctx,interest){
 const msg=waText(ctx);
 let done=null;try{done=JSON.parse(localStorage.getItem('luunaLead')||'null');}catch(e){}
 if(done&&Date.now()-new Date(done.at)<DAY30)return openWa(msg);
 sheet('<h3>Chat dengan kami</h3><p class="lead">Isi nama & nombor supaya team kami boleh bantu lebih cepat — atau terus ke WhatsApp.</p><div class="form">'+formHTML('w',{mode:'wa'})+'</div>'+
  '<button class="skip" id="w-skip">Terus ke WhatsApp tanpa isi</button>');
 bindForm('w',{mode:'wa',msg,interest});document.getElementById('w-skip').onclick=()=>{closeSheet();openWa(msg);};
}
function claim(id){
 const p=(P.promos||[]).find(x=>x.id===id);if(!p)return;hit('promo');track('promo',{content_name:p.t});
 sheet('<h3>'+esc(p.t)+'</h3><p class="lead">'+esc(p.deal)+(p.limit>0?' · tinggal '+p.left+' slot':'')+(p.end?' · sehingga '+dshort(p.end):'')+'</p><div class="form">'+formHTML('s',{promo:p.t})+'</div>');
 bindForm('s',{promo:p.t});}
function bookUrl(br,svc){const u=new URL('./',location.href);u.search='';const q=new URLSearchParams();q.set('book',br);if(svc)q.set('svc',svc);u.search=q.toString();return u.toString();}
function book(svc,brId){
 if(!P.bookOn)return waSheet(svc&&svcOf(svc)?'Nak book '+svcOf(svc).n:'Nak buat tempahan');
 const brs=P.branches||[];
 const go=b=>{hit('book');track('book',{content_name:svc&&svcOf(svc)?svcOf(svc).n:''});if(PREVIEW){alertPv(bookUrl(b,svc));return;}location.href=bookUrl(b,svc);};
 if(brId||brs.length<2)return go(brId||(brs[0]||{}).id||'');
 sheet('<h3>Pilih cawangan</h3><p class="lead">Di mana anda nak buat rawatan?</p><div class="brpick">'+brs.map(b=>'<button data-pick="'+esc(b.id)+'">'+ic('pin',20)+'<span><b>'+esc(b.name)+'</b><small>'+esc(b.addr||'')+'</small></span></button>').join('')+'</div>');
 SHEET.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{closeSheet();go(x.dataset.pick);});
}
function alertPv(u){const e=document.createElement('div');e.className='pv';e.style.top='26px';e.textContent='Pratonton — butang ini akan buka: '+u;document.body.appendChild(e);setTimeout(()=>e.remove(),5000);}

/* one listener for every button on the page */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-book],[data-book-br],[data-claim],[data-promo],[data-ask],[data-cat],[data-more],[data-hit]');if(!t)return;
 if(t.dataset.hit){hit(t.dataset.hit);return;}
 e.preventDefault();
 if(t.dataset.go==='book'){closeSheet();book();}
 else if(t.dataset.go==='wa')waSheet();
 else if(t.dataset.go==='wa-direct')openWa();
 else if(t.dataset.book!==undefined)book(t.dataset.book);
 else if(t.dataset.bookBr!==undefined)book('',t.dataset.bookBr);
 else if(t.dataset.claim)claim(t.dataset.claim);
 else if(t.dataset.promo){const el=document.getElementById('promo');if(el)el.scrollIntoView({behavior:'smooth'});}
 else if(t.dataset.ask){const s=svcOf(t.dataset.ask);waSheet(s?'Harga & slot '+s.n:'',s&&s.n);}
 else if(t.dataset.cat!==undefined){CAT=t.dataset.cat;paintSvcs();}
 else if(t.dataset.more){SHOWALL=true;paintSvcs();}
});
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

/* ---------- start ---------- */
window.__lp={detect,capture,touch,get P(){return P;}};
capture();
(async()=>{
 try{P=await getPub();}catch(e){console.warn(e);P=null;}
 if(!P||(!P.on&&!PREVIEW)){
  $('#app').innerHTML='<div class="skel"><div style="text-align:center;padding:30px;max-width:420px"><h2 style="margin-bottom:10px">Laman ini sedang dikemas kini</h2><p style="color:#4A453C">Sila cuba sebentar lagi.</p></div></div>';return;}
 render();hit('view');pixels();
})();
})();
</script>
